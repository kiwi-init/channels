      - "desktop/scripts/eb-test-marks.ts"
      - "desktop/scripts/eb-update-rehearsal.ts"
      - "desktop/scripts/eb.ts"
      - "desktop/scripts/smoke-eb.ts"
      - "desktop/tsconfig.eb.json"
      - "desktop/tsconfig.json"
    description: >-
      On a macOS runner (Electrobun builds only for the host it runs on), checks the Electrobun shell that is replacing Electron (issue #757).
      Builds web/dist, restores ~/.hutch (the pinned Hutch under kiwi-pinned/, Cottontail, Electrobun's core and devkit, Bun) from actions/cache keyed on desktop/electrobun-pins.json, and runs `bun run prepare:eb` up to three times, 20 s apart, within 5 minutes, so a download blip from GitHub or blackboard.sh doesn't fail the job: desktop/scripts/eb.ts downloads Hutch from the URL desktop/electrobun-pins.json pins, fails unless the archive and its files match their sha256 pins, and runs `electrobun prepare` through it (never the npm shim's unpinned install.sh fallback).
      The steps after it run with DASH_RELEASE_OFFLINE=1 and fetch nothing.
      Then `bun run typecheck:eb` in desktop/: tsc -p tsconfig.eb.json typechecks src/main-eb.ts, src/preload-eb.ts, electrobun.config.ts, eb-tests/ and the eb*.ts build scripts against the projected devkit, strict.
      Then `bun test --tsconfig-override tsconfig.eb.json ./eb-tests` runs window.kiwi over Electrobun's own createRPC on both ends, wired as preload-eb.ts and main-eb.ts wire them (rpc-eb.ts): calls reach main's handler table with their arguments, answers and errors come back, pushes reach their listener, a view off our page gets no answers and no pushes, a call that isn't the bridge's is refused, and a reloaded page never takes the previous load's replies while the old page's late messages get nothing; the keys request and frame (T437) go the same way, off our page get nothing, and a session or request that isn't one is refused before main's keys see it.
      Sessions are main's (T1230): only the session main minted for the load opens, so a thousand hellos with ids of the page's own choosing open nothing, every load gets a fresh id, a retired session's late reply never leaves main, and a page whose first frame is a keys request has its session opened before the keys see it.
      Each document is its own session (T1741): two documents that boot from one preload's id carry their own nonce and get their own sessions, so neither takes the other's reply, and main's load() retires the session at once, so nothing for the old load leaves main before the new page says hello. eb-tests/page-script.test.ts bundles the real preload and runs it in its own realm, then page script there hooks JSON.stringify, Object.prototype.toJSON, RegExp.prototype.test, Reflect.apply, the message handler's postMessage, the __electrobunHostBridge alias and globalThis: none of the hooks sees the session id or the document's nonce, the hijacked globalThis gets no frame, and window.kiwi keeps answering and hearing pushes (T1855).
      Then `bun run build:eb` (electrobun build --env=stable, through eb.ts): scripts/eb-pre-build.ts fails unless the build runs the pinned Hutch and desktop/.hutch/devkit/api hashes to its pin, and turns build/icon.icns into the iconset; before it, `scripts/build-cli.ts --js` builds the kiwi CLI as one JS file (dist/kiwi.js, about 2.6MB) instead of a second compiled Bun: the app compiles it into ~/.kiwi/bin/kiwi with its own Bun at install time (desktop/src/cli.ts:
      `bun build --compile` in a child of the app's Bun, from / with only PATH, HOME and TMPDIR, so no macro in kiwi.js runs in the process that holds the store key; then an ad-hoc codesign on macOS, which Electrobun's Bun 1.4.0 output needs to run, and a --version check before it replaces anything;
      T446); the build bundles src/main-eb.ts with the shared desktop modules it imports (ipc/handlers.ts and all the app's calls through host-eb.ts, guard.ts csp(), open.ts, eb-page.ts, eb-bridge.ts, rpc-eb.ts, window-look.ts, window-size.ts) and @kiwi/core, and src/preload-eb.ts as the preload view; scripts/eb-post-build.ts copies dist/kiwi.js into the app's Resources (failing if it's missing), runs pageWithCsp on the built web/dist/index.html (fails unless only a doctype, <html> and <head> come before the CSP's place), puts that template at Resources/app/page/ outside views/, copies the rest of web/dist into views/internal and fails if an index.html lands there, compiles native/macos/kiwi-shell.m with clang -Wall -Werror into Contents/MacOS (the patch that denies the microphone, camera and location Electrobun grants the page, lets only the page's own blob:/data: downloads through, cancels every navigation but views://internal/index.html and its #/? forms in Electrobun's own navigation delegate, before load, whatever rules the page's internal RPC sets, records each committed navigation's URL natively so the bridge answers only while the view is on our page whatever events the page posts (T1855), and sets the window's minimum size and background), fails if any Electrobun file in the app differs from its pin or Contents/MacOS holds a file nobody pinned, fails when the app's Info.plist names no CFBundleIdentifier or its kiwi:// registration doesn't fit that id (only the release id, com.kiwiinit.channels, registers kiwi://; a dev or test build never does), bundles src/keys-worker.ts into app/bun/keys.js beside the main bundle and fails unless that bundled keys worker answers a page's request, then checks the bundle (scripts/eb-bundle.ts): the main bundle holds exactly one copy of Electrobun's internal RPC table, the one lockInternalRpc empties, the preload bundle exists and has no WebSocket, and the main bundle takes the launcher's key channel (launcherKeys = keySources(), from launcher-channel-eb.ts) before any other code runs: the launcherKeys declaration itself must call keySources()
      src/main-eb.ts only orders startup; each part is its own module it imports (native-eb.ts for libkiwi-shell and Electrobun's core, window-eb.ts for the window, the page, the bridge, the canary and the tripwire, keys-start-eb.ts, store-open-eb.ts for the store this build opens, test-build-eb.ts, life-updates-eb.ts for app life and updates, keep-alive-eb.ts for the stopped-page watch (registered before the window) and the daemon keeper), with launcher-channel-eb.ts imported first so it takes the store key before anything else runs, and its imports_from closure covers them.
      (a bare declaration means Bun wrapped the module in __esm, as it does when it's also import()ed, and its place no longer says when it runs), every top-level statement before it is a declaration, a constant or the bundler's lazy wrapper (parsed with oxc-parser), and every import in the bundle is a builtin, since an import runs before everything, so an import put above it in main-eb.ts fails the build instead of leaving fd 3 to a child (T1710).
      We ship the plain app, not Electrobun's self-extracting wrapper (which would run the app from a folder the user's rights can edit): desktop/scripts/eb-size.ts unpacks the plain .app from the build's .app.tar.zst payload, makes its dmg (hdiutil ULMO) and its zip (ditto, the updater's layout), and fails if that .app is over 100MB on disk or its dmg or zip is over 40MB (about 24MB and 30MB with kiwi.js; the bundled 19MB kiwi.zst had pushed the zip to about 47MB); the wrapper's sizes are only printed.
      Fails on a type error, a bundling error (an import the Bun main process can't resolve), an ObjC warning or a WebKit/AppKit API that no longer exists, a missing web/dist, or an app over its size gates.
      The plain .app's CFBundleExecutable is our launcher (desktop/native/macos/kiwi-launcher.c, built by eb-post-build.ts with clang -Wall -Wextra -Werror), not Electrobun's: it keeps only HOME, USER, LOGNAME, TMPDIR, PATH, SHELL, LANG, LC_*, XPC_SERVICE_NAME, XPC_FLAGS and __CF_USER_TEXT_ENCODING, sets BUN_RUNTIME_TRANSPILER_CACHE_PATH=0 itself (so a forged entry in Bun's transpiler cache under HOME can't replace main's code), and execs Electrobun's launcher with that, so BUN_OPTIONS (--preload), BUN_INSPECT (a debugger), NODE_*, DYLD_* and JSC_* never reach the bun process that runs main and the web view (T632). desktop/scripts/eb-seal-check.ts builds a probe bundle whose executable is native/macos/kiwi-keys.c's kiwi_seal_check, seals it with scripts/eb-seal.ts, and fails unless it starts as sealed and with a ticket stapled into Contents/CodeResources afterwards, and is refused once a sealed file (MacOS/CodeResources included) changes or an unsealed file is added: the launcher's C check and the TS seal held to the same rules. desktop/scripts/eb-env-check.ts unpacks the plain .app and fails if the launcher, run in front of a stand-in that writes down its environment, passes on any name beyond those (it sets one from each family, and KIWI_EB_DRIVER, KIWI_EB_RELAY and CFFIXED_USER_HOME, which only a test build's launcher may pass) or drops one of them, or doesn't set BUN_RUNTIME_TRANSPILER_CACHE_PATH=0 once whatever the caller gave, or if the running app, started with BUN_OPTIONS --preload, BUN_INSPECT on a free port, NODE_OPTIONS --require, DYLD_INSERT_LIBRARIES and HOME pointing at a forged transpiler cache entry for its own index.js (made with the app's bun, its length and wyhash rewritten), runs the preload or the forged code, listens on that port, or loads the library into any process but the unsigned launcher itself (a signed build's hardened runtime stops that one), or leaves anything running; it starts a release-id app only on CI, never on a person's Mac.
      The launcher also holds the store key (T544, desktop/native/macos/kiwi-keys.c): before it starts anything it checks every file in Contents (but Info.plist, _CodeSignature and itself) against the SHA-256 list scripts/eb-seal.ts writes into Info.plist as KiwiSeal (at the end of eb-post-build.ts for dev builds; a stable build's Resources/version.json gets its hash from Electrobun after that hook, so the shipped plain .app is sealed once it's out of the payload, by scripts/eb-app.ts shippedApp, which eb-size, eb-env-check and eb-keys-check use, as T443's packaging will between signing the nested code and the app), and refuses a changed, missing or unlisted file or a link (247 files in about 60 ms on an M2); then it starts Electrobun's launcher from / with posix_spawn and CLOEXEC_DEFAULT, so only stdio and a socketpair on fd 3 (KIWI_KEY_FD=3) get through, and answers bun's requests there (desktop/src/launcher-key.ts): the store key from the Keychain under the bundle id, made only when none is there and never replaced, and the old Electron app's key for a name in Info.plist's KiwiLegacyNames only, for one session: bun's done (or the end of the socket) shuts it, so Electrobun's launcher's copy of fd 3 gets nothing after. bun copies the channel off fd 3 onto a descriptor opened O_CLOEXEC and closes fd 3 at once, and drops KIWI_KEY_FD from process.env and the C environment (unsetenv), so nothing the app starts inherits either (T873). desktop/scripts/eb-keys-check.ts takes a copy of the plain .app with a probe (scripts/eb-keys-probe.ts) as main.js, a throwaway bundle id and a throwaway legacy item, resealed, and fails unless a descriptor the launcher inherited never reaches bun, bun has no fd 3 and no KIWI_KEY_FD once it holds the channel, its copy of the channel is close-on-exec (fcntl F_GETFD) and a child started through libc system() while the channel is open gets no socket and no KIWI_KEY_FD, another copy of the socket gets nothing after done, a child started afterwards gets no socket and no KIWI_KEY_FD, the first start makes a key through the launcher (not marked ready until finish, then marked) and the next gets the same one, still marked, and can't take it back with drop (T1076), a second key is refused, the legacy key comes through while an unlisted name and an unknown request are refused; that store v2 opens on the Mac as main-eb opens it (scripts/eb-store-probe.ts as main.js, taking the key channel in its first import, then store-eb.ts's openEbStore with its own throwaway Electron folder): a first start makes a sealed store and a key marked ready, the next reads it back with the same key, and with both copies deleted and a plain Electron store planted it's refused as a deleted store with nothing written, and, on CI's temporary keychain only, Electron's kiwi-store.bin is imported once through a kiwi-desktop key (T1582); and copies with a changed main.js, a bunfig.toml beside bun, an app.asar, a link or a missing file all stop before bun runs, and unless the launcher's check of the whole app takes 500 ms or less (median of 7), and unless, built with -fsanitize=address,undefined -fno-sanitize-recover=all into a throwaway sealed bundle, native/macos/kiwi-keys-test.c's parser cases (malformed, truncated, oversized, unknown, a NUL inside, done ending the session, many requests in one write, the ready mark's finished, finish and drop (finish naming the key it marks by its SHA-256 and refused for any other; drop only for a key made in that session, never once it's marked ready, and, in a live session, never for a key put in its place, as it deletes by the item reference SecItemAdd gave; a mark left by a key deleted by hand not counting for the next), and 1500 seeded random sessions), the seal check on a sealed and on a changed app, and the launcher itself all run with no sanitizer report, and the harness says that drop deleted the key its session made and left one put in its place (deleting by item reference); on GitHub Actions (CI, GITHUB_ACTIONS and an absolute RUNNER_TEMP, never on a developer's Mac) it uses a temporary keychain, where a second throwaway keychain in the search list holds a store key of the same name and the harness's decoy session makes its own key and takes it back by reference, leaving that one (T1710); it deletes its items either way. eb-env-check runs the launcher inside a small sealed bundle and expects KIWI_KEY_FD as the one name it adds.
      Then it starts the app, without CDP (WebKit has none;
      T442): a second build, `electrobun build --env=dev` through desktop/scripts/eb.ts (the pinned Hutch, as every build) with CHANNELS_EB_TEST=1 and its own bundle id (com.kiwiinit.channels.test), compiles in the test driver (desktop/src/eb-driver.ts behind the KIWI_EB_TEST build-time define in electrobun.config.ts), and its launcher (built with -DKIWI_EB_TEST) also lets KIWI_EB_DRIVER, KIWI_EB_RELAY and CFFIXED_USER_HOME through: with KIWI_EB_DRIVER set, main listens on that Unix socket, runs each function it's sent in the page with executeJavascript and hands back what the page posts on Electrobun's host bridge;
      KIWI_EB_RELAY sets the relay in the test build's store (so the page's CSP and window.kiwi.relayUrl, from #791's bridge, both name the local relay), and the test build keeps its store as plain JSON (desktop/src/eb-test-store.ts: kiwi-eb-test-store.json, 0600 in a 0700 folder through guard.ts writePrivate, a torn or non-object file refused whole) where the release build keeps only memory, so a relaunch reopens the channel; the test build's launcher holds the store key as the release one does. desktop/scripts/eb-driver-check.ts (its marks in desktop/scripts/eb-test-marks.ts, which its --release half applies to the files the release jobs ship) fails if the shipped release .app (unpacked and sealed by eb-app.ts shippedApp) carries the driver, the relay override or the plain-JSON store in its code (kiwiDriver, KIWI_EB_DRIVER, KIWI_EB_RELAY, kiwi-eb-test-store.json) or lets them or CFFIXED_USER_HOME through its launcher, or if the test build lacks any of them, or if either build lacks what every build has (views://internal/index.html and restoreWindowFocusAfterExternalDrop in its code, BUN_RUNTIME_TRANSPILER_CACHE_PATH in its launcher), which would mean it read the wrong files.
      A CHANNELS_EB_TEST=1 build is always com.kiwiinit.channels.test, and eb-post-build.ts refuses one built for the stable or canary channel; the test build won't start unless its data folder is under the temp CFFIXED_USER_HOME it was given, and its driver listens only in a folder only this user can open, never over a file that isn't a socket, and removes the socket on exit. desktop/scripts/smoke-eb.ts (it also has the page navigate to views://internal/icon.svg, views://internal/index.html?x=1 and file:///etc/hosts, and fails unless each is refused: the page stays on views://internal/index.html and window.kiwi still answers, which the rules the canary proved, the native allowlist and the one strict notion of our page (exactly views://internal/index.html, with an optional #fragment, in PAGE_RULES, isPageUrl, the bridge's onOurPage, kiwi-shell.m and Linux's kiwi-shell.c) all have to hold for; through desktop/scripts/eb-drive.ts, ~/Library and HOME in one temp home, since Bun follows HOME, a local relay) fails unless the window shows the dashboard from views://internal/index.html with a first paint, the relay it was given reaches the page as window.kiwi.relayUrl and answers through the CSP, an inline script and a fetch to another origin are refused, the microphone isn't granted, the kiwi daemon answers on the test KIWI_HOME, the kiwi CLI is installed in the test HOME's .kiwi/bin, killing every web content process of the app's own brings the page back with a line in main.log (T439), and nothing of the app is left running after it quits; with desktop/scripts/eb-bridge-checks.ts (T1240) it also fails unless window.kiwi answers our page, page calls to Electrobun's internal webviewTag RPC (ExecuteJavascript, SetNavigationRules, UpdateSrc) and a link to about:blank leave the title and location as they were, a local client on Electrobun's 127.0.0.1 RPC socket connected as our view gets nothing while the page is pushed to three times and its requests never reach the store, a did-commit-navigation the page posts itself doesn't turn the bridge off, a page that replaces globalThis gets none of main's frames, and after the page's own location.reload() the new document is answered.
      Then, through desktop/scripts/eb-first-run.ts (which scripts/perf-desktop.ts also uses when timed by hand), it makes a person, a channel and one message on the local relay (the name field, Continue, New channel, Create channel, the composer and Enter) and fails unless the message shows in the conversation; on Linux it only reports it until T92, since Create channel there hasn't made the channel under Xvfb since 0.27.0.
      On the Mac, smoke-eb then drives the app's menus through System Events (Accessibility, which the macOS runner grants) and fails unless Quit Channels carries ⌘Q, ⌘W closes the window to the menu bar, opening the app again brings it back and ⌘Q quits it, since Electrobun gives only the edit roles keys and app-menus.ts sets them for quit, hide, close, full screen and minimize (T970).
      desktop/native/macos/kiwi-notes-test.m, built into a small .app (the notification center wants a bundle) and run against the test build's libkiwi-shell.dylib, fails unless kiwi_notify_clicks, asked from another thread, gives the notification center the delegate Electrobun never sets, which presents a notification arriving while the app is in front as a banner, in the list and with its sound instead of dropping it, and runs the app's callback once on a click (main shows the window) and calls the completion handler (T973).
      Electrobun's cold-start gate, electrobunColdStartMs, is 1300 ms because on CI its dev test build scales to 900-1070 ms where Electron's scaled to about 680 (its gate was 905):
      T798 finds why, times the stable build, and brings it under 905, then the gate tightens to match.
      Its first-screen gate, electrobunFirstScreenMs, is 1000 ms for the same reason (600-875 ms scaled on CI, against Electron's 745).
      The smoke also sets the page's news count through window.kiwi.setBadge and fails unless 4 shows on the Dock icon (lsappinfo's StatusLabel, NSDockTile in desktop/native/macos/kiwi-shell.m) and 0 clears it (T971).
      Then desktop/scripts/eb-frame-check.ts starts the test app three times with one home: a first start opens at 1200x800, and after the window is moved and resized and the app quits through Electrobun's quit sequence, the next start opens where it was left at that size (desktop/native/macos/kiwi-shell.m restores the frame AppKit autosaves under the name Channels, kept at least the minimum size, T972).
      Then desktop/scripts/eb-frost-check.ts starts the test app twice with one home (T1385): at startup the window looks the way the Mac's accessibility display options ask (a CI runner asks for solid), then the test driver's frostForTest and solidForTest force each way; forced to frost, the window has the sidebar material (an NSVisualEffectView, .sidebar) behind a web view that draws no background, the page is marked data-frost, and window.kiwi.setAppearance with dark, light and system sets the window's appearance to darkAqua, aqua and the system's (kiwi_window_looks in desktop/native/macos/kiwi-shell.m reports what the window has after each change); with Reduce Transparency or Increase Contrast (NSWorkspace's accessibility display options, followed live; solidForTest takes the same path) the material is hidden, the page loses the data-frost mark through the frost push and the shell paints the solid rail, and it comes back when they're off; and a restart with the page's stored theme dark opens the window dark, from the page's own startup call.

  desktop-linux:
