      store's CSP allows api.x.ai only when an xAI key is saved, the project key never reaches
      the snapshot or the token IPC result, consent defaults off, and
      desktop/build/entitlements.mac.plist has the audio-input entitlement. And
      test/desktop-guard.test.ts: on Linux, no encryption or the basic_text backend counts as keys kept
      without a keyring, and such a store is saved again into a keyring once one is there. And
      web lib/channel/trim.test.ts: a long session folds the messages past the 2000-message window
      (plus 500 of slack) into the fold base, and tasks and facts from before it stay;
      lib/channel/warm.test.ts: only the last four channels stay warm; lib/threads.test.ts: what's
      been seen where keeps the newest 500 places. And
      test/perf-check.test.ts: perf-check compares the median of the runs with each gate, counts the
      soak's limits only in the nightly run and lists what isn't at its 0.20 budget yet;
      test/mac-size.test.ts: desktop/scripts/mac-size.ts (run by release-build on macOS) fails a dmg
      or zip over 150 MiB or an installed app over 320 MiB, the 0.20 budgets. And
      test/retry-after.test.ts: the relay's 429 carries Retry-After (header and body, on the socket
