# jev-ci: which CI jobs a pull request can break. Read by .github/jev-ci/cli.ts in the
# `plan` job of .github/workflows/ci.yml. Pushes to main run everything except the jobs marked
# `push: false`, which run on pull requests and manual runs only. `version_bumps: true` runs a
# job when a change only bumps a version number, which otherwise counts as no change.
#
# For each job: `inputs` are the files it reads (a change elsewhere skips it), `imports_from`
# are entry files whose static imports (followed through the repo) count as inputs too,
# `always` are files that run it by rule (config, dependencies), and `description` says in
# plain words what it checks and what makes it fail. Jev reads the description, so keep it
# true. `question` and `criteria` replace the question Jev is asked for that job, and
# `threshold` replaces the global one. `jev: false` marks static checks (types, lint): any
# edit to their files can fail them, so they run whenever those files change and Jev only
# judges tests, flows and builds.
#
# A job also runs when its own job in the workflow changed, or a local action or reusable
# workflow it uses (`uses: ./...`). A change to the workflow's `name`, `run-name`, `on` or
# `concurrency` runs nothing by itself; `permissions` runs the jobs that inherit them; any
# other top-level change runs every job. In this file, a change to a job's `description` or
# `name` runs nothing by itself, a change to its other fields runs that job, and a change to
# a setting above `jobs` runs every job.

# enforce: jobs Jev judges unaffected are skipped. shadow: they run anyway and the plan says so.
mode: enforce
# Run a job when Jev puts its chance of failing at or above this.
threshold: 0.3

workflow: .github/workflows/ci.yml
# Jobs in the workflow that aren't checks: they run on every pull request, so a change to
# them needs no other job. Any other job in the workflow without an entry here always runs.
planner_jobs: [plan, ci-ok]

# The planner itself: a change here runs every job.
run_all_when_changed:
  - ".github/jev-ci/**/*.ts"

# A release bump changes only these lines; it counts as no change.
version_only:
  files: ["package.json", "web/package.json", "desktop/package.json", "src/version.ts"]
  pattern: '^\s*("version"\s*:|export const VERSION\s*=)'

summarize_files: ["bun.lock"]

# Above this many changed lines, or a single file above max_file_lines, Jev isn't asked: the jobs run.
# Lines moved verbatim from one place to another don't count: Jev sees them as moved.
max_jev_lines: 800
max_file_lines: 300

jobs:
  static:
    jev: false
    name: repo / static
    inputs: ["**/*.{ts,tsx,mts,cts,js,jsx,mjs,cjs,css}", "web/index.html", ".github/workflows/**", ".github/actions/**"]
    always: ["tsconfig.json", "tsconfig.worker.json", "package.json", "packages/core/package.json", "bun.lock", ".oxlintrc.json", ".oxfmtrc.json", "web/package.json", "web/tsconfig*.json", "web/vite.config.ts", "web/.oxlintrc.json", "web/.oxfmtrc.json", "desktop/package.json", "desktop/tsconfig*.json", "knip.json"]
    description: >-
      The static checks, one after another, each run even when an earlier one failed.
      Types: tsc --noEmit over src/, packages/core/src (the @kiwi/core workspace package) and
      test/ (and the jev-ci planner test/ imports), again over the Cloudflare worker with the
      Workers types (tsconfig.worker.json), tsc -b in web/ (which also compiles the
      packages/core modules the dashboard imports as @kiwi/core/*), and tsc --noEmit in
      desktop/. scripts/ui-tokens.ts fails on an arbitrary text-[Npx] or rounded-[Npx] Tailwind
      class in web/src. oxlint (root .oxlintrc.json) on src/, packages/core/src, desktop/src, desktop/scripts,
      scripts/, test/, .github/jev-ci/ and site/app.js: unused variables or imports, an empty block or catch,
      explicit any, a useless assignment or escape, a rethrow without its cause. oxlint on web/src
      (web/.oxlintrc.json extends the root config and adds the React rules: conditional hooks,
      setState in an effect, impure calls in render). oxfmt --check on web/src (web/.oxfmtrc.json:
      no semicolons) and on the same root paths as oxlint (root .oxfmtrc.json: semicolons, trailing
      commas, 200 columns). Knip (knip.json) over the root, packages/core, web/ and desktop/: a file nothing
      imports, an export nothing outside its file uses, an unused dependency, an unlisted package.
      scripts/action-pins.ts: every uses: in .github/workflows and .github/actions names a
      third-party action by a full commit SHA. Fails on any of these.

  test-unit:
    name: test / unit
    inputs: ["src/**", ".github/workflows/ci.yml", ".github/workflows/release-build.yml", "scripts/perf-check.ts", "scripts/perf-budgets.json", "packages/core/**", "test/**", "web/src/**", "web/public/**", "site/app.js", "site/install", "site/install.sh", "scripts/build-cli.ts", "scripts/cli-bundle.ts", "scripts/cli-downloads.ts", "scripts/action-pins.ts", "desktop/src/**", "desktop/build/entitlements.mac.plist", ".github/jev-ci/**", ".github/jev-ci.yml", ".github/workflows/ci.yml"]
    always: ["package.json", "bun.lock", "bunfig.toml", "web/package.json", "scripts/ci-tests.ts", "scripts/ci-flows.ts"]
    description: >-
      Runs the unit tests with bun test: every test/*.test.ts except the slow suites in
      scripts/ci-tests.ts's flows groups, plus the dashboard's tests in web/src (task-cards
      among them: one live card per open task, a done task as its last line only; agent-facts: an agent's repo@branch, flagged when the channel doesn't list its repo; quote: a reply's inline quote names who it answers and what they said, an image as Image; agent-strip.test.tsx's one status: away is away even holding a task, a reachable agent on a task is working, what its harness says now wins; message-banner.test.tsx: the question waiting above the composer is only a one-line pointer in the feed, and moving in or out of the banner renders its row again; markdown.test.tsx's mentions: a member's @handle reads as @nickname with the handle as its title, never inside code or links, and a non-member's @ stays text; lib/lanes.test.ts: an agent's lane on a folded signed log (its tasks in progress and in review with their PRs, since when, what's queued, its last three moves, the lead watching the other open PRs, all from one task-to-PR map), every task's PRs in one pass matching each task's own feed (test/work.test.ts: notes, threads naming it, merged or closed later, GitHub branches, forged links), unread counts for every place in one pass matching each place's own (test/standup.test.ts), every task's live card in one pass matching each card asked alone (test/standup.test.ts: messages said, the last line by status, note then chat, its room, who's waited on), a message row's props compared by value with early exits (web message-memo.test.tsx); lib/asks.test.ts: who chose which option of an ask, by its words or its letter, and only from someone it was asked of; lib/voice/grok.test.ts: the Grok Voice adapter replayed on JSON event fixtures with a fake socket, no network: the token only in the subprotocol, the session config, a spoken turn, barge-in (cancel and truncate), tool calls answered before the answer resumes, errors, PCM16 base64, and no static import of lib/voice anywhere in the app so it stays lazy; lib/voice/talk.test.ts: Talk to channel with a fake token, mic, speaker and socket: the room's token, the snapshot in the instructions, mic up and captions back, channel news only from after it started, End stopping everything, the setting to turn on when consent or the key is missing; lib/voice/tools.test.ts and talk.test.ts: the spoken verbs (yes on the top Needs you item, hold, stop) act only on what was just read back: a join with its code (never one whose code isn't in), a plain question answered yes, one with options asked which, a review approved, stop ending the call; plus lib/voice/tools.test.ts: the voice's fast tools on a folded signed log, each read under 300 ms on a 2000-task board (channel status, open tasks, Needs you for the person and joins for the owner only), and acting as the person (post, answer an ask with its option, hold for the owner only, enqueue work as a task), a failed send said back as words; test/picture.test.ts: a person's picture (picture.set by that person only, never an agent's, a png, jpeg or webp of at most 24 KB in base64, quiet in the conversation, carried by snapshots), with test/github-link.test.ts: the linked account's avatar fetched by its id at 96px, at 64px when too big, null when not an image, and the link token handed only to a relay whose /v1/config names a GitHub App (test/create-seat.test.ts: never to clear the repo list), and web monogram.test.tsx: a face wears the channel's picture for that member, initials without one, an agent its harness's logo (a one-colour logo in the theme's ink, a plain terminal for a harness Kiwi doesn't know or none said; web lib/harness.test.ts: short names read as the product, every detected harness has a logo); test/icon.test.ts and web channel-icon.test.tsx: a channel's icon is the robot head its owner picked (by colour, only the twelve), an emoji or an image, a channel without one a robot head steady for its title, never the lead's, and the picker offers all twelve; test/personalities.test.ts: personalities on the person's account (the six presets valid, one of your own needs an id and one glyph, the list drops presets, repeats and broken ones, at most fifty, copies take a free id, the desktop snapshot hands the page only valid ones); test/voice-allow.test.ts: only the owner allows voice in a channel (voice.set), carried by snapshots; lib/voice/news.test.ts: what the live voice is told as the channel moves, on a folded signed log: a task done said once even when its digest follows, a new question for the person with its options, CI red once per check and commit, and the snapshot it starts from). They cover
      pure modules: protocol and event validation, state folding, formatting, identity and
      signing, scopes and roles, routing and auth tables, error texts, the install scripts,
      hooks and harness detection (a Grok Bot from its VM's hostname, and its model grok-bot: test/routing.test.ts, test/runs.test.ts), the daemon waking a Grok Bot by POSTing to its routine's webhook with the Authorization header piped to kiwi wake webhook, never the message text (test/wake.test.ts), the repo and branch an agent's card reads from its folder (test/routing.test.ts), the channel's repos and the flag on an agent from another repo (test/repos.test.ts), a closed task's digest (test/digest.test.ts, and the web's in task-actions.test.ts), GitHub webhooks into a channel's queue (test/github-relay.test.ts: signature, routing by connected repo, owner-only queue and ack, trimming), the owner's app draining that queue into github events and the PRs and checks they fold into (test/github-drain.test.ts), a PR's card taking GitHub's state, title and checks over the chat's guess (test/github-prs.test.ts, web pr-checks.test.tsx), a PR on a branch named T<n>-… showing on task T<n> (test/github-branch.test.ts), the GitHub App's key, token and API calls against a fake GitHub: diffs for members, the kiwi/review check for the owner only (test/github-app.test.ts), which verdicts the owner's app posts as checks, once and without backfilling (test/github-review.test.ts, web review-checks.test.ts), a PR on a T<n>-… branch linked back to its task by one owner-only comment (github-app.test.ts, github-branch.test.ts), CI red becoming a task (test/ci-red.test.ts, packages/core/src/ci-red.ts: a failed check once per commit and check, owned by whoever pushed, a note on the commit's open CI task; ci.yml's concurrency giving each run on main a group of its own, so no push or rehearsal cancels one into a red ci-ok, while a pull request's newest push still cancels its older run; github-app.test.ts: the owner-only check log excerpt from the job's log or its failure annotations; web ci-red.test.ts: the task and note it posts), a GitHub issue imported as a task and the two closing each other: issue refs, issue webhooks, the issues and closes they fold into (test/github-issues.test.ts), kiwi task add --issue and the owner closing the issue on a live relay against a fake GitHub (test/github-issues-live.test.ts), the issue routes, read for members and close for the owner only (github-app.test.ts), an old channel's roles read as personalities: the lead stays the lead, a free-text role becomes a Builder named after it with its rules as instructions, from the whole log or a snapshot, and a signed personality wins (test/roles-carry.test.ts), where a task comes from (task.add's from) and who has its context: agents ranked by lineage, who worked it and their queue, the busy rule, task who's text and --from on a live relay, and warm work: a card's fresh (the hook marks a reset on startup, clear and compact, not resume), when each member last touched a task (its thread, or its events from whoever is on it) and the warm bonus (test/task-who.test.ts), the folders a task changed: read from the agent's branch against main in a throwaway git repo, kept on task done and review, borrowed from the parent or the task's text, and whoever changed them lately ranked for a task in them (test/task-areas.test.ts), which closes the owner's app makes, once and without backfilling (web review-checks.test.ts), a person assigning the suggested agent from the task view (web task-actions.test.ts), a run of GitHub's news folded into one line in the conversation (web github-line.test.ts), a reply's one-line quote (web quote.test.tsx), the history cache, a channel's warm copy for the session (web lib/channel/warm.test.ts: a revisit follows from what it holds with no second cache read or verify, and reads the cache on a gap or a stale copy), the channel clock (web lib/channel/clock.test.ts: it holds still within its interval so a re-render refolds nothing, and every subscriber to one interval shares one timer), the desktop app holding the relay's config and the linked account's repo list for a while and asking again after a failure (test/held.test.ts), the history cache writing a burst of messages as one IndexedDB write that keeps only the newest window (web lib/history.test.ts), and localStorage writes held in memory and written once per burst, flushed when the page hides, a dropped one never landing (web lib/write-behind.test.ts), the desktop app's node-only helpers, the
      public site's invite parsing and its Download button's pick by OS and chip (site/app.js, test/site.test.ts), scripts/action-pins.ts.
      Also test/checkpoint.test.ts: a checkpoint is a task.update note marked checkpoint (text
      required, at most CHECKPOINT_MAX_LENGTH), folded and labelled in task show, refused before
      sending when empty or too long; and what a fresh session is told (packages/core/src/reentry.ts):
      each open task it owns with the newest checkpoint or else the last note, the review round it
      judges, the board for the lead, the compact summary, multi-line text marked; past its cap
      whole tasks are left out, never cut mid-line, the text stays within the cap at any size, and
      it names exactly the tasks (and board) it left out, a checkpoint too long to show is cut with a
      pointer to all of it. And handOver (src/hooks/answer.ts): the unread messages a hook hands over
      stay within its limit at any size and any command length, whole messages first, the note about
      the rest only when needed, a too-long first message cut with a kiwi show pointer only when at
      least CLIP_MIN of its body shows, and otherwise nothing handed over (so nothing is marked read);
      a stop reason with the Kimi or Grok re-arm reminder and a SessionStart context (startContext,
      startBudgets) stay at or under seatBudget for one to fifty seats and any brief size; re-entry's
      recovery commands use the seat's own command.
      Also test/daemon-big-lines.test.ts: the daemon's socket writes queue what the socket
      didn't take and flush it on drain (src/daemon/server.ts), so a catch-up of thirty
      messages with 50 KB ones among them, and big live messages back to back, arrive whole
      and in order. test/daemon-catchup.test.ts: a message that lands while a subscriber
      catches up waits until the catch-up is sent, so the rest of the catch-up isn't skipped.
      Also test/daemon-orphan.test.ts: a daemon whose only relays are local ones that stopped
      answering, with nobody connected, stops by itself after a while (src/daemon/server.ts), so
      a test run that was killed leaves no daemon behind; one with a client connected keeps running.
      Also test/daemon-lock.test.ts: one daemon per KIWI_HOME (src/daemon/lock.ts): daemons started
      at once leave one, a daemon too busy to answer isn't replaced, and a daemon whose lock and
      socket another took exits without deleting that socket.
      Also MiMoCode woken in place: test/hooks-mimo.test.ts: Kiwi's MiMoCode plugin (src/hooks/install/mimo.ts)
      written to MiMoCode's plugin folder (KIWI_MIMO_DIR, MIMOCODE_HOME/config, XDG_CONFIG_HOME/mimocode),
      counted as installed only while it is current, removed on uninstall without touching a kiwi.ts that
      isn't Kiwi's, the file passing tsc --strict with one export, and, loaded with a fake MiMoCode client
      and a fake listener, naming a child session's root on the agent's shell and starting a turn in that
      root session when its listener exits with messages, then listening again with the handoff token the
      listener printed on stdout, so Kiwi counts those messages delivered only once the wake landed, and
      only a UUID-shaped landed token settling a handoff (handoffFrom in src/hooks/listen.ts); a wake MiMoCode refuses
      (promptAsync rejecting, or answering with an error) sent again with backoff before the listener runs
      again, and no longer sent once the
      session is deleted; promptAsync asked to throw on an HTTP error, so a client answering with data
      only, which returns nothing for one, still has the wake sent again.
      Every test file runs after test/setup.ts, which points each harness's folder, MiMoCode's (KIWI_MIMO_DIR)
      among them, at a temp directory and drops each harness's session markers (MIMOCODE, MIMOCODE_PID,
      MIMOCODE_SESSION_ID among them), so a run on a machine with ~/.config/mimocode, or from inside MiMoCode,
      writes nothing there; test/hooks-harness.test.ts stamps ~/.config/mimocode and its plugin folder with
      the other real harness paths and fails if an install changed them.
      Also Pi as a known harness: test/hooks-pi.test.ts: Kiwi's Pi extension
      (src/hooks/install/pi.ts) written to Pi's extensions folder on join or kiwi hooks install
      pi, counted as installed only while it is current and runs this kiwi's hooks, removed on
      uninstall without touching a kiwi.ts that isn't Kiwi's, and, loaded with a fake Pi API and
      fake hooks, exporting KIWI_PI_PID and KIWI_PI_SESSION, briefing a new session, adding unread
      messages to a prompt, handing them to a turn that would end, starting a turn when its
      listener wakes, and stopping its listener's process group on shutdown, the file itself passing tsc --strict; Pi's seat and card
      from PI_CODING_AGENT and the extension's process (test/seats.test.ts, test/routing.test.ts),
      its model from its session file (test/harness-model.test.ts), its wake path and words
      (test/wake.test.ts, test/daemon-seats.test.ts) and its name and logo (web lib/harness.test.ts).
      Also test/context-line.test.ts: a seat's context in words (tokensWord), the Stop hook's nudge
      once per crossing of CONTEXT_LINE (250k; back under it resets, unknown keeps the state), naming
      each open task the seat owns and the checkpoint command, and an activity's context token
      counts cleaned on the wire (cleanActivity); test/harness-model.test.ts: the context read from
      Claude Code's newest main-thread reply (input, cache read, cache written, never output) and from
      Codex's newest token_count with its window, unknown after a compaction (src/harness.ts); web
      agent-strip.test.tsx: an agent's lane shows its context, flagged past the line.
      Also test/daemon-versions.test.ts: compareVersions (packages/core/src/versions.ts, shared by
      the CLI, the desktop updater and the changelog) orders releases and pre-releases, an older
      kiwi keeps a newer daemon running, and a newer one replaces an older daemon (src/daemon/rpc.ts).
      Also test/install.test.ts's download cases: site/install.sh takes the release's .xz when
      xz is installed, else its .gz, else the plain binary, and checks what it downloaded against
      SHA256SUMS; and test/cli-downloads.test.ts: scripts/cli-downloads.ts, the release build's
      check that every CLI download is 30 MB or less.
      Also test/hooks-harness.test.ts's broken config case: with a config.json that isn't JSON,
      every hook exits 0 and says once which file to fix (src/config/file.ts, src/cli/commands/hooks.ts).
      Also test/config-lock.test.ts: withLock (src/config/file.ts) takes a lock whose holder is gone at
      once, waits for a live holder instead of stealing its lock, and never removes a lock it no
      longer owns.
      Also test/bounded-files.test.ts: the daemon's wake.log starts over past 1 MB keeping one older file
      (src/daemon/wake.ts), and the daemon prunes hook bookkeeping in listen-hooks and hook-state older
      than a week, at start and daily (src/hooks/delivered.ts, src/daemon/server.ts).
      Also test/who-cached.test.ts: the daemon keeps each member's latest presence beacon, and once it has
      heard a full beacon round, kiwi who and status answer from it (the daemon's presence verb) without
      opening a socket to the relay for a probe.
      Also test/cli-failures.test.ts: what the CLI says when the relay can't be reached (its address and the
      reason in plain words, not Bun's), fails (5xx) or limits it (429), with what to do next (src/cli/fail.ts,
      packages/core/src/client/live.ts reason()).
      Also test/hooks-harness.test.ts's listener day: Claude Code's listener waits a week, an install
      whose listener timeout is still the old day counts as not installed so it gets rewritten, and
      a listener never outwaits the timeout installed for it (src/hooks/install/claude.ts, src/hooks/listen.ts).
      Also test/machine-file.test.ts: saving this computer's key keeps machine.json.bak, a machine.json
      cut short comes back from it, and one with no backup stops kiwi instead of minting a new key
      (src/machine.ts); with test/desktop-guard.test.ts's chooseStore: kiwi-store.bin comes back from its
      backup when it's missing or broken, never over a good file or a locked keychain.
      Also test/silent-socket.test.ts: a live socket that goes quiet after opening (no answer to
      a ping) and an upgrade nobody answers are both dropped and opened again; a nudge (the network or
      the Mac coming back) cuts a long reconnect wait short and drops a socket that doesn't answer a
      ping in 5s, and web lib/wake.test.ts: coming back online or to a visible page nudges.
      Also test/web-core-barrel.test.ts: web/src takes values from @kiwi/core's client submodules
      (errors, relay, info), never the client.ts barrel, which pulls the whole Channel into the first load.
      Also test/create-seat.test.ts: creating a channel saves the owner key before the relay hears of
      it; a failed save after the relay made it is finished on the next start, and a create that never
      landed is forgotten.
      Also test/unread-live.test.ts: a stored message this build can't read arrives as Unread with
      its seq, and web lib/history.test.ts: its sealed row keeps the cache whole (no hole, no reload)
      and opens as the message once a newer build can read it.
      Also test/desktop-keys.test.ts: the desktop key process (desktop/src/keyring.ts and keys-server.ts,
      over the wire web/src/lib/channel-remote.ts uses) against a local relay, failing if any member,
