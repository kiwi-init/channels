# jev-ci: which CI jobs a pull request can break. Read by .github/jev-ci/cli.ts in the
# `plan` job of .github/workflows/ci.yml. Pushes to main run everything except the jobs marked
# `push: false`, which run on pull requests and manual runs only. `version_bumps: true` runs a
# job when a change only bumps a version number, which otherwise counts as no change.
#
# For each job: `inputs` are the files it reads (a change elsewhere skips it), `always` are
# files that run it by rule (config, dependencies), and `description` says in plain words
# what it checks and what makes it fail. Jev reads the description, so keep it true.
# `jev: false` marks static checks (types, lint): any edit to their files can fail them, so
# they run whenever those files change and Jev only judges tests, flows and builds.

# enforce: jobs Jev judges unaffected are skipped. shadow: they run anyway and the plan says so.
mode: enforce
# Run a job when Jev puts its chance of failing at or above this.
threshold: 0.3

workflow: .github/workflows/ci.yml
planner_jobs: [plan, ci-ok]

# The planner itself, its config and the shared setup: a change here runs every job.
run_all_when_changed:
  - ".github/jev-ci/**"
  - ".github/jev-ci.yml"
  - ".github/actions/**"

# A release bump changes only these lines; it counts as no change.
version_only:
  files: ["package.json", "web/package.json", "desktop/package.json", "src/version.ts"]
  pattern: '^\s*("version"\s*:|export const VERSION\s*=)'

summarize_files: ["bun.lock", "web/bun.lock", "desktop/bun.lock"]

# Above this many changed lines, or a single file above max_file_lines, Jev isn't asked: the jobs run.
max_jev_lines: 800
max_file_lines: 300

# The merge bus (.github/bus, .github/workflows/bus.yml): agents push bus/<task>, and the bus merges
# each onto main, resolves what it can, tests the exact tree on bus/staging and fast-forwards main.
# Jev only sets the numbers below; it never approves a merge.
bus:
  # Resolution tiers, cheapest first. A hunk none of them resolves bounces the item to its author.
  ladder: [git, mergiraf, keep-both, haiku]
  # A pull request joins the bus with this label, added by someone with one of these roles or listed in maintainers. Never a fork.
  label: queue
  label_roles: [admin, maintain]
  maintainers: [ojowwalker77]
  on_behalf_of: Jonatas Walker
  # Keep both sides of a hunk whose base was empty when Jev's keep_both is at or above this.
  keep_both: 0.7
  # A model's resolution goes up a tier (or bounces) when Jev's intent_shift is at or above this.
  intent_shift: 0.35
  # Take a queued branch ahead of the oldest when Jev's needs_order says the oldest needs it first.
  needs_order: 0.6
  # A red staging run is rerun when Jev's unrelated_failure is at or above this, at most `reruns` times.
  unrelated_failure: 0.7
  reruns: 1
  haiku: { model: claude-haiku-5-5, samples: 3, effort: medium }
  opus: { model: claude-opus-5-5, samples: 1, effort: high }
  context_lines: 40
  max_hunk_lines: 200
  lockfiles: ["bun.lock", "web/bun.lock", "desktop/bun.lock"]
  # Typechecks for a merged tree, each run when the merge touches a file it matches.
  tsc:
    - { when: ["src/**", "test/**", ".github/bus/**", ".github/jev-ci/**"], run: [bunx, tsc, --noEmit] }
    - { when: ["src/relay/**", "src/protocol.ts"], run: [bunx, tsc, --noEmit, -p, tsconfig.worker.json] }
    - { when: ["web/**", "src/**"], dir: web, run: [bunx, tsc, -b] }
    - { when: ["desktop/**"], dir: desktop, run: [bunx, tsc, --noEmit] }

jobs:
  core-types:
    jev: false
    name: core / types
    inputs: ["src/**", "test/**", ".github/bus/**", ".github/jev-ci/**", "desktop/src/move.ts", "desktop/src/open.ts", "desktop/src/signer.ts", "desktop/src/update-asset.ts", "desktop/src/daemon-client.ts", "desktop/src/guard.ts", "desktop/src/bridge.ts"]
    always: ["tsconfig.json", "tsconfig.worker.json", "package.json", "bun.lock"]
    description: >-
      Runs tsc --noEmit over src/ (the kiwi CLI, daemon, client, relay and MCP server) and test/
      (which also compiles the merge bus in .github/bus and the jev-ci planner it imports),
      and again over the Cloudflare worker (src/relay/worker.ts, src/relay/room.ts,
      src/protocol.ts) with the Workers types. Fails on any TypeScript type error in those files
      or in what they import, including a changed export, signature or type.

  core-test:
    name: core / test
    inputs: ["src/**", "test/**", "web/src/**", "web/public/**", "site/install", "site/install.sh", "site/install.ps1", "scripts/build-cli.ts", "scripts/cli-bundle.ts", "desktop/src/move.ts", "desktop/src/open.ts", "desktop/src/signer.ts", "desktop/src/update-asset.ts", "desktop/src/daemon-client.ts", "desktop/src/guard.ts", "desktop/src/bridge.ts"]
    always: ["package.json", "bun.lock", "bunfig.toml", "web/package.json", "web/bun.lock", "scripts/ci-tests.ts"]
    description: >-
      Runs the fast unit tests with bun test: every test/*.test.ts except the slow agent-flow
      suites, plus the dashboard's helper tests in web/src. They cover pure modules: protocol and
      event validation, state folding, formatting, identity and signing, scopes and roles,
      routing and auth tables, error texts, the install script (web/public/install.sh), hooks and
      harness detection, the history cache, and the desktop app's node-only helpers
      (desktop/src/move.ts, desktop/src/open.ts, desktop/src/signer.ts, desktop/src/update-asset.ts, desktop/src/daemon-client.ts, desktop/src/guard.ts). Fails if a tested module's behavior,
      output text or exported names change. scripts/ci-tests.ts runs every group with TMPDIR
      pointing through a symlink, as macOS's does, so a test that compares a tmp path with its
      realpath or process.cwd() fails here too.

  flows-a:
    name: core / flows-a
    inputs: ["src/**", "test/**", "web/src/**", "web/public/**"]
    always: ["package.json", "bun.lock", "bunfig.toml", "scripts/ci-tests.ts"]
    description: >-
      Runs slow end-to-end tests that start a real local relay (src/relay/bun.ts) and drive the
      kiwi CLI and client: e2e (create a channel, join, send and listen through the relay),
      verbs (the agent CLI verbs listen, send, show, status, note, join, log, task, leave and
      their aliases), threads (task threads and direct threads), reconnect (what a listener says
      when the relay drops). Fails if the CLI, the client, the relay, the protocol or the text
      they print changes behavior.

  flows-b:
    name: core / flows-b
    inputs: ["src/**", "test/**", "web/src/**", "web/public/**"]
    always: ["package.json", "bun.lock", "bunfig.toml", "scripts/ci-tests.ts"]
    description: >-
      Runs slow agent-flow tests against a real local relay and the kiwi CLI: join-seats
      (joining, one seat per agent, Claude Code hooks doing the listening), read-receipts,
      daemon-pair (kiwi pair through the relay's pairing mailbox: src/daemon.ts, src/machine.ts,
      src/mailbox.ts), sh-escape (the sandboxed kiwi sh), coordinator-follows (the coordinator
      role), reclaim (getting a seat back), wake-yourself (the Stop hooks that keep a Kimi Code
      or Grok agent's own listener running). Fails if joining, seats, hooks, pairing, the daemon,
      kiwi sh or the relay change behavior.

  web-types:
    jev: false
    name: web / types
    inputs: ["web/src/**", "web/index.html", "src/**", "scripts/ui-tokens.ts"]
    always: ["web/package.json", "web/bun.lock", "web/tsconfig*.json", "web/vite.config.ts", "scripts/ui-tokens.ts"]
    description: >-
      Type-checks the React web dashboard with tsc -b in web/, which also compiles the src/
      modules the dashboard imports through @mc/* (client, crypto, format, identity, load,
      membership, protocol, sas, scopes, state, work). Then fails on any arbitrary text-[Npx] or
      rounded-[Npx] Tailwind class in web/src. Fails on a type error in web/src or those src/
      modules, or a raw pixel size in web/src.

  web-lint:
    jev: false
    name: web / lint
    inputs: ["web/src/**"]
    always: ["web/.oxlintrc.json", "web/package.json", "web/bun.lock"]
    description: >-
      Runs oxlint on web/src with the rules ESLint's recommended JavaScript, TypeScript and
      React hooks sets had (web/.oxlintrc.json lists them). Fails on an oxlint error in the
      dashboard's .ts or .tsx files: an unused variable or import, a hook called conditionally,
      setState in an effect, an impure call in render, an explicit any.

  web-format:
    jev: false
    name: web / format
    inputs: ["web/src/**"]
    always: ["web/.oxfmtrc.json", "web/package.json", "web/bun.lock"]
    description: >-
      Runs oxfmt --check on web/src with web/.oxfmtrc.json. Fails when a file in web/src is not
      formatted as oxfmt would write it (run `bun run format` in web/ to fix).

  ui-smoke:
    name: ui-smoke
    inputs: ["src/**", "web/**", "scripts/smoke-ui.ts"]
    always: ["package.json", "bun.lock", "web/package.json", "web/bun.lock", "web/vite.config.ts", "scripts/smoke-ui.ts"]
    description: >-
      Builds the web dashboard for production, starts the relay (src/relay) and runs the kiwi CLI
      (src/cli) as a test computer, then drives the dashboard in headless Chromium: opens every
      menu, popover and dialog, sets up a passkey, previews an invite link, links a computer with
      `kiwi setup`, approves its agent joining, and opens a task. It finds buttons, menus and
      dialogs by their visible names and roles. Fails if a page throws while rendering, if a
      button, label or dialog it looks for is renamed, moved or missing, or if the relay,
      pairing or join flow breaks.

  desktop:
    name: desktop / build
    inputs: ["desktop/**", "src/**"]
    always: ["desktop/package.json", "desktop/bun.lock", "desktop/tsconfig*.json"]
    description: >-
      Installs desktop/ dependencies, type-checks the Electron shell in desktop/src, and bundles
      its main, preload and channels (the key process) scripts with bun build. desktop/src imports
      src/identity.ts, src/mailbox.ts, src/person.ts, and through keyring.ts src/client.ts and
      what it imports. Fails on a type or bundling error in desktop/src or those imports. The
      dashboard is not compiled here.

  desktop-fuses:
    name: desktop / fuses
    inputs: ["desktop/**", "src/**", "web/src/**", "web/index.html", "scripts/build-cli.ts", "scripts/cli-bundle.ts"]
    always: ["desktop/package.json", "desktop/bun.lock", "desktop/tsconfig*.json", "desktop/scripts/fuses.ts", "desktop/scripts/smoke.ts", "package.json", "bun.lock", "web/package.json", "web/bun.lock"]
    description: >-
      Packages the Linux app with electron-builder --dir from desktop/package.json's build config
      (its electronFuses block included), then desktop/scripts/fuses.ts reads the packaged
      binary's Electron fuses with @electron/fuses and fails unless RunAsNode,
      EnableNodeOptionsEnvironmentVariable and EnableNodeCliInspectArguments are off and
      EnableCookieEncryption, EnableEmbeddedAsarIntegrityValidation and OnlyLoadAppFromAsar are
      on. Then desktop/scripts/smoke.ts starts the packaged app under Xvfb and fails unless its
      window renders, its key process (utilityProcess.fork of dist/channels.js from app.asar)
      stays up, and the bundled kiwi daemon answers on its socket, and fails if
      ELECTRON_RUN_AS_NODE=1 runs JavaScript or --inspect opens a debugger in the packaged app.
      Fails on a packaging error, a fuse changed or dropped, or an app that no longer starts from
      its asar.

  site-test:
    name: site / test
    inputs: ["site/app.js", "test/site.test.ts"]
    always: ["package.json", "bun.lock", "scripts/ci-tests.ts"]
    description: >-
      Runs test/site.test.ts: loads the public site's script (site/app.js) against a stub page and
      checks which invite it shows for /join/<code> paths and #<code> links, that a path which
      isn't a join code (a malformed percent escape included) leaves the landing page and its
      downloads in place instead of throwing, and the install command it prints. Fails if the
      invite parsing, the kiwi:// link or the printed command changes.

  desktop-keys:
    name: desktop / keys
    inputs: ["desktop/src/**", "src/**", "web/src/**", "test/desktop-keys.test.ts", "test/check.ts"]
    always: ["package.json", "bun.lock", "scripts/ci-tests.ts"]
    description: >-
      Runs test/desktop-keys.test.ts: the desktop key process (desktop/src/keyring.ts, served over
      the same wire the window uses, web/src/lib/channel-remote.ts) against a local relay. It
      creates a channel, joins, chats, opens cached rows, rotates on remove, restarts and closes,
      and fails if any member, owner, person or channel key reaches what the window receives.
      Also the seat rules (desktop/src/seats.ts: what the window may save), the wire codec, the
      list of calls the window may make, and a scan of web/src that fails when a file other than
      web/src/lib/channel-local.ts imports Channel, generateIdentity, seal/open or the keyring.

  cli-build:
    name: cli / build
    inputs: ["src/**", "scripts/build-cli.ts", "scripts/cli-bundle.ts", "scripts/smoke-cli.ts", "test/owner.ts", "test/owner-cli.ts", "test/check.ts"]
    always: ["package.json", "bun.lock"]
    description: >-
      Compiles the kiwi CLI (src/cli/main.ts and everything it imports) into one Linux binary
      with scripts/build-cli.ts (minified, split into lazily loaded chunks, and with every
      just-bash command kiwi sh doesn't allow left out), then runs `kiwi --version`, then checks
      the minified JS: it fails over its byte budget (BUDGET_BYTES in scripts/build-cli.ts) or if
      QuickJS (run), sql.js, turndown or domino got back in. Then scripts/smoke-cli.ts drives the
      binary against a local relay: it joins a channel, runs every allowed kiwi sh command and
      compares the output with the source CLI's, calls the MCP sh tool, and runs kiwi doctor.
      Fails if a module or chunk can't be resolved, bundled or loaded, if the binary crashes, or
      if any of those answers differ.

  relay-worker:
    name: relay / worker
    inputs: ["src/**"]
    always: ["wrangler.jsonc", "package.json", "bun.lock"]
    description: >-
      Bundles the Cloudflare worker relay (src/relay/worker.ts and its imports) with wrangler
      deploy --dry-run and wrangler.jsonc. Fails if the worker can't be bundled for Cloudflare,
      for example a Node- or Bun-only import reaching src/relay/worker.ts, or an invalid
      wrangler.jsonc. Code the worker doesn't import can't affect it.

  relay-budget:
    name: relay / budget
    inputs: ["src/**", "web/src/lib/**", "test/budget-*.test.ts", "test/traffic.ts", "test/check.ts", "test/owner.ts", "test/owner-cli.ts"]
    always: ["package.json", "bun.lock", "scripts/ci-tests.ts"]
    description: >-
      Runs every test/budget-*.test.ts. budget-relay counts, on one long-lived room storage
      handle as a Cloudflare Durable Object keeps it, the SQL statements a stored message, a read
      mark and a connecting socket cost, and checks the room's in-memory state follows posting
      rights, removals, numbering and a close. The others drive clients through test/traffic.ts,
      a proxy in front of a local relay that counts HTTP requests by route, sockets, frames by
      type and bytes. Each fails when an operation costs more requests, frames, bytes or
      statements than its budget, so a change that adds relay traffic or storage work fails.

  cli-seats:
    name: cli / seats
    inputs: ["src/**", "test/seats.test.ts", "test/multi-seat.test.ts", "test/setup.ts", "test/owner.ts", "test/owner-cli.ts", "test/check.ts"]
    always: ["package.json", "bun.lock", "bunfig.toml", "scripts/ci-tests.ts"]
    description: >-
      Runs test/seats.test.ts and test/multi-seat.test.ts. seats checks which agent a command or
      hook acts for in a folder (src/seats.ts): a session's own seat, a restart taking its seat
      back, a second live session never acting as the first, and a session that holds several
      seats getting all of them. multi-seat drives the kiwi CLI against a local relay: one Claude
      Code session joins two channels under two names from one folder, and its SessionStart, Stop
      and background listen hooks (src/hooks.ts) must serve both seats, while a bare `kiwi listen
      --now` there must refuse and name both (src/cli/main.ts). A second session joins its second
      seat from a sibling folder, and the hooks run from the folder it started in must serve that
      seat too, while another session's hooks must not. Fails if seat resolution, the hook
      answers or the CLI's choice of agent change.

  cli-handoff:
    name: cli / handoff
    inputs: ["src/**", "test/handoff.test.ts", "test/setup.ts", "test/owner.ts", "test/owner-cli.ts", "test/check.ts"]
    always: ["package.json", "bun.lock", "bunfig.toml", "scripts/ci-tests.ts"]
    description: >-
      Runs test/handoff.test.ts. An escalation can carry a live browser link (src/protocol.ts
      handoff): the payload check accepts it only on an escalation and only as an https link
      without credentials, a vendor of at most 40 characters and an expiry. Against a local relay,
      `kiwi send --escalate --handoff URL --wait` must exit 0 when the person answers
      `handoff: done`, 4 on `handoff: failed` and 4 at expiry, and the link must stay out of
      kiwi log, show, listen --json and the waiting command's own output, appearing only in
      `kiwi show N --reveal`. Fails if the field, the wait or the redaction change.

  repo-comments:
    jev: false
    name: repo / comments
    inputs: ["**/*.{ts,tsx,mts,cts,js,jsx,mjs,cjs,css,py}"]
    always: ["scripts/ci/**"]
    description: >-
      AGENTS.md forbids comments and tool directives in code. scripts/ci/no_comments.py reads the
      lines this change adds (git diff against the first parent) and fails on a comment in a
      .ts/.tsx/.js/.jsx/.mjs/.cjs/.mts/.cts or .css file, or a comment or docstring in a .py file
      (a docstring listed in its ALLOWED_DOCSTRINGS passes, a #! first line passes). Old lines
      are not checked. The job also type-checks scripts/ci with mypy --strict and runs its
      unit tests.

  repo-pins:
    jev: false
    name: repo / pins
    inputs: [".github/workflows/**", ".github/actions/**", "scripts/action-pins.ts", "test/action-pins.test.ts"]
    always: ["package.json", "bun.lock", "scripts/ci-tests.ts"]
    description: >-
      Runs test/action-pins.test.ts, then scripts/action-pins.ts over .github/workflows and every
      composite action under .github/actions. The script parses each file as YAML and reads every
      step's uses, a job's uses (reusable workflows) and a composite action's steps. Fails when one
      names a third-party action or workflow by tag or branch instead of a full 40-character commit
      SHA, or a docker:// image without a sha256 digest. Local ones (./…) pass.

  repo-knip:
    jev: false
    name: repo / knip
    inputs: ["**/*.{ts,tsx,css}"]
    always: ["knip.json", "package.json", "bun.lock", "web/package.json", "web/bun.lock", "desktop/package.json", "desktop/bun.lock"]
    description: >-
      Runs Knip (knip.json) over the root, web/ and desktop/ packages. Fails on a file nothing
      imports, an export or exported type nothing outside its file uses, a dependency no file
      uses, or an import of a package a package.json doesn't list. Tests count as users, so an
      export only a test imports passes.

  web-bundle:
    jev: false
    name: web / bundle
    inputs: ["web/src/**", "web/index.html", "src/**", "scripts/web-bundle.ts"]
    always: ["web/package.json", "web/bun.lock", "web/vite.config.ts", "scripts/web-bundle.ts"]
    description: >-
      Builds the web dashboard for production (vite build in web/), then adds up the JS the first
      screen loads: the entry script in web/dist/index.html plus every chunk it modulepreloads.
      Fails when that is over BUDGET_BYTES in scripts/web-bundle.ts. Code reached only through
      web/src/components/lazy.tsx (markdown, settings, computers, the palette and the side panels)
      is loaded after first paint and doesn't count; a new static import of it, or a new heavy
      dependency on the first screen, can push the total over.

  cli-macos:
    name: cli / macos
    inputs: ["src/**", "test/**", "web/src/**", "web/public/**", "site/install", "site/install.sh", "site/install.ps1", "scripts/build-cli.ts", "scripts/cli-bundle.ts", "desktop/src/**"]
    always: ["package.json", "bun.lock", "bunfig.toml", "web/package.json", "web/bun.lock"]
    description: >-
      On a macOS runner, does what the release's cli job does: runs the whole bun test suite
      (every test/*.test.ts and web/src test, the agent flows included), compiles the kiwi CLI
      for darwin-arm64, darwin-x64, linux-x64, linux-arm64 and windows-x64 with
      scripts/build-cli.ts, ad-hoc signs the macOS binaries and runs `kiwi --version`. The same
      tests run on Linux in core / test, core / flows-a, core / flows-b, cli / seats and the
      other test jobs, so this job is for what fails only on macOS: paths (os.tmpdir() is under
      /var, a symlink to /private/var, so process.cwd() and realpath spell a folder differently
      from mkdtemp; home is under /Users; the file system ignores case; a unix socket path is
      capped at 104 bytes), how the CLI names its own command in the text it prints, BSD
      versions of shell tools, process, signal and file-watching differences, and a build
      target that fails to compile. Fails if any test fails on macOS or a target doesn't build.

  release-rehearsal:
    name: release / rehearsal
    jev: false
    push: false
    version_bumps: true
    inputs: []
    always: [".github/workflows/release.yml", ".github/workflows/release-build.yml", "CHANGELOG.md", "src/version.ts", "desktop/package.json", "desktop/bun.lock", "desktop/scripts/fuses.ts", "scripts/changelog.ts"]
    description: >-
      Runs .github/workflows/release-build.yml, the build a tag's release.yml runs, with
      rehearsal: true and a read-only token, uploading nothing: the version and changelog checks
      (taking v<src/version.ts> as the tag), the cli job on macOS (bun test, five builds), and
      the desktop app packaged on macOS (arm64 and x64) and Linux (AppImage and deb), with each
      package's contents and fuses checked. On a pull request the macOS app is unsigned; a
      manual run of ci.yml passes the signing secrets, so the app is signed, notarized and
      checked as on a tag. Fails where the tag would: versions that disagree, no changelog
      section, a test failing on macOS, an electron-builder error, a package missing the web
      app or the kiwi binary, and on a manual run a signing or notarization error. Runs on
      release PRs (they change CHANGELOG.md), on any change that only bumps a version number,
      and on manual runs of ci.yml, never on a push to main.

  bus-test:
    name: bus / test
    inputs: [".github/bus/**", ".github/jev-ci/**", "test/bus-*.test.ts"]
    always: ["package.json", "bun.lock", "scripts/ci-tests.ts", ".github/actions/mergiraf/**"]
    description: >-
      Runs test/bus-*.test.ts against the merge bus in .github/bus, with mergiraf installed: it
      builds small git repositories with conflicting branches and checks the conflict parser, the
      resolution patch (which may only replace whole conflicts), the validation checks (markers,
      parse errors, duplicate class members), the resolution ladder with Jev and Claude stubbed
      (keep-both thresholds, Haiku sampling and majority, escalation to Opus on abstain, a high
      intent_shift or a failed typecheck), the tick's queue order and in-flight check, the staging
      commit's trailers and the symbols an event names. Fails if any of those behaviors change.
