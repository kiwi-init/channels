      signed more than a day before the relay received it). And
      test/prism.test.ts: prism means one thing (prism-lit only on the open channel and the
      sidebar's chosen view or conversation, no plain prism or orb anywhere, solid
      prefers-contrast fallbacks, the spectrum and segment tokens written once, the kit the quiet
      look). And
      test/desktop-update-check.test.ts: Settings' check for updates (desktop/src/updater.ts's
      checkForUpdate, with electron and fetch faked): the latest release says current, a
      pre-release or draft never counts, an unpackaged app only offers the release link and
      downloads nothing, GitHub failing is a failed check, and two checks at once share one. And
      test/jev-ci.test.ts: the CI planner in .github/jev-ci, which plans synthetic changes
      against the real .github/jev-ci.yml and .github/workflows/ci.yml in a scratch git repo,
      following imports into workspace packages (@kiwi/core) by name. And
      test/core-package.test.ts: packages/core imports nothing outside itself but effect/*,
      node: builtins only under packages/core/src/node, no Node or Bun globals elsewhere in it,
      web/src never imports @kiwi/core/node/, and nothing reaches packages/core by a relative
      path. And test/slots.test.ts: task claims and `kiwi answering N` are compare-and-set on a
      local relay (two racing claims or markers: exactly one lands, the loser is told who holds it
      and leaves nothing in the log; a drop frees the claim; a marker doesn't answer an ask), and
      the relay refuses a malformed slot with 400 and someone else's slot with 423 Taken.
      And test/leases.test.ts: leases with a line (kiwi lock/unlock): the first to ask holds
      it, the rest wait in log order, letting go or running out hands it to the next, waits
      give up, only a person frees someone else's, a snapshot-resumed fold agrees, status shows
      it and no one is woken by it, and two agents racing over a local relay end with one
      holder and one waiting.
      And test/quiet.test.ts: which events are live state (notes, leases, claims, reactions,
      joins, cards) and stay out of the conversation and kiwi log, and which people still read there.
      And test/lead.test.ts: the optional lead role (one at a time, an old
      coordinator role reads as it, an old mode.set folds to nothing, a person's words reach every
      agent). And test/push-pull.test.ts: what an agent is sent (all of #general, rooms and task
      threads once it has posted there, so an answer to its question in a task's thread reaches
      it, and @mentions anywhere) and how a mention is read. And test/compact.test.ts:
      /compact (a proposal names every open task and question; only the owner compacts; done
      tasks archive off the board; a snapshot-resumed fold agrees; propose and approve over a
      local relay). And test/where.test.ts: kiwi send --to WHERE (one word for #general, a room,
      a task, a direct thread or a reply; names beside it; two places refused). Fails if a tested module's behavior,
      output text or exported names change. TMPDIR points through a symlink, as macOS's does,
      so a test that compares a tmp path with its realpath or process.cwd() fails here too.

  test-flows-a:
    name: test / flows-a
    inputs: ["src/**", "packages/core/**", "test/owner-cli.ts"]
    imports_from: ["test/e2e.test.ts", "test/verbs.test.ts", "test/threads.test.ts", "test/reconnect.test.ts", "test/cache-trim.test.ts", "test/budget-*.test.ts"]
    always: ["package.json", "bun.lock", "bunfig.toml", "scripts/ci-tests.ts", "scripts/ci-flows.ts"]
    description: >-
      Runs slow end-to-end tests that start a real local relay (src/relay/bun.ts) and drive the
      kiwi CLI and client: e2e (create a channel, join, send and listen through the relay),
      verbs (the agent CLI verbs and their aliases), threads (task threads and direct threads),
      reconnect (what a listener says when the relay drops). Then every test/budget-*.test.ts:
      budget-relay counts the SQL statements a stored message, a read mark and a connecting
      socket cost on one Durable Object storage handle; the others drive clients through
      test/traffic.ts, a proxy that counts HTTP requests by route, sockets, frames and bytes.
      cache-trim: past 800 messages a session keeps a local fold base and trims cache/<room>.jsonl to
      the newest 300 (src/agent/state.ts, src/config/cache.ts), and tasks, charter and log read the
      same from base and tail as from the full log.
      Fails if the CLI, the client, the relay, the protocol or the text they print changes
      behavior, or an operation costs more requests, frames, bytes or statements than its budget.

  test-flows-b:
    name: test / flows-b
    inputs: ["src/**", "packages/core/**", "test/owner-cli.ts"]
    imports_from: ["test/join-seats.test.ts", "test/read-receipts.test.ts", "test/daemon-pair.test.ts", "test/sh-escape.test.ts", "test/reclaim.test.ts", "test/wake-yourself.test.ts", "test/seats.test.ts", "test/multi-seat.test.ts", "test/handoff.test.ts", "test/hooks-once.test.ts", "test/hooks-hung-relay.test.ts", "test/offline-read.test.ts", "test/hooks-reentry.test.ts", "test/mimo-wake-restart.test.ts"]
    always: ["package.json", "bun.lock", "bunfig.toml", "scripts/ci-tests.ts", "scripts/ci-flows.ts"]
    description: >-
      Runs slow agent-flow tests against a real local relay and the kiwi CLI: join-seats
      (joining, one seat per agent, Claude Code hooks doing the listening), read-receipts,
      daemon-pair (kiwi pair through the relay's pairing mailbox: src/daemon/pair.ts, src/machine.ts,
      packages/core/src/mailbox.ts), sh-escape (the sandboxed kiwi sh), reclaim,
      wake-yourself (the Stop hooks that keep a Kimi Code, Grok or Cursor agent's listener running, and a Kimi Code session
      that Kimi's server hosts woken through that server: the busy session recorded at join, kept current by
      the Stop hook, the prompt posted with the server's token; src/kimi-server.ts; for Cursor, its stop hook
      known by conversation_id and cursor_version, its seat by CURSOR_CONVERSATION_ID, and a listen --once of
      that chat counting as armed; a Grok Bot whose VM's shell has CURSOR_AGENT seated and hooked as Grok Bot, not Cursor;
      and with a backlog of unread messages the stop reason, re-arm reminder included, stays within the
      seat's share of the hook limit).
      Then seats and multi-seat: which agent a command or hook acts for in a folder
      (src/seats.ts, a Grok Bot's seat from its VM's hostname or KIWI_HARNESS), one session holding seats in two channels, hooks serving the right seat
      from sibling folders, and with a backlog on both seats each hook's whole output (SessionStart,
      prompt, stop) within HOOK_CONTEXT_MAX, the seats sharing it (src/hooks/run.ts). Then handoff: an escalation's live browser link (packages/core/src/protocol.ts),
      `kiwi send --escalate --handoff URL --wait` exit codes, and the link kept out of log, show,
      listen --json except `kiwi show N --reveal`. Then hooks-once: a message the prompt or stop hook
      hands over never wakes the session a second time from the listener started with it
      (src/hooks/listen.ts waits for the session's answering hook, src/hooks/delivered.ts), and the
      listener keeps listening for the next one; and a prompt hook whose output never reaches the
      session leaves the message unread for the next hook (src/hooks/run.ts commits what was
      read only after printing it), and a hand-over cut at its size limit commits only the
      messages shown, so the next hook brings the rest; and a listener that can't reach the daemon
      keeps retrying its slot (2s doubling to 60s) while its session lives, instead of exiting and
      leaving the session deaf. Then hooks-hung-relay: with the relay accepting connections
      but never answering, the prompt and stop hooks each return in under 2s (src/hooks/run.ts
      puts the whole hook under one deadline; packages/core/src/client/relay.ts gives every
      relay request 30s), and what they couldn't show comes with the next prompt. Then offline-read: with the relay down, kiwi log and kiwi tasks
      show the messages and tasks this computer already had and say the relay can't be reached
      (OfflineReads in packages/core/src/client/relay.ts, src/agent/state.ts, src/cli/context.ts). Then hooks-reentry: a
      SessionStart hook for a session that starts fresh (startup, clear, compact) tells the agent its
      open task and the checkpoint saved with kiwi task checkpoint, and one for a resumed session
      doesn't (src/hooks/answer.ts, packages/core/src/reentry.ts); with big checkpoints and a
      backlog of messages the SessionStart context stays within HOOK_CONTEXT_MAX (Claude Code's
      inline limit, shared between the seats a session serves in src/hooks/run.ts), and every
      message it left out comes with a later hook; and past the context line the Stop hook asks once
      for a checkpoint of each open task, not while stop_hook_active, and again only after the
      context came back under it (src/hooks/context-line.ts). Then mimo-wake-restart:
      Kiwi's MiMoCode plugin (src/hooks/install/mimo.ts) loaded against a real listener, whose wake
      MiMoCode keeps refusing until MiMoCode exits mid-retry; the resumed session still gets those
      messages, because the listener writes a pending handoff per token (src/hooks/delivered.ts) that becomes
      the delivered marker only when the plugin's next listen names the token of the wake that landed
      (src/hooks/listen.ts, src/hooks/run.ts), and the next message isn't repeated with them; and two
      MiMoCode processes on one session, each landing its wake of the same message, count it delivered
      once instead of clearing each other's handoff and waking it back and forth. Fails if joining, seats, hooks, pairing, the
      daemon, kiwi sh, handoff or the relay change behavior.

  build:
    name: build / bundles
    inputs: ["src/**", "packages/core/**", "web/**", "scripts/build-cli.ts", "scripts/cli-bundle.ts", "scripts/smoke-cli.ts", "scripts/smoke-ui.ts", "scripts/web-bundle.ts", "test/owner.ts", "test/owner-cli.ts", "test/check.ts"]
    always: ["package.json", "bun.lock", "web/package.json", "web/vite.config.ts", "wrangler.jsonc", "scripts/smoke-ui.ts", "scripts/web-bundle.ts"]
    description: >-
      Builds the web dashboard for production (vite build in web/) and fails when the JS the
      first screen loads (the entry script plus every chunk it modulepreloads) is over
      BUDGET_BYTES (590,000) in scripts/web-bundle.ts, a budget that doesn't go up for a feature; code reached only through
      web/src/components/lazy.tsx doesn't count. Then ui smoke: starts the relay and the kiwi CLI
      as a test computer and drives the built dashboard in headless Chromium, opening every
      menu, popover and dialog, setting up a passkey, previewing an invite, Settings → Personalities duplicating a preset into the person's own, the owner allowing voice from Details, the Agents tab showing a lane per agent with what's next on it, Needs you as rows always in view (an agent asking in is let in from its row), an answered ask saying who chose what on the ask itself, replying inline (the reply quotes what it answers, "1 Reply" opens the thread), linking a computer
      with `kiwi setup`, approving its agent and opening a task (a board row opens it in the Tasks panel, with no second task list behind it; /tasks switches to the Tasks tab), finding controls by visible
      names and roles; fails if a page throws while rendering, a control it looks for is renamed
      or missing, or the relay, pairing or join flow breaks. Then compiles the kiwi CLI into one
      Linux binary with scripts/build-cli.ts, runs `kiwi --version`, fails over the minified
      JS byte budget or if QuickJS, sql.js, turndown or domino got back in, and
      scripts/smoke-cli.ts drives the binary against a local relay (every allowed kiwi sh
      command compared with the source CLI, the MCP sh tool, kiwi doctor). Then bundles the
      Cloudflare worker (src/relay/worker.ts) with wrangler deploy --dry-run, failing on a Node-
      or Bun-only import reaching it or an invalid wrangler.jsonc.

  shots:
    name: build / shots
    inputs: ["src/**", "packages/core/**", "web/**", "scripts/shoot-ui.ts", "assets/**"]
    always: ["package.json", "bun.lock", "web/package.json", "web/vite.config.ts", "scripts/shoot-ui.ts"]
    description: >-
      Builds the web dashboard (bun run web:build), then scripts/shoot-ui.ts --wide --theme dark
      starts the relay and the kiwi CLI as two agents' computers, seeds a channel in headless
      Chromium (the owner signs in with a passkey, lets atlas in and gives it the Lead
      personality, lets win in, a conversation with an ask, a reply, two tasks and a task's
      conversation, a review and an escalation under Needs you, a direct conversation, notes, a
      pending join request and a second empty channel) and shoots every screen of the wide
      window in the dark: the conversation, the reply bar, the composer with words in it, the Tasks tab, a task opened from its board row
      in the Tasks panel, Needs you, the Agents tab, Details, the direct conversation,
      Invite, the account menu, the command palette, Notes, Pause, Settings, Personalities, Add
      an agent, first run, signed in with nothing open, Join with a code and the invite preview.
      The shots are uploaded as the ui-shots artifact. Fails when the conversation isn't at its newest message (within 80px of the bottom) once the channel opens and again back from the Tasks tab (web/src/components/conversation/use-scroll.ts), or when the seeding can't drive the
      dashboard or any screen can't be reached (a control renamed, moved or gone), so the shots
      keep up with the UI.

  perf:
    name: perf / scale
    inputs: ["web/**", "desktop/**", "packages/core/**", "scripts/perf-scale.ts", "scripts/perf-check.ts", "scripts/perf-budgets.json"]
    always: ["package.json", "bun.lock", "web/package.json", "web/vite.config.ts", "scripts/perf-scale.ts", "scripts/perf-check.ts", "scripts/perf-budgets.json"]
    description: >-
      Builds the web dashboard, then runs scripts/perf-scale.ts three times without the soak: a
      local relay and headless Chromium with 10 agents, 100 tasks and 2000 messages, timing the
      reload to the first screen, the Tasks, Agents and Conversation tabs at 4x CPU and typing
      while the agents post. scripts/perf-check.ts takes the medians and fails when one is over
      its gate in scripts/perf-budgets.json (a ratchet: each gate starts at today's median plus
      20% and comes down to its 0.20 budget as fixes land), writes the table and the gaps to the
      0.20 budgets to the job summary and a perf-scale comment on the pull request, and uploads
      the runs as the perf-scale artifact. The soak's memory slopes are gated by the nightly
      workflow (.github/workflows/nightly.yml), not here.

  desktop:
    name: desktop / package
    inputs: ["desktop/**", "src/**", "packages/core/**", "web/src/**", "web/index.html", "scripts/build-cli.ts", "scripts/cli-bundle.ts", "package.json", "bun.lock", "web/package.json"]
    always: ["desktop/package.json", "desktop/tsconfig*.json", "desktop/scripts/fuses.ts", "desktop/scripts/pack-cli.ts", "desktop/scripts/size.ts", "desktop/scripts/smoke.ts"]
    description: >-
      Bundles the Electron shell's main, preload and channels (key process) scripts with bun
      build, then packages the Linux app with electron-builder --dir from desktop/package.json's
      build config (its electronFuses block included: appId com.kiwiinit.channels, productName
      Channels, executable channels-desktop). desktop/scripts/fuses.ts reads the packaged
      binary's (release/linux-unpacked/channels-desktop) Electron fuses and fails unless RunAsNode,
      EnableNodeOptionsEnvironmentVariable and EnableNodeCliInspectArguments are off and
      EnableCookieEncryption, EnableEmbeddedAsarIntegrityValidation and OnlyLoadAppFromAsar are
      on. desktop/scripts/size.ts fails if app.asar ships node_modules (dist/ already bundles
      them), if more than the English Chromium locales ship (electronLanguages), or if the
      packaged Linux app is over 375MB on disk or 162MB as a tar.gz. The bundled kiwi is
      packed by desktop/scripts/pack-cli.ts first (zstd, checked to unpack to the same bytes), and
      the smoke's daemon runs from the copy the app unpacks. desktop/scripts/smoke.ts starts the packaged app under Xvfb and fails unless its
      window renders, the page's scripts land in the V8 code cache (kiwi-app:// registered with
      codeCache, so a launch after the first skips compiling them), its key process
      (utilityProcess.fork of dist/channels.js from app.asar) stays up and the bundled kiwi
      daemon answers on its socket, and fails if
      ELECTRON_RUN_AS_NODE=1 runs JavaScript or --inspect opens a debugger. Fails on a bundling
      or packaging error, a fuse changed or dropped, or an app that no longer starts.

  cli-macos:
    name: cli / macos
    inputs: ["src/**", "packages/core/**", "test/**", "site/install", "site/install.sh", "desktop/src/**", "package.json", "bun.lock", "bunfig.toml", "web/package.json"]
    always: ["scripts/build-cli.ts", "scripts/cli-bundle.ts"]
    question: >-
      Could this change to `file` make the job described in `job` fail on macOS, or fail to
      cross-compile a darwin target, while the same tests and the Linux build pass
      in test / unit, test / flows-a, test / flows-b and build / bundles?
    criteria:
      true: >-
        The change touches behavior that differs on macOS: tmp paths behind the /var to
        /private/var symlink, realpath or process.cwd() compared with a tmp path, home under
        /Users, a case-insensitive file system, a unix socket path near 104 bytes, BSD shell
        tools, signals, child processes, file watching, the name the CLI prints for itself, or
        the darwin build targets, in a way that could fail only there.
      false: >-
        The change behaves the same on macOS as on Linux: a failure it causes would fail the
        Linux jobs too, which catch it, or it can't fail at all.
    description: >-
      On a macOS runner, does what the release's cli job does: runs the whole bun test suite
      (every test/*.test.ts and web/src test, the agent flows included), compiles the kiwi CLI
      for darwin-arm64, darwin-x64, linux-x64 and linux-arm64 with
      scripts/build-cli.ts, ad-hoc signs the macOS binaries and runs `kiwi --version`. The same
      tests run on Linux in test / unit, test / flows-a and test / flows-b, so this job is for what fails only on macOS: paths (os.tmpdir() is under
      /var, a symlink to /private/var, so process.cwd() and realpath spell a folder differently
      from mkdtemp; home is under /Users; the file system ignores case; a unix socket path is
      capped at 104 bytes), how the CLI names its own command in the text it prints, BSD
      versions of shell tools, process, signal and file-watching differences, and a build
      target that fails to compile. Fails if any test fails on macOS or a target doesn't build.

  release-rehearsal:
    name: release / rehearsal
    jev: false
    push: false
    version_bumps: true
    inputs: []
    always: [".github/workflows/release.yml", ".github/workflows/release-build.yml", "CHANGELOG.md", "src/version.ts", "desktop/package.json", "desktop/scripts/fuses.ts", "desktop/scripts/mac-size.ts", "desktop/scripts/pack-cli.ts", "scripts/changelog.ts", "scripts/cli-downloads.ts"]
    description: >-
      Runs .github/workflows/release-build.yml, the build a tag's release.yml runs, with
      rehearsal: true and a read-only token, uploading nothing: the version and changelog checks
      (taking v<src/version.ts> as the tag), the cli job on macOS (bun test, four builds, each
      packed as .gz and .xz, held to 30 MB by scripts/cli-downloads.ts), and
      the desktop app packaged on macOS (arm64 and x64) and Linux (AppImage and deb), with each
      package's contents and fuses checked (release/mac*/Channels.app and
      release/*-unpacked/channels-desktop), the kiwi binary bundled zstd-packed by
      desktop/scripts/pack-cli.ts (which checks it unpacks to the same bytes), and on macOS
      desktop/scripts/mac-size.ts failing a dmg or zip over 150 MiB or an app over 320 MiB. On a pull request the macOS app is unsigned; a
      manual run of ci.yml passes the signing secrets, so the app is signed, notarized and
      checked as on a tag. Fails where the tag would: versions that disagree, no changelog
      section, a test failing on macOS, an electron-builder error, a package missing the web
      app or the kiwi binary, a Mac package over its size gate, and on a manual run a signing or notarization error. Runs on
      release PRs (they change CHANGELOG.md), on any change that only bumps a version number,
      and on manual runs of ci.yml, never on a push to main.

