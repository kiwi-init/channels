# jev-ci: which CI jobs a pull request can break. Read by .github/jev-ci/cli.ts in the
# `plan` job of .github/workflows/ci.yml. Pushes to main run everything except the jobs marked
# `push: false`, which run on pull requests and manual runs only. `version_bumps: true` runs a
# job when a change only bumps a version number, which otherwise counts as no change.
#
# For each job: `inputs` are the files it reads (a change elsewhere skips it), `imports_from`
# are entry files whose static imports (followed through the repo) count as inputs too,
# `always` are files that run it by rule (config, dependencies), and `description` says in
# plain words what it checks and what makes it fail. Jev reads the description, so keep it
# true. `question` and `criteria` replace the question Jev is asked for that job, and
# `threshold` replaces the global one. `jev: false` marks static checks (types, lint): any
# edit to their files can fail them, so they run whenever those files change and Jev only
# judges tests, flows and builds.
#
# A job also runs when its own job in the workflow changed, or a local action or reusable
# workflow it uses (`uses: ./...`). A change to the workflow's `name`, `run-name`, `on` or
# `concurrency` runs nothing by itself; `permissions` runs the jobs that inherit them; any
# other top-level change runs every job. In this file, a change to a job's `description` or
# `name` runs nothing by itself, a change to its other fields runs that job, and a change to
# a setting above `jobs` runs every job.

# enforce: jobs Jev judges unaffected are skipped. shadow: they run anyway and the plan says so.
mode: enforce
# Run a job when Jev puts its chance of failing at or above this.
threshold: 0.3

workflow: .github/workflows/ci.yml
# Jobs in the workflow that aren't checks: they run on every pull request, so a change to
# them needs no other job. Any other job in the workflow without an entry here always runs.
planner_jobs: [plan, ci-ok]

# The planner itself: a change here runs every job.
run_all_when_changed:
  - ".github/jev-ci/**/*.ts"

# A release bump changes only these lines; it counts as no change.
version_only:
  files: ["package.json", "web/package.json", "desktop/package.json", "src/version.ts"]
  pattern: '^\s*("version"\s*:|export const VERSION\s*=)'

summarize_files: ["bun.lock"]

# Above this many changed lines, or a single file above max_file_lines, Jev isn't asked: the jobs run.
# Lines moved verbatim from one place to another don't count: Jev sees them as moved.
max_jev_lines: 800
max_file_lines: 300

jobs:
  static:
    jev: false
    name: repo / static
    inputs: ["**/*.{ts,tsx,mts,cts,js,jsx,mjs,cjs,css}", "web/index.html", ".github/workflows/**", ".github/actions/**"]
    always: ["tsconfig.json", "tsconfig.worker.json", "package.json", "packages/core/package.json", "bun.lock", ".oxlintrc.json", ".oxfmtrc.json", "web/package.json", "web/tsconfig*.json", "web/vite.config.ts", "web/.oxlintrc.json", "web/.oxfmtrc.json", "desktop/package.json", "desktop/tsconfig*.json", "knip.json"]
    description: >-
      The static checks, one after another, each run even when an earlier one failed.
      Types: tsc --noEmit over src/, packages/core/src (the @kiwi/core workspace package) and
      test/ (and the jev-ci planner test/ imports), again over the Cloudflare worker with the
      Workers types (tsconfig.worker.json), tsc -b in web/ (which also compiles the
      packages/core modules the dashboard imports as @kiwi/core/*), and tsc --noEmit in
      desktop/. scripts/ui-tokens.ts fails on an arbitrary text-[Npx] or rounded-[Npx] Tailwind
      class in web/src. oxlint (root .oxlintrc.json) on src/, packages/core/src, desktop/src, desktop/scripts,
      scripts/, test/, .github/jev-ci/ and site/app.js: unused variables or imports, an empty block or catch,
      explicit any, a useless assignment or escape, a rethrow without its cause. oxlint on web/src
      (web/.oxlintrc.json extends the root config and adds the React rules: conditional hooks,
      setState in an effect, impure calls in render). oxfmt --check on web/src (web/.oxfmtrc.json:
      no semicolons) and on the same root paths as oxlint (root .oxfmtrc.json: semicolons, trailing
      commas, 200 columns). Knip (knip.json) over the root, packages/core, web/ and desktop/: a file nothing
      imports, an export nothing outside its file uses, an unused dependency, an unlisted package.
      scripts/action-pins.ts: every uses: in .github/workflows and .github/actions names a
      third-party action by a full commit SHA. Fails on any of these.

  test-unit:
    name: test / unit
    inputs: ["src/**", "packages/core/**", "test/**", "web/src/**", "web/public/**", "site/app.js", "site/install", "site/install.sh", "site/install.ps1", "scripts/build-cli.ts", "scripts/cli-bundle.ts", "scripts/action-pins.ts", "desktop/src/**", "desktop/build/entitlements.mac.plist", ".github/jev-ci/**", ".github/jev-ci.yml", ".github/workflows/ci.yml"]
    always: ["package.json", "bun.lock", "bunfig.toml", "web/package.json", "scripts/ci-tests.ts", "scripts/ci-flows.ts"]
    description: >-
      Runs the unit tests with bun test: every test/*.test.ts except the slow suites in
      scripts/ci-tests.ts's flows groups, plus the dashboard's tests in web/src (task-cards
      among them: one live card per open task, a done task as its last line only; agent-facts: an agent's repo@branch, flagged when the channel doesn't list its repo). They cover
      pure modules: protocol and event validation, state folding, formatting, identity and
      signing, scopes and roles, routing and auth tables, error texts, the install scripts,
      hooks and harness detection, the repo and branch an agent's card reads from its folder (test/routing.test.ts), the channel's repos and the flag on an agent from another repo (test/repos.test.ts), the history cache, the desktop app's node-only helpers, the
      public site's invite parsing (site/app.js, test/site.test.ts), scripts/action-pins.ts.
      Also test/desktop-keys.test.ts: the desktop key process (desktop/src/keyring.ts and keys-server.ts,
      over the wire web/src/lib/channel-remote.ts uses) against a local relay, failing if any member,
      owner, person or channel key reaches the window, plus the seat rules, the wire codec, the
      allowed calls and a scan of web/src for imports of Channel, seal/open or the keyring
      or keys server outside web/src/lib/channel-local.ts. And test/desktop-voice.test.ts: the desktop voice
      store's CSP allows api.x.ai only when an xAI key is saved, the project key never reaches
      the snapshot or the token IPC result, consent defaults off, and
      desktop/build/entitlements.mac.plist has the audio-input entitlement. And
      test/jev-ci.test.ts: the CI planner in .github/jev-ci, which plans synthetic changes
      against the real .github/jev-ci.yml and .github/workflows/ci.yml in a scratch git repo,
      following imports into workspace packages (@kiwi/core) by name. And
      test/core-package.test.ts: packages/core imports nothing outside itself but effect/*,
      node: builtins only under packages/core/src/node, no Node or Bun globals elsewhere in it,
      web/src never imports @kiwi/core/node/, and nothing reaches packages/core by a relative
      path. And test/slots.test.ts: task claims and `kiwi answering N` are compare-and-set on a
      local relay (two racing claims or markers: exactly one lands, the loser is told who holds it
      and leaves nothing in the log; a drop frees the claim; a marker doesn't answer an ask), and
      the relay refuses a malformed slot with 400 and someone else's slot with 423 Taken.
      And test/leases.test.ts: leases with a line (kiwi lock/unlock): the first to ask holds
      it, the rest wait in log order, letting go or running out hands it to the next, waits
      give up, only a person frees someone else's, a snapshot-resumed fold agrees, status shows
      it and no one is woken by it, and two agents racing over a local relay end with one
      holder and one waiting.
      And test/lead.test.ts: the optional lead role (one at a time, an old
      coordinator role reads as it, an old mode.set folds to nothing, a person's words reach every
      agent). Fails if a tested module's behavior,
      output text or exported names change. TMPDIR points through a symlink, as macOS's does,
      so a test that compares a tmp path with its realpath or process.cwd() fails here too.

  test-flows-a:
    name: test / flows-a
    inputs: ["src/**", "packages/core/**", "test/owner-cli.ts"]
    imports_from: ["test/e2e.test.ts", "test/verbs.test.ts", "test/threads.test.ts", "test/reconnect.test.ts", "test/budget-*.test.ts"]
    always: ["package.json", "bun.lock", "bunfig.toml", "scripts/ci-tests.ts", "scripts/ci-flows.ts"]
    description: >-
      Runs slow end-to-end tests that start a real local relay (src/relay/bun.ts) and drive the
      kiwi CLI and client: e2e (create a channel, join, send and listen through the relay),
      verbs (the agent CLI verbs and their aliases), threads (task threads and direct threads),
      reconnect (what a listener says when the relay drops). Then every test/budget-*.test.ts:
      budget-relay counts the SQL statements a stored message, a read mark and a connecting
      socket cost on one Durable Object storage handle; the others drive clients through
      test/traffic.ts, a proxy that counts HTTP requests by route, sockets, frames and bytes.
      Fails if the CLI, the client, the relay, the protocol or the text they print changes
      behavior, or an operation costs more requests, frames, bytes or statements than its budget.

  test-flows-b:
    name: test / flows-b
    inputs: ["src/**", "packages/core/**", "test/owner-cli.ts"]
    imports_from: ["test/join-seats.test.ts", "test/read-receipts.test.ts", "test/daemon-pair.test.ts", "test/sh-escape.test.ts", "test/reclaim.test.ts", "test/wake-yourself.test.ts", "test/seats.test.ts", "test/multi-seat.test.ts", "test/handoff.test.ts"]
    always: ["package.json", "bun.lock", "bunfig.toml", "scripts/ci-tests.ts", "scripts/ci-flows.ts"]
    description: >-
      Runs slow agent-flow tests against a real local relay and the kiwi CLI: join-seats
      (joining, one seat per agent, Claude Code hooks doing the listening), read-receipts,
      daemon-pair (kiwi pair through the relay's pairing mailbox: src/daemon/pair.ts, src/machine.ts,
      packages/core/src/mailbox.ts), sh-escape (the sandboxed kiwi sh), reclaim,
      wake-yourself (the Stop hooks that keep a Kimi Code or Grok agent's listener running).
      Then seats and multi-seat: which agent a command or hook acts for in a folder
      (src/seats.ts), one session holding seats in two channels, hooks serving the right seat
      from sibling folders. Then handoff: an escalation's live browser link (packages/core/src/protocol.ts),
      `kiwi send --escalate --handoff URL --wait` exit codes, and the link kept out of log, show,
      listen --json except `kiwi show N --reveal`. Fails if joining, seats, hooks, pairing, the
      daemon, kiwi sh, handoff or the relay change behavior.

  build:
    name: build / bundles
    inputs: ["src/**", "packages/core/**", "web/**", "scripts/build-cli.ts", "scripts/cli-bundle.ts", "scripts/smoke-cli.ts", "scripts/smoke-ui.ts", "scripts/web-bundle.ts", "test/owner.ts", "test/owner-cli.ts", "test/check.ts"]
    always: ["package.json", "bun.lock", "web/package.json", "web/vite.config.ts", "wrangler.jsonc", "scripts/smoke-ui.ts", "scripts/web-bundle.ts"]
    description: >-
      Builds the web dashboard for production (vite build in web/) and fails when the JS the
      first screen loads (the entry script plus every chunk it modulepreloads) is over
      BUDGET_BYTES in scripts/web-bundle.ts; code reached only through
      web/src/components/lazy.tsx doesn't count. Then ui smoke: starts the relay and the kiwi CLI
      as a test computer and drives the built dashboard in headless Chromium, opening every
      menu, popover and dialog, setting up a passkey, previewing an invite, linking a computer
      with `kiwi setup`, approving its agent and opening a task, finding controls by visible
      names and roles; fails if a page throws while rendering, a control it looks for is renamed
      or missing, or the relay, pairing or join flow breaks. Then compiles the kiwi CLI into one
      Linux binary with scripts/build-cli.ts, runs `kiwi --version`, fails over the minified
      JS byte budget or if QuickJS, sql.js, turndown or domino got back in, and
      scripts/smoke-cli.ts drives the binary against a local relay (every allowed kiwi sh
      command compared with the source CLI, the MCP sh tool, kiwi doctor). Then bundles the
      Cloudflare worker (src/relay/worker.ts) with wrangler deploy --dry-run, failing on a Node-
      or Bun-only import reaching it or an invalid wrangler.jsonc.

  desktop:
    name: desktop / package
    inputs: ["desktop/**", "src/**", "packages/core/**", "web/src/**", "web/index.html", "scripts/build-cli.ts", "scripts/cli-bundle.ts", "package.json", "bun.lock", "web/package.json"]
    always: ["desktop/package.json", "desktop/tsconfig*.json", "desktop/scripts/fuses.ts", "desktop/scripts/smoke.ts"]
    description: >-
      Bundles the Electron shell's main, preload and channels (key process) scripts with bun
      build, then packages the Linux app with electron-builder --dir from desktop/package.json's
      build config (its electronFuses block included: appId com.kiwiinit.channels, productName
      Channels, executable channels-desktop). desktop/scripts/fuses.ts reads the packaged
      binary's (release/linux-unpacked/channels-desktop) Electron fuses and fails unless RunAsNode,
      EnableNodeOptionsEnvironmentVariable and EnableNodeCliInspectArguments are off and
      EnableCookieEncryption, EnableEmbeddedAsarIntegrityValidation and OnlyLoadAppFromAsar are
      on. desktop/scripts/smoke.ts starts the packaged app under Xvfb and fails unless its
      window renders, its key process (utilityProcess.fork of dist/channels.js from app.asar)
      stays up and the bundled kiwi daemon answers on its socket, and fails if
      ELECTRON_RUN_AS_NODE=1 runs JavaScript or --inspect opens a debugger. Fails on a bundling
      or packaging error, a fuse changed or dropped, or an app that no longer starts.

  cli-macos:
    name: cli / macos
    inputs: ["src/**", "packages/core/**", "test/**", "site/install", "site/install.sh", "site/install.ps1", "desktop/src/**", "package.json", "bun.lock", "bunfig.toml", "web/package.json"]
    always: ["scripts/build-cli.ts", "scripts/cli-bundle.ts"]
    question: >-
      Could this change to `file` make the job described in `job` fail on macOS, or fail to
      cross-compile a darwin or windows target, while the same tests and the Linux build pass
      in test / unit, test / flows-a, test / flows-b and build / bundles?
    criteria:
      true: >-
        The change touches behavior that differs on macOS: tmp paths behind the /var to
        /private/var symlink, realpath or process.cwd() compared with a tmp path, home under
        /Users, a case-insensitive file system, a unix socket path near 104 bytes, BSD shell
        tools, signals, child processes, file watching, the name the CLI prints for itself, or
        the darwin or windows build targets, in a way that could fail only there.
      false: >-
        The change behaves the same on macOS as on Linux: a failure it causes would fail the
        Linux jobs too, which catch it, or it can't fail at all.
    description: >-
      On a macOS runner, does what the release's cli job does: runs the whole bun test suite
      (every test/*.test.ts and web/src test, the agent flows included), compiles the kiwi CLI
      for darwin-arm64, darwin-x64, linux-x64, linux-arm64 and windows-x64 with
      scripts/build-cli.ts, ad-hoc signs the macOS binaries and runs `kiwi --version`. The same
      tests run on Linux in test / unit, test / flows-a and test / flows-b, so this job is for what fails only on macOS: paths (os.tmpdir() is under
      /var, a symlink to /private/var, so process.cwd() and realpath spell a folder differently
      from mkdtemp; home is under /Users; the file system ignores case; a unix socket path is
      capped at 104 bytes), how the CLI names its own command in the text it prints, BSD
      versions of shell tools, process, signal and file-watching differences, and a build
      target that fails to compile. Fails if any test fails on macOS or a target doesn't build.

  release-rehearsal:
    name: release / rehearsal
    jev: false
    push: false
    version_bumps: true
    inputs: []
    always: [".github/workflows/release.yml", ".github/workflows/release-build.yml", "CHANGELOG.md", "src/version.ts", "desktop/package.json", "desktop/scripts/fuses.ts", "scripts/changelog.ts"]
    description: >-
      Runs .github/workflows/release-build.yml, the build a tag's release.yml runs, with
      rehearsal: true and a read-only token, uploading nothing: the version and changelog checks
      (taking v<src/version.ts> as the tag), the cli job on macOS (bun test, five builds), and
      the desktop app packaged on macOS (arm64 and x64) and Linux (AppImage and deb), with each
      package's contents and fuses checked (release/mac*/Channels.app and
      release/*-unpacked/channels-desktop). On a pull request the macOS app is unsigned; a
      manual run of ci.yml passes the signing secrets, so the app is signed, notarized and
      checked as on a tag. Fails where the tag would: versions that disagree, no changelog
      section, a test failing on macOS, an electron-builder error, a package missing the web
      app or the kiwi binary, and on a manual run a signing or notarization error. Runs on
      release PRs (they change CHANGELOG.md), on any change that only bumps a version number,
      and on manual runs of ci.yml, never on a push to main.

