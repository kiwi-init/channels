  test-flows-a:
    name: test / flows-a
    inputs: ["src/**", "packages/core/**", "test/owner-cli.ts"]
    imports_from: ["test/e2e.test.ts", "test/verbs.test.ts", "test/threads.test.ts", "test/reconnect.test.ts", "test/cache-trim.test.ts", "test/budget-*.test.ts"]
    always: ["package.json", "bun.lock", "bunfig.toml", "scripts/ci-tests.ts", "scripts/ci-flows.ts", "scripts/ci-shards.ts"]
    description: >-
      On two runners at once (`scripts/ci-tests.ts flows-a --shard=N/2`, dealt by test/timings.json,
      a jev-ci pass per shard), runs slow end-to-end tests (failing when the run ends before every file ran) that start a real local relay (src/relay/bun.ts) and drive the
      kiwi CLI and client: e2e (create a channel, join, send and listen through the relay),
      verbs (the agent CLI verbs and their aliases; an agent's task add without --ask, --from or --issue refused with the fix named, and kiwi task listing the board under the person's message each task serves; review rounds: an agent's task review on a task
      with no reviewer is refused with how to name one, and its reviewer handing the review on with
      task review --review NAME keeps the open round and its commit and tells the new reviewer which
      round; an agent's reply that runs past six lines in #general is told to keep #general to a line or two and put the detail in the task's thread), threads (task threads and direct threads),
      reconnect (what a listener says when the relay drops). Then every test/budget-*.test.ts:
      budget-relay counts the SQL statements a stored message, a read mark and a connecting
      socket cost on one Durable Object storage handle; the others drive clients through
      test/traffic.ts, a proxy that counts HTTP requests by route, sockets, frames and bytes.
      cache-trim: past 800 messages a session keeps a local fold base and trims cache/<room>.jsonl to
      the newest 300 (src/agent/state.ts, src/config/cache.ts), and tasks, charter and log read the
      same from base and tail as from the full log.
      Fails if the CLI, the client, the relay, the protocol or the text they print changes
      behavior, or an operation costs more requests, frames, bytes or statements than its budget.

  test-flows-b:
    name: test / flows-b
    inputs: ["src/**", "packages/core/**", "test/owner-cli.ts"]
    imports_from: ["test/join-seats.test.ts", "test/join-seats-review.test.ts", "test/join-seats-hooks.test.ts", "test/read-receipts.test.ts", "test/daemon-pair.test.ts", "test/sh-escape.test.ts", "test/reclaim.test.ts", "test/wake-yourself.test.ts", "test/seats.test.ts", "test/multi-seat.test.ts", "test/handoff.test.ts", "test/hooks-once.test.ts", "test/hooks-hung-relay.test.ts", "test/offline-read.test.ts", "test/hooks-reentry.test.ts", "test/hooks-persona.test.ts", "test/mimo-wake-restart.test.ts", "test/held-seat.test.ts"]
    always: ["package.json", "bun.lock", "bunfig.toml", "scripts/ci-tests.ts", "scripts/ci-flows.ts", "scripts/ci-shards.ts"]
    description: >-
      On two runners at once (`scripts/ci-tests.ts flows-b --shard=N/2`, dealt by test/timings.json,
      a jev-ci pass per shard), runs slow agent-flow tests (failing when the run ends before every file ran) against a real local relay and the kiwi CLI: join-seats
      (joining, one seat per agent, Claude Code hooks doing the listening, and a Codex hook run from inside
      a Claude Code session, its CLAUDECODE and CLAUDE_CODE_SESSION_ID inherited, serving no Claude seat
      and leaving that seat's messages unread because the hook names its harness with --harness), read-receipts,
      daemon-pair (kiwi pair through the relay's pairing mailbox: src/daemon/pair.ts, src/machine.ts,
      packages/core/src/mailbox.ts), sh-escape (the sandboxed kiwi sh), reclaim,
      wake-yourself (the Stop hooks that keep a Kimi Code, Grok or Cursor agent's listener running, and a Kimi Code session
      that Kimi's server hosts woken through that server: the busy session recorded at join, kept current by
      the Stop hook, the prompt posted with the server's token; src/kimi-server.ts; for Cursor, its stop hook
      known by conversation_id and cursor_version, its seat by CURSOR_CONVERSATION_ID, and a listen --once of
      that chat counting as armed; a Grok Bot whose VM's shell has CURSOR_AGENT seated and hooked as Grok Bot, not Cursor;
      and with a backlog of unread messages the stop reason, re-arm reminder included, stays within the
      seat's share of the hook limit).
      Then seats and multi-seat: which agent a command or hook acts for in a folder (a reply goes to
      the channel the session heard the message in, even from a folder bound to one seat)
      (src/seats.ts, a Grok Bot's seat from its VM's hostname or KIWI_HARNESS, a hook's named harness over the
      markers its parent session left: hereAs, and a named harness with no session never given a folder's only seat
      when that seat is another harness's or a live session's), one session holding seats in two channels, the
      join of the second from the same folder saying which -c ALIAS --as NAME picks each seat and a rejoin of either
      saying nothing about it (src/cli/commands/join.ts), each Stop and SessionStart unread header and Cursor follow-up naming its channel (src/hooks/answer.ts, test/wake-yourself.test.ts), a session that holds neither seat told the folder has seats in
      both channels and to pass -c ALIAS --as NAME (src/cli/context.ts), hooks serving the right seat
      from sibling folders, and with a backlog on both seats each hook's whole output (SessionStart,
      prompt, stop) within HOOK_CONTEXT_MAX, the seats sharing it (src/hooks/run.ts). Then handoff: an escalation's live browser link (packages/core/src/protocol.ts),
      `kiwi send --escalate --handoff URL --wait` exit codes, and the link kept out of log, show,
      listen --json except `kiwi show N --reveal`, and only a person's done or couldn't ends the wait, never
      an agent's (src/agent/messaging.ts); kiwi ask-human --holds T7,#18 --kind K naming the tasks and asks a decision
      holds up (refused for one that's neither), printed back as what it holds, shown in kiwi status as
      `[kind] · holds …`, and one holding nothing told it goes to the digest and listed there, not as waiting on you.
      Then hooks-once: a message the prompt or stop hook
      hands over never wakes the session a second time from the listener started with it
      (src/hooks/listen.ts waits for the session's answering hook, src/hooks/delivered.ts), and the
      listener keeps listening for the next one; and a prompt hook whose output never reaches the
      session leaves the message unread for the next hook (src/hooks/run.ts commits what was
      read only after printing it), and a hand-over cut at its size limit commits only the
      messages shown, so the next hook brings the rest; and after a /clear (a new session id in the
      same process) the earlier session's listener hands a message over once and the new session's
      stop and prompt hooks don't hand it over again, nor does its listener started before any hook;
      and a listener that can't reach the daemon
      keeps retrying its slot (2s doubling to 60s) while its session lives, instead of exiting and
      leaving the session deaf. Then hooks-hung-relay: with the relay accepting connections
      but never answering, the prompt and stop hooks each return in under 2s (src/hooks/run.ts
      puts the whole hook under one deadline; packages/core/src/client/relay.ts gives every
      relay request 30s), and what they couldn't show comes with the next prompt. Then offline-read: with the relay down, kiwi log and kiwi tasks
      show the messages and tasks this computer already had and say the relay can't be reached
      (OfflineReads in packages/core/src/client/relay.ts, src/agent/state.ts, src/cli/context.ts). Then hooks-persona:
      when the owner gives a seated agent a personality, changes it or takes it away mid-session, its
      next prompt or Stop hook tells it once, before its messages (src/hooks/persona-line.ts,
      src/hooks/answer.ts), and a new session reads it in its SessionStart brief and isn't told again.
      Then hooks-reentry: a
      SessionStart hook for a session that starts fresh (startup, clear, compact) tells the agent its
      open task and the checkpoint saved with kiwi task checkpoint, and one for a resumed session
      doesn't (src/hooks/answer.ts, packages/core/src/reentry.ts); kiwi task checkpoint lead refuses a
      seat that isn't the lead and an empty note before sending anything (src/cli/commands/tasks.ts);
      with big checkpoints and a
      backlog of messages the SessionStart context stays within HOOK_CONTEXT_MAX (Claude Code's
      inline limit, shared between the seats a session serves in src/hooks/run.ts), and every
      message it left out comes with a later hook; and with kiwi context-line off (src/cli/commands/context-line.ts, the
      default) the context line says nothing: no checkpoint line in the brief, a checkpoint only saved, no Stop ask;
      with it on, everything as it was before #670: past the context line the Stop hook asks once
      for a checkpoint of each open task, not while stop_hook_active, and again only after the
      context came back under it (src/hooks/context-line.ts); and with kiwi rotate on, a seat past the
      line whose Stop hands nothing over starts the pane's /clear sender once it has checkpointed each
      open task, never before and never with rotation off, and before that logs why it stays once to
      rotate.log however many times it stops, while with rotation off nothing reaches rotate.log
      (src/hooks/rotate.ts); and a seat made lead past the line is asked for its lead checkpoint,
      stays while it is missing, has a checkpoint that leaves out an open task refused, rotates once it
      saved one, and its fresh session is shown it (src/hooks/answer.ts, src/rotate/decide.ts,
      src/cli/commands/tasks.ts). Then mimo-wake-restart:
      Kiwi's MiMoCode plugin (src/hooks/install/mimo.ts) loaded against a real listener, whose wake
      MiMoCode keeps refusing until MiMoCode exits mid-retry; the resumed session still gets those
      messages, because the listener writes a pending handoff per token (src/hooks/delivered.ts) that becomes
      the delivered marker only when the plugin's next listen names the token of the wake that landed
      (src/hooks/listen.ts, src/hooks/run.ts), and the next message isn't repeated with them; a wake the
      listener hands MiMoCode logged to wake.log as handed, and the refusals before it landed (the plugin's
      next listen reports their count and last error) logged as failed with that reason (appendWakeRow in
      src/daemon/wake.ts, src/hooks/listen.ts); and two MiMoCode processes on one session, each landing its
      wake of the same message, count it delivered once instead of clearing each other's handoff and waking
      it back and forth. Then held-seat: a seat a loop holds with kiwi seat hold (src/hold.ts,
      src/cli/commands/seat.ts) keeps only a hash of the loop's KIWI_SEAT_TOKEN and drops its session; while it is
      held no hook takes it or hands it anything (seatsFor in src/seats.ts), every kiwi command for it from another
      session refuses, --as, KIWI_AS and kiwi use included (src/cli/context.ts, src/cli/commands/channel.ts), a kiwi
      listen already running for it exits on the next message without printing it or moving the cursor
      (src/agent/listen.ts, src/agent/state.ts), and an MCP server started before the hold answers every tool,
      wait_for_messages and sh included, with the refusal and with the cursor where it was (src/mcp.ts, src/sh.ts), while the token's holder still acts as it; bind
      refuses a Grok Bot and a Kimi Code seat without its process; kiwi seat bind hands it to the Claude Code session
      it names, which is told what arrived during the hold, and the old session gets nothing; and a kiwi listen of the bound
      session that heard nothing during the next hold exits on the first message after the seat goes to a third
      session, which gets that message (the holds count in src/hold.ts). Fails if joining, seats, hooks, pairing, the
      daemon, kiwi sh, handoff, the held seat or the relay change behavior.

  build:
    name: build / bundles
    inputs: ["src/**", "packages/core/**", "web/**", "desktop/src/seats.ts", "desktop/src/public-channel.ts", "scripts/build-cli.ts", "scripts/cli-bundle.ts", "scripts/smoke-cli.ts", "scripts/smoke-ui.ts", "scripts/local-relay.ts", "scripts/web-bundle.ts", "test/owner.ts", "test/owner-cli.ts", "test/check.ts"]
    always: ["package.json", "bun.lock", "web/package.json", "web/vite.config.ts", "wrangler.jsonc", "scripts/smoke-ui.ts", "scripts/local-relay.ts", "scripts/web-bundle.ts"]
    description: >-
      Builds the web dashboard for production (vite build in web/) and fails when the JS the
      first screen loads (the entry script plus every chunk it modulepreloads) is over
      BUDGET_BYTES (590,000) in scripts/web-bundle.ts, a budget that doesn't go up for a feature; code reached only through
      web/src/components/lazy.tsx doesn't count. It fails as well when any of Motion (motion/react, the
      animation library) reaches that first load, which is kept for lazy surfaces, and when web/dist carries
      any file over 20 MiB, which would weigh on every desktop download. Then ui smoke: starts the relay and the kiwi CLI
      as a test computer and drives the built dashboard in headless Chromium, opening every
      menu, popover and dialog, setting up a passkey, previewing an invite, an invite that pins a personality keeping its whole join command (the long --persona token wrapping, the short flags whole) inside its box, the tab bar's controls starting past a Mac's traffic lights and the page's sheet below the bar (Settings with data-shell="mac": the bar's first control at least --lights-w in, the sheet at least --chrome-h down), the open channel's tab marked current and ⌘\ hiding the channel's sidebar (the header's Tasks / Agents / Conversation tabs take over, it stays hidden across a reload, and the tab bar's Show the sidebar brings it back), Settings → Personalities duplicating a preset into the person's own, the Agents tab showing a lane per agent with what's next on it, Needs you as rows always in view (an agent asking in is let in from its row), an answered ask saying who chose what on the ask itself, replying inline (the reply quotes what it answers, "1 Reply" opens the thread; then three replies, each sent right after two messages, keep their quotes: an earlier send's late answer doesn't clear the reply, and a reply to a message still sending waits for its seq, checked on the reply's row once the relay's copy has landed), Details → Close channel… downloading the whole log first as JSON Lines with each message's key and signature (the history call through ChannelLink and the desktop keyring) and Cancel keeping the channel, linking a computer
      with `kiwi setup`, approving its agent and opening a task (a board row opens it in the Tasks panel, with no second task list behind it, and with the task open beside it at 1280 and 1180px every row keeps a readable title with nothing spilling out of it, its columns picked by the board's own width; /tasks switches to the Tasks tab; the details' wants-to-join row closes them and shows Needs you, where the agent is let in, and details offer no Copy invite link or second approve flow), a reload of that channel never showing the Add an agent card, No tasks yet or No messages yet before its history is in, the app loaded with no channel in its address reopening the one that was open instead of Nothing open, finding controls by visible
      names and roles; fails if a page throws while rendering, a control it looks for is renamed
      or missing, or the relay, pairing or join flow breaks. Then compiles the kiwi CLI into one
      Linux binary with scripts/build-cli.ts, runs `kiwi --version`, fails over the minified
      JS byte budget or if QuickJS, sql.js, turndown or domino got back in, or ajv (the MCP SDK's
      JSON Schema validator, which only elicitation uses and the build stubs out) got back in, and
      scripts/smoke-cli.ts drives the binary against a local relay (every allowed kiwi sh
      command compared with the source CLI, the MCP sh tool, kiwi doctor). Then bundles the
      Cloudflare worker (src/relay/worker.ts) with wrangler deploy --dry-run, failing on a Node-
      or Bun-only import reaching it or an invalid wrangler.jsonc. Headless Chromium and the apt packages it needs come from .github/actions/browser, which installs the packages from cached .deb files and fails the job if they can't be installed.

  shots:
    name: build / shots
    inputs: ["src/**", "packages/core/**", "web/**", "scripts/shoot-ui.ts", "scripts/local-relay.ts", "scripts/seed-permission.ts", "assets/**"]
    always: ["package.json", "bun.lock", "web/package.json", "web/vite.config.ts", "scripts/shoot-ui.ts", "scripts/local-relay.ts", "scripts/seed-permission.ts"]
    description: >-
      Builds the web dashboard (bun run web:build), then scripts/shoot-ui.ts --wide --phone channel,tasks --theme dark
      starts the relay and the kiwi CLI as two agents' computers, seeds a channel in headless
      Chromium (the owner signs in with a passkey, lets atlas in and gives it the Lead
      personality, lets win in, a conversation with an ask, a reply, two tasks and a task's
      conversation, a review and an escalation under Needs you, a direct conversation between two agents, a picture the lead sends in the direct conversation, two Claude Code permission prompts from
      win (scripts/seed-permission.ts, built by core's permissionShown: a command the owner denies from
      Needs you, an edit of every occurrence left waiting, showing what it replaces and with what), a direct conversation, notes, the channel's repo saved from Details so Write to GitHub shows under Repos, a
      pending join request and a second empty channel) and shoots every screen of the wide
      window in the dark: the conversation, the channel with its sidebar hidden (⌘\: the header takes its views), the tab bar in a Mac window (with a stand-in for its traffic lights), the channel sidebar's search open and its folded conversations opened, the reply bar, the composer with words in it, the Tasks tab, a task opened from its board row
      in the Tasks panel, Needs you, the permission prompts in the conversation (one denied, one waiting), the Agents tab, the channel's settings page (Details: members, the channel's settings with its repo and Write to GitHub off, notes and closing, side by side), the direct conversation, its picture open in the viewer (in a Mac window, with a stand-in for its traffic lights),
      Invite, the account menu, the command palette, Notes, Pause, Settings (its sections and their groups), Settings' New agents group with a stand-in for the desktop app's terminal methods (Allow, Prefer with Rex and tmux greyed, the Rex row) before and after Download Rex Helpers and Prefer Rex, Personalities (opened from its row), Add
      an agent, the desktop app's New agent modal, its computer picker with a paired computer
      chosen, and its started screen (with a stand-in for the launch methods the desktop bridge
      adds), first run, signed in with nothing open, Join
      with a code and the invite preview.
      The shots are uploaded as the ui-shots artifact. Fails when the conversation isn't at its newest message (within 80px of the bottom) once the channel opens and again back from the Tasks tab (which it visits itself), at the wide size and, in the same run (--phone channel,tasks: the channel and Tasks screens on the channel already seeded), at phone size too (web/src/components/conversation/use-scroll.ts), or when the window's drag band would take a control of the open viewer (each app-region box added or taken away in document order, as Electron does), or when the seeding can't drive the
      dashboard or any screen can't be reached (a control renamed, moved or gone), so the shots
      keep up with the UI. Headless Chromium and the apt packages it needs come from .github/actions/browser, which installs the packages from cached .deb files and fails the job if they can't be installed.

  perf:
    name: perf / scale
    inputs: ["web/**", "desktop/**", "packages/core/**", "src/relay/**", "scripts/perf-scale.ts", "scripts/perf-calibrate.ts", "scripts/perf-feel.ts", "scripts/local-relay.ts", "scripts/perf-check.ts", "scripts/perf-budgets.json"]
    always: ["package.json", "bun.lock", "web/package.json", "web/vite.config.ts", "scripts/perf-scale.ts", "scripts/perf-feel.ts", "scripts/local-relay.ts", "scripts/perf-check.ts", "scripts/perf-budgets.json"]
    imports_from: ["scripts/perf-scale.ts", "scripts/perf-feel.ts"]
    parts: [perf-runs]
    description: >-
      Three perf-runs jobs, side by side on their own runners, each build the web dashboard and
      run scripts/perf-scale.ts --gated once without the soak (only what perf-check gates: no
      1x tab switches, details toggles, profiles or second reload; the nightly runs it whole): a
      local relay and headless Chromium with
      10 agents, 100 tasks and 2000 messages (the agents join at once and the seeding sends through each agent's own session, src/agent.ts, on a local relay started with --dev-no-rate-limits, so no per-minute cap slows it), timing the reload to the first screen (the conversation a channel opens on, down to the last message seeded), the Tasks,
      Agents and Conversation tabs at 4x CPU and typing while the agents post (their burst sent through those same in-process sessions, so no ten CLI start-ups compete with the browser for the CPU; the p95 is over every key event typed, those under 16 ms, which Event Timing doesn't report, counted at 16), then run
      scripts/perf-feel.ts with PERF_RTT_MS=150 (one channel of 400 messages and 12 tasks behind a
      proxy that delays HTTP and the WebSocket by half the round trip each way: reload to the first screen,
      Enter to an empty composer and to the bubble, layout shift switching Tasks / #general and
      opening tasks, false screens like Add an agent during five reloads, frames over 33 ms
      scrolling the channel), and upload both as the perf-scale-N artifact (overwrite: a re-run of a
      run job replaces it, so perf / scale reads the new measurement), perf-scale's with a CPU
      calibration (a fixed in-page workload) at 1x and 4x. A run that crashes fails its job. Then perf / scale downloads the three runs, and
      scripts/perf-check.ts tells the perf-feel runs apart by their rttMs and grades their medians
      unscaled (their timings wait mostly on the round trip; shifts and screens aren't times),
      and scales each perf-scale timing by its run's calibration to the reference runner
      in scripts/perf-budgets.json (Reload only its in-page first screen; a run whose calibration
      is out of the ranges there is left out and named, and fewer than two usable runs fail the
      scaled gates), takes the medians and fails when one is over its gate there (a ratchet: each gate starts at today's
      median plus 20% and comes down to its 0.20 budget as fixes land), writing the table and
      the gaps to the 0.20 budgets to the job summary and a perf-scale comment on the pull
      request. The soak's memory slopes are gated by the nightly workflow
      (.github/workflows/nightly.yml), not here. Headless Chromium and the apt packages it needs come from .github/actions/browser, which installs the packages from cached .deb files and fails the job if they can't be installed.

  desktop:
    name: desktop / package
    inputs: ["desktop/**", "src/**", "packages/core/**", "web/src/**", "web/index.html", "scripts/build-cli.ts", "scripts/cli-bundle.ts", "scripts/perf-desktop.ts", "scripts/perf-calibrate.ts", "scripts/local-relay.ts", "scripts/perf-budgets.json", "package.json", "bun.lock", "web/package.json"]
    always: ["desktop/package.json", "desktop/tsconfig*.json", "desktop/scripts/fuses.ts", "desktop/scripts/pack-cli.ts", "desktop/scripts/size.ts", "desktop/scripts/smoke.ts", "scripts/perf-desktop.ts"]
    description: >-
      Bundles the Electron shell's main, preload and channels (key process) scripts with bun
      build, then packages the Linux app with electron-builder --dir from desktop/package.json's
      build config (its electronFuses block included: appId com.kiwiinit.channels, productName
      Channels, executable channels-desktop). desktop/scripts/fuses.ts reads the packaged
      binary's (release/linux-unpacked/channels-desktop) Electron fuses and fails unless RunAsNode,
      EnableNodeOptionsEnvironmentVariable and EnableNodeCliInspectArguments are off and
      EnableCookieEncryption, EnableEmbeddedAsarIntegrityValidation and OnlyLoadAppFromAsar are
      on. desktop/scripts/size.ts fails if app.asar ships node_modules (dist/ already bundles
      them), if more than the English Chromium locales ship (electronLanguages), or if the
      packaged Linux app is over 375MB on disk or 162MB as a tar.gz. The bundled kiwi is
      packed by desktop/scripts/pack-cli.ts first (zstd level 19 on every core, checked to unpack to the same bytes), and
      the smoke's daemon runs from the copy the app unpacks (places of one destination started at
      once share one write under a unique temp name, so the app's start and an adopt never spawn a
      binary still being written: ETXTBSY on Linux; test/desktop-place.test.ts in test / unit). desktop/scripts/smoke.ts starts the packaged app under Xvfb and fails unless its
      window renders, the page's scripts land in the V8 code cache (kiwi-app:// registered with
      codeCache, so a launch after the first skips compiling them), its key process
      (utilityProcess.fork of dist/channels.js from app.asar) stays up and the bundled kiwi
      daemon answers on its socket, and fails if
      ELECTRON_RUN_AS_NODE=1 runs JavaScript or --inspect opens a debugger. Then
      scripts/perf-desktop.ts times the packaged app's cold start under Xvfb, in a temp user data dir,
      KIWI_HOME and HOME, against a local relay: one run makes a person, a channel and 20 messages (the
      app pointed at the relay through its bridge's setRelayUrl, over --remote-debugging-port), then five
      launches each time, from the process start, the window (the renderer's timeOrigin), the first screen
      (first contentful paint), the first cached message of the channel it reopens (the kiwi:first-message
      mark) and live (kiwi:live), and fail if it doesn't reopen the channel left open; each launch also times
      perf-scale's CPU calibration (scripts/perf-calibrate.ts) in the app's page, the medians are scaled by it
      to the reference runner and go to the log and --json, and it fails when one is over its gate in
      scripts/perf-budgets.json, the limits
      whose source is desktop and perf-check skips: desktopFirstScreenMs and coldStartMs (launch to the first
      cached message). Fails on a
      bundling or packaging error, a fuse changed or dropped, or an app that no longer starts.

  desktop-mac:
    name: desktop / mac
    inputs: ["desktop/src/**", "desktop/native/**", "desktop/build/icon.icns", "packages/core/**", "web/src/**", "web/index.html", "web/package.json", "package.json", "bun.lock", "src/relay/**", "scripts/local-relay.ts", "scripts/perf-desktop.ts", "scripts/perf-calibrate.ts", "scripts/perf-budgets.json"]
    imports_from: ["desktop/src/main-eb.ts", "desktop/scripts/smoke-eb.ts", "scripts/perf-desktop.ts"]
    always: ["desktop/package.json", "desktop/electrobun.config.ts", "desktop/tsconfig.json", "desktop/tsconfig.eb.json", "desktop/scripts/eb-pre-build.ts", "desktop/scripts/eb-post-build.ts", "desktop/scripts/eb-size.ts", "desktop/scripts/eb-drive.ts", "desktop/scripts/smoke-eb.ts", "desktop/scripts/eb-driver-check.ts"]
    description: >-
      On a macOS runner (Electrobun builds only for the host it runs on), checks the Electrobun
      shell that is replacing Electron (issue #757). Builds web/dist, then `bun run typecheck:eb`
      in desktop/: `electrobun prepare` fetches Electrobun 2.0.4's devkit (Hutch, the pinned
      core and Bun) into desktop/.hutch, and tsc -p tsconfig.eb.json typechecks
      src/main-eb.ts, electrobun.config.ts and the eb-*.ts build scripts against it, strict.
      Then `bun run build:eb` (electrobun build --env=stable): bundles src/main-eb.ts with the
      shared desktop modules it imports (guard.ts csp(), open.ts, eb-page.ts, window-look.ts,
      window-size.ts) and @kiwi/core; scripts/eb-pre-build.ts turns build/icon.icns into the
      iconset; scripts/eb-post-build.ts copies web/dist into the app's views/internal and
      compiles native/macos/kiwi-shell.m with clang -Wall -Werror into Contents/MacOS (the
      patch that denies the microphone, camera and location Electrobun grants the page, and the
      window's minimum size and background); Electrobun writes the dmg. desktop/scripts/eb-size.ts
      fails if the stable .app is over 100MB on disk, or its dmg or its zip (ditto, the
      updater's layout) is over 40MB. Fails on a type error, a bundling error (an import the
      Bun main process can't resolve), an ObjC warning or a WebKit/AppKit API that no longer
      exists, a missing web/dist, or an app over its size gates.
      Then it starts the app, without CDP (WebKit has none; T442): a second build, `electrobun
      build --env=dev` with CHANNELS_EB_TEST=1 and its own bundle id (com.kiwiinit.channels.test),
      compiles in the test driver (desktop/src/eb-driver.ts behind the KIWI_EB_TEST build-time
      define in electrobun.config.ts): with KIWI_EB_DRIVER set, main listens on that Unix socket,
      runs each function it's sent in the page with executeJavascript and hands back what the
      page posts on Electrobun's host bridge; KIWI_EB_RELAY points the page's CSP and its
      ?relay= at a local relay. desktop/scripts/eb-driver-check.ts fails if the stable build's
      code carries the driver or the relay override (kiwiDriver, KIWI_EB_DRIVER, KIWI_EB_RELAY), or
      the test build lacks them. desktop/scripts/smoke-eb.ts (through desktop/scripts/eb-drive.ts,
      ~/Library in a temp CFFIXED_USER_HOME, a local relay) fails unless the window shows the
      dashboard from views://internal/index.html with a first paint, the relay it was given answers
      through the CSP, an inline script and a fetch to another origin are refused, the microphone
      isn't granted, BUN_OPTIONS / NODE_OPTIONS with a --preload or --require run nothing in the
      main process, and nothing of the app is left running after it quits. scripts/perf-desktop.ts
      --electrobun then times the test build's cold start as desktop / package times Electron's:
      a person, a channel and 20 messages on a local relay through the driver (the name field,
      Continue, New channel, Create channel, the composer and Enter), then 5 launches to the
      window, the first screen, the first cached message of the channel it reopens and live,
      scaled by perf-calibrate.ts's CPU calibration run in the app's page, failing over
      scripts/perf-budgets.json's desktop gates or when a launch doesn't reopen the channel; the
      numbers are the perf-desktop-eb artifact.

  cli-macos:
    name: cli / macos
    inputs: ["src/**", "packages/core/**", "test/**", "site/install", "site/install.sh", "desktop/src/**", "desktop/build/entitlements.app.plist", "desktop/build/entitlements.cli.plist", ".github/workflows/release-build.yml", "package.json", "bun.lock", "bunfig.toml", "web/package.json"]
    always: ["scripts/build-cli.ts", "scripts/cli-bundle.ts", "scripts/ci-tests.ts", "scripts/ci-flows.ts", "scripts/ci-shards.ts"]
    question: >-
      Could this change to `file` make the job described in `job` fail on macOS, or fail to
      cross-compile a darwin target, while the same tests and the Linux build pass
      in test / unit, test / flows-a, test / flows-b and build / bundles?
    criteria:
      true: >-
        The change touches behavior that differs on macOS: tmp paths behind the /var to
        /private/var symlink, realpath or process.cwd() compared with a tmp path, home under
        /Users, a case-insensitive file system, a unix socket path near 104 bytes, BSD shell
        tools, signals, child processes, file watching, the name the CLI prints for itself, or
        the darwin build targets, in a way that could fail only there.
      false: >-
        The change behaves the same on macOS as on Linux: a failure it causes would fail the
        Linux jobs too, which catch it, or it can't fail at all.
    description: >-
      On three macOS runners at once (a matrix of `scripts/ci-tests.ts all --shard=N/3`, which deals
      the files out by their times in test/timings.json: the slowest each file has taken in a cli / macos run (from
      `scripts/ci-tests.ts all --shard=N/3 --update-timings` or the run's log), so the heavy flows
      that slow each other on one runner land apart; every group also hands bun that file
      so --parallel starts the slowest files first), does what the release's cli job does: runs the whole bun test suite
      (every test/*.test.ts and web/src test, the agent flows included) with bun test --parallel so
      each file gets a fresh global as on Linux (one process for every file once let a test's
      SIGINT end the run early, exit 0, after 128 of 328 files), and fails when a shard's run ends
      before every file it was dealt ran. The first shard then compiles the kiwi CLI
      for darwin-arm64, darwin-x64, linux-x64 and linux-arm64 with
      scripts/build-cli.ts, ad-hoc signs the macOS binaries and runs `kiwi --version`. The same
      tests run on Linux in test / unit, test / flows-a and test / flows-b, so this job is for what fails only on macOS: paths (os.tmpdir() is under
      /var, a symlink to /private/var, so process.cwd() and realpath spell a folder differently
      from mkdtemp; home is under /Users; the file system ignores case; a unix socket path is
      capped at 104 bytes), how the CLI names its own command in the text it prints, BSD
      versions of shell tools, process, signal and file-watching differences, and a build
      target that fails to compile. test/desktop-entitlements.test.ts signs stand-in apps with
      codesign here, so release-build.yml's entitlements check runs for real only on macOS. Fails
      if any test fails on macOS or a target doesn't build. Each shard saves its own jev-ci pass
      (shard1of3 and so on, given a minute so a hung cache save can't hold it), and the plan
      counts the job passed on its inputs only once all three have, each from main or this pull
      request (passMarkers in .github/jev-ci/github.ts, test/jev-ci.test.ts).

  ios:
    name: ios / build
    inputs: ["ios/**"]
    imports_from: ["ios/engine/main.ts"]
    always: ["package.json", "bun.lock", "web/package.json", "desktop/package.json", "packages/core/package.json"]
    description: >-
      On a macOS runner with the newest Xcode installed there, checks the iPhone app in ios/.
      swift-format lint --strict (ios/.swift-format: 4-space indent, 180 columns, lowerCamelCase
      names, no force unwraps or force try) over ios/Channels and ios/ChannelsUITests. Then xcodebuild builds the Channels
      scheme for generic iOS devices, Release, unsigned: the Swift sources (SwiftUI, Swift 6 with
      complete strict concurrency, so a value that isn't Sendable crossing an actor fails), the
      asset catalog, and the "Bundle the engine" build phase, which runs bun build on
      ios/engine/main.ts (browser target, IIFE) into the app. The engine imports @kiwi/core, the
      desktop's Keyring, seats and bridge types, and a few pure web/src/lib modules (asks,
      harness names, presence, base-plan, fold-roster, trim, preview, task-actions), so a change there that breaks the
      bundle fails here. Fails on a lint finding, a Swift compile error, a missing asset or
      Info.plist key the build needs, or a bundle error. It does not run the app or the engine.

  ios-gestures:
    name: ios / gestures
    inputs: ["ios/**"]
    imports_from: ["ios/engine/main.ts", "ios/scripts/fixture.ts"]
    always: ["package.json", "bun.lock", "web/package.json", "desktop/package.json", "packages/core/package.json"]
    description: >-
      On a macOS runner with the newest Xcode, boots an iPhone simulator on the newest iOS
      runtime installed and runs the Channels scheme's tests: ios/ChannelsUITests, XCUITest
      driving the Debug app with real touches. The target's "Make the fixture" build phase runs
      ios/scripts/fixture.ts, which folds a signed log of twelve messages (six long ones from
      agents) and writes the engine's own roomView of it, so the canned channel always has the
      wire shape the app decodes; a Debug build given it in CHANNELS_FIXTURE shows that channel
      instead of reading the keychain (ios/Channels/Model/AppModel.swift). GestureTests opens the
      channel from the list eight times, fresh each time, and 0.3 or 0.8 s after the tap drags
      200 pt down from the middle right of the screen, on a message bubble: every drag has to
      scroll the conversation more than 100 pt (a SwiftUI DragGesture on each row swallowed about
      half of them right after opening: 0 pt), and so does the same drag beside the bubbles.
      Swiping a bubble right has to start a reply ("Reply to …" in the composer) without leaving
      the conversation (the Rightward pan in Conversation.swift). The drags' distances are printed
      as GESTURE lines. Fails on a compile error in the app or the tests, a fixture the app can't
      decode, or any of those gestures failing.

  release-rehearsal:
    name: release / rehearsal
    jev: false
    push: false
    version_bumps: true
    inputs: []
    always: [".github/workflows/release.yml", ".github/workflows/release-build.yml", ".github/actions/stamp/action.yml", "scripts/stamp.ts", "CHANGELOG.md", "src/version.ts", "desktop/package.json", "desktop/scripts/fuses.ts", "desktop/scripts/mac-size.ts", "desktop/scripts/appimage-squashfs.ts", "desktop/scripts/pack-cli.ts", "desktop/build/entitlements.app.plist", "desktop/build/entitlements.cli.plist", "scripts/changelog.ts", "scripts/cli-downloads.ts"]
    description: >-
      Runs .github/workflows/release-build.yml, the build a tag's release.yml runs, with
      rehearsal: true and a read-only token, publishing nothing: scripts/stamp.ts stamping the tag
      after src/version.ts (stamp.ts --next, v0.20.6 after 0.20.5) into src/version.ts, both
      package.json files and site/app.js and site/README.md's download names, and writing
      CHANGELOG.md's section from the commits since the last release tag, as a tag does; the
      version and changelog checks on the stamped tree; every job below building that tree (the
      .github/actions/stamp action applies the stamp the version job uploads); the cli job on macOS (bun test, four builds, each
      packed as .gz and .xz, held to 30 MB by scripts/cli-downloads.ts), and
      the desktop app packaged on macOS (arm64 and x64) and Linux (AppImage and deb), with each
      package's contents and fuses checked (release/mac*/Channels.app and
      release/*-unpacked/channels-desktop), the kiwi binary bundled zstd-packed by
      desktop/scripts/pack-cli.ts (which checks it unpacks to the same bytes), and on macOS
      desktop/scripts/mac-size.ts failing a dmg or zip over 150 MiB or an app over 320 MiB, and on Linux
      desktop/scripts/appimage-squashfs.ts failing an AppImage not packed with gzip, lz4 or zstd in
      blocks of at most 128 KiB. On a pull request, and on a manual run of ci.yml from any
      branch but main, the macOS app is unsigned: no caller passes the signing secrets, and only
      the release environment (main and v* tags) holds them. A manual run on main takes them from
      that environment, so the app is signed, notarized and checked as on a tag. Fails where the tag would: a stamped file with no version for the stamp
      to find, versions that disagree after it, no changelog section, a test failing on macOS, an electron-builder error, a package missing the web
      app or the kiwi binary, a Mac package over its size gate, an AppImage packed slow to page in, and on a manual run on main a signing or notarization error. Runs on
      a pull request that changes the release workflows, the stamp or CHANGELOG.md, on any change
      that only bumps a version number, and on manual runs of ci.yml, never on a push to main
      (release.yml's "kiwi X.Y.Z" stamp commit included).

