      An answer the fold doesn't have yet is read again a bounded number of times and decided only on the fold's copy (test/permission-hook.test.ts), and the hook's own wait reads it that way (test/permission-ask.test.ts, askPermission on a fake session whose fold lags the frame); a newer prompt that starts while the wait winds down gets nothing printed for the old one, and neither does an answer in the terminal then, since the last check runs after the wait has closed; a signal after the wait has closed closes the ask instead of killing the hook. test/permission-lock.test.ts (node:fs wrapped to act at the exact moment): a stale lock swapped for a live or still-written one just before the takeover stays with that hook, a newer hook that takes the session while the lock is set aside keeps it, and letting go removes the newer-prompt mark before the lock. test/ios-view.test.ts: the iPhone app's room view (ios/engine/view.ts, the engine's roomView on a folded signed log): a task in review that the person may approve is in its reviews, done by the task's owner and dated by its open round, one waiting on an agent reviewer isn't, an agent's seat gets none, and the channel's latest line is its newest message outside the chat with the lead (a task thread's, with the thread it was said in), #general's when nothing came after it.
      And the Electrobun shell's page and pins: test/desktop-eb-page.test.ts (desktop/src/eb-page.ts: the CSP meta first in a <head> found by the page's structure, with only HTML's whitespace (tab, LF, FF, CR, space) allowed before it, so a non-breaking space or a vertical tab is refused; the navigation rules and the one page they allow; will-navigate read as the page, a refusal or a breach) and test/desktop-eb-pins.test.ts (desktop/scripts/eb-pins.ts and desktop/electrobun-pins.json: the pins moving with the electrobun dependency, the Linux native wrapper's inputs pinned (Electrobun's source at a commit, CEF's and Dawn's include trees by sha256) with desktop/native/linux/electrobun-wayland.patch touching only nativeWrapper.cpp and forcing GDK's X11 backend only when CEF is bundled (T523), a host without pins refused, a changed or missing file named, a tree hash over every path and byte).
      Fails if any of that breaks.
      And web lib/annotate.test.ts: an image's base64 becomes a Blob without fetching a data URL (the app's and the site's CSP connect-src have no data:, so the annotator's Copy image failed with Load failed), and no file in web/src fetches one.

  test-flows:
    name: test / flows
    inputs:
      - "packages/core/**"
      - "src/**"
      - "test/owner-cli.ts"
    imports_from:
      - "test/budget-*.test.ts"
      - "test/cache-trim.test.ts"
      - "test/daemon-pair.test.ts"
      - "test/e2e.test.ts"
      - "test/handoff.test.ts"
      - "test/held-seat.test.ts"
      - "test/hooks-hung-relay.test.ts"
      - "test/hooks-once.test.ts"
      - "test/hooks-persona.test.ts"
      - "test/hooks-reentry.test.ts"
      - "test/join-seats-hooks.test.ts"
      - "test/join-seats-review.test.ts"
      - "test/join-seats.test.ts"
      - "test/loop-flows.test.ts"
      - "test/mimo-wake-restart.test.ts"
      - "test/multi-seat.test.ts"
      - "test/offline-read.test.ts"
      - "test/read-receipts.test.ts"
      - "test/reclaim.test.ts"
      - "test/reconnect.test.ts"
      - "test/remote-launch-flow.test.ts"
      - "test/seats.test.ts"
      - "test/sh-escape.test.ts"
      - "test/threads.test.ts"
      - "test/verbs.test.ts"
      - "test/wake-yourself.test.ts"
    always:
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      - "scripts/ci-flows.ts"
      - "scripts/ci-tests.ts"
    description: >-
      `scripts/ci-tests.ts flows` runs slow end-to-end tests (failing when the run ends before every file ran) that start a real local relay (src/relay/bun.ts) and drive the kiwi CLI and client: e2e (create a channel, join, send and listen through the relay), verbs (the agent CLI verbs and their aliases; an agent's task add without --ask, --from or --issue refused with the fix named, and kiwi task listing the board under the person's message each task serves; review rounds: an agent's task review on a task with no reviewer is refused with how to name one, and its reviewer handing the review on with task review --review NAME keeps the open round and its commit and tells the new reviewer which round; an agent's reply that runs past six lines in #general is told to keep #general to a line or two and put the detail in the task's thread), threads (task threads and direct threads), reconnect (what a listener says when the relay drops).
      And verbs: kiwi task add refuses a title over 60 characters with exit 1, no task id on stdout and a pointer to the body, and takes the spec as --body or --file spec.md (shown by task show), refusing both at once (T1103).
      Then every test/budget-*.test.ts: budget-relay counts the SQL statements a stored message, a read mark and a connecting socket cost on one Durable Object storage handle; the others drive clients through test/traffic.ts, a proxy that counts HTTP requests by route, sockets, frames and bytes. cache-trim: past 800 messages a session keeps a local fold base and trims cache/<room>.jsonl to the newest 300 (src/agent/state.ts, src/config/cache.ts), and tasks, charter and log read the same from base and tail as from the full log.
      Fails if the CLI, the client, the relay, the protocol or the text they print changes behavior, or an operation costs more requests, frames, bytes or statements than its budget.
      It also runs slow agent-flow tests (failing when the run ends before every file ran) against a real local relay and the kiwi CLI: join-seats (joining, one seat per agent, Claude Code hooks doing the listening, and a Codex hook run from inside a Claude Code session, its CLAUDECODE and CLAUDE_CODE_SESSION_ID inherited, serving no Claude seat and leaving that seat's messages unread because the hook names its harness with --harness), read-receipts, daemon-pair (kiwi pair through the relay's pairing mailbox: src/daemon/pair.ts, src/machine.ts, packages/core/src/mailbox.ts), sh-escape (the sandboxed kiwi sh), reclaim, wake-yourself (the Stop hooks that keep a Kimi Code, Grok or Cursor agent's listener running, and a Kimi Code session that Kimi's server hosts woken through that server: the busy session recorded at join, kept current by the Stop hook, the prompt posted with the server's token; src/kimi-server.ts; for Cursor, its stop hook known by conversation_id and cursor_version, its seat by CURSOR_CONVERSATION_ID, and a listen --once of that chat counting as armed; a Grok Bot whose VM's shell has CURSOR_AGENT seated and hooked as Grok Bot, not Cursor; and with a backlog of unread messages the stop reason, re-arm reminder included, stays within the seat's share of the hook limit).
      Then seats and multi-seat: which agent a command or hook acts for in a folder (a reply goes to the channel the session heard the message in, even from a folder bound to one seat)
      (src/seats.ts, a Grok Bot's seat from its VM's hostname or KIWI_HARNESS, a hook's named harness over the markers its parent session left: hereAs, and a named harness with no session never given a folder's only seat when that seat is another harness's or a live session's), one session holding seats in two channels, the join of the second from the same folder saying which -c ALIAS --as NAME picks each seat and a rejoin of either saying nothing about it (src/cli/commands/join.ts), each Stop and SessionStart unread header and Cursor follow-up naming its channel (src/hooks/answer.ts, test/wake-yourself.test.ts), a session that holds neither seat told the folder has seats in both channels and to pass -c ALIAS --as NAME (src/cli/context.ts), hooks serving the right seat from sibling folders, and with a backlog on both seats each hook's whole output (SessionStart, prompt, stop) within HOOK_CONTEXT_MAX, the seats sharing it (src/hooks/run.ts).
      Then handoff: an escalation's live browser link (packages/core/src/protocol.ts), `kiwi send --escalate --handoff URL --wait` exit codes, and the link kept out of log, show, listen --json except `kiwi show N --reveal`, and only a person's done or couldn't ends the wait, never an agent's (src/agent/messaging.ts); kiwi ask-human --holds T7,#18 --kind K naming the tasks and asks a decision holds up (refused for one that's neither), printed back as what it holds, shown in kiwi status as `[kind] · holds …`, and one holding nothing told it goes to the digest and listed there, not as waiting on you.
      Then hooks-once: a message the prompt or stop hook hands over never wakes the session a second time from the listener started with it (src/hooks/listen.ts waits for the session's answering hook, src/hooks/delivered.ts), and the listener keeps listening for the next one; and a prompt hook whose output never reaches the session leaves the message unread for the next hook (src/hooks/run.ts commits what was read only after printing it), and a hand-over cut at its size limit commits only the messages shown, so the next hook brings the rest; and after a /clear (a new session id in the same process) the earlier session's listener hands a message over once and the new session's stop and prompt hooks don't hand it over again, nor does its listener started before any hook; and a listener that can't reach the daemon keeps retrying its slot (2s doubling to 60s) while its session lives, instead of exiting and leaving the session deaf.
      Then hooks-hung-relay: with the relay accepting connections but never answering, the prompt and stop hooks each return in under 2s (src/hooks/run.ts puts the whole hook under one deadline; packages/core/src/client/relay.ts gives every relay request 30s), and what they couldn't show comes with the next prompt.
      Then offline-read: with the relay down, kiwi log and kiwi tasks show the messages and tasks this computer already had and say the relay can't be reached (OfflineReads in packages/core/src/client/relay.ts, src/agent/state.ts, src/cli/context.ts).
      Then daemon-pair (issue #714): kiwi pair, the command, starts this computer's daemon once the app approves, and the relay then sees the computer online for the person.
      Then remote-launch-flow (T394): on a local relay, a computer paired by kiwi pair (its daemon on a stub tmux and a stub Claude Code on its login PATH, so nothing opens) is started from another device through the app's own calls (desktop/src/remote.ts): it lists Claude Code without bypass while its switch is off and its home folder's git repo, starts it there with --model, --effort and --permission-mode, refuses bypass before anything opens until kiwi launches bypass on, refuses a folder outside what it offers however it's spelled, and a fourth start in ten minutes.
      Then hooks-persona: when the owner gives a seated agent a personality, changes it or takes it away mid-session, its next prompt or Stop hook tells it once, before its messages (src/hooks/persona-line.ts, src/hooks/answer.ts), and a new session reads it in its SessionStart brief and isn't told again.
      Then hooks-reentry: a SessionStart hook for a session that starts fresh (startup, clear, compact) tells the agent its open task and the checkpoint saved with kiwi task checkpoint, and one for a resumed session doesn't (src/hooks/answer.ts, packages/core/src/reentry.ts); kiwi task checkpoint lead refuses a seat that isn't the lead and an empty note before sending anything (src/cli/commands/tasks.ts); with big checkpoints and a backlog of messages the SessionStart context stays within HOOK_CONTEXT_MAX (Claude Code's inline limit, shared between the seats a session serves in src/hooks/run.ts), and every message it left out comes with a later hook; and with kiwi context-line off (src/cli/commands/context-line.ts, the default) the context line says nothing: no checkpoint line in the brief, a checkpoint only saved, no Stop ask; with it on, everything as it was before #670: past the context line the Stop hook asks once for a checkpoint of each open task, not while stop_hook_active, and again only after the context came back under it (src/hooks/context-line.ts); and a seat made lead past the line is asked for its lead checkpoint, has a checkpoint that leaves out an open task refused, and its fresh session is shown the one it saved (src/hooks/answer.ts, src/cli/commands/tasks.ts).
      Then mimo-wake-restart:
      Kiwi's MiMoCode plugin (src/hooks/install/mimo.ts) loaded against a real listener, whose wake MiMoCode keeps refusing until MiMoCode exits mid-retry; the resumed session still gets those messages, because the listener writes a pending handoff per token (src/hooks/delivered.ts) that becomes the delivered marker only when the plugin's next listen names the token of the wake that landed (src/hooks/listen.ts, src/hooks/run.ts), and the next message isn't repeated with them; a wake the listener hands MiMoCode logged to wake.log as handed, and the refusals before it landed (the plugin's next listen reports their count and last error) logged as failed with that reason (appendWakeRow in src/daemon/wake.ts, src/hooks/listen.ts); and two MiMoCode processes on one session, each landing its wake of the same message, count it delivered once instead of clearing each other's handoff and waking it back and forth.
      Then held-seat: a seat a loop holds with kiwi seat hold (src/hold.ts, src/cli/commands/seat.ts) keeps only a hash of the loop's KIWI_SEAT_TOKEN and drops its session; while it is held no hook takes it or hands it anything (seatsFor in src/seats.ts), every kiwi command for it from another session refuses, --as, KIWI_AS and kiwi use included (src/cli/context.ts, src/cli/commands/channel.ts), a kiwi listen already running for it exits on the next message without printing it or moving the cursor (src/agent/listen.ts, src/agent/state.ts), and an MCP server started before the hold answers every tool, wait_for_messages and sh included, with the refusal and with the cursor where it was (src/mcp.ts, src/sh.ts), while the token's holder still acts as it; bind refuses a Grok Bot and a Kimi Code seat without its process; kiwi seat bind hands it to the Claude Code session it names, which is told what arrived during the hold, and the old session gets nothing; and a kiwi listen of the bound session that heard nothing during the next hold exits on the first message after the seat goes to a third session, which gets that message (the holds count in src/hold.ts).
      Then loop-flows: kiwi loop (src/loop/run.ts, src/cli/commands/loop.ts, src/loop/recipes.ts) holds its seat, starts a fake Claude Code for a task the seat owns with the window's model, KIWI_CHANNEL and KIWI_AS, without KIWI_SEAT_TOKEN or the outer session's markers, and a first prompt that names the task and how it ends (src/loop/work.ts); binds the seat to the session in its process's registry (src/loop/claude.ts); once the session marks the task done, holds the seat again, ends the idle session with SIGTERM, and releases the seat when the loop is stopped; and with --harness codex, run from a shell that still has an outer CODEX_THREAD_ID, starts a fake Codex with -m and the effort as a config override, finds its new thread by the launch nonce in the rollout's first prompt (src/loop/codex.ts), binds the seat to that thread, and ends it once the rollout says the turn is over; and with --harness grok, starts a fake Grok whose first prompt also asks for a kiwi listen monitor, binds the seat to the session in the loop's folder that holds the nonce (src/loop/grok.ts), and ends it once its update stream says the turn is over; and with --harness mimo, refuses --effort, starts a fake MiMoCode with the model chosen in its model.json, binds the seat to the session its database holds with the nonce (src/loop/mimo.ts), and ends it with SIGINT, which MiMoCode stops on, not SIGTERM; and with --harness kimi, refuses to run outside tmux, then in a private tmux server clears the pane, waits for a fake Kimi's ready screen with bracketed paste on (the fake turns it on a second after drawing the screen), pastes the first prompt with bracketed paste and Enter, binds the seat to Kimi's process, ends it once its wire log says the turn ended, and stops the kiwi listener it left running (run only on tmux 3.7 or newer, which reports bracketed paste, so skipped on the Linux runner's tmux 3.6a and run where a newer tmux is installed); and with a fake tmux 3.6a, kiwi loop --harness kimi refused up front with the version it found.
      Fails if joining, seats, hooks, pairing, the daemon, kiwi sh, handoff, the held seat, the loop or the relay change behavior.

  build:
    name: build / bundles
    inputs:
      - "desktop/src/public-channel.ts"
      - "desktop/src/seats.ts"
      - "packages/core/**"
      - "scripts/build-cli.ts"
      - "scripts/cli-bundle.ts"
      - "scripts/local-relay.ts"
      - "scripts/smoke-cli.ts"
      - "scripts/smoke-ui.ts"
      - "scripts/web-bundle.ts"
      - "src/**"
      - "test/check.ts"
      - "test/owner-cli.ts"
      - "test/owner.ts"
      - "web/**"
    always:
      - "bun.lock"
      - "package.json"
      - "scripts/local-relay.ts"
      - "scripts/smoke-ui.ts"
      - "scripts/web-bundle.ts"
      - "web/package.json"
      - "web/vite.config.ts"
      - "wrangler.jsonc"
    description: >-
      Builds the web dashboard for production (vite build in web/) and fails when the JS the first screen loads (the entry script plus every chunk it modulepreloads) is over BUDGET_BYTES (590,000) in scripts/web-bundle.ts, a budget that doesn't go up for a feature; code reached only through web/src/components/lazy.tsx doesn't count.
      It fails as well when any of Motion (motion/react, the animation library) reaches that first load, which is kept for lazy surfaces, and when web/dist carries any file over 20 MiB, which would weigh on every desktop download.
      Then ui smoke: starts the relay and the kiwi CLI as a test computer and drives the built dashboard in headless Chromium, opening every menu, popover and dialog, downloading the channel from Details any time (a transcript naming each message's number, date, time and sender, and the signed log, both named with the date and time), making the room #mobile from Details → Rooms (a taken name refused before it's sent; the room in the Rooms row and the sidebar's conversations) and renaming it #ios, then posting in #ios from its conversation (the composer says Message #ios) and finding the message there and not in #general, setting up a passkey, previewing an invite, an invite that pins a personality keeping its whole join command (the long --persona token wrapping, the short flags whole) inside its box, the sidebar's top row starting past a Mac's traffic lights and the page clear of them (data-shell="mac": the row's content at least --lights-w in, the page's left edge too), the open channel's row marked current with its conversations nested under it and ⌘\ hiding the sidebar (it stays hidden across a reload, and the toolbar's Show the sidebar brings it back), Settings → Personalities duplicating a preset into the person's own, the Agents tab showing a lane per agent with what's next on it, Needs you as rows always in view (an agent asking in is let in from its row), an answered ask saying who chose what on the ask itself, replying inline (the reply quotes what it answers, "1 Reply" opens the thread; then three replies, each sent right after two messages, keep their quotes: an earlier send's late answer doesn't clear the reply, and a reply to a message still sending waits for its seq, checked on the reply's row once the relay's copy has landed), Details → Close channel… downloading the whole log first as JSON Lines with each message's key and signature (the history call through ChannelLink and the desktop keyring) and Cancel keeping the channel, linking a computer with `kiwi setup`, approving its agent and opening a task (a board row opens it in the Tasks panel, with no second task list behind it, and with the task open beside it at 1280 and 1180px every row keeps a readable title with nothing spilling out of it, its columns picked by the board's own width; /tasks switches to the Tasks tab; the details' wants-to-join row closes them and shows Needs you, where the agent is let in, and details offer no Copy invite link or second approve flow), a reload of that channel never showing the Add an agent card, No tasks yet or No messages yet before its history is in, the app loaded with no channel in its address reopening the one that was open instead of Nothing open, finding controls by visible names and roles; fails if a page throws while rendering, a control it looks for is renamed or missing, or the relay, pairing or join flow breaks.
      Then compiles the kiwi CLI into one Linux binary with scripts/build-cli.ts (bunfig.toml and .env autoload off), runs `kiwi --version`, runs it again from a folder whose bunfig.toml preloads a file and fails if that file ran (T1365), fails over the minified JS byte budget or if QuickJS, sql.js, turndown or domino got back in, or ajv (the MCP SDK's JSON Schema validator, which only elicitation uses and the build stubs out) got back in, and scripts/smoke-cli.ts drives the binary against a local relay (every allowed kiwi sh command compared with the source CLI, the MCP sh tool, kiwi doctor).
      Then bundles the Cloudflare worker (src/relay/worker.ts) with wrangler deploy --dry-run, failing on a Node- or Bun-only import reaching it or an invalid wrangler.jsonc.
      Headless Chromium and the apt packages it needs come from .github/actions/browser, which installs the packages from .deb files cached for this very runner image (and Playwright's browsers cached per Ubuntu release, since its WebKit is built for one) and fails the job if they can't be installed.

  shots:
    name: build / shots
    inputs:
      - "assets/**"
      - "packages/core/**"
      - "scripts/local-relay.ts"
      - "scripts/seed-permission.ts"
      - "scripts/shoot-ui.ts"
      - "src/**"
      - "web/**"
    always:
      - "bun.lock"
      - "package.json"
      - "scripts/local-relay.ts"
      - "scripts/seed-permission.ts"
      - "scripts/shoot-ui.ts"
      - "web/package.json"
      - "web/vite.config.ts"
    description: >-
      Builds the web dashboard (bun run web:build), then scripts/shoot-ui.ts --wide --phone channel,tasks --theme dark in headless Chromium and again with --browser webkit --wide --theme light in Playwright's WebKit (the engine of the Mac's and Linux's system web view, which the desktop app moves to: .github/actions/browser installs it and its apt packages with webkit:
      "true").
      Each run starts the relay and the kiwi CLI as two agents' computers, seeds a channel in that browser (the owner signs in, with a virtual passkey authenticator in Chromium, lets atlas in and gives it the Lead personality, lets win in, a conversation with an ask, a reply, two tasks and a task's conversation, a review and an escalation under Needs you, a direct conversation between two agents, a picture the lead sends in the direct conversation, two Claude Code permission prompts from win (scripts/seed-permission.ts, built by core's permissionShown: a command the owner denies from Needs you, an edit of every occurrence left waiting, showing what it replaces and with what), a direct conversation, notes, the channel's repo saved from Details so Write to GitHub shows under Repos, a pending join request and a second empty channel) and shoots every screen of the wide window in its theme: the conversation, the channel with its sidebar hidden (⌘\: the header takes its views), the tab bar in a Mac window (with a stand-in for its traffic lights), the channel sidebar's search open and its folded conversations opened, the reply bar, the composer with words in it, the Tasks tab, a task opened from its board row in the Tasks panel, Needs you, the permission prompts in the conversation (one denied, one waiting), the Agents tab, the channel's settings page (Details: members, the channel's settings with its repo and Write to GitHub off, notes and closing, side by side), the direct conversation, its picture open in the viewer (in a Mac window, with a stand-in for its traffic lights), your colour picked from your own row in Details (a real color.set through the relay, checked when you open it again, then cleared), an agent's menu in Details turning its wake off and back (with a stand-in for the desktop app's wake calls), Invite, Details → Rooms with a new room's name typed in, the account menu, the command palette, Notes, Pause, Settings (its sections and their groups), Settings' New agents group with a stand-in for the desktop app's terminal methods (Allow, Prefer with Rex and tmux greyed, the Rex row) before and after Download Rex Helpers and Prefer Rex, Settings' Folders agents can start in, after Add a folder… (the picker stubbed), Settings' Hooks rows (one per harness on this computer, with a stand-in for the desktop app's hooks calls) before and after Update on Claude Code, Personalities (opened from its row), Add an agent, the desktop app's New agent modal step by step (Computer, Options with a model, effort and 1M context picked, and Permissions with Bypass, failing when Next goes on before Bypass is confirmed or stays held after, then Harness, Options and Permissions on a paired computer, where Bypass is shown refused, then Folder, and Name with its Start inside the window), a launch that fails and its Try again to the started screen, which fails unless the launch carried the paired computer's model and effort (with a stand-in for the launch methods the desktop bridge adds, its harness rows carrying the options each harness takes), first run, signed in with nothing open, Join with a code and the invite preview; last, so no other screen has rooms, the owner makes #mobile and atlas posts once in #general and twice in #mobile (one an @mention of the owner) while #general is open: the sidebar's per-room unread counts (T1236).
      The shots are uploaded as the ui-shots artifact, WebKit's as ui-shots-webkit.
      The seed's first run fails at once with the error the page shows (role alert) rather than waiting out its timeout.
      Fails when the conversation isn't at its newest message (within 80px of the bottom) once the channel opens and again back from the Tasks tab (which it visits itself), at the wide size and, in the same run (--phone channel,tasks: the channel and Tasks screens on the channel already seeded), at phone size too (web/src/components/conversation/use-scroll.ts), or when the window's drag band would take a control of the open viewer (each app-region box added or taken away in document order, as Electron does), or when the seeding can't drive the dashboard or any screen can't be reached (a control renamed, moved or gone), so the shots keep up with the UI; each of these in either engine, so a screen or the conversation's place that works in Chromium but not in WebKit fails too.
      Headless Chromium and the apt packages it needs come from .github/actions/browser, which installs the packages from .deb files cached for this very runner image (and Playwright's browsers cached per Ubuntu release, since its WebKit is built for one) and fails the job if they can't be installed.

