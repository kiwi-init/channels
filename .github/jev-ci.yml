# jev-ci: which CI jobs a pull request or merge group can break. Read by .github/jev-ci/cli.ts
# in the `plan` job of .github/workflows/ci.yml. A pull request runs only `pull_request_jobs`
# (below); the rest of its plan runs in the merge queue. A merge group is planned like a pull request,
# on the group's combined change (merge_group.base_sha..head_sha), and it trusts pass markers
# from main and from the merge queue's gh-readonly-queue/main/ refs as pull requests do. Pushes
# to main run nothing when a merge_group run of ci.yml already passed on that very commit (the
# queue merges what it tested as-is), and otherwise everything except the jobs marked
# `push: false`, which run on pull requests, merge groups and manual runs only.
# `version_bumps: true` runs a job when a change only bumps a version number, which otherwise
# counts as no change.
#
# Layout, so pull requests that touch the same job merge without conflicts: each job's lists
# one item per line, sorted, and each description one sentence per line (a folded `>-` block,
# so the lines join back into the same text). test/jev-ci.test.ts keeps it that way.
#
# For each job: `inputs` are the files it reads (a change elsewhere skips it), `imports_from`
# are entry files whose static imports (followed through the repo) count as inputs too,
# `always` are files that run it by rule (config, dependencies), `parts` are workflow jobs that
# do part of its work (a matrix it waits on) and run or skip with it, and `description` says in
# plain words what it checks and what makes it fail. Jev reads the description, so keep it
# true. `question` and `criteria` replace the question Jev is asked for that job, and
# `threshold` replaces the global one. `jev: false` marks static checks (types, lint): any
# edit to their files can fail them, so they run whenever those files change and Jev only
# judges tests, flows and builds.
#
# A job also runs when its own job in the workflow changed, or a local action or reusable
# workflow it uses (`uses: ./...`). A change to the workflow's `name`, `run-name`, `on` or
# `concurrency` runs nothing by itself; `permissions` runs the jobs that inherit them; any
# other top-level change runs every job. In this file, a change to a job's `description` or
# `name` runs nothing by itself, a change to its other fields runs that job, and a change to
# a setting above `jobs` runs every job.

# enforce: jobs Jev judges unaffected are skipped. shadow: they run anyway and the plan says so.
mode: enforce
# Run a job when Jev puts its chance of failing at or above this.
threshold: 0.3

workflow: .github/workflows/ci.yml
# Jobs in the workflow that aren't checks: they run on every pull request, so a change to
# them needs no other job. Any other job in the workflow without an entry here always runs.
planner_jobs: [plan, ci-ok]

# A pull request runs only these jobs, as planned (and so does a pull request whose planning
# failed); ci-ok passes on them, so it joins the merge queue minutes after a push. Every other
# job the plan picks is skipped there with the reason it would have run, and runs once in the
# merge queue's group run, which plans the group's combined change with every job.
pull_request_jobs: [static, test-unit]

# The planner itself: a change here runs every job.
run_all_when_changed:
  - ".github/jev-ci/**/*.ts"

# A release bump changes only these lines; it counts as no change.
version_only:
  files: ["package.json", "web/package.json", "desktop/package.json", "src/version.ts"]
  pattern: '^\s*("version"\s*:|export const VERSION\s*=)'

summarize_files: ["bun.lock"]

# Above this many changed lines, or a single file above max_file_lines, Jev isn't asked: the jobs run.
# Lines moved verbatim from one place to another don't count: Jev sees them as moved.
max_jev_lines: 800
max_file_lines: 300

jobs:
  static:
    jev: false
    name: repo / static
    inputs:
      - "**/*.{ts,tsx,mts,cts,js,jsx,mjs,cjs,css}"
      - ".github/actions/**"
      - ".github/workflows/**"
      - "web/index.html"
    always:
      - ".oxfmtrc.json"
      - ".oxlintrc.json"
      - "bun.lock"
      - "desktop/package.json"
      - "desktop/tsconfig*.json"
      - "knip.json"
      - "package.json"
      - "packages/core/package.json"
      - "tsconfig.json"
      - "tsconfig.worker.json"
      - "web/.oxfmtrc.json"
      - "web/.oxlintrc.json"
      - "web/package.json"
      - "web/tsconfig*.json"
      - "web/vite.config.ts"
    description: >-
      The static checks, one after another, each run even when an earlier one failed.
      Types: tsc --noEmit over src/, packages/core/src (the @kiwi/core workspace package) and test/ (and the jev-ci planner test/ imports), again over the Cloudflare worker with the Workers types (tsconfig.worker.json), tsc -b in web/ (which also compiles the packages/core modules the dashboard imports as @kiwi/core/*), and tsc --noEmit in desktop/, and tsc --noEmit over the iPhone app's engine (ios/engine/tsconfig.json, which adds the DOM lib), its dev scripts (ios/scripts) and the Android app's check scripts (android/scripts). scripts/ui-tokens.ts fails on an arbitrary text-[Npx] or rounded-[Npx] Tailwind class in web/src. oxlint (root .oxlintrc.json) on src/, packages/core/src, desktop/src, desktop/scripts, scripts/, test/, .github/jev-ci/, site/app.js and site/world.js: unused variables or imports, an empty block or catch, explicit any, a useless assignment or escape, a rethrow without its cause; ios/engine, ios/scripts and android/scripts too. oxlint on web/src (web/.oxlintrc.json extends the root config and adds the React rules: conditional hooks, setState in an effect, impure calls in render). oxfmt --check on web/src (web/.oxfmtrc.json: no semicolons) and on the same root paths as oxlint (root .oxfmtrc.json: semicolons, trailing commas, 200 columns).
      Knip (knip.json) over the root, packages/core, web/ and desktop/: a file nothing imports, an export nothing outside its file uses, an unused dependency, an unlisted package. scripts/action-pins.ts: every uses: in .github/workflows and .github/actions names a third-party action by a full commit SHA.
      Fails on any of these.

  test-unit:
    name: test / unit
    inputs:
      - ".github/jev-ci.yml"
      - ".github/jev-ci/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/perf.yml"
      - ".github/workflows/rehearsal.yml"
      - ".github/workflows/release-build.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/update-check.yml"
      - "desktop/build/entitlements.app.plist"
      - "desktop/electrobun-pins.json"
      - "desktop/package.json"
      - "desktop/scripts/appimage-squashfs.ts"
      - "desktop/scripts/eb-app.ts"
      - "desktop/scripts/eb-dmg.ts"
      - "desktop/scripts/eb-driver-check.ts"
      - "desktop/scripts/eb-pins.ts"
      - "desktop/scripts/eb-release.ts"
      - "desktop/scripts/eb-seal.ts"
      - "desktop/scripts/eb-test-marks.ts"
      - "desktop/scripts/update-check/**"
      - "desktop/src/**"
      - "ios/engine/**"
      - "packages/core/**"
      - "scripts/action-pins.ts"
      - "scripts/brew-bump.ts"
      - "scripts/build-cli.ts"
      - "scripts/changelog.ts"
      - "scripts/cli-bundle.ts"
      - "scripts/cli-downloads.ts"
      - "scripts/local-relay.ts"
      - "scripts/perf-budgets.json"
      - "scripts/perf-check.ts"
      - "scripts/stamp.ts"
      - "site/README.md"
      - "site/app.js"
      - "site/install"
      - "site/install.sh"
      - "src/**"
      - "test/**"
      - "web/public/**"
      - "web/src/**"
    always:
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      - "scripts/ci-flows.ts"
      - "scripts/ci-tests.ts"
      - "web/package.json"
    description: >-
      test/desktop-linux-launcher.test.ts (Linux): desktop/native/linux/kiwi-launcher.c, compiled with cc, hands Electrobun's launcher only the names it keeps (never LD_*, BUN_*, NODE_OPTIONS, JSC_*, GTK_MODULES, GTK_PATH, GIO_MODULE_DIR, GST_PLUGIN_PATH, QT_PLUGIN_PATH, WebKit's injected bundle or KIWI_KEY_FD), sets BUN_RUNTIME_TRANSPILER_CACHE_PATH=0 itself, finds Electrobun's launcher beside itself when started through a link, passes the arguments on, and refuses with 127 when it isn't there (T1548).
      And it reads the DT_NEEDED list of bin/libNativeWrapper.so beside it and, when one of those libraries is in none of the system's library folders, beside it or through dlopen, names it with the runtime install line for the distro /etc/os-release names (apt, dnf with libayatana-appindicator-gtk3, pacman or zypper; every family's for one it doesn't know), exits 127 and starts nothing, where Electrobun's launcher names libappindicator-gtk3 for Fedora (T1066).
      And test/doctor.test.ts's Homebrew case: kiwi doctor names an older kiwi ahead of Homebrew's on PATH (a leftover ~/.kiwi/bin/kiwi, told apart by Homebrew's Cellar path) with both versions, and gives the fix, rm of that binary and the marked PATH lines in the shell profiles that carry them, keeping ~/.kiwi's keys and seats, and says nothing with Homebrew's first or no Homebrew kiwi (T1402).
      And test/worktree-seat.test.ts: from a git worktree outside the joined folder (an agent's scratchpad), kiwi finds the seat of the worktree's main checkout, read from its .git file's commondir and matched by real path, deep folders included, while two seats there still need -c/--as, a seat bound in the worktree wins, and a plain folder or a submodule's .git file finds nothing (T1115).
      And test/handback.test.ts: a task outlives the agent who leaves, so once its owner is no longer an active member its open tasks fold back to the board as open (doing goes to todo), named as left by them with their notes and checkpoint kept, while done ones keep their owner and a member still here keeps theirs; the message handing them back names each with its PR, branch, head and checkpoint, and a live agent leaving tells the lead before it goes (T1105).
      And test/task-title.test.ts: a new task's title is at most 60 characters (TASK_TITLE_LIMIT) for people, a longer one or a rename past it refused before anything is sent, with the spec in its body (detail, at most TASK_BODY_MAX_LENGTH), while an older client's title up to 200 still folds whole (T1103).
      And test/goal-names.test.ts: a person's ask gets a goal in plain words (ask.name, a newer op at EVENT_OPS_VERSION 5), named by the lead, the owner or the person who asked and refused for anyone else, for a message no task is filed under and for an empty name, cut to MAX_GOAL_NAME, cleared by null back to their words, kept through a fold from a kept base; kiwi task's board heads the tasks with it and the person's words under it, and a live session names, renames and clears it while a builder is refused (T1095).
      And web/src/lib/now.test.ts: the Now card pinned above the conversation and on top of the Tasks tab reads the next line from the note `next` (gone once cleared or past its ttl), lists the tasks whose status (statusOf) is working or needs you, newest first, the latter marked, with their stage from the signed log (no PR yet, PR #N with checks running, passed or a named check failed), the top 5 and a count of the rest, never one only assigned, and the tasks done or shipped today by their merge (a merged PR counts before anyone marks it done; not yesterday's, not cancelled ones), saying the release a merge shipped in, as a count and the last 3 (T1093, T1288).
      And `scripts/ci-tests.ts unit` runs the unit tests with bun test (failing when the run ends before every file ran, which scripts/ci-tests.ts checks for every group from the last summary bun prints, without waiting on a process a test left holding its output: test/ci-tests.test.ts runs it on throwaway projects): every test/*.test.ts except the slow suites scripts/ci-flows.ts lists, plus the dashboard's tests in web/src (task-cards among them: one live card per open task, a done task as its last line only; agent-facts: an agent's repo@branch, flagged when the channel doesn't list its repo; quote: a reply's inline quote names who it answers and what they said, an image as Image; lib/tab-fit.test.ts: the tab bar shows every channel tab that fits, the rest go under More with room kept for it, and the open channel always keeps a tab; conversation/channel-sidebar.test.tsx: on a wide screen the sidebar's Search is a row that turns into a real field holding what you typed, the view list is one Tasks row with a quiet dot and number for Needs you, In progress and In review (none at zero, the chosen one marked current), Conversations keep the rooms, your own threads, one asking for you and the open one while threads between agents fold behind an 'N more' row with their unread total, and its Agents heading opens the Agents tab; agent-strip.test.tsx's one status: away is away even holding a task, a reachable agent on a task is working, what its harness says now wins; message-banner.test.tsx: the question waiting above the composer is only a one-line pointer in the feed, and moving in or out of the banner renders its row again; markdown.test.tsx's mentions: a member's @handle reads as @nickname with the handle as its title, never inside code or links, and a non-member's @ stays text; lib/mentions.test.ts: the composer writes a picked member as their nickname when it names only them (else their handle), and turns nicknames back into handles on send, never inside code; lib/lanes.test.ts: an agent's lane on a folded signed log (its tasks in progress and in review with their PRs, since when, what's queued, its last three moves, the lead watching the other open PRs, all from one task-to-PR map), every task's PRs in one pass matching each task's own feed (test/work.test.ts: notes, threads naming it, merged or closed later, GitHub branches, forged links), unread counts for every place in one pass matching each place's own (test/standup.test.ts), every task's live card in one pass matching each card asked alone (test/standup.test.ts: messages said, the last line by status, note then chat, its room, who's waited on), a message row's props compared by value with early exits (web message-memo.test.tsx); lib/asks.test.ts:
      Needs you holds only a person's question or a decision that holds an open task or ask (heldAsks; a done task holds nothing), a decision's kind in its label, who chose which option of an ask, by its words or its letter, and only from someone it was asked of, and Needs you's permission rows only from the fold's openAsks (permissionAsks: a forged copy, two asks at one seq, an ask past its deadline and a plain question make none); test/picture.test.ts: a person's picture (picture.set by that person only, never an agent's, a png, jpeg or webp of at most 24 KB in base64, quiet in the conversation, carried by snapshots), with test/github-link.test.ts: the linked account's avatar fetched by its id at 96px, at 64px when too big, null when not an image, and the link token handed only to the relay it was linked on, while that relay's /v1/config still names the same GitHub App, never to another relay after a switch, nor from a link made before the token was bound to its relay;
      Settings shows the link only on its own relay (desktop/src/github-flow.ts, desktop/src/ipc/github.ts)
      (test/create-seat.test.ts: never to clear the repo list), and web monogram.test.tsx: a face wears the channel's picture for that member, initials without one, an agent its harness's logo (a one-colour logo in the theme's ink, a plain terminal for a harness Kiwi doesn't know or none said; web lib/harness.test.ts: short names read as the product, every detected harness has a logo); test/icon.test.ts and web channel-icon.test.tsx: a channel's icon is the robot head its owner picked (by colour, only the twelve), an emoji or an image, a channel without one a robot head steady for its title, never the lead's, and the picker offers all twelve; test/personalities.test.ts: personalities on the person's account (the six presets valid, one of your own needs an id and one glyph, the list drops presets, repeats and broken ones, at most fifty, copies take a free id, the desktop snapshot hands the page only valid ones)).
      They cover pure modules: protocol and event validation, state folding, formatting, identity and signing, scopes and roles, routing and auth tables, error texts, the install scripts, hooks and harness detection (a Grok Bot from its VM's hostname, and its model grok-bot: test/routing.test.ts, test/runs.test.ts; the Codex, Gemini and Grok hook commands naming their harness with --harness, an older kiwi's unflagged ones reported by kiwi hooks status as from an older kiwi, and rewritten flagged by the next unflagged hook run unless KIWI_NO_HOOKS is set or that harness's hooks are off: test/hooks-harness.test.ts), the daemon waking a Grok Bot by POSTing to its routine's webhook with the Authorization header piped to kiwi wake webhook, never the message text, and never waking a Codex seat its loop holds until kiwi seat bind names the new thread, which the next message then wakes (wakePath in packages/core/src/wake.ts, pathOf in src/daemon/wake.ts, test/wake.test.ts), a held seat taken nowhere: not by a listener of its old session in another checkout, a duplicate record or a later join, no wake path while any record of it is held whoever's token the daemon has, its cursor moved forward only by the token's holder, and by no session object opened before a later hold even after another opens it, an old session's listener in another checkout not taking back a seat bound to a live session, and Kimi Code bound by its process (test/hold.test.ts: src/seats.ts, src/hold.ts, src/config/services.ts), the work kiwi loop starts a session for: the task the seat is doing first, then a round it owes, then its open tasks, then its task waiting on a verdict, then messages for it, a coder's session kept through a rejection, over when its task is done or moves, and given up for a round the seat owes while it waits on its verdict, a reviewer's over when its round closes, the first prompt naming the work and how it ends with re-entry after it (a task whose round is open told to wait and not to start it, a checkpoint asked for before each round, a self-reviewed task flagged, a review session leaving the seat's own tasks for their sessions), Claude Code's argv and its process's registry read for the session id and idle, Codex's argv, its new thread found as the one started after the launch whose rollout holds the launch's nonce, and its turn read from the rollout, Grok's argv, its session found as the one in the loop's folder started after the launch whose history holds the nonce, and its turn read from its update stream (turn_completed or the Stop hook's run), MiMoCode's argv with the model given or the one chosen in MiMoCode's model.json, its session found in its database as the top-level one in the loop's folder started after the launch with the nonce in a part, and idle once its last main message is a finished answer, Kimi Code's argv without a prompt, its screen read as ready, on its trust prompt or starting, its session found as the earliest one for the loop's folder started after the launch whose wire log holds the nonce, idle once its turn ended, and the kiwi listeners left under a session found by the process tree with their start times, only an exact pid and start time still running kiwi listen stopped, a gone or unkillable one skipped (with a fake kill), a kiwi listen told by the kiwi command's own words in linear time, and bracketed paste checkable from tmux 3.7 on (test/loop-work.test.ts: src/loop/work.ts, src/loop/claude.ts, src/loop/codex.ts, src/loop/grok.ts, src/loop/mimo.ts, src/loop/kimi.ts), the repo and branch an agent's card reads from its folder (test/routing.test.ts), an agent's message to #general past six lines or 600 characters getting one line that points it to its task's thread, a person's never, and #general being the main conversation of the general room (test/places.test.ts), the channel's repos and the flag on an agent from another repo (test/repos.test.ts), a closed task's digest, posted in the task's own thread and leaving out checkpoint notes (test/digest.test.ts, and the web's in task-actions.test.ts), GitHub webhooks into a channel's queue (test/github-relay.test.ts: signature, routing by connected repo, owner-only queue and ack, trimming), the owner's app draining that queue into github events and the PRs and checks they fold into, a started check included as state (queued or in progress on its PR, quiet and left out of the line and of Activity, web lib/activity.test.ts) while a late start of the same run or an older run never covers its result and a newer run or attempt does, by the run id and attempt the relay keeps (test/github-drain.test.ts, test/github-relay.test.ts), a PR's card taking GitHub's state, title and checks over the chat's guess (test/github-prs.test.ts, web pr-checks.test.tsx), a PR on a branch named with the channel's branch prefix and a task's number (T7-… with T) showing on that task, and with no prefix (the default) no branch linking any PR: branch.prefix.set, owner only, a short branch-safe prefix, carried by snapshots, read the same by kiwi task done's folders (test/github-branch.test.ts, test/task-areas.test.ts), the GitHub App's key, token and API calls against a fake GitHub: diffs for members, the kiwi/review check for the owner only (test/github-app.test.ts), which verdicts the owner's app posts as checks, once and without backfilling (test/github-review.test.ts, web review-checks.test.ts), a PR on a T<n>-… branch linked back to its task by one owner-only comment that names the task by its id, never its title, and only while the owner's per-channel Write to GitHub switch is on (github.write.set: off by default, owner only, carried by snapshots, and never for a PR GitHub reported before it was turned on)
      (github-app.test.ts, github-branch.test.ts, web review-checks.test.ts), ci.yml's concurrency giving each run on main a group of its own, so no push cancels one into a red ci-ok, while a pull request's newest push still cancels its older run, a GitHub issue imported as a task: issue refs, issue webhooks, the issues and closes they fold into, the issue closing on GitHub closing its task, and with Write to GitHub off (the default) the task only linking the issue, never commenting on or closing it, while on it the issue gets one `Linked to Kiwi task T7` comment and closes with its task, with no title or note, and nothing from before it went on (test/github-issues.test.ts), kiwi task add --issue and the owner closing the issue with Write to GitHub on, on a live relay against a fake GitHub (test/github-issues-live.test.ts), the issue routes, read for members and close for the owner only (github-app.test.ts), an old channel's roles read as personalities: the lead stays the lead, a free-text role becomes a Builder named after it with its rules as instructions, from the whole log or a snapshot, and a signed personality wins (test/roles-carry.test.ts), where a task comes from (task.add's from) and who has its context: agents ranked by lineage, who worked it and their queue, the busy rule, task who's text and --from on a live relay, and warm work: a card's fresh (the hook marks a reset on startup, clear and compact, not resume), when each member last touched a task (its thread, or its events from whoever is on it) and the warm bonus (test/task-who.test.ts), the folders a task changed: read from the agent's branch (named with the channel's branch prefix) against main in a throwaway git repo, kept on task done and review, borrowed from the parent or the task's text, and whoever changed them lately ranked for a task in them (test/task-areas.test.ts), which closes and issue links the owner's app makes, once and without backfilling (web review-checks.test.ts), a person assigning the suggested agent from the task view (web task-actions.test.ts), a run of GitHub's news folded into one line in the conversation (web github-line.test.ts), and in #general a run of task updates and done digests folded into one line with one entry per task, a digest named by its task and its PRs read from its PR part only (web lib/activity.test.ts), a reply's one-line quote (web quote.test.tsx), the history cache, a channel's warm copy for the session (web lib/channel/warm.test.ts: a revisit follows from what it holds with no second cache read or verify, and reads the cache on a gap or a stale copy), the channel clock (web lib/channel/clock.test.ts: it holds still within its interval so a re-render refolds nothing, and every subscriber to one interval shares one timer), the desktop app holding the relay's config and the linked account's repo list for a while and asking again after a failure (test/held.test.ts), the history cache writing a burst of messages as one IndexedDB write that keeps only the newest window (web lib/history.test.ts), and localStorage writes held in memory and written once per burst, flushed when the page hides, a dropped one never landing (web lib/write-behind.test.ts), the Electrobun test build's plain-JSON store (test/desktop-test-vault.test.ts: a first run until saved, then the same store from a 0600 file in a 0700 folder; a torn file, a list or null refused whole), the Electrobun shell's test driver (test/desktop-eb-driver.test.ts: a request is one JSON line with a numeric id, a function's source and its argument as JSON; test/eb-drive-linux.test.ts: on Linux the driver starts an app folder's bin/electrobun-launcher, past bin/launcher's environment allowlist, and stops what runs under that folder; the page posts the function's value, null for undefined, or its error, thrown at once or later, under the driver's own id; an argument with quotes, backslashes, line breaks and </script> arrives whole; the app's own RPC messages pass on to it