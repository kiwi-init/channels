    parts:
      - "desktop-distros"
    description: >-
      On two runners at once, Ubuntu 24.04 and 26.04 (a matrix, each part saving its own jev-ci pass;
      T2119: on 24.04 AppArmor's unprivileged user-namespace restriction keeps bubblewrap from setting up its loopback, so WebKitGTK's sandbox can't start there)
      (Electrobun builds only for the host it runs on), builds the Electrobun shell for Linux on WebKitGTK (issue #757, T444): web/dist, `bun run prepare:eb` (Hutch's devkit, cached under ~/.hutch), then `bun run build:eb` (electrobun build --env=stable), both through desktop/scripts/eb.ts, which runs only the Hutch desktop/electrobun-pins.json pins for this host (its archive and files checked by sha256), and desktop/scripts/eb-pins-check.ts linux-arm64 downloads the linux-arm64 Hutch archive and Electrobun's linux-arm64 core archive (only hashing them, never running anything) and fails unless the archive, its three files and the core's api tree match desktop/electrobun-pins.json, since no job builds on linux-arm64; scripts/eb-pre-build.ts fails unless the build runs that Hutch and desktop/.hutch/devkit/api hashes to its pin (the same tree for macOS and Linux) and makes the Mac iconset only on macOS, and scripts/eb-post-build.ts puts web/dist/index.html (checked by pageWithCsp) at Resources/app/page/ and the rest of web/dist in Resources/app/views/internal on either OS (the Mac's native shell, launcher and app-file pins only on macOS); on Linux it renames Electrobun's bin/launcher to bin/electrobun-launcher and compiles native/linux/kiwi-launcher.c into bin/launcher with cc -Wall -Wextra -Werror, so the entry, /usr/bin/channels-desktop and the AppImage's AppRun all start ours, which keeps the environment to an allowlist (the session, locale, input method, the desktop's launch token, proxies, the AppImage's own names, WebKit's DISABLE switches) and, when the desktop gave only XDG_ACTIVATION_TOKEN (as Plasma does), passes it on as DESKTOP_STARTUP_ID too, the only one GTK3 reads (T689) and sets BUN_RUNTIME_TRANSPILER_CACHE_PATH=0 before it execs Electrobun's (T1548).
      Then it rebuilds Electrobun's bin/libNativeWrapper.so from source (desktop/scripts/eb-native-wrapper.ts, T523), from Electrobun's package/src/native at the v2.0.4 commit, CEF 147's include/ and electrobun-dawn 0.2.6's include/, each downloaded once into ~/.cache/kiwi-eb-native (kept by actions/cache, keyed on desktop/electrobun-pins.json) and refused unless its tree hashes to its pin there, with desktop/native/linux/electrobun-wayland.patch then electrobun-tray.patch applied by patch --fuzz=0 (GDK's X11 backend is forced only when CEF is bundled, so WebKitGTK windows open on Wayland when WAYLAND_DISPLAY is set and on X11 otherwise; the AppIndicator library is loaded with dlopen when the first tray is made, and without libayatana-appindicator3.so.1 createTray returns no tray, T1065, so the AppImage starts on stock Fedora and Arch), compiled with Electrobun's own g++ flags (WebKitGTK, GTK, Ayatana AppIndicator's headers and PipeWire capture, so the job installs libayatana-appindicator3-dev and libpipewire-0.3-dev), and fails unless the build exports every function the shipped one does and readelf finds no AppIndicator among the libraries it links.
      Then desktop/scripts/linux-store-check.ts runs the app's store (store-eb.ts openEbStore with keySources' Linux keychain key) twice: inside dbus-run-session with a throwaway gnome-keyring unlocked, it plants the Electron app's kiwi-desktop Safe Storage password under Chromium's libsecret schema and its v11 kiwi-store.bin, and fails unless the first start imports it sealed under a store key the keyring keeps with its ready mark, both copies at 0600, the next start reads store v2 without importing again, and the old file stays; with no session bus, it fails unless the store opens in plain JSON at 0600 with the reason main.log gets (T1550).
      Then desktop/scripts/package-linux.ts makes today's two Linux downloads from Electrobun's plain stable artifact (never its self-extracting setup), without Electrobun's updater tools (bspatch, zig-zstd: only its Updater uses them, and these packages update as a whole file), its uninstall tool or its own Channels.desktop:
      Channels-<v>-linux-amd64.deb (package kiwi-desktop, so it replaces the Electron one, the app in /opt/Channels, /usr/bin/channels-desktop, a .desktop entry opening kiwi:// links, the hicolor icons, Depends on libwebkit2gtk-4.1-0, libgtk-3-0, libayatana-appindicator3-1, librsvg2-2, bubblewrap and xdg-dbus-proxy (WebKitGTK's sandbox), md5sums, an entry that runs /opt/Channels/bin/launcher, a preinst that drops the Electron deb's channels-desktop alternative and a postinst that restores the link if an old postrm took it) and Channels-<v>-linux-x86_64.AppImage (zstd squashfs in 128 KiB blocks on AppImage's type2 runtime, release 20251108 checked against its pinned sha256), and fails when either is over 40 MB. desktop/scripts/linux-packages-check.sh (which the release's desktop-linux-eb job runs too): scripts/appimage-squashfs.ts checks the AppImage's compression, and the job fails when the deb or the extracted AppImage lacks either launcher, Bun, Resources/app/bun/index.js and keys.js (the main bundle and the keys worker that Create channel needs, T92), Resources/kiwi.js (the kiwi CLI the app installs and its daemon keeper starts: scripts/build-cli.ts --js builds dist/kiwi.js before the build, and eb-post-build copies it on either OS, T2317), the page template (Resources/app/page/index.html), the page's assets, the .desktop entry or the icon, or carries what it leaves out (an index.html under views/ among it), or when the built bin/launcher, put in front of env, passes on LD_PRELOAD, LD_LIBRARY_PATH, BUN_OPTIONS, NODE_OPTIONS or GTK_MODULES (T1548), drops DESKTOP_STARTUP_ID, or fails to give a lone XDG_ACTIVATION_TOKEN (or one beside an empty DESKTOP_STARTUP_ID) to DESKTOP_STARTUP_ID (T689). desktop/scripts/linux-upgrade-check.sh (the release runs it too) then installs the v0.26.0 Electron deb (pinned by sha256) and this deb over it, and fails unless /usr/bin/channels-desktop leads to /opt/Channels/bin/launcher, the Electron app is gone, the entry runs the launcher and dpkg --verify finds nothing; it prints the runner's AppArmor user-namespace setting for WebKitGTK's sandbox.
      The job's apt packages come from .debs cached under the runner image's key (as .github/actions/browser does); the apt step has 15 minutes, and what it downloaded is saved even when it runs out of time, so a slow mirror costs one run, not every run.
      Then it starts the installed app (T1545): desktop/native/linux/kiwi-shell.c, built by eb-post-build into the bundle's bin as libkiwi-shell.so, is what main-eb.ts loads on Linux too. desktop/native/linux/kiwi-shell-test.c (run under Xvfb against the installed library, loaded after gtk_init as the app loads it) fails unless the program name and class are channels-desktop (the Wayland app_id, which matches channels-desktop.desktop), a microphone request on mock capture devices is denied (NotAllowedError) while a handler connected first to allow everything, as Electrobun's Allow/Block dialog is, never runs, a terminated web process reaches kiwi_watch_page's callback, kiwi_guard_downloads and kiwi_allow_only (T2071, as the Mac's from #776) hold even behind a handler that uses every navigation: the view stays on its page through a load elsewhere, a window.open and a target=_blank link (whether a window opens is Electrobun's create handler's call, which hands it to main as new-window-open, as on the Mac), an http: download is cancelled, the page's data: downloads are saved (counted only when they finish without failing: a cancelled one also emits finished) and a data: navigation becomes a download, not a page; kiwi_committed_url gives the page's committed URL (the bridge's trust check, from load-changed's commit as the Mac's from didCommitNavigation), and kiwi_sandbox_pages, asked from another thread, turns WebKitGTK's bubblewrap sandbox on for the default context and for every context made after it (T1193, since Electrobun makes its own for the persist:default partition, which is where the page runs; the test's view uses such a context, and its WebKitWebProcess must have a bwrap among its parents), and refuses by name if a WebKit process of the app's already runs, once a trial bwrap --unshare-all builds its namespaces (on 26.04), or leaves it off and says why (on 24.04, where it can't:
      WebKit's web process would otherwise die in bwrap's loopback setup and abort the app; also off without bwrap or xdg-dbus-proxy on PATH; main-eb prints the reason and writes it to main.log). desktop/native/linux/kiwi-scheme-test.c (under dbus-run-session and Xvfb, playing the desktop portal's Settings on that bus itself) fails unless kiwi_follow_color_scheme, asked from another thread, reads org.freedesktop.appearance color-scheme once and turns GTK's gtk-application-prefer-dark-theme on for 1 (GNOME's Dark style, which alone leaves WebKitGTK light), so a page's prefers-color-scheme is dark; ignores a change in another namespace; follows SettingChanged to 2 (light), back to 1 and to 0 (GTK's own setting from before) in the open page, live, with no reload (T768). desktop/native/linux/kiwi-tray-test.c (under dbus-run-session, playing org.kde.StatusNotifierWatcher itself) fails unless kiwi_tray_host, asked from another thread, finds no tray host with no watcher on the bus or with a watcher whose IsStatusNotifierHostRegistered is false, and finds one once it is true; where there is none, closing the window minimizes it instead of hiding it (T770).
      Then a step moves libayatana-appindicator3.so.1 out of the system's library folder, as stock Fedora and Arch have it (T1065): readelf must find no AppIndicator among libNativeWrapper.so's libraries, kiwi-tray-test.c with no-indicator must find no tray host even with a watcher whose host is registered (no tray icon can show, so closing minimizes), and eb-linux-start.sh must start the installed app with its window as above; the library goes back after.
      desktop/native/linux/kiwi-shortcuts-test.c (under Xvfb) fails unless kiwi_window_keys, asked from another thread, gives the window the app menu's shortcuts, which Electrobun leaves out on Linux, with a text field focused, so Ctrl+=, Ctrl++ and Ctrl+keypad + make text bigger, Ctrl+- and Ctrl+keypad - smaller, Ctrl+0 normal, Ctrl+R reloads, Ctrl+Q quits, Ctrl+W closes the window and F11 toggles full screen, each as the action number app-menus.ts's shortcutAction reads, while r, q and = without Ctrl type into the field (T769). desktop/native/linux/kiwi-look-test.c (under Xvfb on a 1280x720 screen, a 1080p laptop at 150%) fails unless kiwi_window_look, the Mac's window look now on Linux too, asked from another thread, opens the 1200x800 window within 90% of the screen, keeps it at its 720x480 minimum when asked for 300x200, and paints the window's own background #f2f2f5, and #000000 once GTK prefers dark, as the page does (T771). desktop/native/linux/kiwi-notify-test.c (under dbus-run-session and Xvfb, playing org.freedesktop.Notifications itself) fails unless kiwi_notify and kiwi_notify_clicks, asked from another thread, send one notification from app Channels with icon and desktop-entry channels-desktop, a default action and its body escaped for a server that reads markup, instead of Electrobun's notify-send (which the deb doesn't pull in and which names it notify-send); ignore another app's notification and another action; on a click on ours run the callback once and hand the window the notification's ActivationToken, so the window shown again carries it as _NET_STARTUP_ID (xdg-activation on Wayland); and ignore its id once it closed (T772). desktop/native/linux/kiwi-paste-test.c (under Xvfb, with a 4x3 image on the clipboard) fails unless kiwi_watch_paste and kiwi_take_paste, asked from another thread, serve nothing with no paste key, the clipboard's image as a PNG right after Ctrl+V or Shift+Insert on the web view, once per key, and nothing after Ctrl+Shift+V (paste as text), a typed v or 2.5 s, since WebKitGTK's paste event carries no image and the composer asks main for it (T896). desktop/scripts/eb-linux-start.sh then starts /opt/Channels/bin/launcher under Xvfb with a temp HOME and fails unless a window with WM_CLASS Channels (Electrobun's own class, the entry's StartupWMClass) titled Channels opens within 30 s, a WebKitWebProcess of the app's own runs 5 s later with a bwrap among its parent processes (any bwrap of the app's session isn't enough: on 26.04 glycin decodes the tray icon in a bwrap of its own) on 26.04, and on 24.04 without one while the app says why, its window opened within 90% of the 1280x800 screen and at least 720x480 (T771), its rules canary was reported refused (the app quits otherwise) and its download and navigation guards installed (T2071), the app is still up, and nothing of it is left 10 s after SIGTERM; it starts the AppImage (--appimage-extract-and-run) the same way.
      Under Xvfb, smoke-eb also presses Ctrl+= and then Ctrl+0 on the window with xdotool and fails unless the page's --text-scale grows and then resets, the whole way from GTK's accelerator to the page (T769).
      On 26.04 it then drives the app as desktop / mac does (T1552): a test build (`bun scripts/eb.ts build --env=dev` with CHANNELS_EB_TEST=1, which gets the .test id), desktop/scripts/eb-driver-check.ts (on Linux against the installed deb in /opt/Channels: no test driver, relay override or plain-JSON test store in its code, all three in the test build's), desktop/scripts/smoke-eb.ts under Xvfb (eb-drive.ts starts a Linux app folder's bin/electrobun-launcher, since bin/launcher keeps KIWI_EB_* out of the environment, with HOME and the XDG dirs in a temp root; its web-process check stops WebKitWebProcess and reads main.log under .local/state, and the kiwi daemon must answer on the test KIWI_HOME and the kiwi CLI be installed in the test HOME's .kiwi/bin, as on the Mac, T2317).
      On 26.04 the same smoke-eb then runs in a Wayland session as KDE and GNOME run one (T434): a headless weston with XWayland (weston --backend=headless --xwayland, its socket in a 0700 XDG_RUNTIME_DIR under the runner's temp dir), WAYLAND_DISPLAY set, DISPLAY on that XWayland, XDG_SESSION_TYPE=wayland and no Xvfb, so a break in the Wayland session fails the job (#847's reporter was on Wayland), with weston's log and the app's own output printed when it does.
      In both sessions, with no tray host on the session bus, smoke-eb closes the window through the test driver's closeWindow (win.requestClose, so the app's will-close handler decides) and fails unless the driver's window answer says it is still visible, minimized rather than hidden with nothing on screen to bring it back (T770).
      In the XWayland session desktop/scripts/eb-wayland-start.sh also starts the installed app (bin/electrobun-launcher with WAYLAND_DEBUG=client and a temp HOME) and fails unless it opens an xdg_toplevel within 30 s (printing its app_id and title), its WebKitWebProcess runs 5 s later, XWayland holds no window of class Channels (with both there, the app picks Wayland), the app is still up, and nothing of it is left 10 s after SIGTERM.
      smoke-eb and eb-wayland-start.sh run again in a Wayland-only session (T523), a headless weston without --xwayland at --scale=2 (2560x1600), DISPLAY and XAUTHORITY unset, failing if any Xwayland runs, so the app has no X server to fall back to; there eb-wayland-start.sh is given the output scale and fails unless the compositor sent wl_output.scale(2) and the app drew at buffer scale 2 (T840, since GTK3 draws at the integer scale and the compositor scales it down for 125% and 150%, which KWin and GNOME were checked to do, so a window drawn at 1 and enlarged, the blurry case, fails the job).
      Then dpkg --purge must leave nothing behind: no /opt/Channels, /usr/bin/channels-desktop, entry or icons; the v0.26.0 deb is fetched into RUNNER_TEMP, so it is never uploaded.
      A last step, which only prints and never fails, records what bwrap can do under the runner's AppArmor (the restriction, the profiles naming bwrap or userns, and bwrap and unshare -Urn with and without a scratch unconfined profile granting userns), for a deb profile that brings the sandbox to 24.04 later.
      As on the Mac, eb-post-build bundles src/keys-worker.ts into app/bun/keys.js and fails unless that bundled keys worker answers a page's request, before the Linux part ends the script (T92: 0.27.0 to 0.27.2 shipped the Linux app without it, so Create channel failed); smoke-eb's first run (a person, a channel, a message) fails the job on Linux again.
      Each image's packages are kept as linux-packages-<image> for 3 days.
      Then desktop/scripts/wayland-check/kwin.sh runs the test app in a headless KWin with no XWayland (kwin_wayland --virtual, DISPLAY unset, failing if an Xwayland ran) beside a GTK helper app that is a native Wayland client, driving both with real input through KWin's fake input (desktop/scripts/wayland-check/kwin-input.c) and placing them with KWin scripting (kwin.py), and desktop/scripts/wayland-check.ts fails unless text pastes into the composer from the helper, an image the helper copies pastes into the composer as an attachment (pasted.png, through main and kiwi_take_paste, since WebKitGTK's paste event carries nothing, T896), the composer's Ctrl+C and a message's Copy text button reach the helper, an image the page writes with navigator.clipboard.write reaches it, a PNG dragged from the helper onto the composer is attached (WebKitGTK hands the page a dropped file only as a file URL, so desktop/native/linux/kiwi-shell.c keeps the dropped paths and the composer takes them through takeDroppedFiles, T895), and a file dropped elsewhere leaves the page where it was.
      Then desktop/native/linux/kiwi-badge-test.c, on its own session bus, fails unless kiwi_badge sends the Unity LauncherEntry Update that Plasma's task manager and GNOME's docks read, for application://channels-desktop.desktop: a count of 3 shown, and 0 or a negative count hidden at 0 (the page's news count, T971).
      Its part desktop / distros (T960) takes the AppImage built on 24.04 into fedora:44 and archlinux:latest containers (privileged, so bwrap gets the unprivileged user namespaces Fedora and Arch allow) and runs desktop/scripts/distro-check/check.sh, which fails on any FAIL line it collects.
      With only the packages Channels names installed (no libayatana-appindicator), ldd must find every library the app's binaries link, in the system or shipped beside them in Channels/bin (libasar.so, which libNativeWrapper.so links).
      Under headless weston on native Wayland, desktop/scripts/distro-check/session.sh starts the AppImage with --appimage-extract-and-run, through AppRun and kiwi-launcher, three times: with no Secret Service and no ayatana, then with ayatana and GNOME Keyring, then with KWallet's Secret Service (ksecretd, its wallet made and opened at login as Plasma's kwallet-pam does, through desktop/scripts/distro-check/kwallet-login.py).
      Each start must open an xdg_toplevel (seen through weston-debug proto) within 60 s, keep running 15 s, run its WebKitWebProcess with a bwrap among its parents, register a tray icon with a StatusNotifierWatcher only when ayatana is installed, keep its store key in the Secret Service when one runs (secret-tool search service Channels) or say in main.log that it keeps it unencrypted when none does, and stop (exited processes the container's init leaves unreaped don't count) within 10 s of SIGTERM.
      kiwi-tray-test (with and without ayatana), kiwi-scheme-test and kiwi-notify-test are built in each container and run against the AppImage's libkiwi-shell.so.
      A run dispatched with update_from=VERSION also runs desktop/scripts/distro-check/update.sh: that release's AppImage must stage the latest release's AppImage matching its SHA256SUMS, replace itself with it on quitting, and the updated AppImage must start.
      Its shards save desktop-linux's pass marker as 3of4 and 4of4, so desktop-linux counts as passed only once both distros pass too.
  cli-macos:
    name: cli / macos
    inputs:
      - ".github/workflows/release-build.yml"
      - "bun.lock"
      - "bunfig.toml"
      - "desktop/build/entitlements.app.plist"
      - "desktop/src/**"
      - "package.json"
      - "packages/core/**"
      - "site/install"
      - "site/install.sh"
      - "src/**"
      - "test/**"
      - "web/package.json"
    always:
      - "scripts/build-cli.ts"
      - "scripts/ci-flows.ts"
      - "scripts/ci-tests.ts"
      - "scripts/cli-bundle.ts"
    question: >-
      Could this change to `file` make the job described in `job` fail on macOS, or fail to
      cross-compile a darwin target, while the same tests and the Linux build pass
      in test / unit, test / flows and build / bundles?
    criteria:
      true: >-
        The change touches behavior that differs on macOS: tmp paths behind the /var to
        /private/var symlink, realpath or process.cwd() compared with a tmp path, home under
        /Users, a case-insensitive file system, a unix socket path near 104 bytes, BSD shell
        tools, signals, child processes, file watching, the name the CLI prints for itself, or
        the darwin build targets, in a way that could fail only there.
      false: >-
        The change behaves the same on macOS as on Linux: a failure it causes would fail the
        Linux jobs too, which catch it, or it can't fail at all.
    description: >-
      On one macOS runner, with Homebrew's tmux installed first (3.7 or newer, so the tmux tests and kiwi loop --harness kimi's typed-prompt flow run here, which the Linux runner's tmux 3.6a skips), does what the release's cli job does: runs the whole bun test suite (every test/*.test.ts and web/src test, the agent flows included) with bun test --parallel so each file gets a fresh global as on Linux (one process for every file once let a test's SIGINT end the run early, exit 0, after 128 of 328 files), and fails when the run ends before every file ran.
      It then compiles the kiwi CLI for darwin-arm64, darwin-x64, linux-x64 and linux-arm64 with scripts/build-cli.ts (with bunfig.toml and .env autoload off), ad-hoc signs the macOS binaries and runs `kiwi --version`, then runs it again from a folder whose bunfig.toml preloads a file and fails if that file ran (T1062).
      The same tests run on Linux in test / unit and test / flows, so this job is for what fails only on macOS: paths (os.tmpdir() is under /var, a symlink to /private/var, so process.cwd() and realpath spell a folder differently from mkdtemp; home is under /Users; the file system ignores case; a unix socket path is capped at 104 bytes), how the CLI names its own command in the text it prints, BSD versions of shell tools, process, signal and file-watching differences, and a build target that fails to compile.
      Fails if any test fails on macOS or a target doesn't build.

  ios:
    name: ios / build
    inputs:
      - "bun.lock"
      - "desktop/package.json"
      - "ios/**"
      - "package.json"
      - "web/package.json"
    imports_from:
      - "ios/engine/main.ts"
    always:
      - "packages/core/package.json"
    description: >-
      On a macOS runner with the newest Xcode installed there, checks the iPhone app in ios/. swift-format lint --strict (ios/.swift-format: 4-space indent, 180 columns, lowerCamelCase names, no force unwraps or force try) over ios/Channels and ios/ChannelsUITests.
      Then xcodebuild builds the Channels scheme for generic iOS devices, Release, unsigned: the Swift sources (SwiftUI, Swift 6 with complete strict concurrency, so a value that isn't Sendable crossing an actor fails), the asset catalog, and the "Bundle the engine" build phase, which runs bun build on ios/engine/main.ts (browser target, IIFE) into the app.
      The engine imports @kiwi/core, the desktop's Keyring, seats, bridge types, remote asks and launch checks, and a few pure web/src/lib modules (asks, harness names, presence, base-plan, fold-roster, trim, preview, task-actions, approval-tend, launch-follow), so a change there that breaks the bundle fails here.
      The New Agent sheet (ios/Channels/Views/NewAgent.swift) compiles here too: computer, harness, folder and options pushed in a NavigationStack, and Face ID before a Bypass launch.
      Fails on a lint finding, a Swift compile error, a missing asset or Info.plist key the build needs, or a bundle error.
      It does not run the app or the engine.
      Of the dependency manifests, the bundle takes only effect (desktop/src/keyring.ts and the web/src/lib modules import it) and the @kiwi/core workspace's exports map from them: a change to another package, a script, the Electron build settings in desktop/package.json or a desktop-only dependency (Electron, Electrobun) in bun.lock doesn't reach the iPhone app.

  ios-gestures:
    name: ios / gestures
    inputs:
      - "bun.lock"
      - "desktop/package.json"
      - "ios/**"
      - "package.json"
      - "web/package.json"
    imports_from:
      - "ios/engine/main.ts"
      - "ios/scripts/fixture.ts"
    always:
      - "packages/core/package.json"
    description: >-
      On a macOS runner with the newest Xcode, boots an iPhone simulator on the newest iOS runtime installed and runs the Channels scheme's tests: ios/ChannelsUITests, XCUITest driving the Debug app with real touches.
      The target's "Make the fixture" build phase runs ios/scripts/fixture.ts, which folds a signed log of twelve messages (six long ones from agents) and writes the engine's own roomView of it, so the canned channel always has the wire shape the app decodes; a Debug build given it in CHANNELS_FIXTURE shows that channel instead of reading the keychain (ios/Channels/Model/AppModel.swift).
      GestureTests opens the channel from the list eight times, fresh each time, and 0.3 or 0.8 s after the tap drags 200 pt down from the middle right of the screen, on a message bubble: every drag has to scroll the conversation more than 100 pt (a SwiftUI DragGesture on each row swallowed about half of them right after opening: 0 pt), and so does the same drag beside the bubbles.
      Swiping a bubble right has to start a reply ("Reply to …" in the composer) without leaving the conversation (the Rightward pan in Conversation.swift).
      NewAgentTests skips here: it walks the real New Agent sheet only on a linked phone, run by hand with TEST_RUNNER_KIWI_DEVICE_FLOW=1 (and TEST_RUNNER_KIWI_DEVICE_LAUNCH=1 to start a real agent), and attaches a screenshot of each step.
      The drags' distances are printed as GESTURE lines.
      Each drag waits up to 5 s after the tap for a bubble to show away from the screen's edges, printing how long when it waited, and one that finds none prints what was on screen and attaches a screenshot to the result bundle, which the job uploads as ios-gestures-xcresult when it fails (T568).
      Fails on a compile error in the app or the tests, a fixture the app can't decode, or any of those gestures failing.
      Of the dependency manifests, the engine and the fixture take only effect and the @kiwi/core workspace's exports map from them: a change to another package, a script, the Electron build settings in desktop/package.json or a desktop-only dependency in bun.lock doesn't reach the app or its tests.

  android:
    name: android / build
    inputs:
      - "android/**"
      - "bun.lock"
      - "desktop/package.json"
      - "ios/engine/**"
      - "ios/scripts/**"
      - "package.json"
      - "web/package.json"
    imports_from:
      - "android/scripts/bridge-check.ts"
      - "ios/engine/main.ts"
      - "ios/scripts/dev-channel.ts"
    always:
      - "packages/core/package.json"
    description: >-
      On an Ubuntu runner with JDK 17 and the preinstalled Android SDK, builds the Android app in android/ with its Gradle wrapper (Gradle 8.14.3, Android Gradle plugin 8.13, Kotlin 2.2, Jetpack Compose; versions in android/gradle/libs.versions.toml) with `./gradlew assembleRelease lintRelease`.
      The app's Gradle build runs bun build on ios/engine/main.ts (browser target, IIFE) into the APK's assets, the same engine the iPhone app bundles, so a change to the engine, @kiwi/core, the desktop Keyring, seats or bridge types, or the pure web/src/lib modules the engine imports that breaks the bundle fails here.
      Then the Kotlin sources compile (strict types, kotlinx serialization models of the engine's wire in android/app/.../engine/Wire.kt), R8 shrinks and the release APK is signed with the debug key in android/app/debug.p12 (the same key in every build, so a new APK installs over the last one), and Android lint runs on the release variant with abortOnError (manifest, resources, API levels, the targetSdk).
      Fails on a bundle error, a Kotlin compile error, a missing resource or manifest entry, an R8 failure, or a lint error.
      Uploads app-release.apk and the lint report as the channels-android artifact.
      Then android/app/src/test/.../ScreensTest.kt draws each screen (link, the channel list, #general, the lead chat, details, details with only a review waiting, the five steps of New agent, settings) on the JVM with Robolectric's native graphics and Roborazzi (`recordRoborazziRelease`, a Pixel 7 sized screen on Android 14, since Robolectric needs Java 21 for 15 and up and the build runs on 17), once light and once dark, from the sample channels in Sample.kt (a question, a review, reactions, a quote, code, an event line), and uploads the PNGs as the android-screens artifact.
      A screen that throws while it's drawn fails the job; the pictures themselves aren't compared with saved ones.
      Then android/scripts/bridge-check.ts runs the engine the way Engine.kt hosts it: the bundle loaded in headless Chromium at http://localhost/, the PROBE and call wrapper taken from Engine.kt's source, a kiwiAndroid object standing in for the bridge.
      It links to a channel from ios/scripts/dev-channel.ts (a local relay, agents, tasks, a question) and checks the probe passes (secure context, Ed25519, X25519), linkAsk and linkWait, start, that room pushes arrive with every field Wire.kt requires, and that send, a lead-chat send, react and answer come back.
      Fails on any of those.
      It does not run the Android app itself.
      Of the dependency manifests, the bundle takes only effect and the @kiwi/core workspace's exports map from them: a change to another package, a script, the Electron build settings in desktop/package.json or a desktop-only dependency (Electron, Electrobun) in bun.lock doesn't reach the Android app.
