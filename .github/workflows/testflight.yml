name: testflight

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to TestFlight (off exports and checks the signed app only, from any branch)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: true

jobs:
  upload:
    name: testflight / upload
    if: github.repository == 'kiwi-init/channels' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && !inputs.upload))
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      DESTINATION: ${{ github.event_name == 'workflow_dispatch' && !inputs.upload && 'export' || 'upload' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: newest xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: app store connect key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          test -n "$APPLE_API_KEY_P8" || { echo "::error::APPLE_API_KEY_P8 is not set"; exit 1; }
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - name: archive, unsigned
        run: |
          xcodebuild -project ios/Channels.xcodeproj -scheme Channels -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Channels.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/ios" \
            CODE_SIGNING_ALLOWED=NO \
            AppIdentifierPrefix=57249C654W. \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive
      - name: give the archive its entitlements
        run: |
          app="$RUNNER_TEMP/Channels.xcarchive/Products/Applications/Channels.app"
          for entitlements in ios/Channels/Channels.entitlements ios/ChannelsLive/ChannelsLive.entitlements; do
            sed -e 's/$(AppIdentifierPrefix)/57249C654W./g' -e 's/<string>development</<string>production</' "$entitlements" > "$RUNNER_TEMP/$(basename "$entitlements")"
          done
          find "$app" -depth \( -name '*.dylib' -o -name '*.framework' \) -exec codesign -f -s - {} \;
          codesign -f -s - --entitlements "$RUNNER_TEMP/ChannelsLive.entitlements" "$app/PlugIns/ChannelsLive.appex"
          codesign -f -s - --entitlements "$RUNNER_TEMP/Channels.entitlements" "$app"
      - name: sign in the cloud and ${{ env.DESTINATION }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>DESTINATION</string>
            <key>teamID</key><string>57249C654W</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          sed -i '' "s/DESTINATION/$DESTINATION/" "$RUNNER_TEMP/export.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Channels.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER"
          if [ "$DESTINATION" = upload ]; then
            echo "Build ${{ github.run_number }} is on its way to TestFlight" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: the signed app keeps its entitlements
        if: env.DESTINATION == 'export'
        run: |
          cd "$RUNNER_TEMP" && unzip -q export/*.ipa -d ipa
          app=$(ls -d ipa/Payload/*.app)
          for bundle in "$app" "$app"/PlugIns/*.appex; do
            echo "== $bundle"
            codesign -dvv "$bundle" 2>&1 | grep -E "Authority=|TeamIdentifier="
            codesign -d --entitlements - --xml "$bundle" | plutil -p -
          done
          codesign -d --entitlements - --xml "$app" | plutil -p - | grep -q '"aps-environment" => "production"'
          codesign -d --entitlements - --xml "$app" | plutil -p - | grep -q 'com.kiwiinit.channels.live'
          codesign -d --entitlements - --xml "$app"/PlugIns/ChannelsLive.appex | plutil -p - | grep -q 'com.kiwiinit.channels.live'
          codesign -dvv "$app" 2>&1 | grep -q "Authority=Apple Distribution"
          for bundle in "$app" "$app"/PlugIns/ChannelsLive.appex; do
            plutil -extract KiwiLiveKeychain raw "$bundle/Info.plist" | grep -qx "57249C654W.com.kiwiinit.channels.live"
          done
      - name: forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
