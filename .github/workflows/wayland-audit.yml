name: mac-audit

on:
  push:
    branches: [T689-wayland-audit]

permissions:
  contents: read
  actions: read

jobs:
  mac:
    name: Mac audit, the 0.27.5 release app
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: audit
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: the 0.27.5 release zip, as a person downloads it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.27.5 -R "${{ github.repository }}" -p 'Channels-0.27.5-mac-arm64.zip' -D "$RUNNER_TEMP/mac"
          ditto -x -k "$RUNNER_TEMP/mac/Channels-0.27.5-mac-arm64.zip" "$RUNNER_TEMP/app"
          codesign -dv "$RUNNER_TEMP/app/Channels.app" 2>&1 | grep -E "Authority|TeamIdentifier" | head -3
          spctl -a -vv "$RUNNER_TEMP/app/Channels.app" 2>&1 | head -3 || true
      - name: menus, shortcuts, window restore and kiwi:// links
        run: bun audit/.release-check/mac-audit.ts "$RUNNER_TEMP/app/Channels.app"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac-audit
          path: ${{ runner.temp }}/mac-audit.json
          retention-days: 3
