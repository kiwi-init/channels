name: release-check

on:
  push:
    branches: [T689-wayland-audit]

permissions:
  contents: read
  actions: read

env:
  REHEARSAL_RUN: "40133920995"

jobs:
  mac:
    name: release check, the shipped Mac app starts
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: audit
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: the rehearsal's Mac zip, unpacked as a person would
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$REHEARSAL_RUN" -R "${{ github.repository }}" -n rehearsal-desktop-mac-eb -D "$RUNNER_TEMP/mac"
          ditto -x -k "$(ls "$RUNNER_TEMP"/mac/Channels-*-mac-arm64.zip)" "$RUNNER_TEMP/app"
          codesign --verify --deep --strict "$RUNNER_TEMP/app/Channels.app" && echo "signature verifies"
      - name: the shipped app's launcher starts it and keeps the caller's environment out
        if: ${{ !cancelled() }}
        run: bun desktop/scripts/eb-env-check.ts "$RUNNER_TEMP/app/Channels.app"
      - name: the shipped app opens its window with its own web content
        if: ${{ !cancelled() }}
        run: bun audit/.release-check/mac-start.ts "$RUNNER_TEMP/app/Channels.app"

  cli-darwin-x64:
    name: release check, darwin-x64 CLI
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: the rehearsal's CLIs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$REHEARSAL_RUN" -R "${{ github.repository }}" -n rehearsal-cli -D "$RUNNER_TEMP/cli"
      - name: the darwin-x64 CLI, from each download, runs kiwi demo
        run: bash .release-check/cli.sh "$RUNNER_TEMP/cli" darwin-x64
