name: release-build

on:
  workflow_call:
    inputs:
      rehearsal:
        type: boolean
        default: false
    secrets:
      MAC_CERT_P12_BASE64:
        required: false
      MAC_CERT_PASSWORD:
        required: false
      APPLE_API_KEY_P8:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false

permissions:
  contents: read

env:
  ELECTRON_LAST_MAC_ARM64: v0.26.0
  UPSTREAM_ELECTROBUN_LAST_MAC_ARM64: v2026.10.6

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Stamp the tag's version and changelog
        env:
          REHEARSAL: ${{ inputs.rehearsal }}
        run: |
          tag="$GITHUB_REF_NAME"
          if [ "$REHEARSAL" = true ]; then tag=$(bun scripts/stamp.ts --next); echo "rehearsal: stamping $tag"; fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          bun scripts/stamp.ts "$tag"
          git diff > "$RUNNER_TEMP/stamp.patch"
          git diff --stat

      - name: Check the version matches the tag
        run: |
          v=$(bun -e 'console.log((await import("./src/version.ts")).VERSION)')
          pkg=$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).version)')
          app=$(bun -e 'console.log(JSON.parse(await Bun.file("desktop/package.json").text()).version)')
          test "v$v" = "$TAG" || { echo "src/version.ts says $v, tag is $TAG"; exit 1; }
          test "$pkg" = "$v" || { echo "package.json says $pkg, src/version.ts says $v"; exit 1; }
          test "$app" = "$v" || { echo "desktop/package.json says $app, src/version.ts says $v"; exit 1; }

      - name: Check the changelog has this version
        run: bun scripts/changelog.ts --notes "$TAG" > /dev/null

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stamp
          path: ${{ runner.temp }}/stamp.patch
          overwrite: true

  cli:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/stamp

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Build
        run: |
          mkdir -p dist
          for t in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            bun scripts/build-cli.ts --target "bun-$t" --outfile "dist/kiwi-$t"
          done
          codesign --force --sign - dist/kiwi-darwin-arm64 dist/kiwi-darwin-x64
          ./dist/kiwi-darwin-arm64 --version

      - name: Pack
        run: |
          cd dist
          for f in kiwi-*; do
            gzip -9 -n -k "$f"
            xz -9 -T0 -k "$f"
          done
          bun ../scripts/cli-downloads.ts .

      - name: Upload
        if: ${{ !inputs.rehearsal || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.rehearsal && 'rehearsal' || 'release' }}-cli
          retention-days: ${{ inputs.rehearsal && 3 || 0 }}
          path: dist/kiwi-*
          overwrite: true

  desktop-mac-eb:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60
    environment: ${{ (!inputs.rehearsal || github.ref == 'refs/heads/main') && 'release' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/stamp

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.hutch
          key: hutch-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/electrobun-pins.json') }}

      - name: Build the renderer
        run: bun run ui:build

      - name: Electrobun toolchain
        working-directory: desktop
        timeout-minutes: 5
        run: for i in 1 2 3; do bun run prepare:eb && exit 0; echo "electrobun prepare failed ($i of 3)"; [ "$i" -lt 3 ] && sleep 20; done; exit 1

      - name: The kiwi CLI the app bundles
        run: mkdir -p dist && bun scripts/build-cli.ts --js dist/kiwi.js

      - name: Build
        working-directory: desktop
        env:
          CHANNELS_EB_RELEASE: "1"
          DASH_RELEASE_OFFLINE: "1"
        run: bun run build:eb

      - name: Sign, notarize and package
        shell: bash
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          REHEARSAL: ${{ inputs.rehearsal }}
        run: |
          if [ -n "$MAC_CERT_P12_BASE64" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            kc="$RUNNER_TEMP/kiwi-eb-signing.keychain-db"
            kcpass=$(openssl rand -base64 32)
            security create-keychain -p "$kcpass" "$kc"
            security set-keychain-settings -lut 21600 "$kc"
            security unlock-keychain -p "$kcpass" "$kc"
            printf '%s' "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -f pkcs12 \
              || { echo "the certificate didn't import: check MAC_CERT_P12_BASE64 and MAC_CERT_PASSWORD"; exit 1; }
            rm -f "$RUNNER_TEMP/cert.p12"
            curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
            security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$kc" -T /usr/bin/codesign || true
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpass" "$kc" > /dev/null
            security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
            ids=$(security find-identity -v -p codesigning "$kc")
            [[ "$ids" == *"Developer ID Application"* ]] \
              || { echo "no Developer ID Application identity in the certificate (export it from My Certificates, with its key)"; exit 1; }
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"
            export EB_SIGN_KEYCHAIN="$kc" APPLE_API_KEY="$RUNNER_TEMP/apple-api-key.p8"
            echo "EB_SIGNED=1" >> "$GITHUB_ENV"
          fi
          unset MAC_CERT_P12_BASE64 MAC_CERT_PASSWORD APPLE_API_KEY_P8
          bun desktop/scripts/eb-release.ts desktop/release-eb out

      - name: No test code in what ships
        run: bun desktop/scripts/eb-driver-check.ts --release out/Channels-*-mac-arm64.zip out/Channels-*-mac-arm64.dmg

      - name: Update from the Electron app and from the last release on upstream Electrobun
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for from in "$ELECTRON_LAST_MAC_ARM64" "$UPSTREAM_ELECTROBUN_LAST_MAC_ARM64"; do
            old="Channels-${from#v}-mac-arm64.zip"
            gh release download "$from" --repo "$GITHUB_REPOSITORY" --pattern "$old" --dir "$RUNNER_TEMP/update-from/$from"
            bun desktop/scripts/eb-update-rehearsal.ts "$RUNNER_TEMP/update-from/$from/$old" out/Channels-*-mac-arm64.zip
          done

      - name: The app makes a channel and sends
        run: |
          ditto -x -k "$(ls out/Channels-*-mac-arm64.zip)" "$RUNNER_TEMP/probe"
          app="$RUNNER_TEMP/probe/Channels.app/Contents"
          bun desktop/scripts/package-probe.ts "$app/MacOS/bun" "$app/Resources/kiwi.js" "$app/Resources/app/bun/keys.js"
          rm -rf "$RUNNER_TEMP/probe"

      - name: Upload
        if: ${{ !inputs.rehearsal || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.rehearsal && 'rehearsal' || 'release' }}-desktop-mac-eb
          retention-days: ${{ inputs.rehearsal && 3 || 0 }}
          path: out/*
          if-no-files-found: error
          overwrite: true

  desktop-linux-eb:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/stamp

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: WebKitGTK, its sandbox, Xvfb and the AppImage tools
        timeout-minutes: 15
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libpipewire-0.3-dev bubblewrap xdg-dbus-proxy xvfb xauth xdotool x11-utils squashfs-tools

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.hutch
          key: hutch-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/electrobun-pins.json') }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/kiwi-eb-native
          key: eb-native-${{ hashFiles('desktop/electrobun-pins.json') }}

      - name: Build the renderer
        run: bun run ui:build

      - name: Electrobun toolchain
        working-directory: desktop
        timeout-minutes: 5
        run: for i in 1 2 3; do bun run prepare:eb && exit 0; echo "electrobun prepare failed ($i of 3)"; [ "$i" -lt 3 ] && sleep 20; done; exit 1

      - name: The kiwi CLI the app bundles
        run: mkdir -p dist && bun scripts/build-cli.ts --js dist/kiwi.js

      - name: Build
        working-directory: desktop
        env:
          CHANNELS_EB_RELEASE: "1"
          DASH_RELEASE_OFFLINE: "1"
        run: bun run build:eb

      - name: AppImage, at most 60 MB
        run: bun desktop/scripts/package-linux.ts desktop/release-eb out

      - name: No test code in what ships
        run: bun desktop/scripts/eb-driver-check.ts --release out/Channels-*-linux-x86_64.AppImage

      - name: The AppImage holds the app
        run: bash desktop/scripts/linux-packages-check.sh out

      - name: The AppImage makes a channel and sends
        run: |
          img="$PWD/$(ls out/Channels-*-linux-x86_64.AppImage)"
          (cd "$RUNNER_TEMP" && "$img" --appimage-extract > /dev/null)
          root="$RUNNER_TEMP/squashfs-root/Channels"
          bun desktop/scripts/package-probe.ts "$root/bin/bun" "$root/Resources/kiwi.js" "$root/Resources/app/bun/keys.js"
          rm -rf "$RUNNER_TEMP/squashfs-root"

      - name: The AppImage starts
        run: xvfb-run -a -s "-screen 0 1280x800x24" bash desktop/scripts/eb-linux-start.sh "$PWD/$(ls out/Channels-*-linux-x86_64.AppImage)" unsandboxed --appimage-extract-and-run

      - name: Upload
        if: ${{ !inputs.rehearsal || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.rehearsal && 'rehearsal' || 'release' }}-desktop-linux-eb
          retention-days: ${{ inputs.rehearsal && 3 || 0 }}
          path: out/Channels-*-linux-x86_64.AppImage
          if-no-files-found: error
          overwrite: true
