# A release is a tag on main and nothing else: git tag v0.21.0 && git push origin v0.21.0.
# Builds kiwi and the Channels desktop app for every platform from the tagged commit stamped
# with the tag's version (scripts/stamp.ts), on GitHub's machines, publishes the files with
# checksums and a signed build-provenance attestation, so anyone can check a binary came from
# this exact source:
#   gh attestation verify ~/.kiwi/bin/kiwi --repo kiwi-init/channels
# then commits the stamp (the version and CHANGELOG.md's section) to main.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  on-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tagged commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME is on $GITHUB_SHA, which isn't on main: a release is a tag on a commit of main, so nothing is built, signed or published"
            exit 1
          }
          echo "$GITHUB_REF_NAME is on $GITHUB_SHA, on main"

  build:
    needs: on-main
    uses: ./.github/workflows/release-build.yml
    with:
      electrobun_mac: false
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          path: repo

      - uses: ./repo/.github/actions/stamp
        with:
          path: repo

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Install
        working-directory: repo
        run: bun install --frozen-lockfile

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "artifacts/*"

      - name: Checksums
        run: |
          cd artifacts
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find artifacts -maxdepth 1 -type f | sort)
          # A release candidate (v0.11.0-rc.3) is a prerelease: the install scripts fetch
          # releases/latest, which must stay on the last real release.
          pre=(); [[ "$GITHUB_REF_NAME" == *-* ]] && pre=(--prerelease)
          # The notes: this version's changelog (scripts/changelog.ts), then where to get it.
          bun repo/scripts/changelog.ts --notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          printf '\n---\n\n%s\n' "Channels desktop app (macOS dmg/zip, Linux AppImage/deb) and the kiwi CLI. Download the app at https://channels.kiwiinit.com/; install the CLI with: curl -fsSL https://channels.kiwiinit.com/install | sh (macOS, Linux). Every file is checksummed in SHA256SUMS and has a build-provenance attestation: gh attestation verify <file> --repo $GITHUB_REPOSITORY" >> "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "${files[@]}" "${pre[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "kiwi $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"

  # The Worker (relay + site/) ships after the GitHub release exists: the site's download links
  # name this version's files, which 404 until the release is up (docs/0.13-release.md). Release
  # candidates don't deploy: the public relay stays on the last real release. Nothing waits on this
  # job, so a failed deploy never holds back the binaries or the app.
  deploy-relay:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: deploy-relay
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/stamp

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run relay:deploy

  # main learns the release: the stamp lands as one "kiwi X.Y.Z" commit (scripts/changelog.ts leaves
  # those out), pushed by the GitHub App that may bypass main's pull request rule. Skipped for a
  # release candidate, when main already says this version (it was bumped by hand), and when main
  # is past it (a fix released from an older commit). If main moved and the stamp no longer applies,
  # this job fails after the release is out: run bun scripts/stamp.ts vX.Y.Z on main in a PR.
  bump-main:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BUS_APP_CLIENT_ID }}
          private-key: ${{ secrets.BUS_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stamp
          path: ${{ runner.temp }}/stamp

      - name: Check the stamp only edits the stamped files
        env:
          STAMPED: |
            src/version.ts
            package.json
            desktop/package.json
            site/app.js
            site/README.md
            CHANGELOG.md
        run: |
          patch="$RUNNER_TEMP/stamp/stamp.patch"
          [ -s "$patch" ] || exit 0
          summary=$(git apply --summary "$patch")
          [ -z "$summary" ] || { echo "::error::the stamp creates, deletes, renames or changes the mode of a file, so it isn't pushed to main: $summary"; exit 1; }
          stat=$(git apply --numstat "$patch")
          while IFS=$'\t' read -r _ _ file; do
            grep -qxF -- "$file" <<<"$STAMPED" || { echo "::error::the stamp edits $file, which scripts/stamp.ts never writes, so it isn't pushed to main"; exit 1; }
          done <<<"$stat"

      - name: Commit the stamp to main
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP: ${{ steps.app.outputs.app-slug }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          patch="$RUNNER_TEMP/stamp/stamp.patch"
          [ -s "$patch" ] || { echo "the tagged commit already said $v: nothing to commit"; exit 0; }
          id=$(gh api "users/$APP%5Bbot%5D" --jq .id)
          who=$(gh api "users/$GITHUB_ACTOR" --jq '.name // .login')
          git config user.name "$APP[bot]"
          git config user.email "$id+$APP[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            cmp=$(V="$v" bun -e 'const { compareVersions } = await import("./packages/core/src/versions.ts"); const { VERSION } = await import("./src/version.ts"); console.log(compareVersions(VERSION, process.env.V ?? ""))')
            [ "$cmp" -lt 0 ] || { echo "main already says $v or later: nothing to commit"; exit 0; }
            git apply --3way "$patch"
            git commit -q -a -m "kiwi $v" -m "The release's stamp from $GITHUB_REF_NAME: the version in src/version.ts, package.json, desktop/package.json and the site's download names, and CHANGELOG.md's section." -m "Agent: release.yml on behalf of $who"
            git push origin HEAD:main && exit 0
          done
          exit 1
