# Builds kiwi and the Channels desktop app for every platform from a tagged commit,
# on GitHub's machines, and publishes the files with checksums and a signed
# build-provenance attestation, so anyone can check a binary came from this
# exact source:
#   gh attestation verify ~/.kiwi/bin/kiwi --repo ojowwalker77/channels
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/release-build.yml
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          path: repo

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Install
        working-directory: repo
        run: bun install --frozen-lockfile

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "artifacts/*"

      - name: Checksums
        run: |
          cd artifacts
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find artifacts -maxdepth 1 -type f | sort)
          # A release candidate (v0.11.0-rc.3) is a prerelease: the install scripts fetch
          # releases/latest, which must stay on the last real release.
          pre=(); [[ "$GITHUB_REF_NAME" == *-* ]] && pre=(--prerelease)
          # The notes: this version's changelog (scripts/changelog.ts), then where to get it.
          bun repo/scripts/changelog.ts --notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          printf '\n---\n\n%s\n' "Channels desktop app (macOS dmg/zip, Linux AppImage/deb) and the kiwi CLI. Download the app at https://channels.kiwiinit.com/; install the CLI with: curl -fsSL https://channels.kiwiinit.com/install | sh (macOS, Linux). Every file is checksummed in SHA256SUMS and has a build-provenance attestation: gh attestation verify <file> --repo $GITHUB_REPOSITORY" >> "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "${files[@]}" "${pre[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "kiwi $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"

  # The Worker (relay + site/) ships after the GitHub release exists: the site's download links
  # name this version's files, which 404 until the release is up (docs/0.13-release.md). Release
  # candidates don't deploy: the public relay stays on the last real release. Nothing waits on this
  # job, so a failed deploy never holds back the binaries or the app.
  deploy-relay:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-relay
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun run relay:deploy
