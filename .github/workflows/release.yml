# Builds kiwi and the Kiwi desktop app for every platform from a tagged commit,
# on GitHub's machines, and publishes the files with checksums and a signed
# build-provenance attestation, so anyone can check a binary came from this
# exact source:
#   gh attestation verify ~/.kiwi/bin/kiwi --repo ojowwalker77/channels
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # src/version.ts is the version; the two package.json files must agree so the
  # binaries and the app carry the same tag.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Check the version matches the tag
        run: |
          v=$(bun -e 'console.log((await import("./src/version.ts")).VERSION)')
          pkg=$(bun -e 'console.log(JSON.parse(await Bun.file("package.json").text()).version)')
          app=$(bun -e 'console.log(JSON.parse(await Bun.file("desktop/package.json").text()).version)')
          test "v$v" = "$GITHUB_REF_NAME" || { echo "src/version.ts says $v, tag is $GITHUB_REF_NAME"; exit 1; }
          test "$pkg" = "$v" || { echo "package.json says $pkg, src/version.ts says $v"; exit 1; }
          test "$app" = "$v" || { echo "desktop/package.json says $app, src/version.ts says $v"; exit 1; }

  cli:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        # web/ too: some tests (web/src/**/*.test.tsx) import the web app's React.
        run: bun install --frozen-lockfile && (cd web && bun install --frozen-lockfile)

      - name: Test
        run: bun test

      - name: Build
        run: |
          mkdir -p dist
          for t in darwin-arm64 darwin-x64 linux-x64 linux-arm64 windows-x64; do
            ext=""; [ "$t" = windows-x64 ] && ext=".exe"
            bun build src/cli/main.ts --compile --minify --external node-liblzma --external @mongodb-js/zstd --target="bun-$t" --outfile "dist/kiwi-$t$ext"
          done
          # Apple Silicon only runs signed code: give the macOS builds an ad-hoc signature.
          codesign --force --sign - dist/kiwi-darwin-arm64 dist/kiwi-darwin-x64
          ./dist/kiwi-darwin-arm64 --version

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/kiwi-*"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: cli
          path: dist/kiwi-*

  # The Electron app builds on each OS for that OS: dmg/zip on macOS, nsis on
  # Windows, AppImage/deb on Linux. Unsigned for now.
  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: |
          bun install --frozen-lockfile
          (cd web && bun install --frozen-lockfile)
          (cd desktop && bun install --frozen-lockfile)

      - name: Build the renderer and the bundled kiwi CLI
        shell: bash
        run: |
          bun run web:build
          if [ "${{ runner.os }}" = "Windows" ]; then
            bun build src/cli/main.ts --compile --external node-liblzma --external @mongodb-js/zstd --outfile dist/kiwi.exe
          else
            bun run build
          fi

      - name: Package
        working-directory: desktop
        env:
          # No signing certificate in CI; build unsigned as the plan says.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bun run build && bunx electron-builder --publish never --config.directories.output=release

      - name: Collect
        shell: bash
        run: |
          bun -e '
            const fs = require("fs");
            fs.mkdirSync("out", { recursive: true });
            const exts = [".dmg", ".zip", ".exe", ".appimage", ".deb"];
            const dir = "desktop/release";
            const names = fs.readdirSync(dir).filter((f) => exts.some((e) => f.toLowerCase().endsWith(e)));
            for (const n of names) fs.copyFileSync(`${dir}/${n}`, `out/${n}`);
            console.log(names.join("\n") || "(nothing collected)");
          '

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "out/*"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: [cli, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find artifacts -maxdepth 1 -type f | sort)
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "kiwi $GITHUB_REF_NAME" \
            --notes "Kiwi desktop app (macOS dmg/zip, Windows nsis, Linux AppImage/deb) and the kiwi CLI. Download the app at https://channels.kiwiinit.com/; install the CLI with: curl -fsSL https://channels.kiwiinit.com/install | sh (macOS, Linux) or irm https://channels.kiwiinit.com/install.ps1 | iex (Windows). Every file is checksummed in SHA256SUMS and has a build-provenance attestation: gh attestation verify <file> --repo $GITHUB_REPOSITORY"