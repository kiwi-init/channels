name: release

on:
  push:
    tags: ["v*-livewire.*"]

permissions:
  contents: read

jobs:
  on-livewire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag is a Livewire release on main
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]{1,6}\.[0-9]{1,6}\.[0-9]{1,6}-livewire\.[0-9]{1,6}$ ]] || {
            echo "::error::$GITHUB_REF_NAME isn't vYYYY.M.PATCH-livewire.N: a Channels Livewire release is tagged like v2026.10.2-livewire.1, so nothing is built, signed or published"
            exit 1
          }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME is on $GITHUB_SHA, which isn't on main: a Channels Livewire release is a tag on main, so nothing is built, signed or published"
            exit 1
          }
          echo "$GITHUB_REF_NAME is on $GITHUB_SHA, on main"

  build:
    needs: on-livewire
    uses: ./.github/workflows/release-build.yml
    secrets: inherit

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          path: repo

      - uses: ./repo/.github/actions/stamp
        with:
          path: repo

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Install
        working-directory: repo
        run: bun install --frozen-lockfile

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "artifacts/*"

      - name: Checksums
        run: |
          cd artifacts
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Sign SHA256SUMS
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: bash repo/desktop/scripts/sign-sums.sh artifacts/SHA256SUMS "kiwi $GITHUB_REF_NAME SHA256SUMS"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find artifacts -maxdepth 1 -type f | sort)
          version="${GITHUB_REF_NAME#v}"
          bun repo/scripts/changelog.ts --notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          printf '\n---\n\n%s\n' "Channels Livewire $version: a release candidate of the Channels desktop app on Electrobun Livewire, installed beside Channels with its own data, keychain items and ~/.kiwi-livewire, and updated only to later Livewire releases. Every file is checksummed in SHA256SUMS, signed in SHA256SUMS.minisig (minisign -Vm SHA256SUMS -P <the key in desktop/src/release-key.ts>), and has a build-provenance attestation: gh attestation verify <file> --repo $GITHUB_REPOSITORY" >> "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --prerelease --latest=false \
            --repo "$GITHUB_REPOSITORY" \
            --title "Channels Livewire $version" \
            --notes-file "$RUNNER_TEMP/notes.md"
