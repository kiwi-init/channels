name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# A new push to a pull request cancels its run still in progress: only the newest commit's
# result matters there. Each merge group has a ref of its own, so groups never cancel each
# other, and every run on main has a group of its own, so no push or rehearsal cancels another
# and each commit on main gets a verdict (a cancelled run reads as red).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# One job per area, its checks as steps: each job pays for one checkout and one install.
# A step that fails doesn't stop the checks after it (`!cancelled()`), so one run shows every failure.
jobs:
  # Decides which jobs this pull request or merge group can break (.github/jev-ci.yml): rules
  # first, then a cache of inputs that already passed, then Jev for the rest. A pull request runs
  # only its pull_request_jobs (repo / static, test / unit); a merge group is planned on its
  # combined change (merge_group.base_sha..head_sha) and runs every job that plan picks. A push to main runs
  # nothing when the merge queue already tested that commit as-is, and everything otherwise;
  # if planning fails, everything runs. Every check below runs only if the plan says so.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    outputs:
      run: ${{ steps.plan.outputs.run }}
      hashes: ${{ steps.plan.outputs.hashes }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - id: plan
        run: bun .github/jev-ci/cli.ts plan --github
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}

  # Types, lint, format, unused code and action pins.
  static:
    name: repo / static
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['static']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup
      - name: core types
        run: bunx tsc --noEmit && bunx tsc --noEmit -p tsconfig.worker.json
      - name: web types
        if: ${{ !cancelled() }}
        run: cd web && bunx tsc -b
      - name: desktop types
        if: ${{ !cancelled() }}
        run: cd desktop && bunx tsc --noEmit
      - name: ios engine types
        if: ${{ !cancelled() }}
        run: bunx tsc --noEmit -p ios/engine/tsconfig.json && bunx tsc --noEmit -p ios/scripts/tsconfig.json
      - name: ui tokens
        if: ${{ !cancelled() }}
        run: bun scripts/ui-tokens.ts
      - name: lint
        if: ${{ !cancelled() }}
        run: bun run lint
      - name: format
        if: ${{ !cancelled() }}
        run: bun run format:check
      - name: web lint
        if: ${{ !cancelled() }}
        run: cd web && bun oxlint src
      - name: web format
        if: ${{ !cancelled() }}
        run: cd web && bun oxfmt --check src
      - name: knip
        if: ${{ !cancelled() }}
        run: bun run knip
      - name: action pins
        if: ${{ !cancelled() }}
        run: bun scripts/action-pins.ts
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: static
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['static'] }}

  test-unit:
    name: test / unit
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['test-unit']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: bun scripts/ci-tests.ts unit --shard=${{ matrix.shard }}/2
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        timeout-minutes: 1
        with:
          job: test-unit
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['test-unit'] }}
          shard: ${{ matrix.shard }}of2

  # The slow suites against a real local relay, split in two so they run side by side (scripts/ci-tests.ts).
  test-flows-a:
    name: test / flows-a
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['test-flows-a']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: bun scripts/ci-tests.ts flows-a --shard=${{ matrix.shard }}/2
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        timeout-minutes: 1
        with:
          job: test-flows-a
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['test-flows-a'] }}
          shard: ${{ matrix.shard }}of2

  test-flows-b:
    name: test / flows-b
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['test-flows-b']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: bun scripts/ci-tests.ts flows-b --shard=${{ matrix.shard }}/2
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        timeout-minutes: 1
        with:
          job: test-flows-b
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['test-flows-b'] }}
          shard: ${{ matrix.shard }}of2

  # The web dashboard, the CLI binary and the worker, each built and smoke-tested.
  build:
    name: build / bundles
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['build']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/browser
      - name: web build
        run: cd web && bun run build
      - name: web bundle budget
        run: bun scripts/web-bundle.ts
      # Opens every menu, popover and dialog on the production build: Base UI throws on a
      # misplaced part only at render, which typecheck can't see (the b085ae8 crash).
      - name: ui smoke
        if: ${{ !cancelled() }}
        run: bun run smoke:ui
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-smoke-failure
          path: /tmp/kiwi-smoke-failure-*.png
          if-no-files-found: ignore
          overwrite: true
      - name: cli build
        if: ${{ !cancelled() }}
        run: |
          bun run build && ./dist/kiwi --version && bun scripts/build-cli.ts --check
          probe="$RUNNER_TEMP/kiwi-autoload"
          mkdir -p "$probe"
          printf 'preload = ["./p.js"]\n' > "$probe/bunfig.toml"
          printf 'require("node:fs").writeFileSync("preload-ran", "")\n' > "$probe/p.js"
          (cd "$probe" && "$GITHUB_WORKSPACE/dist/kiwi" --version)
          test ! -e "$probe/preload-ran" || { echo "the kiwi CLI ran a bunfig.toml preload from the folder it was started in"; exit 1; }
      - name: cli smoke
        if: ${{ !cancelled() }}
        run: bun scripts/smoke-cli.ts dist/kiwi
      - name: relay worker
        if: ${{ !cancelled() }}
        run: bunx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: build
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['build'] }}

  shots:
    name: build / shots
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['shots']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/browser
        with:
          webkit: "true"
      - run: bun run web:build
      - name: ui shots
        run: bun scripts/shoot-ui.ts --wide --phone channel,tasks --theme dark "$RUNNER_TEMP/shots"
      - name: ui shots in WebKit
        if: ${{ !cancelled() }}
        run: bun scripts/shoot-ui.ts --browser webkit --wide --theme light "$RUNNER_TEMP/shots-webkit"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-shots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
          overwrite: true
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-shots-webkit
          path: ${{ runner.temp }}/shots-webkit
          if-no-files-found: ignore
          overwrite: true
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: shots
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['shots'] }}

  perf-runs:
    name: perf / scale, run ${{ matrix.run }}
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['perf-runs']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        run: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/browser
      - run: bun run web:build
      - name: perf-scale
        env:
          PERF_SOAK_MIN: "0"
        run: bun scripts/perf-scale.ts --gated --json "$RUNNER_TEMP/perf-${{ matrix.run }}.json"
      - name: perf-feel
        env:
          PERF_RTT_MS: "150"
        run: bun scripts/perf-feel.ts --json "$RUNNER_TEMP/feel-${{ matrix.run }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf-scale-${{ matrix.run }}
          path: |
            ${{ runner.temp }}/perf-${{ matrix.run }}.json
            ${{ runner.temp }}/feel-${{ matrix.run }}.json
          if-no-files-found: error
          overwrite: true

  perf:
    name: perf / scale
    needs: [plan, perf-runs]
    if: fromJSON(needs.plan.outputs.run)['perf']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: perf-scale-*
          path: ${{ runner.temp }}/perf
          merge-multiple: true
      - name: medians against the gates
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bun scripts/perf-check.ts --comment "$RUNNER_TEMP"/perf/perf-*.json "$RUNNER_TEMP"/perf/feel-*.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: perf
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['perf'] }}

  desktop:
    name: desktop / package
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['desktop']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: bun run web:build
      - run: mkdir -p dist && bun scripts/build-cli.ts --target bun-linux-x64 --outfile dist/kiwi && bun desktop/scripts/pack-cli.ts dist/kiwi
      - working-directory: desktop
        run: bun run build && bunx electron-builder --linux --dir --publish never
      - run: bun desktop/scripts/fuses.ts desktop/release/linux-unpacked/channels-desktop
      - run: bun desktop/scripts/size.ts desktop/release/linux-unpacked/channels-desktop
      - run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - run: xvfb-run -a bun desktop/scripts/smoke.ts desktop/release/linux-unpacked/channels-desktop
      - run: xvfb-run -a bun scripts/perf-desktop.ts desktop/release/linux-unpacked/channels-desktop --json "$RUNNER_TEMP/perf-desktop.json"
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: desktop
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['desktop'] }}

  desktop-mac:
    name: desktop / mac
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['desktop-mac']
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: bun run web:build
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.hutch
          key: hutch-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/electrobun-pins.json') }}
      - name: electrobun toolchain
        working-directory: desktop
        timeout-minutes: 5
        run: for i in 1 2 3; do bun run prepare:eb && exit 0; echo "electrobun prepare failed ($i of 3)"; [ "$i" -lt 3 ] && sleep 20; done; exit 1
      - working-directory: desktop
        env:
          DASH_RELEASE_OFFLINE: "1"
        run: bun run typecheck:eb
      - working-directory: desktop
        if: ${{ !cancelled() }}
        run: bun test --tsconfig-override tsconfig.eb.json ./eb-tests
      - working-directory: desktop
        if: ${{ !cancelled() }}
        env:
          DASH_RELEASE_OFFLINE: "1"
        run: bun run build:eb
      - if: ${{ !cancelled() }}
        run: bun desktop/scripts/eb-size.ts desktop/release-eb
      - if: ${{ !cancelled() }}
        run: bun desktop/scripts/eb-seal-check.ts
      - name: the launcher keeps BUN_*, NODE_*, DYLD_* and JSC_* out of the app
        if: ${{ !cancelled() }}
        run: bun desktop/scripts/eb-env-check.ts desktop/release-eb
      - name: the launcher holds the store key for one session, refuses a changed app, and its C runs clean under ASan and UBSan
        if: ${{ !cancelled() }}
        run: bun desktop/scripts/eb-keys-check.ts desktop/release-eb
      - name: test build (the test driver in, its own bundle id)
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: bun scripts/eb.ts build --env=dev
        env:
          CHANNELS_EB_TEST: "1"
          DASH_RELEASE_OFFLINE: "1"
      - name: no test driver in the release build
        if: ${{ !cancelled() }}
        run: bun desktop/scripts/eb-driver-check.ts desktop/release-eb
      - name: smoke
        if: ${{ !cancelled() }}
        run: bun desktop/scripts/smoke-eb.ts desktop/release-eb/build/dev-macos-*/*.app
      - name: cold start
        if: ${{ !cancelled() }}
        run: bun scripts/perf-desktop.ts desktop/release-eb/build/dev-macos-*/*.app --electrobun --json "$RUNNER_TEMP/perf-desktop-eb.json"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf-desktop-eb
          path: ${{ runner.temp }}/perf-desktop-eb.json
          if-no-files-found: ignore
          overwrite: true
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        timeout-minutes: 1
        with:
          job: desktop-mac
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['desktop-mac'] }}

  desktop-linux:
    name: desktop / linux, ${{ matrix.os }}
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['desktop-linux']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            part: 1
            sandbox: unsandboxed
          - os: ubuntu-26.04
            part: 2
            sandbox: sandboxed
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - id: image
        run: echo "key=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/linux-debs
          key: linux-debs-${{ runner.arch }}-${{ steps.image.outputs.key }}-${{ github.run_id }}
          restore-keys: linux-debs-${{ runner.arch }}-${{ steps.image.outputs.key }}-
      - name: WebKitGTK, its sandbox, Xvfb and the AppImage tools, from cached .debs when the mirror is slow
        timeout-minutes: 15
        run: |
          debs="$RUNNER_TEMP/linux-debs"
          mkdir -p "$debs/partial"
          find "$debs" -maxdepth 1 -name '*.deb' | wc -l > "$RUNNER_TEMP/debs-before"
          echo "Dir::Cache::Archives \"$debs/\";" | sudo tee /etc/apt/apt.conf.d/90linux-debs > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev bubblewrap xdg-dbus-proxy xvfb xauth xdotool x11-utils squashfs-tools
      - id: debs
        name: keep what apt downloaded, even when it ran out of time
        if: always()
        run: |
          debs="$RUNNER_TEMP/linux-debs"
          sudo rm -rf "$debs/partial" "$debs/lock"
          sudo chown -R "$(id -u):$(id -g)" "$debs"
          echo "new=$([ "$(find "$debs" -maxdepth 1 -name '*.deb' | wc -l)" -gt "$(cat "$RUNNER_TEMP/debs-before" 2> /dev/null || echo 0)" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: always() && steps.debs.outputs.new == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/linux-debs
          key: linux-debs-${{ runner.arch }}-${{ steps.image.outputs.key }}-${{ github.run_id }}
      - run: bun run web:build
      - id: electrobun
        run: echo "version=$(bun -e 'console.log(require("./desktop/package.json").devDependencies.electrobun)')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.hutch
          key: hutch-${{ runner.os }}-${{ runner.arch }}-electrobun-${{ steps.electrobun.outputs.version }}
      - name: electrobun toolchain
        working-directory: desktop
        run: for i in 1 2 3; do bun run prepare:eb && exit 0; echo "electrobun prepare failed ($i of 3)"; sleep 20; done; exit 1
      - working-directory: desktop
        env:
          DASH_RELEASE_OFFLINE: "1"
        run: bun run build:eb
      - name: the linux-arm64 Hutch and devkit match their pins (no job builds there)
        if: ${{ !cancelled() }}
        run: bun desktop/scripts/eb-pins-check.ts linux-arm64
      - name: deb and AppImage, each at most 40 MB
        if: ${{ !cancelled() }}
        run: bun desktop/scripts/package-linux.ts desktop/release-eb desktop/release-eb/linux
      - name: the packages hold the app
        if: ${{ !cancelled() }}
        working-directory: desktop/release-eb/linux
        run: |
          bun ../../scripts/appimage-squashfs.ts .
          deb=$(ls Channels-*-linux-amd64.deb)
          dpkg-deb --field "$deb" Package Version Architecture Depends
          files=$(dpkg-deb --contents "$deb")
          for p in ./opt/Channels/bin/launcher ./opt/Channels/bin/electrobun-launcher ./opt/Channels/bin/bun ./opt/Channels/Resources/app/page/index.html ./opt/Channels/Resources/app/views/internal/assets ./usr/bin/channels-desktop ./usr/share/applications/channels-desktop.desktop ./usr/share/icons/hicolor/512x512/apps/channels-desktop.png; do
            [[ "$files" == *" $p"* ]] || { echo "$deb lacks $p"; exit 1; }
          done
          for p in ./opt/Channels/bin/bspatch ./opt/Channels/bin/zig-zstd ./opt/Channels/Resources/uninstall ./opt/Channels/Channels.desktop ./opt/Channels/Resources/app/views/internal/index.html; do
            [[ "$files" != *" $p"* ]] || { echo "$deb carries $p, which it leaves out"; exit 1; }
          done
          img=$(ls Channels-*-linux-x86_64.AppImage)
          "./$img" --appimage-extract > /dev/null
          for p in AppRun channels-desktop.desktop channels-desktop.png Channels/bin/launcher Channels/bin/electrobun-launcher Channels/bin/bun Channels/Resources/app/page/index.html Channels/Resources/app/views/internal/assets; do
            [ -e "squashfs-root/$p" ] || { echo "$img lacks $p"; exit 1; }
          done
          for p in Channels/bin/bspatch Channels/bin/zig-zstd Channels/Resources/uninstall Channels/Channels.desktop Channels/Resources/app/views/internal/index.html; do
            [ ! -e "squashfs-root/$p" ] || { echo "$img carries $p, which it leaves out"; exit 1; }
          done
          probe=$(mktemp -d)
          cp squashfs-root/Channels/bin/launcher "$probe/launcher"
          printf '#include <stdio.h>\nextern char **environ;\nint main(void) { for (char **e = environ; *e; e++) puts(*e); return 0; }\n' > "$probe/env.c"
          cc -O2 -o "$probe/electrobun-launcher" "$probe/env.c"
          seen=$(env -i HOME=/home/ana DISPLAY=:0 LD_PRELOAD=/tmp/evil.so LD_LIBRARY_PATH=. BUN_OPTIONS=--preload=/tmp/evil.ts NODE_OPTIONS=--require=/tmp/evil.js GTK_MODULES=evil XDG_RUNTIME_DIR=/run/user/1000 "$probe/launcher")
          want=$(printf 'HOME=/home/ana\nDISPLAY=:0\nXDG_RUNTIME_DIR=/run/user/1000\nBUN_RUNTIME_TRANSPILER_CACHE_PATH=0')
          [ "$seen" = "$want" ] || { echo "the built bin/launcher passed on:"; echo "$seen"; exit 1; }
          rm -rf "$probe" squashfs-root
          echo "checked: $deb and $img; bin/launcher keeps the app's environment to its allowlist"
      - name: the deb installs over today's Electron deb and keeps its launcher link
        if: ${{ !cancelled() }}
        working-directory: desktop/release-eb/linux
        run: |
          curl -fsSL -o old.deb https://github.com/ojowwalker77/channels/releases/download/v0.26.0/Channels-0.26.0-linux-amd64.deb
          echo "0fb7656f63f14c5f802b71d6c6f255a13404a73455b407d7f8bb0c05e0b729f2  old.deb" | sha256sum -c -
          sudo apt-get install -y --no-install-recommends ./old.deb
          [ "$(readlink -f /usr/bin/channels-desktop)" = /opt/Channels/channels-desktop ] || { echo "the Electron deb didn't make its link"; exit 1; }
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 librsvg2-2 bubblewrap xdg-dbus-proxy
          sudo dpkg -i "$(ls Channels-*-linux-amd64.deb)"
          link=$(readlink -f /usr/bin/channels-desktop || true)
          [ "$link" = /opt/Channels/bin/launcher ] || { echo "after the upgrade /usr/bin/channels-desktop is '$link', not /opt/Channels/bin/launcher"; exit 1; }
          [ ! -e /opt/Channels/channels-desktop ] || { echo "the Electron app is still in /opt/Channels"; exit 1; }
          grep -qx 'Exec=/opt/Channels/bin/launcher %U' /usr/share/applications/channels-desktop.desktop || { echo "the installed entry doesn't run /opt/Channels/bin/launcher"; exit 1; }
          verify=$(dpkg --verify kiwi-desktop || true)
          [ -z "$verify" ] || { echo "dpkg --verify kiwi-desktop:"; echo "$verify"; exit 1; }
          echo "upgraded: $(dpkg-query -W kiwi-desktop), /usr/bin/channels-desktop -> $link"
          echo "for WebKitGTK's sandbox: kernel.apparmor_restrict_unprivileged_userns=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo unset), unshare -U as a user: $(unshare -U true 2>&1 && echo allowed || echo refused)"
          rm old.deb
      - name: the installed app starts on WebKitGTK, with the .desktop entry's names, and its permission and page hooks work
        if: ${{ !cancelled() }}
        run: |
          cc -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/kiwi-shell-test" desktop/native/linux/kiwi-shell-test.c $(pkg-config --cflags --libs webkit2gtk-4.1) -ldl
          xvfb-run -a "$RUNNER_TEMP/kiwi-shell-test" /opt/Channels/bin/libkiwi-shell.so ${{ matrix.sandbox }}
          echo "for WebKitGTK's sandbox: kernel.apparmor_restrict_unprivileged_userns=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo unset)"
          xvfb-run -a -s "-screen 0 1280x800x24" bash desktop/scripts/eb-linux-start.sh /opt/Channels/bin/launcher ${{ matrix.sandbox }}
          img=$(ls "$PWD"/desktop/release-eb/linux/Channels-*-linux-x86_64.AppImage)
          xvfb-run -a -s "-screen 0 1280x800x24" bash desktop/scripts/eb-linux-start.sh "$img" ${{ matrix.sandbox }} --appimage-extract-and-run
          sudo dpkg --purge kiwi-desktop
      - name: what bwrap can do under this AppArmor, for an app profile later (prints only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          try() { out=$("$@" 2>&1) && echo "ok" || echo "refused: $(echo "$out" | head -n 1)"; }
          echo "kernel.apparmor_restrict_unprivileged_userns=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo unset)"
          echo "profiles in /etc/apparmor.d naming bwrap or userns: $(grep -lE 'bwrap|userns' /etc/apparmor.d/* 2>/dev/null | tr '\n' ' ')"
          echo "loaded profiles naming bwrap or userns: $(sudo grep -E 'bwrap|userns' /sys/kernel/security/apparmor/profiles | tr '\n' ';')"
          echo "bwrap --unshare-all, unprofiled: $(try bwrap --unshare-all --die-with-parent --ro-bind / / true)"
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile kiwi-userns-probe flags=(unconfined) {\n  userns,\n}\n' > "$RUNNER_TEMP/kiwi-userns-probe"
          sudo apparmor_parser -r "$RUNNER_TEMP/kiwi-userns-probe" && echo "loaded kiwi-userns-probe (unconfined, userns)"
          echo "under kiwi-userns-probe, bwrap itself: $(try aa-exec -p kiwi-userns-probe -- bwrap --unshare-all --die-with-parent --ro-bind / / true)"
          echo "under kiwi-userns-probe, bwrap exec'd from sh: $(try aa-exec -p kiwi-userns-probe -- sh -c 'bwrap --unshare-all --die-with-parent --ro-bind / / true')"
          echo "label of sh under kiwi-userns-probe, and of what it execs: $(aa-exec -p kiwi-userns-probe -- sh -c 'cat /proc/self/attr/current; echo; cat /proc/$$/attr/current' | tr '\n' ' ')"
          echo "label of bwrap's child under kiwi-userns-probe: $(aa-exec -p kiwi-userns-probe -- bwrap --unshare-all --die-with-parent --ro-bind / / cat /proc/self/attr/current 2>&1 | head -n 1)"
          echo "unshare -Urn under kiwi-userns-probe: $(try aa-exec -p kiwi-userns-probe -- unshare -Urn ip link set lo up)"
          echo "unshare -Urn, unprofiled: $(try unshare -Urn ip link set lo up)"
          sudo apparmor_parser -R "$RUNNER_TEMP/kiwi-userns-probe" || true
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-packages-${{ matrix.os }}
          path: desktop/release-eb/linux/*
          if-no-files-found: warn
          retention-days: 3
          overwrite: true
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: desktop-linux
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['desktop-linux'] }}
          shard: ${{ matrix.part }}of2

  cli-macos:
    name: cli / macos
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['cli-macos']
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: brew install tmux
      - run: bun scripts/ci-tests.ts all --shard=${{ matrix.shard }}/3
      - if: matrix.shard == 1
        run: |
          mkdir -p dist
          for t in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            bun scripts/build-cli.ts --target "bun-$t" --outfile "dist/kiwi-$t"
          done
          codesign --force --sign - dist/kiwi-darwin-arm64 dist/kiwi-darwin-x64
          ./dist/kiwi-darwin-arm64 --version
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        timeout-minutes: 1
        with:
          job: cli-macos
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['cli-macos'] }}
          shard: ${{ matrix.shard }}of3

  # The iPhone app: Swift lint, then an unsigned build for devices with the engine bundled in.
  ios:
    name: ios / build
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['ios']
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - name: newest xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: swift lint
        run: xcrun swift-format lint -r --strict --configuration ios/.swift-format ios/Channels ios/ChannelsUITests
      - name: app build
        if: ${{ !cancelled() }}
        run: xcodebuild -project ios/Channels.xcodeproj -scheme Channels -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/ios" CODE_SIGNING_ALLOWED=NO build
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        timeout-minutes: 1
        with:
          job: ios
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['ios'] }}

  # The iPhone app's gestures, with real touches: ios/ChannelsUITests in a simulator, on a canned channel.
  ios-gestures:
    name: ios / gestures
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['ios-gestures']
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - name: newest xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: simulator
        run: |
          SIM=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in devices if ".iOS-" in k), key=lambda k: [int(x) for x in k.rsplit(".iOS-", 1)[1].split("-")])
          print(next(d["udid"] for d in devices[runtimes[-1]] if d["name"].startswith("iPhone")))')
          echo "SIM=$SIM" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM"
          xcrun simctl bootstatus "$SIM"
      - name: gestures
        run: |
          set +e
          xcodebuild test -project ios/Channels.xcodeproj -scheme Channels -destination "id=$SIM" -derivedDataPath "$RUNNER_TEMP/ios-ui" CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/gestures.log" 2>&1
          code=$?
          grep -E "GESTURE|error:|Test Case .*(passed|failed)|\*\* TEST" "$RUNNER_TEMP/gestures.log"
          [ "$code" -eq 0 ] || tail -80 "$RUNNER_TEMP/gestures.log"
          exit "$code"
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        timeout-minutes: 1
        with:
          job: ios-gestures
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['ios-gestures'] }}

  release-rehearsal:
    name: release / rehearsal
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['release-rehearsal']
    uses: ./.github/workflows/release-build.yml
    with:
      rehearsal: true

  # The one check to require: passes when every job the plan ran passed and the rest were skipped.
  # It also finishes the plan's comment on the pull request with each job's result.
  ci-ok:
    name: ci-ok
    needs: [plan, static, test-unit, test-flows-a, test-flows-b, build, shots, perf-runs, perf, desktop, desktop-mac, desktop-linux, cli-macos, ios, ios-gestures, release-rehearsal]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun .github/jev-ci/cli.ts report --github
        env:
          NEEDS: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ github.token }}
