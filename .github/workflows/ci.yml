name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      jobs:
        description: "Only these jobs, comma-separated (static, test-unit, test-flows, build, doc, fuzz, shots, desktop-mac, desktop-linux, desktop-distros, cli-macos, and the phone jobs ios, android); empty picks from what the branch changed (.github/coverage.yml), everything when in doubt"
        required: false
        default: ""
      update_from:
        description: "desktop / distros also updates this released version's AppImage to the latest release (update.sh)"
        required: false
        default: ""
      doc_still_loops:
        description: "build / doc's busy-doc stillness check in WebKit runs this many loops with --trace, and keeps its log as the doc-still-trace artifact; empty runs it once"
        required: false
        default: ""
      release:
        description: "desktop / distros checks this published version's AppImage (checked against its SHA256SUMS) instead of this run's build, and doesn't wait for desktop / linux"
        required: false
        default: ""

# A new push to a pull request cancels its run still in progress: only the newest commit's
# result matters there. Pushes to main share one group but never cancel the run in progress: it
# finishes, one run waits, and a newer push replaces the waiting one, so main's full run keeps
# finishing while merges come every few minutes. Each merge group has a ref of its own, so groups
# never cancel each other. A dispatched run replaces an older dispatched run on the same ref only
# when it asks for exactly the same thing: the group carries each of the jobs, release and
# update_from inputs as its JSON string (toJSON quotes and escapes, so a tuple's encoding
# is unique and no delimiter inside an input can impersonate another tuple), so a jobs=doc
# run never replaces a jobs=desktop-linux validation on the same head, a release check
# never replaces a plain one, and dispatches never share a group with a push to main,
# which stays uncancellable by anything but itself. GitHub compares group names without
# letter case, so identity here ignores case too, exactly as far as the host's own
# comparison collapses it (the spec's choice, #3101).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_ref || (github.event_name == 'push' && github.ref) || (github.event_name == 'workflow_dispatch' && format('{0}-dispatch-{1}{2}{3}', github.ref, toJSON(inputs.jobs), toJSON(inputs.release), toJSON(inputs.update_from))) || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

# One job per area, its checks as steps: each job pays for one checkout and one install.
# A step that fails doesn't stop the checks after it (`!cancelled()`), so one run shows every failure.
jobs:
  # Which jobs run: a pull request runs repo / static and test / unit (a release's stamp PR, titled
  # "kiwi YYYY.M.PATCH", also cli / macos: the release's Mac tests and packing); a dispatch runs the jobs it
  # names (all when it names none); a push to main and a merge group run everything. The phone jobs (ios,
  # android) are retired for now: they run only when a dispatch names them.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 50
        if: github.event_name == 'workflow_dispatch' && inputs.jobs == ''
      - run: git fetch --depth=50 origin main || true
        if: github.event_name == 'workflow_dispatch' && inputs.jobs == ''
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          JOBS: ${{ inputs.jobs }}
          TITLE: ${{ github.event.pull_request.title }}
          RELEASE: ${{ inputs.release }}
        run: |
          all="static test-unit test-flows build doc fuzz shots desktop-mac desktop-linux desktop-distros cli-macos"
          phones="ios android"
          case "$EVENT" in
            pull_request) pick="static test-unit"; if echo "$TITLE" | grep -qE '^kiwi [0-9]{4}\.[0-9]{1,2}\.[0-9]+(-rc\.[0-9]+)?$'; then pick="$pick cli-macos"; fi ;;
            workflow_dispatch)
              if [ -n "$JOBS" ]; then
                pick=$(echo "$JOBS" | tr ',' ' ')
                case " $pick " in *" desktop-distros "*) case " $pick " in *" desktop-linux "*) ;; *) pick="$pick desktop-linux" ;; esac ;; esac
              else
                pick=$(bash scripts/coverage-pick.sh "$RELEASE")
              fi ;;
            *) pick="$all" ;;
          esac
          for j in $pick; do case " $all $phones " in *" $j "*) ;; *) echo "no job named $j; the jobs are: $all $phones"; exit 1 ;; esac; done
          json=$(for j in $all $phones; do case " $pick " in *" $j "*) v=true ;; *) v=false ;; esac; printf '"%s":%s,' "$j" "$v"; done)
          echo "run={${json%,}}" >> "$GITHUB_OUTPUT"
      - run: |
          legs='["repo / static","test / unit","test / flows","build / bundles, app","build / bundles, ui-a","build / bundles, ui-b","build / doc, send","build / doc, edit","build / doc, view","build / fuzz","build / shots, chromium","build / shots, webkit","desktop / mac","desktop / linux, ubuntu-24.04","desktop / linux, ubuntu-26.04","desktop / distros, arch","cli / macos","ci-ok"]'
          printf '%s' "$legs" > ci-legs.json
        if: github.event_name == 'push'
      - name: upload the expected legs manifest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-legs
          path: ci-legs.json
          retention-days: 90

  # Types, lint, format, unused code and action pins.
  static:
    name: repo / static
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['static']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup
      - name: core types
        run: bunx tsrs --noEmit && bunx tsrs --noEmit -p tsconfig.worker.json
      - name: secrets types
        if: ${{ !cancelled() }}
        run: bunx tsrs --noEmit -p packages/secrets/tsconfig.json
      - name: channel types
        if: ${{ !cancelled() }}
        run: bunx tsrs --noEmit -p packages/channel/tsconfig.json
      - name: app types
        if: ${{ !cancelled() }}
        run: bunx tsrs --noEmit -p packages/app/tsconfig.json
      - name: scripts types (the CI checks, perf and demo scripts; ui-dev-channel needs the local devkit)
        if: ${{ !cancelled() }}
        run: bunx tsrs --noEmit -p tsconfig.scripts.json
      - name: desktop types
        if: ${{ !cancelled() }}
        run: cd desktop && bunx tsrs --noEmit
      - name: lint
        if: ${{ !cancelled() }}
        run: bun run lint
      - name: format
        if: ${{ !cancelled() }}
        run: bun run format:check
      - name: ui types
        if: ${{ !cancelled() }}
        run: cd ui && bunx tsrs -b
      - name: ui lint
        if: ${{ !cancelled() }}
        run: cd ui && bun oxlint src
      - name: ui format
        if: ${{ !cancelled() }}
        run: cd ui && bun oxfmt --check src
      - name: ui css units
        if: ${{ !cancelled() }}
        run: bun scripts/css-units.ts
      - name: ui words in catalogs
        if: ${{ !cancelled() }}
        run: bun scripts/ui-english.ts
      - name: knip
        if: ${{ !cancelled() }}
        run: bun run knip
      - name: action pins
        if: ${{ !cancelled() }}
        run: bun scripts/action-pins.ts
      - name: the ci-ok contract and the doc inventory
        if: ${{ !cancelled() }}
        run: bun scripts/ciok-contract.ts

  test-unit:
    name: test / unit
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['test-unit']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: unit tests including CLI upgrades and desktop update recovery
        run: bun scripts/ci-tests.ts unit

  # The slow suites against a real local relay (scripts/ci-flows.ts).
  test-flows:
    name: test / flows
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['test-flows']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun scripts/ci-tests.ts flows

  # The app, the CLI binary and the worker, each built and smoke-tested.
  build:
    name: build / bundles, ${{ matrix.part }}
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['build']
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        part: [app, ui-a, ui-b]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/browser
        with:
          webkit: "true"
      - name: ui build
        run: bun run ui:build
      - name: ui bundle budget
        if: ${{ !cancelled() && matrix.part == 'app' }}
        run: bun scripts/ui-bundle.ts
      - name: ui harness build, with the plain-browser key store
        if: ${{ !cancelled() }}
        run: bun scripts/ui-harness.ts
      - name: app smoke
        if: ${{ !cancelled() && matrix.part == 'app' }}
        timeout-minutes: 5
        run: bun scripts/smoke-app.ts
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-smoke-failure
          path: /tmp/kiwi-app-smoke-failure.png
          if-no-files-found: ignore
          overwrite: true
      # The new UI's long-feed demo in WebKit: it renders the latest rows, and nothing jumps while it scrolls. It scrolls once and gates on rows and jumps; the timed runs are by hand.
      - name: ui scroll in WebKit
        if: ${{ !cancelled() && matrix.part == 'ui-a' }}
        run: bun scripts/ui-scroll-fps.ts --check --dist ui/dist
      - name: ui a thread, a thread doc and a feed hold still once they open, in WebKit
        if: ${{ !cancelled() && matrix.part == 'ui-a' }}
        run: bun scripts/ui-still.ts --dist ui/dist
      - name: ui removing a repo from channel settings keeps the settings dialog open, in WebKit
        if: ${{ !cancelled() && matrix.part == 'ui-a' }}
        run: bun scripts/ui-settings-remove.ts --dist ui/dist
      # A feed keeps its place when its width changes: the sidebar hidden and shown, its edge dragged, the panel opened and closed, the window resized. At the bottom it stays at the bottom with no blank room; scrolled up, the row being read comes back to its pixel (T231).
      - name: ui a feed keeps its place when its width changes, in WebKit
        if: ${{ !cancelled() && matrix.part == 'ui-a' }}
        run: bun scripts/ui-feed-width.ts --dist ui/dist
      - name: ui a remote edit landing between your keys never undoes your caret or selection (⇧← and ←), in Chromium and WebKit
        if: ${{ !cancelled() && matrix.part == 'ui-a' }}
        run: bun scripts/ui-doc-select-race.ts
      - name: ui people see agents by nickname, never by handle, on the main screens (demo agents get real-looking handles)
        if: ${{ !cancelled() && matrix.part == 'ui-b' }}
        run: bun scripts/ui-handles.ts --dist ui/dist
      # DESIGN.md's rules of place, measured in the built page at two window sizes and in both layouts: the centre, the sidebar's edges and width, the tabs, hiding and peeking the sidebar, search, the panel (T339).
      - name: ui the layout rules hold, in WebKit
        if: ${{ !cancelled() && matrix.part == 'ui-b' }}
        run: bun scripts/ui-layout.ts --dist ui/dist
      - name: cli build
        if: ${{ !cancelled() && matrix.part == 'app' }}
        run: |
          bun run build && ./dist/kiwi --version && bun scripts/build-cli.ts --check
          probe="$RUNNER_TEMP/kiwi-autoload"
          mkdir -p "$probe"
          printf 'preload = ["./p.js"]\n' > "$probe/bunfig.toml"
          printf 'require("node:fs").writeFileSync("preload-ran", "")\n' > "$probe/p.js"
          (cd "$probe" && "$GITHUB_WORKSPACE/dist/kiwi" --version)
          test ! -e "$probe/preload-ran" || { echo "the kiwi CLI ran a bunfig.toml preload from the folder it was started in"; exit 1; }
      - name: cli smoke
        if: ${{ !cancelled() && matrix.part == 'app' }}
        run: bun scripts/smoke-cli.ts dist/kiwi
      - name: relay worker
        if: ${{ !cancelled() && matrix.part == 'app' }}
        run: bunx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"

  # The thread doc in Chromium and WebKit, written from the composer: replay, send, follow, image order, image copies, steady, a busy doc holding still and what the composer keeps from writing in the doc. Three legs balanced on the 2026-11-06 step medians (note gates/baseline): send ~2.2, edit ~2.4, view ~2.4 min of tests, every test exactly one leg; ci-ok fails unless every leg that ran passed.
  doc:
    name: build / doc, ${{ matrix.part }}
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['doc']
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.doc_still_loops != '' && 60 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        part: [send, edit, view]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/browser
        with:
          webkit: "true"
      - name: ui build
        run: bun run ui:build
      - name: ui harness build, with the plain-browser key store
        if: ${{ !cancelled() }}
        run: bun scripts/ui-harness.ts
      - name: doc replay, a line you send from the composer shows once, whole, in a second window of yours too
        if: ${{ !cancelled() && matrix.part == 'send' }}
        run: bun scripts/ui-doc-replay.ts --chromium --second-window --rounds=2
      - name: doc send, sending at the bottom, scrolled up or a long line keeps the view where it was
        if: ${{ !cancelled() && matrix.part == 'send' }}
        run: bun scripts/ui-send-scroll.ts
      - name: doc follow, at the bottom the view follows an agent's lines, also right after you send while it posts and edits, in Chromium and WebKit
        if: ${{ !cancelled() && matrix.part == 'view' }}
        run: bun scripts/ui-doc-follow.ts
      - name: rail needs-you, an agent's ask in another channel shows on its tile, stays 1 through a visit, and goes when the ask closes, while you sit in a channel
        if: ${{ !cancelled() && matrix.part == 'view' }}
        run: bun scripts/ui-rail-needs.ts
      - name: meadow, the scene behind onboarding and the site draws and moves, follows the clock, rests while hidden, holds still for reduced motion and reuses its renderer, in WebKit
        if: ${{ !cancelled() && matrix.part == 'view' }}
        run: bun scripts/ui-meadow.ts
      - name: doc image order, a line sent with an image from the composer stays above the lines sent after it
        if: ${{ !cancelled() && matrix.part == 'send' }}
        run: bun scripts/ui-doc-image-order.ts
      - name: send once, a message whose answer was lost or that was written with the relay away survives a reload and is delivered once
        if: ${{ !cancelled() && matrix.part == 'send' }}
        run: bun scripts/ui-send-once.ts
      - name: hidden blocks, a line in the feed is one bare node in the doc, selecting takes it once, and Back to draft gives a failed line back, in Chromium and WebKit
        if: ${{ !cancelled() && matrix.part == 'send' }}
        run: bun scripts/ui-doc-hidden.ts && bun scripts/ui-doc-hidden.ts --webkit
      - name: image copies, a Retina shot in the feed shows from a copy sized to its box and the doc mounts no second one, while the viewer, Save image and a drag get the original, in Chromium and WebKit
        if: ${{ !cancelled() && matrix.part == 'view' }}
        run: |
          status=0
          bun scripts/ui-image-thumbs.ts || status=1
          bun scripts/ui-image-thumbs.ts --webkit || status=1
          exit "$status"
      - name: doc steady, tall lines sent below the fold keep their height when you scroll to them, in Chromium and WebKit
        if: ${{ !cancelled() && matrix.part == 'send' }}
        run: |
          status=0
          bun scripts/ui-doc-steady.ts || status=1
          bun scripts/ui-doc-steady.ts --webkit || status=1
          exit "$status"
      - name: msg edit, an agent's edited message keeps its text on screen through every edit, in Chromium and WebKit
        if: ${{ !cancelled() && matrix.part == 'edit' }}
        run: |
          status=0
          bun scripts/ui-msg-edit.ts || status=1
          bun scripts/ui-msg-edit.ts --webkit || status=1
          exit "$status"
      - name: ui a busy thread doc never scrolls on its own, under the composer or while you read, in WebKit
        if: ${{ !cancelled() && matrix.part == 'view' }}
        env:
          LOOPS: ${{ inputs.doc_still_loops }}
        run: |
          if [ -z "$LOOPS" ]; then exec bun scripts/ui-doc-still.ts --dist ui/dist; fi
          case "$LOOPS" in *[!0-9]*) echo "doc_still_loops: a number of loops"; exit 1 ;; esac
          mkdir -p "$RUNNER_TEMP/doc-still"
          set -o pipefail
          bun scripts/ui-doc-still.ts --dist ui/dist --trace --loops "$LOOPS" 2>&1 | tee "$RUNNER_TEMP/doc-still/doc-still.log"
      - if: ${{ !cancelled() && matrix.part == 'view' && inputs.doc_still_loops != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doc-still-trace
          path: ${{ runner.temp }}/doc-still
          if-no-files-found: ignore
          overwrite: true
      - name: composer in a doc, late refusals keep the draft, PDFs, Edit in the composer, slow pasted images, the / menu and ⌘Enter, in Chromium and WebKit
        if: ${{ !cancelled() && matrix.part == 'send' }}
        run: |
          bun scripts/ui-composer-doc.ts &
          chromium=$!
          bun scripts/ui-composer-doc.ts --webkit &
          webkit=$!
          status=0
          wait "$chromium" || status=1
          wait "$webkit" || status=1
          exit "$status"
      - name: edit an old message, ↑ on a long line from past the 400-message window opens it whole, and saving keeps it whole for everyone
        if: ${{ !cancelled() && matrix.part == 'edit' }}
        run: bun scripts/ui-edit-old.ts

  # The thread doc's fuzzer and two owners sending side by side, each in Chromium and WebKit at once.
  fuzz:
    name: build / fuzz
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['fuzz']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/browser
        with:
          webkit: "true"
      - name: ui build
        run: bun run ui:build
      - name: ui harness build, with the plain-browser key store
        if: ${{ !cancelled() }}
        run: bun scripts/ui-harness.ts
      - name: doc fuzzer, fixed seeds, two windows of one person and an agent never lose or mix a line, in Chromium and WebKit
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/doc-fuzz"
          fuzz() {
            status=0
            for seed in 1 7 8; do
              bun scripts/ui-doc-fuzz.ts --"$1" --seed="$seed" --steps=120 --windows=2 --agents=1 --trace="$RUNNER_TEMP/doc-fuzz/$1-seed-$seed.txt" || status=1
            done
            return "$status"
          }
          fuzz chromium &
          chromium=$!
          fuzz webkit &
          webkit=$!
          status=0
          wait "$chromium" || status=1
          wait "$webkit" || status=1
          exit "$status"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doc-fuzz-traces
          path: ${{ runner.temp }}/doc-fuzz
          if-no-files-found: ignore
          overwrite: true
      - name: doc owners, two people sending at once from their composers each send one line of the doc as their own, in Chromium and WebKit
        if: ${{ !cancelled() }}
        run: |
          bun scripts/ui-doc-owner.ts &
          chromium=$!
          bun scripts/ui-doc-owner.ts --webkit &
          webkit=$!
          status=0
          wait "$chromium" || status=1
          wait "$webkit" || status=1
          exit "$status"

  shots:
    name: build / shots, ${{ matrix.engine }}
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['shots']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/browser
        with:
          webkit: "true"
      - run: bun run ui:build
      - name: ui shots in Chromium and WebKit, ${{ matrix.engine }}
        run: |
          pids=""
          for shard in 1/2 2/2; do
            if [ "${{ matrix.engine }}" = chromium ]; then
              bun scripts/shoot-app.ts --dist ui/dist --theme dark --shard "$shard" "$RUNNER_TEMP/shots" &
            else
              bun scripts/shoot-app.ts --dist ui/dist --browser webkit --theme light --shard "$shard" "$RUNNER_TEMP/shots-webkit" &
            fi
            pids="$pids $!"
          done
          status=0
          if [ "${{ matrix.engine }}" = chromium ]; then
            bun scripts/shoot-app.ts --dist ui/dist --size 390x844 --only channel,tasks --theme dark "$RUNNER_TEMP/shots/phone" || status=1
          fi
          for pid in $pids; do wait "$pid" || status=1; done
          exit "$status"
      - name: ui stash clicks in WebKit
        if: ${{ !cancelled() && matrix.engine == 'chromium' }}
        run: bun scripts/ui-stash-click.ts --dist ui/dist
      - name: shots wait for reaction requests in ${{ matrix.engine }}
        if: ${{ !cancelled() }}
        run: bun scripts/shots-settle.ts --browser ${{ matrix.engine }} --dist ui/dist
      - name: ui scrolling up a feed of event runs keeps loading to its first row, in WebKit
        if: ${{ !cancelled() && matrix.engine == 'webkit' }}
        run: bun scripts/ui-scroll-up.ts --dist ui/dist
      - name: ui the spec page uses a wide window and its comment box grows, in WebKit
        if: ${{ !cancelled() && matrix.engine == 'chromium' }}
        run: bun scripts/ui-spec-layout.ts --dist ui/dist
      - name: ui spec comments take keyboard focus, jump reply to reply, keep each spec's draft, and retry a failed send once, in WebKit
        if: ${{ !cancelled() && matrix.engine == 'webkit' }}
        run: bun scripts/ui-spec-comments.ts --dist ui/dist
      - name: ui Esc in search keeps the panel, and Settings doesn't offer a name change, in WebKit
        if: ${{ !cancelled() && matrix.engine == 'chromium' }}
        run: bun scripts/ui-esc-and-name.ts --dist ui/dist
      - name: ui the composer keeps each room's draft and images to itself, and an image sends without a file name as text, in WebKit
        if: ${{ !cancelled() && matrix.engine == 'webkit' }}
        run: bun scripts/ui-composer-rooms.ts --dist ui/dist
      - name: ui muting a room dims it in the sidebar, in WebKit
        if: ${{ !cancelled() && matrix.engine == 'chromium' }}
        run: bun scripts/ui-mute-room.ts --dist ui/dist
      - name: ui a refused copy selects the whole command and offers it by hand, and a landed one doesn't, in WebKit
        if: ${{ !cancelled() && matrix.engine == 'webkit' }}
        run: bun scripts/ui-copy-recovers.ts --dist ui/dist
      - name: ui the Tasks tab changes quiet time and where tasks land, and reads both back, with and without a repo, in WebKit
        if: ${{ !cancelled() && matrix.engine == 'webkit' }}
        run: bun scripts/ui-task-settings.ts --dist ui/dist --browser webkit
      - name: ui People lists you first, and your row opens your profile, in WebKit
        if: ${{ !cancelled() && matrix.engine == 'webkit' }}
        run: bun scripts/ui-people-you.ts --dist ui/dist
      - name: ui settings, profiles, Invite and Add an agent open in one modal that Esc, a click outside and Back close, with focus kept inside, in WebKit
        if: ${{ !cancelled() && matrix.engine == 'chromium' }}
        run: bun scripts/ui-modal.ts --dist ui/dist
      - name: ui edit and delete your own message (toolbar, Enter, ↑, Esc, the delete confirm), in WebKit
        if: ${{ !cancelled() && matrix.engine == 'webkit' }}
        run: bun scripts/ui-edit-delete.ts --dist ui/dist
      - name: ui search reaches older history, Search older history fetches more only on a click, and an older hit opens its stretch (Back to latest, react and copy only), in WebKit
        if: ${{ !cancelled() && matrix.engine == 'chromium' }}
        run: bun scripts/ui-older-search.ts --dist ui/dist
      - name: ui a reload keeps the room, tab and scroll, and ⌘[ / ⌘] step back and forward after search jumps, in WebKit
        if: ${{ !cancelled() && matrix.engine == 'webkit' }}
        run: bun scripts/ui-restore-place.ts --dist ui/dist
      - name: ui a click on a mention opens the direct conversation with that person, and their name inside it opens the profile
        if: ${{ !cancelled() }}
        run: bun scripts/ui-person-click.ts --dist ui/dist --browser ${{ matrix.engine }}
      - name: ui your own message is a bubble as wide as its longest line, with its picture, chip, reactions and replies on one right edge, and a run of them reads as one group
        if: ${{ !cancelled() }}
        run: bun scripts/ui-own-bubble.ts --dist ui/dist --browser ${{ matrix.engine }}
      - name: harness a page error names the check it came after, its stack and, for a resize observer loop, the element and the observer
        if: ${{ !cancelled() }}
        run: bun scripts/ui-page-errors.ts --browser ${{ matrix.engine }}
      - name: ui your own message shows its hover tools only over the bubble, what hangs on it or the tools, never on its words, and keyboard focus still shows them
        if: ${{ !cancelled() }}
        run: bun scripts/ui-own-tools.ts --dist ui/dist --browser ${{ matrix.engine }}
      - name: ui the line under your message names an agent that can't be woken or isn't listening, and a busy one with its task, the messages ahead and the lead to ask
        if: ${{ !cancelled() }}
        run: bun scripts/ui-signs.ts --dist ui/dist --browser ${{ matrix.engine }}
      - name: ui the sidebar stays where it is scrolled while its highlight glides to the row just opened, and a press on a row right after opens it
        if: ${{ !cancelled() }}
        run: bun scripts/ui-side-still.ts --dist ui/dist --browser ${{ matrix.engine }}
      - name: ui Copy link to message copies only the message's address, and a pasted or opened link jumps to it with ⌘[ back, in WebKit
        if: ${{ !cancelled() && matrix.engine == 'chromium' }}
        run: bun scripts/ui-message-link.ts --dist ui/dist
      - name: ui history archive (newest window on reload, rows kept below it, backfill, leave), on WebKit's IndexedDB
        if: ${{ !cancelled() && matrix.engine == 'webkit' }}
        run: bun scripts/ui-history-archive.ts
      - name: ui top bar in Chromium moves the window only from its background
        if: ${{ !cancelled() && matrix.engine == 'chromium' }}
        run: bun scripts/ui-drag-regions.ts --dist ui/dist
      - name: ui room replies in Chromium and WebKit, a reply shows inline with its quote and a message opens its thread
        if: ${{ !cancelled() && matrix.engine == 'webkit' }}
        run: bun scripts/ui-room-replies.ts --dist ui/dist && bun scripts/ui-room-replies.ts --dist ui/dist --webkit
      - name: ui onboarding's meadow holds still with the app's own Reduce motion, in Chromium and WebKit
        if: ${{ !cancelled() && matrix.engine == 'chromium' }}
        run: bun scripts/ui-onboarding-meadow.ts --dist ui/dist && bun scripts/ui-onboarding-meadow.ts --dist ui/dist --webkit
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-shots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
          overwrite: true
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-shots-webkit
          path: ${{ runner.temp }}/shots-webkit
          if-no-files-found: ignore
          overwrite: true

  desktop-mac:
    name: desktop / mac
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['desktop-mac']
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run ui:build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.hutch
          key: hutch-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/electrobun-pins.json') }}
      - name: electrobun toolchain
        working-directory: desktop
        timeout-minutes: 5
        run: for i in 1 2 3; do bun run prepare:eb && exit 0; echo "electrobun prepare failed ($i of 3)"; [ "$i" -lt 3 ] && sleep 20; done; exit 1
      - name: the kiwi CLI the app bundles
        run: mkdir -p dist && bun scripts/build-cli.ts --js dist/kiwi.js
      - working-directory: desktop
        env:
          DASH_RELEASE_OFFLINE: "1"
        run: bun run typecheck:eb
      - working-directory: desktop
        if: ${{ !cancelled() }}
        run: bun test --tsconfig-override tsconfig.eb.json ./eb-tests
      - name: history search on macOS's own SQLite (FTS5, the sealed index, the worker)
        if: ${{ !cancelled() }}
        run: bun test test/search-index.test.ts test/history-search.test.ts
      - name: the launcher's key channel leaves the main thread free (a real socket, macOS only)
        if: ${{ !cancelled() }}
        run: bun test test/desktop-launcher-wait.test.ts
      - working-directory: desktop
        if: ${{ !cancelled() }}
        env:
          DASH_RELEASE_OFFLINE: "1"
        run: bun run build:eb
      - if: ${{ !cancelled() }}
        run: bun desktop/scripts/eb-size.ts desktop/release-eb
      - if: ${{ !cancelled() }}
        run: bun desktop/scripts/eb-seal-check.ts
      - name: the launcher keeps BUN_*, NODE_*, DYLD_* and JSC_* out of the app
        if: ${{ !cancelled() }}
        run: bun desktop/scripts/eb-env-check.ts desktop/release-eb
      - name: quitting during the first start leaves no CLI build running and no half-made CLI behind
        if: ${{ !cancelled() }}
        run: bun desktop/scripts/eb-quit-check.ts desktop/release-eb
      - name: the launcher holds the store key for one session, refuses a changed app, and its C runs clean under ASan and UBSan
        if: ${{ !cancelled() }}
        run: bun desktop/scripts/eb-keys-check.ts desktop/release-eb
      - name: test build (the test driver in, its own bundle id)
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: bun scripts/eb.ts build --env=dev
        env:
          CHANNELS_EB_TEST: "1"
          DASH_RELEASE_OFFLINE: "1"
      - name: no test driver in the release build
        if: ${{ !cancelled() }}
        run: bun desktop/scripts/eb-driver-check.ts desktop/release-eb
      - name: smoke
        if: ${{ !cancelled() }}
        run: bun desktop/scripts/smoke-eb.ts desktop/release-eb/build/dev-macos-*/*.app
      - name: the window opens where it was left, at the size it was left (NSWindow frame autosave)
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: bun desktop/scripts/eb-frame-check.ts desktop/release-eb/build/dev-macos-*/*.app
      - name: the UI boots from a signed channel, swaps while the window is closed, survives restarts, and one that fails is banned (T1246)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: bun desktop/scripts/eb-ui-check.ts desktop/release-eb/build/dev-macos-*/*.app
      - name: a store the app can't read gets its own page instead of first-run, and is never written over (T1772)
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: bun desktop/scripts/eb-unreadable-check.ts desktop/release-eb/build/dev-macos-*/*.app
      - name: the frame is the window's own glass over a bright and a dark wallpaper, solid with Reduce transparency, and scrolling next to an opaque window (T2107)
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: |
          ax() { osascript -l JavaScript -e 'ObjC.import("AppKit"); const w = $.NSWorkspace.sharedWorkspace; `reduce transparency ${w.accessibilityDisplayShouldReduceTransparency}, increase contrast ${w.accessibilityDisplayShouldIncreaseContrast}`'; }
          echo "what draws this screen: $(system_profiler SPDisplaysDataType 2> /dev/null | grep -E 'Chipset Model|Vendor|Metal|Resolution' | sed -E 's/^ +//' | paste -sd ';' -), $(sysctl -n hw.model), macOS $(sw_vers -productVersion)"
          echo "this machine, as it comes: $(ax)"
          for key in reduceTransparency increaseContrast; do echo "com.apple.universalaccess $key: $(defaults read com.apple.universalaccess "$key" 2>&1 | tail -n 1), for every user: $(defaults read /Library/Preferences/com.apple.universalaccess "$key" 2>&1 | tail -n 1)"; done
          defaults write com.apple.universalaccess reduceTransparency -bool false || echo "the user's Reduce transparency can't be written"
          echo "after the user's setting: $(ax)"
          sudo defaults write /Library/Preferences/com.apple.universalaccess reduceTransparency -bool false || echo "the machine's Reduce transparency can't be written"
          echo "after the machine's setting: $(ax)"
          bun desktop/scripts/eb-glass-check.ts desktop/release-eb/build/dev-macos-*/*.app "$RUNNER_TEMP/glass"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: glass-mac
          path: ${{ runner.temp }}/glass
          if-no-files-found: ignore
          overwrite: true

  desktop-linux:
    name: desktop / linux, ${{ matrix.os }}
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['desktop-linux']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            sandbox: unsandboxed
            drive: false
          - os: ubuntu-26.04
            sandbox: sandboxed
            drive: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - id: image
        run: echo "key=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/linux-debs
          key: linux-debs-${{ runner.arch }}-${{ steps.image.outputs.key }}-${{ github.run_id }}
          restore-keys: linux-debs-${{ runner.arch }}-${{ steps.image.outputs.key }}-
      - name: WebKitGTK, its sandbox, Xvfb and the AppImage tools, from cached .debs when the mirror is slow
        timeout-minutes: 15
        run: |
          debs="$RUNNER_TEMP/linux-debs"
          mkdir -p "$debs/partial"
          find "$debs" -maxdepth 1 -name '*.deb' | wc -l > "$RUNNER_TEMP/debs-before"
          echo "Dir::Cache::Archives \"$debs/\";" | sudo tee /etc/apt/apt.conf.d/90linux-debs > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libpipewire-0.3-dev bison bubblewrap xdg-dbus-proxy xvfb xauth xdotool x11-utils squashfs-tools gnome-keyring libsecret-tools dbus ${{ matrix.drive && 'weston xwayland kwin-wayland plasma-wayland-protocols libkf6iconthemes-dev qt6-base-dev qt6-svg-plugins breeze-icon-theme sway swaybg grim gsettings-desktop-schemas libglib2.0-bin libwayland-dev python3-gi gir1.2-gtk-3.0 gir1.2-gdkpixbuf-2.0 openbox wmctrl' || '' }}
      - id: debs
        name: keep what apt downloaded, even when it ran out of time
        if: always()
        run: |
          debs="$RUNNER_TEMP/linux-debs"
          sudo rm -rf "$debs/partial" "$debs/lock"
          sudo chown -R "$(id -u):$(id -g)" "$debs"
          echo "new=$([ "$(find "$debs" -maxdepth 1 -name '*.deb' | wc -l)" -gt "$(cat "$RUNNER_TEMP/debs-before" 2> /dev/null || echo 0)" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: always() && steps.debs.outputs.new == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/linux-debs
          key: linux-debs-${{ runner.arch }}-${{ steps.image.outputs.key }}-${{ github.run_id }}
      - run: bun run ui:build
      - id: electrobun
        run: echo "version=$(bun -e 'console.log(require("./desktop/electrobun-pins.json").electrobun)')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.hutch
          key: hutch-${{ runner.os }}-${{ runner.arch }}-electrobun-${{ steps.electrobun.outputs.version }}
      - name: electrobun toolchain
        working-directory: desktop
        run: for i in 1 2 3; do bun run prepare:eb && exit 0; echo "electrobun prepare failed ($i of 3)"; sleep 20; done; exit 1
      - name: the kiwi CLI the app bundles
        run: mkdir -p dist && bun scripts/build-cli.ts --js dist/kiwi.js
      - working-directory: desktop
        env:
          DASH_RELEASE_OFFLINE: "1"
        run: bun run build:eb
      - name: the linux-arm64 Hutch and Livewire devkit match their pins (no job builds there)
        if: ${{ !cancelled() }}
        run: bun desktop/scripts/eb-pins-check.ts linux-arm64
      - name: the store on Linux, through a throwaway GNOME keyring and with no Secret Service
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          dbus-run-session -- sh -c 'printf throwaway | gnome-keyring-daemon --unlock --components=secrets >/dev/null && bun desktop/scripts/linux-store-check.ts keyring'
          DBUS_SESSION_BUS_ADDRESS=unix:path=/nonexistent/kiwi-no-session-bus bun desktop/scripts/linux-store-check.ts none
      - name: the AppImage, at most 60 MB
        if: ${{ !cancelled() }}
        run: bun desktop/scripts/package-linux.ts desktop/release-eb desktop/release-eb/linux
      - name: the AppImage holds the app
        if: ${{ !cancelled() }}
        run: bash desktop/scripts/linux-packages-check.sh desktop/release-eb/linux
      - name: the AppImage, extracted, is the app the checks below load and start
        if: ${{ !cancelled() }}
        run: |
          img=$(ls "$PWD"/desktop/release-eb/linux/Channels-*-linux-x86_64.AppImage)
          rm -rf "$RUNNER_TEMP/appimage" && mkdir -p "$RUNNER_TEMP/appimage"
          (cd "$RUNNER_TEMP/appimage" && "$img" --appimage-extract > /dev/null)
          [ -x "$RUNNER_TEMP/appimage/squashfs-root/Channels/bin/launcher" ] || { echo "the AppImage has no Channels/bin/launcher"; exit 1; }
          echo "APP=$RUNNER_TEMP/appimage/squashfs-root/Channels" >> "$GITHUB_ENV"
      - name: the app starts on WebKitGTK, with the .desktop entry's names, and its permission and page hooks work
        if: ${{ !cancelled() }}
        run: |
          cc -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/kiwi-shell-test" desktop/native/linux/kiwi-shell-test.c $(pkg-config --cflags --libs webkit2gtk-4.1) -ldl
          xvfb-run -a "$RUNNER_TEMP/kiwi-shell-test" "$APP/bin/libkiwi-shell.so" ${{ matrix.sandbox }}
          echo "for WebKitGTK's sandbox: kernel.apparmor_restrict_unprivileged_userns=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo unset)"
          xvfb-run -a -s "-screen 0 1280x800x24" bash desktop/scripts/eb-linux-start.sh "$APP/bin/launcher" ${{ matrix.sandbox }}
          img=$(ls "$PWD"/desktop/release-eb/linux/Channels-*-linux-x86_64.AppImage)
          xvfb-run -a -s "-screen 0 1280x800x24" bash desktop/scripts/eb-linux-start.sh "$img" ${{ matrix.sandbox }} --appimage-extract-and-run
      - name: a start that fails says why in a message box and in main.log, then quits (T1763), with a screenshot
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          export XVFB_FBDIR="$RUNNER_TEMP/start-failure-fb"
          mkdir -p "$XVFB_FBDIR"
          xvfb-run -a -s "-screen 0 1280x800x24 -fbdir $XVFB_FBDIR" bun desktop/scripts/start-failure-check.ts "$APP" "$RUNNER_TEMP/start-failure"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: start-failure-${{ matrix.os }}
          path: ${{ runner.temp }}/start-failure
          if-no-files-found: warn
          retention-days: 3
          overwrite: true
      - name: under Breeze Dark, KDE's icon loader (as Plasma's taskbar and Alt+Tab use it) draws the dark icon the AppImage installs, and the light one again under Breeze, live in one running process
        if: ${{ !cancelled() && matrix.drive }}
        timeout-minutes: 5
        run: bash desktop/scripts/icon-theme-check/check.sh "$RUNNER_TEMP/appimage/squashfs-root" "$RUNNER_TEMP/icon-theme-check"
      - name: test build (the test driver in, for the native click check)
        if: ${{ !cancelled() && matrix.drive }}
        working-directory: desktop
        run: bun scripts/eb.ts build --env=dev
        env:
          CHANNELS_EB_TEST: "1"
          DASH_RELEASE_OFFLINE: "1"
      - name: in the real app the Settings gear opens Settings, and a press on it never starts a window move, in both layouts
        if: ${{ !cancelled() && matrix.drive }}
        timeout-minutes: 5
        run: |
          test=$(ls -d "$PWD"/desktop/release-eb/build/dev-linux-*/* 2>/dev/null | head -n 1)
          [ -n "$test" ] || { echo "no dev-linux test build under desktop/release-eb/build"; exit 1; }
          xvfb-run -a -s "-screen 0 1280x800x24" bun desktop/scripts/eb-native-click.ts "$test"
      - name: Linux window controls sit at the top-right, act on the window under openbox, and their label follows the window manager
        if: ${{ !cancelled() && matrix.drive }}
        timeout-minutes: 5
        run: |
          test=$(ls -d "$PWD"/desktop/release-eb/build/dev-linux-*/* 2>/dev/null | head -n 1)
          [ -n "$test" ] || { echo "no dev-linux test build under desktop/release-eb/build"; exit 1; }
          xvfb-run -a -s "-screen 0 1280x800x24" bun desktop/scripts/eb-window-controls.ts "$test"
      - if: ${{ !cancelled() && matrix.drive }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: icon-theme-check-${{ matrix.os }}
          path: ${{ runner.temp }}/icon-theme-check/shots
          if-no-files-found: warn
          retention-days: 3
          overwrite: true
      - name: the tray uses Channels' symbolic icon and title where a tray host runs
        if: ${{ !cancelled() }}
        run: |
          cc -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/kiwi-tray-test" desktop/native/linux/kiwi-tray-test.c $(pkg-config --cflags --libs gio-2.0) -ldl
          dbus-run-session -- sh -c 'printf throwaway | gnome-keyring-daemon --unlock --components=secrets >/dev/null && xvfb-run -a "$1" "$2" "$3"' sh "$RUNNER_TEMP/kiwi-tray-test" "$APP/bin/libkiwi-shell.so" "$APP/bin/launcher"
      - name: with no libayatana-appindicator on the system (stock Arch), the app still starts, and closing still hides to the tray
        if: ${{ !cancelled() }}
        run: |
          if readelf -d "$APP/bin/libNativeWrapper.so" | grep -i appindicator; then echo "libNativeWrapper.so still links AppIndicator"; exit 1; fi
          echo "libNativeWrapper.so doesn't link AppIndicator"
          hidden="$RUNNER_TEMP/hidden-appindicator"
          mkdir -p "$hidden"
          sudo mv /usr/lib/x86_64-linux-gnu/libayatana-appindicator3.so.1* "$hidden/"
          code=0
          dbus-run-session -- "$RUNNER_TEMP/kiwi-tray-test" "$APP/bin/libkiwi-shell.so" no-indicator || code=$?
          xvfb-run -a -s "-screen 0 1280x800x24" bash desktop/scripts/eb-linux-start.sh "$APP/bin/launcher" ${{ matrix.sandbox }} || code=$?
          sudo mv "$hidden"/* /usr/lib/x86_64-linux-gnu/
          exit "$code"
      - name: the window follows the desktop's light or dark (the portal's color-scheme), live
        if: ${{ !cancelled() }}
        run: |
          cc -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/kiwi-scheme-test" desktop/native/linux/kiwi-scheme-test.c $(pkg-config --cflags --libs webkit2gtk-4.1) -ldl
          dbus-run-session -- xvfb-run -a "$RUNNER_TEMP/kiwi-scheme-test" "$APP/bin/libkiwi-shell.so"
      - name: the app menu's shortcuts work on Linux, where Electrobun has no app menu
        if: ${{ !cancelled() }}
        run: |
          cc -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/kiwi-shortcuts-test" desktop/native/linux/kiwi-shortcuts-test.c $(pkg-config --cflags --libs gtk+-3.0) -ldl
          xvfb-run -a "$RUNNER_TEMP/kiwi-shortcuts-test" "$APP/bin/libkiwi-shell.so"
      - name: the first window fits a small screen, keeps its minimum size and has the page's background
        if: ${{ !cancelled() }}
        run: |
          cc -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/kiwi-look-test" desktop/native/linux/kiwi-look-test.c $(pkg-config --cflags --libs gtk+-3.0) -ldl
          xvfb-run -a -s "-screen 0 1280x720x24" "$RUNNER_TEMP/kiwi-look-test" "$APP/bin/libkiwi-shell.so"
      - name: an image pasted from another app is served to the page only right after a real Ctrl+V or Shift+Insert
        if: ${{ !cancelled() }}
        run: |
          cc -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/kiwi-paste-test" desktop/native/linux/kiwi-paste-test.c $(pkg-config --cflags --libs webkit2gtk-4.1) -ldl
          xvfb-run -a "$RUNNER_TEMP/kiwi-paste-test" "$APP/bin/libkiwi-shell.so"
      - name: the taskbar badge shows the page's news count (LauncherEntry over D-Bus)
        if: ${{ !cancelled() }}
        run: |
          cc -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/kiwi-badge-test" desktop/native/linux/kiwi-badge-test.c $(pkg-config --cflags --libs gio-2.0) -ldl
          dbus-run-session -- "$RUNNER_TEMP/kiwi-badge-test" "$APP/bin/libkiwi-shell.so"
      - name: test build (the test driver in, its own id)
        if: ${{ !cancelled() && matrix.drive }}
        working-directory: desktop
        run: bun scripts/eb.ts build --env=dev
        env:
          CHANNELS_EB_TEST: "1"
          DASH_RELEASE_OFFLINE: "1"
      - id: test-app
        if: ${{ !cancelled() && matrix.drive }}
        run: |
          found=$(ls -d desktop/release-eb/build/dev-linux-*/*/bin/electrobun-launcher)
          [ "$(echo "$found" | wc -l)" = 1 ] || { echo "expected one test build, found: $found"; exit 1; }
          echo "path=$(dirname "$(dirname "$found")")" >> "$GITHUB_OUTPUT"
      - name: no test driver in the release build (the extracted AppImage)
        if: ${{ !cancelled() && matrix.drive }}
        run: bun desktop/scripts/eb-driver-check.ts desktop/release-eb "$APP"
      - name: smoke, under Xvfb
        if: ${{ !cancelled() && matrix.drive }}
        run: xvfb-run -a -s "-screen 0 1280x800x24" bun desktop/scripts/smoke-eb.ts "${{ steps.test-app.outputs.path }}"
      - name: a kiwi://join link opens the app on its join, cold and while it runs
        if: ${{ !cancelled() && matrix.drive }}
        timeout-minutes: 5
        run: xvfb-run -a -s "-screen 0 1280x800x24" bun desktop/scripts/join-link-eb.ts "${{ steps.test-app.outputs.path }}"
      - name: smoke, in a Wayland session as desktops run it (headless weston with XWayland, no Xvfb)
        if: ${{ !cancelled() && matrix.drive }}
        timeout-minutes: 10
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/wayland"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          weston --version
          weston --backend=headless --xwayland --socket=kiwi-wayland --width=1280 --height=800 --idle-time=0 > "$RUNNER_TEMP/weston.log" 2>&1 &
          compositor=$!
          x=""
          for _ in $(seq 1 50); do
            x=$(grep -oE 'listening on display :[0-9]+' "$RUNNER_TEMP/weston.log" | grep -oE ':[0-9]+$' | head -n 1 || true)
            [ -S "$XDG_RUNTIME_DIR/kiwi-wayland" ] && [ -n "$x" ] && break
            sleep 0.2
          done
          [ -S "$XDG_RUNTIME_DIR/kiwi-wayland" ] && [ -n "$x" ] || { echo "weston didn't open its Wayland socket and XWayland display:"; cat "$RUNNER_TEMP/weston.log"; exit 1; }
          echo "Wayland socket kiwi-wayland, XWayland display $x"
          session() { env -u XAUTHORITY -u GDK_BACKEND DISPLAY="$x" WAYLAND_DISPLAY=kiwi-wayland XDG_SESSION_TYPE=wayland "$@"; }
          code=0
          session bun desktop/scripts/smoke-eb.ts "${{ steps.test-app.outputs.path }}" || code=$?
          session bash desktop/scripts/eb-wayland-start.sh "$APP/bin/electrobun-launcher" || code=$?
          if [ "$code" -ne 0 ]; then
            echo "::group::weston's log"; cat "$RUNNER_TEMP/weston.log"; echo "::endgroup::"
            echo "::group::the test app alone in this session, for 20 s"
            mkdir -p "$RUNNER_TEMP/wayland-home" && HOME="$RUNNER_TEMP/wayland-home" session timeout 20 "${{ steps.test-app.outputs.path }}/bin/electrobun-launcher" > "$RUNNER_TEMP/wayland-app.log" 2>&1 || echo "exited $?"
            tail -n 120 "$RUNNER_TEMP/wayland-app.log"
            echo "::endgroup::"
          fi
          kill "$compositor" 2> /dev/null || true
          exit "$code"
      - name: smoke, natively on Wayland (headless weston at scale 2 with no XWayland, DISPLAY unset)
        if: ${{ !cancelled() && matrix.drive }}
        timeout-minutes: 10
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/wayland-native"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --socket=kiwi-native --width=2560 --height=1600 --scale=2 --idle-time=0 > "$RUNNER_TEMP/weston-native.log" 2>&1 &
          compositor=$!
          for _ in $(seq 1 50); do
            [ -S "$XDG_RUNTIME_DIR/kiwi-native" ] && break
            sleep 0.2
          done
          [ -S "$XDG_RUNTIME_DIR/kiwi-native" ] || { echo "weston didn't open its Wayland socket:"; cat "$RUNNER_TEMP/weston-native.log"; exit 1; }
          if pgrep -x Xwayland > /dev/null; then echo "an Xwayland is running, so this session isn't Wayland-only: $(pgrep -a -x Xwayland)"; exit 1; fi
          session() { env -u DISPLAY -u XAUTHORITY -u GDK_BACKEND WAYLAND_DISPLAY=kiwi-native XDG_SESSION_TYPE=wayland "$@"; }
          code=0
          session bun desktop/scripts/smoke-eb.ts "${{ steps.test-app.outputs.path }}" || code=$?
          session bash desktop/scripts/eb-wayland-start.sh "$APP/bin/electrobun-launcher" 2 || code=$?
          if [ "$code" -ne 0 ]; then
            echo "::group::weston's log"; cat "$RUNNER_TEMP/weston-native.log"; echo "::endgroup::"
            echo "::group::the test app alone in this session, for 20 s"
            mkdir -p "$RUNNER_TEMP/wayland-native-home" && HOME="$RUNNER_TEMP/wayland-native-home" session timeout 20 "${{ steps.test-app.outputs.path }}/bin/electrobun-launcher" > "$RUNNER_TEMP/wayland-native-app.log" 2>&1 || echo "exited $?"
            tail -n 120 "$RUNNER_TEMP/wayland-native-app.log"
            echo "::endgroup::"
          fi
          kill "$compositor" 2> /dev/null || true
          exit "$code"
      - name: clipboard and file drops, natively on Wayland (headless KWin with no XWayland, input through KWin's fake input)
        if: ${{ !cancelled() && matrix.drive }}
        timeout-minutes: 12
        run: bash desktop/scripts/wayland-check/kwin.sh "$PWD/${{ steps.test-app.outputs.path }}" "$RUNNER_TEMP/wayland-check"
      - name: tiling, scale and closing on wlroots as Hyprland and sway run it (headless sway with no XWayland), with screenshots
        if: ${{ !cancelled() && matrix.drive }}
        timeout-minutes: 12
        run: bash desktop/scripts/wlroots-check/sway.sh "$PWD/${{ steps.test-app.outputs.path }}" "$RUNNER_TEMP/wlroots-check"
      - name: on a floating desktop (headless weston) the shell draws GNOME's wallpaper, with no GTK title bar and close, minimize and maximize top left, with screenshots
        if: ${{ !cancelled() && matrix.drive }}
        timeout-minutes: 8
        run: bash desktop/scripts/floating-check/weston.sh "$PWD/${{ steps.test-app.outputs.path }}" "$RUNNER_TEMP/floating-check"
      - if: ${{ !cancelled() && matrix.drive }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: floating-check
          path: |
            ${{ runner.temp }}/floating-check/*.png
            ${{ runner.temp }}/floating-check/*.json
            ${{ runner.temp }}/floating-check/*.log
          if-no-files-found: warn
          retention-days: 3
      - if: ${{ !cancelled() && matrix.drive }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wlroots-check
          path: |
            ${{ runner.temp }}/wlroots-check/*.png
            ${{ runner.temp }}/wlroots-check/*.json
            ${{ runner.temp }}/wlroots-check/*.log
          if-no-files-found: warn
          retention-days: 3
      - name: what bwrap can do under this AppArmor, for an app profile later (prints only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          try() { out=$("$@" 2>&1) && echo "ok" || echo "refused: $(echo "$out" | head -n 1)"; }
          echo "kernel.apparmor_restrict_unprivileged_userns=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo unset)"
          echo "profiles in /etc/apparmor.d naming bwrap or userns: $(grep -lE 'bwrap|userns' /etc/apparmor.d/* 2>/dev/null | tr '\n' ' ')"
          echo "loaded profiles naming bwrap or userns: $(sudo grep -E 'bwrap|userns' /sys/kernel/security/apparmor/profiles | tr '\n' ';')"
          echo "bwrap --unshare-all, unprofiled: $(try bwrap --unshare-all --die-with-parent --ro-bind / / true)"
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile kiwi-userns-probe flags=(unconfined) {\n  userns,\n}\n' > "$RUNNER_TEMP/kiwi-userns-probe"
          sudo apparmor_parser -r "$RUNNER_TEMP/kiwi-userns-probe" && echo "loaded kiwi-userns-probe (unconfined, userns)"
          echo "under kiwi-userns-probe, bwrap itself: $(try aa-exec -p kiwi-userns-probe -- bwrap --unshare-all --die-with-parent --ro-bind / / true)"
          echo "under kiwi-userns-probe, bwrap exec'd from sh: $(try aa-exec -p kiwi-userns-probe -- sh -c 'bwrap --unshare-all --die-with-parent --ro-bind / / true')"
          echo "label of sh under kiwi-userns-probe, and of what it execs: $(aa-exec -p kiwi-userns-probe -- sh -c 'cat /proc/self/attr/current; echo; cat /proc/$$/attr/current' | tr '\n' ' ')"
          echo "label of bwrap's child under kiwi-userns-probe: $(aa-exec -p kiwi-userns-probe -- bwrap --unshare-all --die-with-parent --ro-bind / / cat /proc/self/attr/current 2>&1 | head -n 1)"
          echo "unshare -Urn under kiwi-userns-probe: $(try aa-exec -p kiwi-userns-probe -- unshare -Urn ip link set lo up)"
          echo "unshare -Urn, unprofiled: $(try unshare -Urn ip link set lo up)"
          sudo apparmor_parser -R "$RUNNER_TEMP/kiwi-userns-probe" || true
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages-${{ matrix.os }}
          path: desktop/release-eb/linux/*
          if-no-files-found: warn
          retention-days: 3
          overwrite: true

  # desktop / distros runs after merge: on every push to main and when a dispatch names it (naming
  # it also selects desktop-linux, the leg that builds its AppImage), not on default dispatches.
  # This is safe because release.yml's ci-green gate refuses to build or publish a tag whose exact
  # commit lacks a green push run — distros included — so a broken AppImage cannot ship.
  desktop-distros:
    name: desktop / distros, ${{ matrix.distro }}
    needs: [plan, desktop-linux]
    if: ${{ !cancelled() && fromJSON(needs.plan.outputs.run)['desktop-distros'] && (needs.desktop-linux.result == 'success' || inputs.release != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ${{ matrix.image }}
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: arch
            image: archlinux:latest
    steps:
      - name: git and tar for the checkout
        run: pacman -Sy --noconfirm git tar gzip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: ${{ inputs.release == '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages-ubuntu-24.04
          path: ${{ runner.temp }}/packages
      - name: the published ${{ inputs.release }} AppImage, matching its SHA256SUMS
        if: ${{ inputs.release != '' }}
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          base="https://github.com/${{ github.repository }}/releases/download/v$RELEASE"
          name="Channels-$RELEASE-linux-x86_64.AppImage"
          mkdir -p "$RUNNER_TEMP/packages" && cd "$RUNNER_TEMP/packages"
          curl -fsSL -o "$name" "$base/$name"
          curl -fsSL -o SHA256SUMS "$base/SHA256SUMS"
          grep " $name\$" SHA256SUMS | sha256sum -c -
      - name: the AppImage on a stock ${{ matrix.distro }}, under headless weston on native Wayland
        env:
          UPDATE_FROM: ${{ inputs.update_from }}
        run: bash desktop/scripts/distro-check/check.sh ${{ matrix.distro }} "$(ls "$RUNNER_TEMP"/packages/Channels-*-linux-x86_64.AppImage)" "$RUNNER_TEMP/distro-check" "$UPDATE_FROM"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distro-check-${{ matrix.distro }}
          path: ${{ runner.temp }}/distro-check
          if-no-files-found: warn
          retention-days: 3

  cli-macos:
    name: cli / macos
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['cli-macos']
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: brew install tmux
      - run: bun scripts/ci-tests.ts mac
      - run: |
          mkdir -p dist
          for t in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            bun scripts/build-cli.ts --target "bun-$t" --outfile "dist/kiwi-$t"
          done
          codesign --force --sign - dist/kiwi-darwin-arm64 dist/kiwi-darwin-x64
          ./dist/kiwi-darwin-arm64 --version
          probe="$RUNNER_TEMP/kiwi-autoload"
          mkdir -p "$probe"
          printf 'preload = ["./p.js"]\n' > "$probe/bunfig.toml"
          printf 'require("node:fs").writeFileSync("preload-ran", "")\n' > "$probe/p.js"
          (cd "$probe" && "$GITHUB_WORKSPACE/dist/kiwi-darwin-arm64" --version)
          test ! -e "$probe/preload-ran" || { echo "the kiwi CLI ran a bunfig.toml preload from the folder it was started in"; exit 1; }
      - name: pack, as the release does
        run: |
          cd dist
          for f in kiwi-*; do
            gzip -9 -n -k "$f"
            case "$f" in *-arm64) bcj=--arm64 ;; *) bcj=--x86 ;; esac
            xz "$bcj" --lzma2=preset=9 -T0 -k "$f"
          done
          bun ../scripts/cli-downloads.ts .

  # The iPhone app: Swift lint, then an unsigned build for devices with the engine bundled in.
  ios:
    name: ios / build
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['ios']
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: newest xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: phone engine types
        run: bunx tsrs --noEmit -p ios/engine/tsconfig.json && bunx tsrs --noEmit -p ios/scripts/tsconfig.json
      - name: swift lint
        if: ${{ !cancelled() }}
        run: xcrun swift-format lint -r --strict --configuration ios/.swift-format ios/Channels ios/ChannelsUITests
      - name: app build
        if: ${{ !cancelled() }}
        run: xcodebuild -project ios/Channels.xcodeproj -scheme Channels -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/ios" CODE_SIGNING_ALLOWED=NO build
      - name: every word the app shows is in its String Catalog
        if: ${{ !cancelled() }}
        run: bun ios/scripts/catalog-check.ts ios/Channels/Localizable.xcstrings "$RUNNER_TEMP/ios"
      - name: UI tests in the simulator (a Language pick changes the app at once, the phone's language is followed, updates sit behind an icon)
        if: ${{ !cancelled() }}
        run: |
          sim=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          xcodebuild -project ios/Channels.xcodeproj -scheme Channels -destination "id=$sim" -derivedDataPath "$RUNNER_TEMP/ios-sim" -resultBundlePath "$RUNNER_TEMP/languages.xcresult" -only-testing:ChannelsUITests/LanguageTests -only-testing:ChannelsUITests/UpdatesTests -only-testing:ChannelsUITests/DemoTests CODE_SIGNING_ALLOWED=NO test
      - name: language shots
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/ios-language-shots"
          [ -d "$RUNNER_TEMP/languages.xcresult" ] && xcrun xcresulttool export attachments --path "$RUNNER_TEMP/languages.xcresult" --output-path "$RUNNER_TEMP/ios-language-shots" || true
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-language-shots
          path: ${{ runner.temp }}/ios-language-shots
          if-no-files-found: ignore
          overwrite: true
      - name: the feed never goes blank while you type in a short channel, in the simulator
        if: ${{ !cancelled() }}
        run: |
          sim=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          xcodebuild -project ios/Channels.xcodeproj -scheme Channels -destination "id=$sim" -derivedDataPath "$RUNNER_TEMP/ios-sim" -resultBundlePath "$RUNNER_TEMP/feed.xcresult" -only-testing:ChannelsUITests/BlankFeedTests/testTheFeedStaysWhileTyping CODE_SIGNING_ALLOWED=NO test
      - name: feed shots
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/ios-feed-shots"
          [ -d "$RUNNER_TEMP/feed.xcresult" ] && xcrun xcresulttool export attachments --path "$RUNNER_TEMP/feed.xcresult" --output-path "$RUNNER_TEMP/ios-feed-shots" || true
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-feed-shots
          path: ${{ runner.temp }}/ios-feed-shots
          if-no-files-found: ignore
          overwrite: true

  # The Android app: Gradle bundles the engine, builds a release APK (R8) and runs Android lint on it.
  # The APK is signed with the repo's release keystore (KIWI_ANDROID_KEYSTORE_BASE64 with its password secrets,
  # the macOS certificate's pattern) on runs that can read the secrets; anywhere else it comes out unsigned,
  # never signed with the debug key. The APK is kept as an artifact to install on a phone.
  # Every screen is drawn on the JVM (Robolectric and Roborazzi), light and dark, and kept as the android-screens artifact.
  # Then the engine runs in Chromium the way Engine.kt hosts it, linked to a dev channel, through the kiwiAndroid bridge.
  android:
    name: android / build
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['android']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository/org/robolectric
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: phone engine types
        run: bunx tsrs --noEmit -p android/scripts/tsconfig.json
      - name: app build, lint and screens
        if: ${{ !cancelled() }}
        working-directory: android
        shell: bash
        env:
          KIWI_ANDROID_KEYSTORE_BASE64: ${{ secrets.KIWI_ANDROID_KEYSTORE_BASE64 }}
          KIWI_ANDROID_STORE_PASSWORD: ${{ secrets.KIWI_ANDROID_STORE_PASSWORD }}
          KIWI_ANDROID_KEY_ALIAS: ${{ secrets.KIWI_ANDROID_KEY_ALIAS }}
          KIWI_ANDROID_KEY_PASSWORD: ${{ secrets.KIWI_ANDROID_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/kiwi-release.p12"
          if [ -n "$KIWI_ANDROID_KEYSTORE_BASE64" ] && [ -n "$KIWI_ANDROID_STORE_PASSWORD" ] && [ -n "$KIWI_ANDROID_KEY_ALIAS" ]; then
            printf '%s' "$KIWI_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            export KIWI_ANDROID_KEYSTORE="$keystore"
          else
            echo "no release keystore secrets here: the APK will be unsigned"
          fi
          JAVA_HOME="$JAVA_HOME_17_X64" ./gradlew --no-daemon --stacktrace assembleRelease lintRelease recordRoborazziRelease
      - uses: ./.github/actions/browser
        if: ${{ !cancelled() }}
      - name: engine bridge
        if: ${{ !cancelled() }}
        run: bun android/scripts/bridge-check.ts
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: channels-android
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/reports/lint-results-release.html
          if-no-files-found: ignore
          overwrite: true
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-screens
          path: android/app/build/screens
          if-no-files-found: ignore
          overwrite: true

  # The one check to require: passes when every job the plan ran passed and the rest were skipped.
  ci-ok:
    name: ci-ok
    needs: [plan, static, test-unit, test-flows, build, doc, fuzz, shots, desktop-mac, desktop-linux, desktop-distros, cli-macos, ios, android]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          PLAN: ${{ needs.plan.outputs.run }}
        run: |
          p=$(echo "$NEEDS" | jq -r '.plan.result // "absent from needs"')
          if [ "$p" != "success" ]; then echo "plan: $p"; exit 1; fi
          if [ -z "$PLAN" ]; then echo "plan produced no job selection"; exit 1; fi
          sel=$(jq -n -r --argjson plan "$PLAN" 'if ($plan | type) == "object" and ([$plan | to_entries[] | .value] | all(type == "boolean")) and([$plan | to_entries[] | select(.value == true)] | length > 0) then "ok" else "invalid job selection" end')
          if [ "$sel" != "ok" ]; then echo "plan produced $sel"; exit 1; fi
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.key != "plan") | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"')
          if [ -n "$bad" ]; then echo "$bad"; exit 1; fi
          stray=$(echo "$NEEDS" | jq -r --argjson plan "$PLAN" 'to_entries[] | select(.key != "plan") | select($plan[.key] == false) | select(.value.result == "success") | "\(.key): ran but not selected"')
          if [ -n "$stray" ]; then echo "$stray"; exit 1; fi
          missing=$(jq -n -r --argjson plan "$PLAN" --argjson needs "$NEEDS" '$plan | to_entries[] | select(.value == true) | .key as $k | ($needs[$k].result // "absent from needs") as $r | select($r != "success") | "\($k): selected by plan, \($r)"')
          if [ -n "$missing" ]; then echo "$missing"; exit 1; fi
          echo "every selected job ran and passed"
