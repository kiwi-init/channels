name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      jobs:
        description: "Only these .github/jev-ci.yml jobs, comma-separated (desktop-linux, desktop-mac, …); empty runs everything"
        required: false
        default: ""

# A new push to a pull request cancels its run still in progress: only the newest commit's
# result matters there. Pushes to main share one group but never cancel the run in progress: it
# finishes, one run waits, and a newer push replaces the waiting one, so main's full run keeps
# finishing while merges come every few minutes. Each merge group has a ref of its own, so groups
# never cancel each other, and a dispatched run never cancels another.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_ref || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

# One job per area, its checks as steps: each job pays for one checkout and one install.
# A step that fails doesn't stop the checks after it (`!cancelled()`), so one run shows every failure.
jobs:
  # Decides which jobs this pull request or merge group can break (.github/jev-ci.yml): rules
  # first, then a cache of inputs that already passed, then Jev for the rest. A pull request runs
  # only its pull_request_jobs (repo / static, test / unit); a merge group is planned on its
  # combined change (merge_group.base_sha..head_sha) and runs every job that plan picks. A push to main runs
  # nothing when the merge queue already tested that commit as-is, and everything otherwise;
  # if planning fails, everything runs. Every check below runs only if the plan says so.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    outputs:
      run: ${{ steps.plan.outputs.run }}
      hashes: ${{ steps.plan.outputs.hashes }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - id: plan
        run: bun .github/jev-ci/cli.ts plan --github
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}

  # Types, lint, format, unused code and action pins.
  static:
    name: repo / static
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['static']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup
      - name: core types
        run: bunx tsc --noEmit && bunx tsc --noEmit -p tsconfig.worker.json
      - name: web types
        if: ${{ !cancelled() }}
        run: cd web && bunx tsc -b
      - name: desktop types
        if: ${{ !cancelled() }}
        run: cd desktop && bunx tsc --noEmit
      - name: phone engine types
        if: ${{ !cancelled() }}
        run: bunx tsc --noEmit -p ios/engine/tsconfig.json && bunx tsc --noEmit -p ios/scripts/tsconfig.json && bunx tsc --noEmit -p android/scripts/tsconfig.json
      - name: ui tokens
        if: ${{ !cancelled() }}
        run: bun scripts/ui-tokens.ts
      - name: lint
        if: ${{ !cancelled() }}
        run: bun run lint
      - name: format
        if: ${{ !cancelled() }}
        run: bun run format:check
      - name: web lint
        if: ${{ !cancelled() }}
        run: cd web && bun oxlint src
      - name: web format
        if: ${{ !cancelled() }}
        run: cd web && bun oxfmt --check src
      - name: knip
        if: ${{ !cancelled() }}
        run: bun run knip
      - name: action pins
        if: ${{ !cancelled() }}
        run: bun scripts/action-pins.ts
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: static
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['static'] }}

  test-unit:
    name: test / unit
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['test-unit']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: bun scripts/ci-tests.ts unit
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        timeout-minutes: 1
        with:
          job: test-unit
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['test-unit'] }}

  # The slow suites against a real local relay (scripts/ci-flows.ts).
  test-flows:
    name: test / flows
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['test-flows']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: bun scripts/ci-tests.ts flows
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        timeout-minutes: 1
        with:
          job: test-flows
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['test-flows'] }}

  # The web dashboard, the CLI binary and the worker, each built and smoke-tested.
  build:
    name: build / bundles
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['build']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/browser
      - name: web build
        run: cd web && bun run build
      - name: web bundle budget
        run: bun scripts/web-bundle.ts
      # Opens every menu, popover and dialog on the production build: Base UI throws on a
      # misplaced part only at render, which typecheck can't see (the b085ae8 crash).
      - name: ui smoke
        if: ${{ !cancelled() }}
        run: bun run smoke:ui
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-smoke-failure
          path: /tmp/kiwi-smoke-failure-*.png
          if-no-files-found: ignore
          overwrite: true
      - name: cli build
        if: ${{ !cancelled() }}
        run: |
          bun run build && ./dist/kiwi --version && bun scripts/build-cli.ts --check
          probe="$RUNNER_TEMP/kiwi-autoload"
          mkdir -p "$probe"
          printf 'preload = ["./p.js"]\n' > "$probe/bunfig.toml"
          printf 'require("node:fs").writeFileSync("preload-ran", "")\n' > "$probe/p.js"
          (cd "$probe" && "$GITHUB_WORKSPACE/dist/kiwi" --version)
          test ! -e "$probe/preload-ran" || { echo "the kiwi CLI ran a bunfig.toml preload from the folder it was started in"; exit 1; }
      - name: cli smoke
        if: ${{ !cancelled() }}
        run: bun scripts/smoke-cli.ts dist/kiwi
      - name: relay worker
        if: ${{ !cancelled() }}
        run: bunx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: build
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['build'] }}

  shots:
    name: build / shots
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['shots']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/browser
        with:
          webkit: "true"
      - run: bun run web:build
      - name: ui shots
        run: bun scripts/shoot-ui.ts --wide --phone channel,tasks --theme dark "$RUNNER_TEMP/shots"
      - name: ui shots in WebKit
        if: ${{ !cancelled() }}
        run: bun scripts/shoot-ui.ts --browser webkit --wide --theme light "$RUNNER_TEMP/shots-webkit"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-shots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
          overwrite: true
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-shots-webkit
          path: ${{ runner.temp }}/shots-webkit
          if-no-files-found: ignore
          overwrite: true
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: shots
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['shots'] }}

  desktop-mac:
    name: desktop / mac
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['desktop-mac']
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: bun run web:build
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.hutch
          key: hutch-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/electrobun-pins.json') }}
      - name: electrobun toolchain
        working-directory: desktop
        timeout-minutes: 5
        run: for i in 1 2 3; do bun run prepare:eb && exit 0; echo "electrobun prepare failed ($i of 3)"; [ "$i" -lt 3 ] && sleep 20; done; exit 1
      - name: the kiwi CLI the app bundles
        run: mkdir -p dist && bun scripts/build-cli.ts --js dist/kiwi.js
      - working-directory: desktop
        env:
          DASH_RELEASE_OFFLINE: "1"
        run: bun run typecheck:eb
      - working-directory: desktop
        if: ${{ !cancelled() }}
        run: bun test --tsconfig-override tsconfig.eb.json ./eb-tests
      - working-directory: desktop
        if: ${{ !cancelled() }}
        env:
          DASH_RELEASE_OFFLINE: "1"
        run: bun run build:eb
      - if: ${{ !cancelled() }}
        run: bun desktop/scripts/eb-size.ts desktop/release-eb
      - if: ${{ !cancelled() }}
        run: bun desktop/scripts/eb-seal-check.ts
      - name: the launcher keeps BUN_*, NODE_*, DYLD_* and JSC_* out of the app
        if: ${{ !cancelled() }}
        run: bun desktop/scripts/eb-env-check.ts desktop/release-eb
      - name: the launcher holds the store key for one session, refuses a changed app, and its C runs clean under ASan and UBSan
        if: ${{ !cancelled() }}
        run: bun desktop/scripts/eb-keys-check.ts desktop/release-eb
      - name: test build (the test driver in, its own bundle id)
        if: ${{ !cancelled() }}
        working-directory: desktop
        run: bun scripts/eb.ts build --env=dev
        env:
          CHANNELS_EB_TEST: "1"
          DASH_RELEASE_OFFLINE: "1"
      - name: no test driver in the release build
        if: ${{ !cancelled() }}
        run: bun desktop/scripts/eb-driver-check.ts desktop/release-eb
      - name: notifications show while the app is in front, and a click on one shows the window
        if: ${{ !cancelled() }}
        run: |
          t="$RUNNER_TEMP/KiwiNotesTest.app/Contents"
          mkdir -p "$t/MacOS"
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<plist version="1.0"><dict><key>CFBundleIdentifier</key><string>com.kiwiinit.channels.notes-test</string><key>CFBundleExecutable</key><string>kiwi-notes-test</string><key>CFBundlePackageType</key><string>APPL</string></dict></plist>\n' > "$t/Info.plist"
          clang -fobjc-arc -O2 -Wall -Wextra -Werror -arch arm64 -mmacosx-version-min=12.0 -framework AppKit -framework UserNotifications -o "$t/MacOS/kiwi-notes-test" desktop/native/macos/kiwi-notes-test.m
          codesign --force --sign - "$RUNNER_TEMP/KiwiNotesTest.app"
          "$t/MacOS/kiwi-notes-test" "$(ls -d desktop/release-eb/build/dev-macos-*/*.app)/Contents/MacOS/libkiwi-shell.dylib"
      - name: smoke
        if: ${{ !cancelled() }}
        run: bun desktop/scripts/smoke-eb.ts desktop/release-eb/build/dev-macos-*/*.app
      - name: the window opens where it was left, at the size it was left (NSWindow frame autosave)
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: bun desktop/scripts/eb-frame-check.ts desktop/release-eb/build/dev-macos-*/*.app
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        timeout-minutes: 1
        with:
          job: desktop-mac
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['desktop-mac'] }}

  desktop-linux:
    name: desktop / linux, ${{ matrix.os }}
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['desktop-linux']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            part: 1
            sandbox: unsandboxed
            drive: false
          - os: ubuntu-26.04
            part: 2
            sandbox: sandboxed
            drive: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - id: image
        run: echo "key=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/linux-debs
          key: linux-debs-${{ runner.arch }}-${{ steps.image.outputs.key }}-${{ github.run_id }}
          restore-keys: linux-debs-${{ runner.arch }}-${{ steps.image.outputs.key }}-
      - name: WebKitGTK, its sandbox, Xvfb and the AppImage tools, from cached .debs when the mirror is slow
        timeout-minutes: 15
        run: |
          debs="$RUNNER_TEMP/linux-debs"
          mkdir -p "$debs/partial"
          find "$debs" -maxdepth 1 -name '*.deb' | wc -l > "$RUNNER_TEMP/debs-before"
          echo "Dir::Cache::Archives \"$debs/\";" | sudo tee /etc/apt/apt.conf.d/90linux-debs > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libpipewire-0.3-dev bubblewrap xdg-dbus-proxy xvfb xauth xdotool x11-utils squashfs-tools gnome-keyring libsecret-tools dbus ${{ matrix.drive && 'weston xwayland kwin-wayland plasma-wayland-protocols libwayland-dev python3-gi gir1.2-gtk-3.0 gir1.2-gdkpixbuf-2.0' || '' }}
      - id: debs
        name: keep what apt downloaded, even when it ran out of time
        if: always()
        run: |
          debs="$RUNNER_TEMP/linux-debs"
          sudo rm -rf "$debs/partial" "$debs/lock"
          sudo chown -R "$(id -u):$(id -g)" "$debs"
          echo "new=$([ "$(find "$debs" -maxdepth 1 -name '*.deb' | wc -l)" -gt "$(cat "$RUNNER_TEMP/debs-before" 2> /dev/null || echo 0)" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: always() && steps.debs.outputs.new == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/linux-debs
          key: linux-debs-${{ runner.arch }}-${{ steps.image.outputs.key }}-${{ github.run_id }}
      - run: bun run web:build
      - id: electrobun
        run: echo "version=$(bun -e 'console.log(require("./desktop/package.json").devDependencies.electrobun)')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.hutch
          key: hutch-${{ runner.os }}-${{ runner.arch }}-electrobun-${{ steps.electrobun.outputs.version }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/kiwi-eb-native
          key: eb-native-${{ hashFiles('desktop/electrobun-pins.json') }}
      - name: electrobun toolchain
        working-directory: desktop
        run: for i in 1 2 3; do bun run prepare:eb && exit 0; echo "electrobun prepare failed ($i of 3)"; sleep 20; done; exit 1
      - name: the kiwi CLI the app bundles
        run: mkdir -p dist && bun scripts/build-cli.ts --js dist/kiwi.js
      - working-directory: desktop
        env:
          DASH_RELEASE_OFFLINE: "1"
        run: bun run build:eb
      - name: the linux-arm64 Hutch and devkit match their pins (no job builds there), and the native wrapper's source is Electrobun's release tag
        if: ${{ !cancelled() }}
        run: bun desktop/scripts/eb-pins-check.ts linux-arm64
      - name: the store on Linux, through a throwaway GNOME keyring and with no Secret Service
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          dbus-run-session -- sh -c 'printf throwaway | gnome-keyring-daemon --unlock --components=secrets >/dev/null && bun desktop/scripts/linux-store-check.ts keyring'
          env -u DBUS_SESSION_BUS_ADDRESS bun desktop/scripts/linux-store-check.ts none
      - name: deb and AppImage, each at most 40 MB
        if: ${{ !cancelled() }}
        run: bun desktop/scripts/package-linux.ts desktop/release-eb desktop/release-eb/linux
      - name: the packages hold the app
        if: ${{ !cancelled() }}
        run: bash desktop/scripts/linux-packages-check.sh desktop/release-eb/linux
      - name: the deb installs over today's Electron deb and keeps its launcher link
        if: ${{ !cancelled() }}
        run: bash desktop/scripts/linux-upgrade-check.sh desktop/release-eb/linux
      - name: the installed app starts on WebKitGTK, with the .desktop entry's names, and its permission and page hooks work
        if: ${{ !cancelled() }}
        run: |
          cc -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/kiwi-shell-test" desktop/native/linux/kiwi-shell-test.c $(pkg-config --cflags --libs webkit2gtk-4.1) -ldl
          xvfb-run -a "$RUNNER_TEMP/kiwi-shell-test" /opt/Channels/bin/libkiwi-shell.so ${{ matrix.sandbox }}
          echo "for WebKitGTK's sandbox: kernel.apparmor_restrict_unprivileged_userns=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo unset)"
          xvfb-run -a -s "-screen 0 1280x800x24" bash desktop/scripts/eb-linux-start.sh /opt/Channels/bin/launcher ${{ matrix.sandbox }}
          img=$(ls "$PWD"/desktop/release-eb/linux/Channels-*-linux-x86_64.AppImage)
          xvfb-run -a -s "-screen 0 1280x800x24" bash desktop/scripts/eb-linux-start.sh "$img" ${{ matrix.sandbox }} --appimage-extract-and-run
      - name: closing hides to the tray only where a tray host runs
        if: ${{ !cancelled() }}
        run: |
          cc -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/kiwi-tray-test" desktop/native/linux/kiwi-tray-test.c $(pkg-config --cflags --libs gio-2.0) -ldl
          dbus-run-session -- "$RUNNER_TEMP/kiwi-tray-test" /opt/Channels/bin/libkiwi-shell.so
      - name: with no libayatana-appindicator on the system (stock Fedora, Arch), the app still starts, with no tray
        if: ${{ !cancelled() }}
        run: |
          if readelf -d /opt/Channels/bin/libNativeWrapper.so | grep -i appindicator; then echo "libNativeWrapper.so still links AppIndicator"; exit 1; fi
          echo "libNativeWrapper.so doesn't link AppIndicator"
          hidden="$RUNNER_TEMP/hidden-appindicator"
          mkdir -p "$hidden"
          sudo mv /usr/lib/x86_64-linux-gnu/libayatana-appindicator3.so.1* "$hidden/"
          code=0
          dbus-run-session -- "$RUNNER_TEMP/kiwi-tray-test" /opt/Channels/bin/libkiwi-shell.so no-indicator || code=$?
          xvfb-run -a -s "-screen 0 1280x800x24" bash desktop/scripts/eb-linux-start.sh /opt/Channels/bin/launcher ${{ matrix.sandbox }} || code=$?
          sudo mv "$hidden"/* /usr/lib/x86_64-linux-gnu/
          exit "$code"
      - name: the window follows the desktop's light or dark (the portal's color-scheme), live
        if: ${{ !cancelled() }}
        run: |
          cc -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/kiwi-scheme-test" desktop/native/linux/kiwi-scheme-test.c $(pkg-config --cflags --libs webkit2gtk-4.1) -ldl
          dbus-run-session -- xvfb-run -a "$RUNNER_TEMP/kiwi-scheme-test" /opt/Channels/bin/libkiwi-shell.so
      - name: the app menu's shortcuts work on Linux, where Electrobun has no app menu
        if: ${{ !cancelled() }}
        run: |
          cc -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/kiwi-shortcuts-test" desktop/native/linux/kiwi-shortcuts-test.c $(pkg-config --cflags --libs gtk+-3.0) -ldl
          xvfb-run -a "$RUNNER_TEMP/kiwi-shortcuts-test" /opt/Channels/bin/libkiwi-shell.so
      - name: the first window fits a small screen, keeps its minimum size and has the page's background
        if: ${{ !cancelled() }}
        run: |
          cc -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/kiwi-look-test" desktop/native/linux/kiwi-look-test.c $(pkg-config --cflags --libs gtk+-3.0) -ldl
          xvfb-run -a -s "-screen 0 1280x720x24" "$RUNNER_TEMP/kiwi-look-test" /opt/Channels/bin/libkiwi-shell.so
      - name: notifications come from Channels over D-Bus, and a click opens the window
        if: ${{ !cancelled() }}
        run: |
          cc -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/kiwi-notify-test" desktop/native/linux/kiwi-notify-test.c $(pkg-config --cflags --libs gtk+-3.0) -ldl
          dbus-run-session -- xvfb-run -a "$RUNNER_TEMP/kiwi-notify-test" /opt/Channels/bin/libkiwi-shell.so
      - name: an image pasted from another app is served to the page only right after a real Ctrl+V or Shift+Insert
        if: ${{ !cancelled() }}
        run: |
          cc -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/kiwi-paste-test" desktop/native/linux/kiwi-paste-test.c $(pkg-config --cflags --libs webkit2gtk-4.1) -ldl
          xvfb-run -a "$RUNNER_TEMP/kiwi-paste-test" /opt/Channels/bin/libkiwi-shell.so
      - name: the taskbar badge shows the page's news count (LauncherEntry over D-Bus)
        if: ${{ !cancelled() }}
        run: |
          cc -O2 -Wall -Wextra -Werror -o "$RUNNER_TEMP/kiwi-badge-test" desktop/native/linux/kiwi-badge-test.c $(pkg-config --cflags --libs gio-2.0) -ldl
          dbus-run-session -- "$RUNNER_TEMP/kiwi-badge-test" /opt/Channels/bin/libkiwi-shell.so
      - name: test build (the test driver in, its own id)
        if: ${{ !cancelled() && matrix.drive }}
        working-directory: desktop
        run: bun scripts/eb.ts build --env=dev
        env:
          CHANNELS_EB_TEST: "1"
          DASH_RELEASE_OFFLINE: "1"
      - id: test-app
        if: ${{ !cancelled() && matrix.drive }}
        run: |
          found=$(ls -d desktop/release-eb/build/dev-linux-*/*/bin/electrobun-launcher)
          [ "$(echo "$found" | wc -l)" = 1 ] || { echo "expected one test build, found: $found"; exit 1; }
          echo "path=$(dirname "$(dirname "$found")")" >> "$GITHUB_OUTPUT"
      - name: no test driver in the release build (the installed deb)
        if: ${{ !cancelled() && matrix.drive }}
        run: bun desktop/scripts/eb-driver-check.ts desktop/release-eb /opt/Channels
      - name: smoke, under Xvfb
        if: ${{ !cancelled() && matrix.drive }}
        run: xvfb-run -a -s "-screen 0 1280x800x24" bun desktop/scripts/smoke-eb.ts "${{ steps.test-app.outputs.path }}"
      - name: smoke, in a Wayland session as desktops run it (headless weston with XWayland, no Xvfb)
        if: ${{ !cancelled() && matrix.drive }}
        timeout-minutes: 10
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/wayland"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          weston --version
          weston --backend=headless --xwayland --socket=kiwi-wayland --width=1280 --height=800 --idle-time=0 > "$RUNNER_TEMP/weston.log" 2>&1 &
          compositor=$!
          x=""
          for _ in $(seq 1 50); do
            x=$(grep -oE 'listening on display :[0-9]+' "$RUNNER_TEMP/weston.log" | grep -oE ':[0-9]+$' | head -n 1 || true)
            [ -S "$XDG_RUNTIME_DIR/kiwi-wayland" ] && [ -n "$x" ] && break
            sleep 0.2
          done
          [ -S "$XDG_RUNTIME_DIR/kiwi-wayland" ] && [ -n "$x" ] || { echo "weston didn't open its Wayland socket and XWayland display:"; cat "$RUNNER_TEMP/weston.log"; exit 1; }
          echo "Wayland socket kiwi-wayland, XWayland display $x"
          session() { env -u XAUTHORITY -u GDK_BACKEND DISPLAY="$x" WAYLAND_DISPLAY=kiwi-wayland XDG_SESSION_TYPE=wayland "$@"; }
          code=0
          session bun desktop/scripts/smoke-eb.ts "${{ steps.test-app.outputs.path }}" || code=$?
          session bash desktop/scripts/eb-wayland-start.sh /opt/Channels/bin/electrobun-launcher || code=$?
          if [ "$code" -ne 0 ]; then
            echo "::group::weston's log"; cat "$RUNNER_TEMP/weston.log"; echo "::endgroup::"
            echo "::group::the test app alone in this session, for 20 s"
            mkdir -p "$RUNNER_TEMP/wayland-home" && HOME="$RUNNER_TEMP/wayland-home" session timeout 20 "${{ steps.test-app.outputs.path }}/bin/electrobun-launcher" > "$RUNNER_TEMP/wayland-app.log" 2>&1 || echo "exited $?"
            tail -n 120 "$RUNNER_TEMP/wayland-app.log"
            echo "::endgroup::"
          fi
          kill "$compositor" 2> /dev/null || true
          exit "$code"
      - name: smoke, natively on Wayland (headless weston at scale 2 with no XWayland, DISPLAY unset)
        if: ${{ !cancelled() && matrix.drive }}
        timeout-minutes: 10
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/wayland-native"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --socket=kiwi-native --width=2560 --height=1600 --scale=2 --idle-time=0 > "$RUNNER_TEMP/weston-native.log" 2>&1 &
          compositor=$!
          for _ in $(seq 1 50); do
            [ -S "$XDG_RUNTIME_DIR/kiwi-native" ] && break
            sleep 0.2
          done
          [ -S "$XDG_RUNTIME_DIR/kiwi-native" ] || { echo "weston didn't open its Wayland socket:"; cat "$RUNNER_TEMP/weston-native.log"; exit 1; }
          if pgrep -x Xwayland > /dev/null; then echo "an Xwayland is running, so this session isn't Wayland-only: $(pgrep -a -x Xwayland)"; exit 1; fi
          session() { env -u DISPLAY -u XAUTHORITY -u GDK_BACKEND WAYLAND_DISPLAY=kiwi-native XDG_SESSION_TYPE=wayland "$@"; }
          code=0
          session bun desktop/scripts/smoke-eb.ts "${{ steps.test-app.outputs.path }}" || code=$?
          session bash desktop/scripts/eb-wayland-start.sh /opt/Channels/bin/electrobun-launcher 2 || code=$?
          if [ "$code" -ne 0 ]; then
            echo "::group::weston's log"; cat "$RUNNER_TEMP/weston-native.log"; echo "::endgroup::"
            echo "::group::the test app alone in this session, for 20 s"
            mkdir -p "$RUNNER_TEMP/wayland-native-home" && HOME="$RUNNER_TEMP/wayland-native-home" session timeout 20 "${{ steps.test-app.outputs.path }}/bin/electrobun-launcher" > "$RUNNER_TEMP/wayland-native-app.log" 2>&1 || echo "exited $?"
            tail -n 120 "$RUNNER_TEMP/wayland-native-app.log"
            echo "::endgroup::"
          fi
          kill "$compositor" 2> /dev/null || true
          exit "$code"
      - name: clipboard and file drops, natively on Wayland (headless KWin with no XWayland, input through KWin's fake input)
        if: ${{ !cancelled() && matrix.drive }}
        timeout-minutes: 12
        run: bash desktop/scripts/wayland-check/kwin.sh "$PWD/${{ steps.test-app.outputs.path }}" "$RUNNER_TEMP/wayland-check"
      - name: dpkg --purge leaves nothing of the app behind
        if: ${{ !cancelled() }}
        run: |
          sudo dpkg --purge kiwi-desktop
          left=$(ls -d /opt/Channels /usr/bin/channels-desktop /usr/share/applications/channels-desktop.desktop /usr/share/icons/hicolor/*/apps/channels-desktop.png 2> /dev/null || true)
          [ -z "$left" ] || { echo "left after --purge:"; echo "$left"; exit 1; }
          echo "purged: no files, link, entry or icons left"
      - name: what bwrap can do under this AppArmor, for an app profile later (prints only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          try() { out=$("$@" 2>&1) && echo "ok" || echo "refused: $(echo "$out" | head -n 1)"; }
          echo "kernel.apparmor_restrict_unprivileged_userns=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo unset)"
          echo "profiles in /etc/apparmor.d naming bwrap or userns: $(grep -lE 'bwrap|userns' /etc/apparmor.d/* 2>/dev/null | tr '\n' ' ')"
          echo "loaded profiles naming bwrap or userns: $(sudo grep -E 'bwrap|userns' /sys/kernel/security/apparmor/profiles | tr '\n' ';')"
          echo "bwrap --unshare-all, unprofiled: $(try bwrap --unshare-all --die-with-parent --ro-bind / / true)"
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile kiwi-userns-probe flags=(unconfined) {\n  userns,\n}\n' > "$RUNNER_TEMP/kiwi-userns-probe"
          sudo apparmor_parser -r "$RUNNER_TEMP/kiwi-userns-probe" && echo "loaded kiwi-userns-probe (unconfined, userns)"
          echo "under kiwi-userns-probe, bwrap itself: $(try aa-exec -p kiwi-userns-probe -- bwrap --unshare-all --die-with-parent --ro-bind / / true)"
          echo "under kiwi-userns-probe, bwrap exec'd from sh: $(try aa-exec -p kiwi-userns-probe -- sh -c 'bwrap --unshare-all --die-with-parent --ro-bind / / true')"
          echo "label of sh under kiwi-userns-probe, and of what it execs: $(aa-exec -p kiwi-userns-probe -- sh -c 'cat /proc/self/attr/current; echo; cat /proc/$$/attr/current' | tr '\n' ' ')"
          echo "label of bwrap's child under kiwi-userns-probe: $(aa-exec -p kiwi-userns-probe -- bwrap --unshare-all --die-with-parent --ro-bind / / cat /proc/self/attr/current 2>&1 | head -n 1)"
          echo "unshare -Urn under kiwi-userns-probe: $(try aa-exec -p kiwi-userns-probe -- unshare -Urn ip link set lo up)"
          echo "unshare -Urn, unprofiled: $(try unshare -Urn ip link set lo up)"
          sudo apparmor_parser -R "$RUNNER_TEMP/kiwi-userns-probe" || true
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-packages-${{ matrix.os }}
          path: desktop/release-eb/linux/*
          if-no-files-found: warn
          retention-days: 3
          overwrite: true
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: desktop-linux
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['desktop-linux'] }}
          shard: ${{ matrix.part }}of4

  desktop-distros:
    name: desktop / distros, ${{ matrix.distro }}
    needs: [plan, desktop-linux]
    if: ${{ !cancelled() && fromJSON(needs.plan.outputs.run)['desktop-distros'] && needs.desktop-linux.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ${{ matrix.image }}
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: fedora
            image: fedora:44
            part: 3
          - distro: arch
            image: archlinux:latest
            part: 4
    steps:
      - name: git and tar for the checkout
        run: if command -v dnf > /dev/null; then dnf -y -q install git tar gzip; else pacman -Sy --noconfirm git tar gzip; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-packages-ubuntu-24.04
          path: ${{ runner.temp }}/packages
      - name: the AppImage on a stock ${{ matrix.distro }}, under headless weston on native Wayland
        run: bash desktop/scripts/distro-check/check.sh ${{ matrix.distro }} "$(ls "$RUNNER_TEMP"/packages/Channels-*-linux-x86_64.AppImage)" "$RUNNER_TEMP/distro-check"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distro-check-${{ matrix.distro }}
          path: ${{ runner.temp }}/distro-check
          if-no-files-found: warn
          retention-days: 3
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: desktop-linux
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['desktop-linux'] }}
          shard: ${{ matrix.part }}of4

  cli-macos:
    name: cli / macos
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['cli-macos']
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: brew install tmux
      - run: bun scripts/ci-tests.ts all
      - run: |
          mkdir -p dist
          for t in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            bun scripts/build-cli.ts --target "bun-$t" --outfile "dist/kiwi-$t"
          done
          codesign --force --sign - dist/kiwi-darwin-arm64 dist/kiwi-darwin-x64
          ./dist/kiwi-darwin-arm64 --version
          probe="$RUNNER_TEMP/kiwi-autoload"
          mkdir -p "$probe"
          printf 'preload = ["./p.js"]\n' > "$probe/bunfig.toml"
          printf 'require("node:fs").writeFileSync("preload-ran", "")\n' > "$probe/p.js"
          (cd "$probe" && "$GITHUB_WORKSPACE/dist/kiwi-darwin-arm64" --version)
          test ! -e "$probe/preload-ran" || { echo "the kiwi CLI ran a bunfig.toml preload from the folder it was started in"; exit 1; }
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        timeout-minutes: 1
        with:
          job: cli-macos
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['cli-macos'] }}

  # The iPhone app: Swift lint, then an unsigned build for devices with the engine bundled in.
  ios:
    name: ios / build
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['ios']
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - name: newest xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: swift lint
        run: xcrun swift-format lint -r --strict --configuration ios/.swift-format ios/Channels ios/ChannelsUITests
      - name: app build
        if: ${{ !cancelled() }}
        run: xcodebuild -project ios/Channels.xcodeproj -scheme Channels -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/ios" CODE_SIGNING_ALLOWED=NO build
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        timeout-minutes: 1
        with:
          job: ios
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['ios'] }}

  # The iPhone app's gestures, with real touches: ios/ChannelsUITests in a simulator, on a canned channel.
  ios-gestures:
    name: ios / gestures
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['ios-gestures']
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - name: newest xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: simulator
        run: |
          SIM=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in devices if ".iOS-" in k), key=lambda k: [int(x) for x in k.rsplit(".iOS-", 1)[1].split("-")])
          print(next(d["udid"] for d in devices[runtimes[-1]] if d["name"].startswith("iPhone")))')
          echo "SIM=$SIM" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM"
          xcrun simctl bootstatus "$SIM"
      - name: gestures
        run: |
          set +e
          xcodebuild test -project ios/Channels.xcodeproj -scheme Channels -destination "id=$SIM" -derivedDataPath "$RUNNER_TEMP/ios-ui" -resultBundlePath "$RUNNER_TEMP/gestures.xcresult" CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/gestures.log" 2>&1
          code=$?
          grep -E "GESTURE|error:|Test Case .*(passed|failed)|\*\* TEST" "$RUNNER_TEMP/gestures.log"
          [ "$code" -eq 0 ] || tail -80 "$RUNNER_TEMP/gestures.log"
          exit "$code"
      - if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-gestures-xcresult
          path: ${{ runner.temp }}/gestures.xcresult
          if-no-files-found: ignore
          retention-days: 3
          overwrite: true
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        timeout-minutes: 1
        with:
          job: ios-gestures
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['ios-gestures'] }}

  # The Android app: Gradle bundles the engine, builds a release APK (R8, signed with the debug key in android/app/debug.p12
  # so every build installs over the last one) and runs Android lint on it. The APK is kept as an artifact to install on a phone.
  # Every screen is drawn on the JVM (Robolectric and Roborazzi), light and dark, and kept as the android-screens artifact.
  # Then the engine runs in Chromium the way Engine.kt hosts it, linked to a dev channel, through the kiwiAndroid bridge.
  android:
    name: android / build
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['android']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.m2/repository/org/robolectric
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: app build, lint and screens
        working-directory: android
        run: JAVA_HOME="$JAVA_HOME_17_X64" ./gradlew --no-daemon --stacktrace assembleRelease lintRelease recordRoborazziRelease
      - uses: ./.github/actions/browser
        if: ${{ !cancelled() }}
      - name: engine bridge
        if: ${{ !cancelled() }}
        run: bun android/scripts/bridge-check.ts
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: channels-android
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/reports/lint-results-release.html
          if-no-files-found: ignore
          overwrite: true
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-screens
          path: android/app/build/screens
          if-no-files-found: ignore
          overwrite: true
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        timeout-minutes: 1
        with:
          job: android
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['android'] }}

  # The one check to require: passes when every job the plan ran passed and the rest were skipped.
  # It also finishes the plan's comment on the pull request with each job's result.
  ci-ok:
    name: ci-ok
    needs: [plan, static, test-unit, test-flows, build, shots, desktop-mac, desktop-linux, desktop-distros, cli-macos, ios, ios-gestures, android]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun .github/jev-ci/cli.ts report --github
        env:
          NEEDS: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ github.token }}
