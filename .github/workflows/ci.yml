name: ci

on:
  push:
    branches: [main, "bus/**"]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels its run still in progress. Main and bus/staging keep every run.
concurrency:
  group: ci-${{ github.event.pull_request.number || (startsWith(github.ref, 'refs/heads/bus/') && github.ref != 'refs/heads/bus/staging' && github.ref_name) || format('{0}-{1}', github.ref_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (startsWith(github.ref, 'refs/heads/bus/') && github.ref != 'refs/heads/bus/staging') }}

permissions:
  contents: read

jobs:
  # Decides which jobs this pull request can break (.github/jev-ci.yml): rules first, then a
  # cache of inputs that already passed, then Jev for the rest. Pushes to main run everything,
  # and if planning fails, everything runs. Every check below runs only if the plan says so.
  # On bus/staging (the merge bus's test merge) it plans from main, so only what the item adds runs.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    outputs:
      run: ${{ steps.plan.outputs.run }}
      hashes: ${{ steps.plan.outputs.hashes }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: ${{ startsWith(github.ref, 'refs/heads/bus/') && '0' || '2' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - id: plan
        run: bun .github/jev-ci/cli.ts plan --github
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}

  core-types:
    name: core / types
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['core-types']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
        with:
          web: "false"
      - run: bunx tsc --noEmit && bunx tsc --noEmit -p tsconfig.worker.json
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: core-types
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['core-types'] }}

  core-test:
    name: core / test
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['core-test']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: bun scripts/ci-tests.ts core
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: core-test
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['core-test'] }}

  # The slow agent flows, split in two so they run side by side (scripts/ci-tests.ts).
  flows-a:
    name: core / flows-a
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['flows-a']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: bun scripts/ci-tests.ts flows-a
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: flows-a
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['flows-a'] }}

  flows-b:
    name: core / flows-b
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['flows-b']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: bun scripts/ci-tests.ts flows-b
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: flows-b
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['flows-b'] }}

  web-types:
    name: web / types
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['web-types']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: cd web && bunx tsc -b
      - run: bun scripts/ui-tokens.ts
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: web-types
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['web-types'] }}

  web-lint:
    name: web / lint
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['web-lint']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: cd web && bun oxlint src
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: web-lint
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['web-lint'] }}

  web-format:
    name: web / format
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['web-format']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: cd web && bun oxfmt --check src
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: web-format
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['web-format'] }}

  web-task-cards:
    name: web / task-cards
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['web-task-cards']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: bun test web/src/lib/task-cards.test.ts
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: web-task-cards
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['web-task-cards'] }}

  web-bundle:
    name: web / bundle
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['web-bundle']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: cd web && bun run build
      - run: bun scripts/web-bundle.ts
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: web-bundle
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['web-bundle'] }}

  # Opens every menu, popover and dialog on the production build: Base UI throws on a
  # misplaced part only at render, which typecheck can't see (the b085ae8 crash).
  ui-smoke:
    name: ui-smoke
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['ui-smoke']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - id: playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bunx playwright-core install-deps chromium-headless-shell
      - if: steps.playwright.outputs.cache-hit != 'true'
        run: bunx playwright-core install --only-shell chromium
      - run: cd web && bun run build
      - run: bun run smoke:ui
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-smoke-failure
          path: /tmp/kiwi-smoke-failure-*.png
          if-no-files-found: ignore
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: ui-smoke
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['ui-smoke'] }}

  desktop:
    name: desktop / build
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['desktop']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
        with:
          web: "false"
      - run: cd desktop && bun install --frozen-lockfile && bunx tsc --noEmit && bun run build
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: desktop
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['desktop'] }}

  desktop-fuses:
    name: desktop / fuses
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['desktop-fuses']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: bun run web:build
      - run: mkdir -p dist && bun scripts/build-cli.ts --target bun-linux-x64 --outfile dist/kiwi
      - working-directory: desktop
        run: bun install --frozen-lockfile && bun run build && bunx electron-builder --linux --dir --publish never
      - run: bun desktop/scripts/fuses.ts desktop/release/linux-unpacked/kiwi-desktop
      - run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - run: xvfb-run -a bun desktop/scripts/smoke.ts desktop/release/linux-unpacked/kiwi-desktop
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: desktop-fuses
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['desktop-fuses'] }}

  desktop-keys:
    name: desktop / keys
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['desktop-keys']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
        with:
          web: "false"
      - run: bun scripts/ci-tests.ts desktop-keys
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: desktop-keys
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['desktop-keys'] }}

  site-test:
    name: site / test
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['site-test']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
        with:
          web: "false"
      - run: bun scripts/ci-tests.ts site
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: site-test
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['site-test'] }}

  cli-build:
    name: cli / build
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['cli-build']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
        with:
          web: "false"
      - run: bun run build && ./dist/kiwi --version
      - run: bun scripts/build-cli.ts --check
      - run: bun scripts/smoke-cli.ts dist/kiwi
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: cli-build
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['cli-build'] }}

  cli-macos:
    name: cli / macos
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['cli-macos']
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: bun test
      - run: |
          mkdir -p dist
          for t in darwin-arm64 darwin-x64 linux-x64 linux-arm64 windows-x64; do
            ext=""; [ "$t" = windows-x64 ] && ext=".exe"
            bun scripts/build-cli.ts --target "bun-$t" --outfile "dist/kiwi-$t$ext"
          done
          codesign --force --sign - dist/kiwi-darwin-arm64 dist/kiwi-darwin-x64
          ./dist/kiwi-darwin-arm64 --version
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: cli-macos
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['cli-macos'] }}

  release-rehearsal:
    name: release / rehearsal
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['release-rehearsal']
    uses: ./.github/workflows/release-build.yml
    with:
      rehearsal: true
    secrets:
      MAC_CERT_P12_BASE64: ${{ github.event_name == 'workflow_dispatch' && secrets.MAC_CERT_P12_BASE64 || '' }}
      MAC_CERT_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.MAC_CERT_PASSWORD || '' }}
      APPLE_API_KEY_P8: ${{ github.event_name == 'workflow_dispatch' && secrets.APPLE_API_KEY_P8 || '' }}
      APPLE_API_KEY_ID: ${{ github.event_name == 'workflow_dispatch' && secrets.APPLE_API_KEY_ID || '' }}
      APPLE_API_ISSUER: ${{ github.event_name == 'workflow_dispatch' && secrets.APPLE_API_ISSUER || '' }}

  relay-worker:
    name: relay / worker
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['relay-worker']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
        with:
          web: "false"
      # wrangler.jsonc serves web/dist as assets; the bundle check doesn't need it built.
      - run: mkdir -p web/dist && bunx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: relay-worker
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['relay-worker'] }}

  relay-budget:
    name: relay / budget
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['relay-budget']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
        with:
          web: "false"
      - run: bun scripts/ci-tests.ts budget
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: relay-budget
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['relay-budget'] }}

  cli-seats:
    name: cli / seats
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['cli-seats']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
        with:
          web: "false"
      - run: bun scripts/ci-tests.ts seats
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: cli-seats
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['cli-seats'] }}

  cli-handoff:
    name: cli / handoff
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['cli-handoff']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
        with:
          web: "false"
      - run: bun scripts/ci-tests.ts handoff
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: cli-handoff
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['cli-handoff'] }}

  repo-comments:
    name: repo / comments
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['repo-comments']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install mypy==2.3.1
      - run: python -m mypy --strict scripts/ci
      - run: python -m unittest discover -s scripts/ci -p 'test_*.py'
      - run: python scripts/ci/no_comments.py --base HEAD^1
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: repo-comments
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['repo-comments'] }}

  repo-knip:
    name: repo / knip
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['repo-knip']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: cd desktop && bun install --frozen-lockfile
      - run: bun run knip
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: repo-knip
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['repo-knip'] }}

  repo-pins:
    name: repo / pins
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['repo-pins']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
        with:
          web: "false"
      - run: bun scripts/ci-tests.ts pins
      - run: bun scripts/action-pins.ts
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: repo-pins
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['repo-pins'] }}

  bus-test:
    name: bus / test
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['bus-test']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
        with:
          web: "false"
      - run: bun scripts/ci-tests.ts bus
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: bus-test
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['bus-test'] }}

  # The one check to require: passes when every job the plan ran passed and the rest were skipped.
  # It also finishes the plan's comment on the pull request with each job's result.
  ci-ok:
    name: ci-ok
    needs: [plan, core-types, core-test, flows-a, flows-b, web-types, web-lint, web-format, ui-smoke, desktop, desktop-fuses, cli-build, relay-worker, relay-budget, cli-seats, cli-handoff, repo-comments, desktop-keys, repo-knip, web-bundle, web-task-cards, site-test, repo-pins, bus-test, cli-macos, release-rehearsal]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun .github/jev-ci/cli.ts report --github
        env:
          NEEDS: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ github.token }}
      # A PR is squash-merged, and that commit's description is its changelog entry (scripts/changelog.ts):
      # a PR none of whose commits says what changed and why fails the gate. Version bumps are exempt.
      - if: always() && github.event_name == 'pull_request'
        run: bun scripts/changelog.ts --check "origin/$BASE_REF..HEAD"
        env:
          BASE_REF: ${{ github.base_ref }}
