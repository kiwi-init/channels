name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels its run still in progress: only the newest commit's
# result matters there. Every run on main has a group of its own, so no push or rehearsal
# cancels another and each commit on main gets a verdict (a cancelled run reads as red).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

# One job per area, its checks as steps: each job pays for one checkout and one install.
# A step that fails doesn't stop the checks after it (`!cancelled()`), so one run shows every failure.
jobs:
  # Decides which jobs this pull request can break (.github/jev-ci.yml): rules first, then a
  # cache of inputs that already passed, then Jev for the rest. Pushes to main run everything,
  # and if planning fails, everything runs. Every check below runs only if the plan says so.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    outputs:
      run: ${{ steps.plan.outputs.run }}
      hashes: ${{ steps.plan.outputs.hashes }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - id: plan
        run: bun .github/jev-ci/cli.ts plan --github
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}

  # Types, lint, format, unused code and action pins.
  static:
    name: repo / static
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['static']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup
      - name: core types
        run: bunx tsc --noEmit && bunx tsc --noEmit -p tsconfig.worker.json
      - name: web types
        if: ${{ !cancelled() }}
        run: cd web && bunx tsc -b
      - name: desktop types
        if: ${{ !cancelled() }}
        run: cd desktop && bunx tsc --noEmit
      - name: ui tokens
        if: ${{ !cancelled() }}
        run: bun scripts/ui-tokens.ts
      - name: lint
        if: ${{ !cancelled() }}
        run: bun run lint
      - name: format
        if: ${{ !cancelled() }}
        run: bun run format:check
      - name: web lint
        if: ${{ !cancelled() }}
        run: cd web && bun oxlint src
      - name: web format
        if: ${{ !cancelled() }}
        run: cd web && bun oxfmt --check src
      - name: knip
        if: ${{ !cancelled() }}
        run: bun run knip
      - name: action pins
        if: ${{ !cancelled() }}
        run: bun scripts/action-pins.ts
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: static
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['static'] }}

  test-unit:
    name: test / unit
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['test-unit']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: bun scripts/ci-tests.ts unit
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: test-unit
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['test-unit'] }}

  # The slow suites against a real local relay, split in two so they run side by side (scripts/ci-tests.ts).
  test-flows-a:
    name: test / flows-a
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['test-flows-a']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: bun scripts/ci-tests.ts flows-a
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: test-flows-a
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['test-flows-a'] }}

  test-flows-b:
    name: test / flows-b
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['test-flows-b']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: bun scripts/ci-tests.ts flows-b
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: test-flows-b
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['test-flows-b'] }}

  # The web dashboard, the CLI binary and the worker, each built and smoke-tested.
  build:
    name: build / bundles
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['build']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/browser
      - name: web build
        run: cd web && bun run build
      - name: web bundle budget
        run: bun scripts/web-bundle.ts
      # Opens every menu, popover and dialog on the production build: Base UI throws on a
      # misplaced part only at render, which typecheck can't see (the b085ae8 crash).
      - name: dictation model cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/dictation
          key: dictation-${{ hashFiles('packages/core/src/dictation.ts') }}
      - name: dictation model, pinned and verified
        run: bun scripts/dictation-files.ts "$RUNNER_TEMP/dictation"
      - name: ui smoke
        if: ${{ !cancelled() }}
        env:
          SMOKE_DICTATION: ${{ runner.temp }}/dictation
        run: bun run smoke:ui
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-smoke-failure
          path: /tmp/kiwi-smoke-failure-*.png
          if-no-files-found: ignore
      - name: cli build
        if: ${{ !cancelled() }}
        run: bun run build && ./dist/kiwi --version && bun scripts/build-cli.ts --check
      - name: cli smoke
        if: ${{ !cancelled() }}
        run: bun scripts/smoke-cli.ts dist/kiwi
      - name: relay worker
        if: ${{ !cancelled() }}
        run: bunx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: build
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['build'] }}

  shots:
    name: build / shots
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['shots']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/browser
      - run: bun run web:build
      - name: ui shots
        run: bun scripts/shoot-ui.ts --wide --phone channel,tasks --theme dark "$RUNNER_TEMP/shots"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-shots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: shots
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['shots'] }}

  perf-runs:
    name: perf / scale, run ${{ matrix.run }}
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['perf-runs']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        run: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/browser
      - run: bun run web:build
      - name: perf-scale
        env:
          PERF_SOAK_MIN: "0"
        run: bun scripts/perf-scale.ts --json "$RUNNER_TEMP/perf-${{ matrix.run }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf-scale-${{ matrix.run }}
          path: ${{ runner.temp }}/perf-${{ matrix.run }}.json
          if-no-files-found: error

  perf:
    name: perf / scale
    needs: [plan, perf-runs]
    if: fromJSON(needs.plan.outputs.run)['perf']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: perf-scale-*
          path: ${{ runner.temp }}/perf
          merge-multiple: true
      - name: medians against the gates
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bun scripts/perf-check.ts --comment "$RUNNER_TEMP"/perf/perf-*.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: perf
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['perf'] }}

  desktop:
    name: desktop / package
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['desktop']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: bun run web:build
      - run: mkdir -p dist && bun scripts/build-cli.ts --target bun-linux-x64 --outfile dist/kiwi && bun desktop/scripts/pack-cli.ts dist/kiwi
      - working-directory: desktop
        run: bun run build && bunx electron-builder --linux --dir --publish never
      - run: bun desktop/scripts/fuses.ts desktop/release/linux-unpacked/channels-desktop
      - run: bun desktop/scripts/size.ts desktop/release/linux-unpacked/channels-desktop
      - run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - run: xvfb-run -a bun desktop/scripts/smoke.ts desktop/release/linux-unpacked/channels-desktop
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .dictation-files
          key: dictation-${{ hashFiles('packages/core/src/dictation.ts') }}
      - run: bun scripts/dictation-files.ts .dictation-files
      - run: xvfb-run -a bun desktop/scripts/dictate.ts desktop/release/linux-unpacked/channels-desktop .dictation-files
        timeout-minutes: 12
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dictate-failure
          path: /tmp/kiwi-dictate-failure.png
          if-no-files-found: ignore
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        with:
          job: desktop
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['desktop'] }}

  cli-macos:
    name: cli / macos
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['cli-macos']
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: bun scripts/ci-tests.ts all --shard=${{ matrix.shard }}/3
      - if: matrix.shard == 1
        run: |
          mkdir -p dist
          for t in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            bun scripts/build-cli.ts --target "bun-$t" --outfile "dist/kiwi-$t"
          done
          codesign --force --sign - dist/kiwi-darwin-arm64 dist/kiwi-darwin-x64
          ./dist/kiwi-darwin-arm64 --version
      - uses: ./.github/actions/jev-ci-pass
        continue-on-error: true
        timeout-minutes: 1
        with:
          job: cli-macos
          hash: ${{ fromJSON(needs.plan.outputs.hashes)['cli-macos'] }}
          shard: ${{ matrix.shard }}of3

  release-rehearsal:
    name: release / rehearsal
    needs: plan
    if: fromJSON(needs.plan.outputs.run)['release-rehearsal']
    uses: ./.github/workflows/release-build.yml
    with:
      rehearsal: true

  # The one check to require: passes when every job the plan ran passed and the rest were skipped.
  # It also finishes the plan's comment on the pull request with each job's result.
  ci-ok:
    name: ci-ok
    needs: [plan, static, test-unit, test-flows-a, test-flows-b, build, shots, perf-runs, perf, desktop, cli-macos, release-rehearsal]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun .github/jev-ci/cli.ts report --github
        env:
          NEEDS: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ github.token }}
