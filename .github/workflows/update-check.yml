name: update-check

on:
  workflow_dispatch:
    inputs:
      from:
        description: "The Channels Livewire release installed first, as a version: 2026.10.2-livewire.2"
        required: true
      to:
        description: "The release it must update itself to, the newest Channels Livewire release: 2026.10.2-livewire.3"
        required: true

permissions:
  contents: read
  attestations: read

env:
  FROM: ${{ inputs.from }}
  TO: ${{ inputs.to }}

jobs:
  mac:
    name: the installed app updates itself, Mac arm64
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: bash desktop/scripts/update-check/versions.sh "$FROM" "$TO"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bash desktop/scripts/update-check/mac.sh "$FROM" "$TO" "$RUNNER_TEMP/mac"

  linux:
    name: the installed app updates itself, Linux ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: bash desktop/scripts/update-check/versions.sh "$FROM" "$TO"
      - run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-0 libayatana-appindicator3-1 librsvg2-2 bubblewrap xdg-dbus-proxy xvfb xauth fuse3 dbus-x11
      - env:
          GH_TOKEN: ${{ github.token }}
        run: dbus-run-session -- bash desktop/scripts/update-check/linux.sh "$FROM" "$TO" "$RUNNER_TEMP/linux"
