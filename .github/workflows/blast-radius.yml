name: blast-radius

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: "Judge this pull request (a number)"
        required: true

permissions:
  contents: read

concurrency:
  group: blast-radius-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  judge:
    name: pr / blast radius
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BUS_APP_CLIENT_ID }}
          private-key: ${{ secrets.BUS_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-pull-requests: write
      - name: label and flag
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BOT: ${{ steps.app.outputs.app-slug }}[bot]
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: bun scripts/blast-radius.ts
