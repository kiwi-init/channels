name: t5311 compression_tool probe
on:
  push:
    branches: [Channels5311-cli-size]
    paths: [.github/workflows/zz-t5311-probe.yml]
permissions: {}
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - run: |
          sw_vers
          uname -m
          ls -l /usr/bin/compression_tool
          command -v xz || echo "no xz on PATH"
          printf 'kiwi %.0s' $(seq 64) > plain
          arm64=/Td6WFoAAATm1rRGBMEVwAIKACEBHAAAAAAAAJ4XMQ3gAT8ADV0ANZpLVTCUYrSDAdIAAAAAAACVrZkR/gLWXAABMcACAAAAhSBvT7HEZ/sCAAAAAARZWg==
          x86=/Td6WFoAAATm1rRGBMEVwAIEACEBHAAAAAAAAJg8R1/gAT8ADV0ANZpLVTCUYrSDAdIAAAAAAACVrZkR/gLWXAABMcACAAAAhSBvT7HEZ/sCAAAAAARZWg==
          bad=0
          for pair in "arm64:$arm64" "x86:$x86"; do
            name=${pair%%:*}
            printf '%s' "${pair#*:}" | base64 -d > "$name.xz"
            if /usr/bin/compression_tool -decode -a lzma -i "$name.xz" -o "$name.out" && cmp -s plain "$name.out"; then
              echo "$name BCJ: decodes"
            else
              echo "$name BCJ: FAILS (exit $?)"
              bad=1
            fi
          done
          exit $bad
