name: distro-audit-t960

on:
  push:
    branches: [T960-distro-audit]

permissions:
  contents: read

jobs:
  audit:
    name: T960 audit, ${{ matrix.distro }} ${{ matrix.keyring }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: ${{ matrix.distro == 'fedora' && 'fedora:latest' || 'archlinux:latest' }}
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        distro: [fedora, arch]
        keyring: [gnome-keyring, kwallet, none]
    steps:
      - name: git and tar for checkout
        run: |
          if command -v dnf > /dev/null; then dnf -y -q install git tar gzip curl; else pacman -Sy --noconfirm git tar gzip curl; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: audit the released AppImage
        timeout-minutes: 30
        run: bash desktop/scripts/distro-audit/audit.sh ${{ matrix.distro }} ${{ matrix.keyring }} /tmp/audit 0.27.5
      - if: always()
        run: cat /tmp/audit/notes.txt || true
      - if: always()
        run: chmod -R a+rX /tmp/audit; rm -f /tmp/audit/*.sock; ls -la /tmp/audit | head -40
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t960-${{ matrix.distro }}-${{ matrix.keyring }}
          path: /tmp/audit
          retention-days: 3
