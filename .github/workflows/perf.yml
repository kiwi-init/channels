name: perf

on:
  workflow_dispatch:
    inputs:
      soak_only:
        description: "Minutes of soak for one diagnosis run, with no gates (empty runs the usual four runs and the 20-minute soak)"
        type: string
        default: ""
      soak_tabs:
        description: "0 keeps the soak on the conversation, with no tour of the views each minute"
        type: string
        default: ""
      soak_post:
        description: "0 has no agent post during the diagnosis soak, an idle control for soak_alloc (needs soak_only)"
        type: string
        default: ""
      soak_alloc:
        description: "yes makes the diagnosis soak estimate allocation per message sent from an 8 KiB sampling heap profile that keeps collected objects, on an unminified build (only with soak_only)"
        type: string
        default: ""
      soak_base:
        description: "large seeds a fold base the size of a busy real channel's (at least 3.4 MB) before the diagnosis soak, the same one every run (only with soak_only; empty keeps the usual one)"
        type: string
        default: ""
      jobs:
        description: "scale (the default), desktop (the packaged Mac app's cold start and idle memory, reported with no gate), pss (the Linux desktop app's PSS over time, release against release, #2629), doc (what a thread doc's updates cost, at a short and a long thread, no gate), upgrade (an older release's data opened by this build), replies (three agents answer one message, in the app), or all"
        type: string
        default: "scale"
      doc_lines:
        description: "Thread lengths for the doc job, space separated (empty is 40 400)"
        type: string
        default: ""
      upgrade_from:
        description: "The release tag the upgrade job starts from (empty is v2026.11.15)"
        type: string
        default: ""
      desktop_messages:
        description: "Messages in the channel the desktop app reopens (empty is 20)"
        type: string
        default: ""
      desktop_idle:
        description: "Seconds the desktop app idles before its memory is read (empty is 60, 0 skips it)"
        type: string
        default: ""
      pss_tags:
        description: "For the pss job: the release tags it compares, space separated, each built as a Linux test build (empty is v2026.11.29 v2026.11.30)"
        type: string
        default: ""
      pss_runs:
        description: "For the pss job: runs of each tag, alternating on one runner (empty is 2)"
        type: string
        default: ""
      pss_phases:
        description: "For the pss job: minutes of warm-up, of live sampling and of idle sampling (empty is 5 40 10)"
        type: string
        default: ""
      pss_seed:
        description: "For the pss job: large (the default, perf-scale's large base) or tiny (6 tasks and 60 messages, to check the job itself)"
        type: string
        default: ""
      paired:
        description: "yes runs a UI PR's head against its merge base on one runner, four alternating runs each, and fails on a regression or a gate the base meets (empty runs the usual four runs, the soak and the gates)"
        type: string
        default: ""
      paired_head_load:
        description: "A control for the paired check: loop iterations added to every head run's switches, keys and reload (empty adds none)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  perf:
    name: perf / scale and soak
    if: ${{ inputs.jobs != 'desktop' && inputs.jobs != 'doc' && inputs.jobs != 'upgrade' && inputs.jobs != 'replies' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/browser
      - run: bun scripts/ui-harness.ts
        env:
          HARNESS_MINIFY: ${{ inputs.soak_only != '' && inputs.soak_alloc == 'yes' && '0' || '' }}
      - name: perf-scale's reload probe ends only when the seeded row is shown two frames running, never on a delayed, held, hidden, off-screen or one-frame row
        run: bun scripts/perf-frame-probe.ts
      - name: perf-scale, one soak for a diagnosis
        if: ${{ inputs.soak_only != '' }}
        env:
          PERF_SOAK_MIN: ${{ inputs.soak_only }}
          PERF_SOAK_TABS: ${{ inputs.soak_tabs }}
          PERF_ALLOC: ${{ inputs.soak_alloc == 'yes' && '1' || '' }}
          PERF_SOAK_POST: ${{ inputs.soak_post }}
          PERF_BASE: ${{ inputs.soak_base }}
        run: bun scripts/perf-scale.ts --gated --json "$RUNNER_TEMP/perf-soak.json"
      - name: the merge base the paired check compares against
        id: base
        if: ${{ inputs.soak_only == '' && inputs.paired == 'yes' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "sha=$(gh api "repos/${{ github.repository }}/compare/main...${{ github.sha }}" --jq .merge_base_commit.sha)" >> "$GITHUB_OUTPUT"
      - if: ${{ inputs.soak_only == '' && inputs.paired == 'yes' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: perf-base
      - name: the merge base's build, driven by this head's perf-scale harness so both sides run the same workload
        if: ${{ inputs.soak_only == '' && inputs.paired == 'yes' }}
        run: |
          test "$(git -C perf-base rev-parse HEAD)" = "${{ steps.base.outputs.sha }}"
          bun scripts/perf-paired.ts copy perf-base
          cd perf-base && bun install --frozen-lockfile && bun scripts/ui-harness.ts
      - name: perf-scale, paired, base and head alternating four runs each on this runner
        if: ${{ inputs.soak_only == '' && inputs.paired == 'yes' }}
        shell: bash
        env:
          PERF_SOAK_MIN: "0"
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.sha }}
          HEAD_LOAD: ${{ inputs.paired_head_load }}
        run: |
          i=0
          for side in base head head base base head head base; do
            i=$((i + 1))
            if [ "$side" = base ]; then
              (cd perf-base && PERF_CONTROL=base PERF_APP_SHA="$BASE_SHA" bun scripts/perf-scale.ts --json "$RUNNER_TEMP/perf-pair-$i-base.json") || echo "run $i base" >> "$RUNNER_TEMP/perf-pair-failed.txt"
            else
              PERF_CONTROL=head PERF_APP_SHA="$HEAD_SHA" PERF_LOAD_UNITS="$HEAD_LOAD" bun scripts/perf-scale.ts --json "$RUNNER_TEMP/perf-pair-$i-head.json" || echo "run $i head" >> "$RUNNER_TEMP/perf-pair-failed.txt"
            fi
          done
      - name: head against its base, and against the gates
        if: ${{ !cancelled() && inputs.soak_only == '' && inputs.paired == 'yes' }}
        shell: bash
        run: bun scripts/perf-check.ts --paired --failed="$RUNNER_TEMP/perf-pair-failed.txt" "$RUNNER_TEMP"/perf-pair-*.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: perf-scale, four runs and one with the 20-minute soak
        if: ${{ inputs.soak_only == '' && inputs.paired == '' }}
        run: |
          for i in 1 2 3 4; do PERF_SOAK_MIN=0 bun scripts/perf-scale.ts --json "$RUNNER_TEMP/perf-$i.json"; done
          PERF_SOAK_MIN=20 bun scripts/perf-scale.ts --json "$RUNNER_TEMP/perf-5.json"
      - name: medians against the gates
        if: ${{ inputs.soak_only == '' && inputs.paired == '' }}
        shell: bash
        run: bun scripts/perf-check.ts --nightly "$RUNNER_TEMP"/perf-*.json | tee -a "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf
          path: |
            ${{ runner.temp }}/perf-*.json
            ${{ runner.temp }}/perf-pair-failed.txt
          if-no-files-found: ignore
          overwrite: true

  doc:
    name: perf / a thread doc's updates
    if: ${{ inputs.jobs == 'doc' || inputs.jobs == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/browser
      - run: bun scripts/ui-harness.ts
      - name: a short thread, then a long one; numbers only, no gate
        shell: bash
        env:
          DOC_LINES: ${{ inputs.doc_lines || '40 400' }}
        run: |
          for lines in $DOC_LINES; do
            bun scripts/perf-doc-updates.ts --lines=$lines --json="$RUNNER_TEMP/perf-doc-$lines.json"
          done
          { echo '```json'; jq -s . "$RUNNER_TEMP"/perf-doc-*.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  upgrade:
    name: perf / an older release's data opens in this build
    if: ${{ inputs.jobs == 'upgrade' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/browser
      - run: bun scripts/ui-harness.ts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.upgrade_from || 'v2026.11.15' }}
          path: old-release
      - name: the older release's own harness build
        working-directory: old-release
        run: bun install --frozen-lockfile && bun scripts/ui-harness.ts
      - name: its data, opened by this build
        run: bun scripts/ui-upgrade.ts --old=old-release
      - name: this build's own data, reopened by itself
        if: ${{ !cancelled() }}
        run: bun scripts/ui-upgrade.ts --old=.
      - name: the control, its data reopened by itself
        if: ${{ !cancelled() }}
        run: bun scripts/ui-upgrade.ts --old=old-release --control

  replies:
    name: perf / three agents answer one message, in the app
    if: ${{ inputs.jobs == 'replies' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/browser
      - run: bun scripts/ui-harness.ts
      - name: one answer, two under it, none dropped
        run: bun scripts/ui-replies-under.ts --shot="$RUNNER_TEMP/replies-under.png"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: replies-under
          path: ${{ runner.temp }}/replies-under.png
          if-no-files-found: ignore
          overwrite: true

  desktop:
    name: perf / desktop cold start and idle memory
    if: ${{ inputs.jobs == 'desktop' || inputs.jobs == 'all' }}
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run ui:build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.hutch
          key: hutch-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/electrobun-pins.json') }}
      - name: electrobun toolchain
        working-directory: desktop
        timeout-minutes: 5
        run: for i in 1 2 3; do bun run prepare:eb && exit 0; echo "electrobun prepare failed ($i of 3)"; [ "$i" -lt 3 ] && sleep 20; done; exit 1
      - name: the kiwi CLI the app bundles
        run: mkdir -p dist && bun scripts/build-cli.ts --js dist/kiwi.js
      - name: test build (the test driver in, its own bundle id)
        working-directory: desktop
        run: bun scripts/eb.ts build --env=dev
        env:
          CHANNELS_EB_TEST: "1"
          DASH_RELEASE_OFFLINE: "1"
      - name: cold start, nine launches, and memory after an idle minute; numbers only, no gate
        env:
          PERF_RUNS: "9"
          PERF_MESSAGES: ${{ inputs.desktop_messages || '20' }}
          PERF_IDLE_SEC: ${{ inputs.desktop_idle || '60' }}
        run: bun scripts/perf-desktop.ts desktop/release-eb/build/dev-macos-*/*.app --no-gate --json "$RUNNER_TEMP/perf-desktop.json"
      - name: the report
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          [ -f "$RUNNER_TEMP/perf-desktop.json" ] || { echo "no report was written"; exit 1; }
          { echo '```json'; jq '{runs, calibrationMs, measured, scaled, memory, startup}' "$RUNNER_TEMP/perf-desktop.json"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-desktop
          path: ${{ runner.temp }}/perf-desktop.json
          if-no-files-found: ignore
          overwrite: true

  pss:
    name: perf / desktop PSS on Linux, release against release
    if: ${{ inputs.jobs == 'pss' }}
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: WebKitGTK and Xvfb
        timeout-minutes: 15
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libpipewire-0.3-dev bison bubblewrap xdg-dbus-proxy xvfb xauth x11-utils
      - name: a Linux test build of each tag (the test driver in, its own id)
        timeout-minutes: 60
        env:
          TAGS: ${{ inputs.pss_tags || 'v2026.11.29 v2026.11.30' }}
          CHANNELS_EB_TEST: "1"
          DASH_RELEASE_OFFLINE: "1"
        run: |
          for tag in $TAGS; do
            dir="$RUNNER_TEMP/build-$tag"
            git worktree add --detach "$dir" "$tag"
            (
              cd "$dir"
              bun install --frozen-lockfile
              bun run ui:build
              (cd desktop && for i in 1 2 3; do bun run prepare:eb && exit 0; echo "electrobun prepare failed ($i of 3)"; [ "$i" -lt 3 ] && sleep 20; done; exit 1)
              mkdir -p dist && bun scripts/build-cli.ts --js dist/kiwi.js
              cd desktop && bun scripts/eb.ts build --env=dev
            )
            found=$(ls -d "$dir"/desktop/release-eb/build/dev-linux-*/*/bin/electrobun-launcher)
            [ "$(echo "$found" | wc -l)" = 1 ] || { echo "$tag: expected one test build, found: $found"; exit 1; }
            echo "$tag $(dirname "$(dirname "$found")")" >> "$RUNNER_TEMP/builds.txt"
          done
          cat "$RUNNER_TEMP/builds.txt"
      - name: PSS over time, the tags alternating on this runner
        env:
          RUNS: ${{ inputs.pss_runs || '2' }}
          PHASES: ${{ inputs.pss_phases || '5 40 10' }}
          SEED: ${{ inputs.pss_seed || 'large' }}
        run: |
          read -r warm live idle <<< "$PHASES"
          export PSS_WARM_MIN="$warm" PSS_LIVE_MIN="$live" PSS_IDLE_MIN="$idle"
          case "$SEED" in
            large) ;;
            tiny) export PERF_TASKS=6 PERF_MESSAGES=60 PERF_TASK_NOTES=1 ;;
            *) echo "pss_seed is large or tiny, not $SEED"; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/pss"
          for run in $(seq 1 "$RUNS"); do
            while read -r tag build; do
              echo "::group::$tag, run $run"
              xvfb-run -a -s "-screen 0 1280x800x24" bun scripts/perf-desktop-pss.ts "$build" --label "$tag" --json "$RUNNER_TEMP/pss/$tag-run$run.json"
              echo "::endgroup::"
            done < "$RUNNER_TEMP/builds.txt"
          done
      - name: the report
        if: ${{ !cancelled() }}
        run: |
          {
            echo '| run | process | min | median | max |'
            echo '|---|---|---|---|---|'
            for f in "$RUNNER_TEMP"/pss/*.json; do
              jq -r --arg r "$(basename "$f" .json)" '.perProcessMiB // {} | to_entries[] | "| \($r) | \(.key) | \(.value.min) | \(.value.median) | \(.value.max) |"' "$f"
            done
            echo
            for f in "$RUNNER_TEMP"/pss/*.json; do
              jq -r --arg r "$(basename "$f" .json)" '"**\($r)** web drops: \([.webDrops[]? | "\(.from) → \(.to)"] | join(", ") | if . == "" then "none" else . end); restarts: \(.restarts // [] | length)"' "$f"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-desktop-pss
          path: ${{ runner.temp }}/pss
          if-no-files-found: ignore
          overwrite: true
