name: perf

on:
  workflow_dispatch:
    inputs:
      soak_only:
        description: "Minutes of soak for one diagnosis run, with no gates (empty runs the usual four runs and the 20-minute soak)"
        type: string
        default: ""
      soak_tabs:
        description: "0 keeps the soak on the conversation, with no tour of the views each minute"
        type: string
        default: ""
      jobs:
        description: "scale (the default), desktop (the packaged Mac app's cold start and idle memory, reported with no gate), desktop-linux (the same for the Linux app under Xvfb), doc (what a thread doc's updates cost, at a short and a long thread, no gate), upgrade (an older release's data opened by this build), replies (three agents answer one message, in the app), or all"
        type: string
        default: "scale"
      doc_lines:
        description: "Thread lengths for the doc job, space separated (empty is 40 400)"
        type: string
        default: ""
      upgrade_from:
        description: "The release tag the upgrade job starts from (empty is v2026.11.15)"
        type: string
        default: ""
      desktop_messages:
        description: "Messages in the channel the desktop app reopens (empty is 20)"
        type: string
        default: ""
      desktop_idle:
        description: "Seconds the desktop app idles before its memory is read (empty is 60, 0 skips it)"
        type: string
        default: ""
      desktop_runner:
        description: "The macOS runner the desktop job runs on (empty is macos-latest; macos-26-intel when arm64 runners aren't acquired)"
        type: string
        default: ""
      desktop_jsc:
        description: "A Livewire ref (a branch, tag or SHA): the desktop job then also builds the app with its main process on that ref's JavaScriptCore host, no Bun in it, and measures it the same way after the Bun app (empty measures the Bun app only)"
        type: string
        default: ""
      paired:
        description: "yes runs a UI PR's head against its merge base on one runner, four alternating runs each, and fails on a regression or a gate the base meets (empty runs the usual four runs, the soak and the gates)"
        type: string
        default: ""
      paired_head_load:
        description: "A control for the paired check: loop iterations added to every head run's switches, keys and reload (empty adds none)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  perf:
    name: perf / scale and soak
    if: ${{ inputs.jobs != 'desktop' && inputs.jobs != 'desktop-linux' && inputs.jobs != 'doc' && inputs.jobs != 'upgrade' && inputs.jobs != 'replies' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/browser
      - run: bun scripts/ui-harness.ts
      - name: perf-scale's reload probe ends only when the seeded row is shown two frames running, never on a delayed, held, hidden, off-screen or one-frame row
        run: bun scripts/perf-frame-probe.ts
      - name: perf-scale, one soak for a diagnosis
        if: ${{ inputs.soak_only != '' }}
        env:
          PERF_SOAK_MIN: ${{ inputs.soak_only }}
          PERF_SOAK_TABS: ${{ inputs.soak_tabs }}
        run: bun scripts/perf-scale.ts --gated --json "$RUNNER_TEMP/perf-soak.json"
      - name: the merge base the paired check compares against
        id: base
        if: ${{ inputs.soak_only == '' && inputs.paired == 'yes' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "sha=$(gh api "repos/${{ github.repository }}/compare/main...${{ github.sha }}" --jq .merge_base_commit.sha)" >> "$GITHUB_OUTPUT"
      - if: ${{ inputs.soak_only == '' && inputs.paired == 'yes' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: perf-base
      - name: the merge base's build, driven by this head's perf-scale harness so both sides run the same workload
        if: ${{ inputs.soak_only == '' && inputs.paired == 'yes' }}
        run: |
          test "$(git -C perf-base rev-parse HEAD)" = "${{ steps.base.outputs.sha }}"
          bun scripts/perf-paired.ts copy perf-base
          cd perf-base && bun install --frozen-lockfile && bun scripts/ui-harness.ts
      - name: perf-scale, paired, base and head alternating four runs each on this runner
        if: ${{ inputs.soak_only == '' && inputs.paired == 'yes' }}
        shell: bash
        env:
          PERF_SOAK_MIN: "0"
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.sha }}
          HEAD_LOAD: ${{ inputs.paired_head_load }}
        run: |
          i=0
          for side in base head head base base head head base; do
            i=$((i + 1))
            if [ "$side" = base ]; then
              (cd perf-base && PERF_CONTROL=base PERF_APP_SHA="$BASE_SHA" bun scripts/perf-scale.ts --json "$RUNNER_TEMP/perf-pair-$i-base.json") || echo "run $i base" >> "$RUNNER_TEMP/perf-pair-failed.txt"
            else
              PERF_CONTROL=head PERF_APP_SHA="$HEAD_SHA" PERF_LOAD_UNITS="$HEAD_LOAD" bun scripts/perf-scale.ts --json "$RUNNER_TEMP/perf-pair-$i-head.json" || echo "run $i head" >> "$RUNNER_TEMP/perf-pair-failed.txt"
            fi
          done
      - name: head against its base, and against the gates
        if: ${{ !cancelled() && inputs.soak_only == '' && inputs.paired == 'yes' }}
        shell: bash
        run: bun scripts/perf-check.ts --paired --failed="$RUNNER_TEMP/perf-pair-failed.txt" "$RUNNER_TEMP"/perf-pair-*.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: perf-scale, four runs and one with the 20-minute soak
        if: ${{ inputs.soak_only == '' && inputs.paired == '' }}
        run: |
          for i in 1 2 3 4; do PERF_SOAK_MIN=0 bun scripts/perf-scale.ts --json "$RUNNER_TEMP/perf-$i.json"; done
          PERF_SOAK_MIN=20 bun scripts/perf-scale.ts --json "$RUNNER_TEMP/perf-5.json"
      - name: medians against the gates
        if: ${{ inputs.soak_only == '' && inputs.paired == '' }}
        shell: bash
        run: bun scripts/perf-check.ts --nightly "$RUNNER_TEMP"/perf-*.json | tee -a "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf
          path: |
            ${{ runner.temp }}/perf-*.json
            ${{ runner.temp }}/perf-pair-failed.txt
          if-no-files-found: ignore
          overwrite: true

  doc:
    name: perf / a thread doc's updates
    if: ${{ inputs.jobs == 'doc' || inputs.jobs == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/browser
      - run: bun scripts/ui-harness.ts
      - name: a short thread, then a long one; numbers only, no gate
        shell: bash
        env:
          DOC_LINES: ${{ inputs.doc_lines || '40 400' }}
        run: |
          for lines in $DOC_LINES; do
            bun scripts/perf-doc-updates.ts --lines=$lines --json="$RUNNER_TEMP/perf-doc-$lines.json"
          done
          { echo '```json'; jq -s . "$RUNNER_TEMP"/perf-doc-*.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  upgrade:
    name: perf / an older release's data opens in this build
    if: ${{ inputs.jobs == 'upgrade' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/browser
      - run: bun scripts/ui-harness.ts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.upgrade_from || 'v2026.11.15' }}
          path: old-release
      - name: the older release's own harness build
        working-directory: old-release
        run: bun install --frozen-lockfile && bun scripts/ui-harness.ts
      - name: its data, opened by this build
        run: bun scripts/ui-upgrade.ts --old=old-release
      - name: this build's own data, reopened by itself
        if: ${{ !cancelled() }}
        run: bun scripts/ui-upgrade.ts --old=.
      - name: the control, its data reopened by itself
        if: ${{ !cancelled() }}
        run: bun scripts/ui-upgrade.ts --old=old-release --control

  replies:
    name: perf / three agents answer one message, in the app
    if: ${{ inputs.jobs == 'replies' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/browser
      - run: bun scripts/ui-harness.ts
      - name: one answer, two under it, none dropped
        run: bun scripts/ui-replies-under.ts --shot="$RUNNER_TEMP/replies-under.png"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: replies-under
          path: ${{ runner.temp }}/replies-under.png
          if-no-files-found: ignore
          overwrite: true

  desktop:
    name: perf / desktop cold start and idle memory
    if: ${{ inputs.jobs == 'desktop' || inputs.jobs == 'all' }}
    runs-on: ${{ inputs.desktop_runner || 'macos-latest' }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run ui:build
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.hutch
          key: hutch-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/electrobun-pins.json') }}
      - name: electrobun toolchain
        working-directory: desktop
        timeout-minutes: 5
        run: for i in 1 2 3; do bun run prepare:eb && exit 0; echo "electrobun prepare failed ($i of 3)"; [ "$i" -lt 3 ] && sleep 20; done; exit 1
      - name: the kiwi CLI the app bundles
        run: mkdir -p dist && bun scripts/build-cli.ts --js dist/kiwi.js
      - name: test build (the test driver in, its own bundle id)
        working-directory: desktop
        run: bun scripts/eb.ts build --env=dev
        env:
          CHANNELS_EB_TEST: "1"
          DASH_RELEASE_OFFLINE: "1"
      - name: cold start, nine launches, and memory after an idle minute; numbers only, no gate
        env:
          PERF_RUNS: "9"
          PERF_MESSAGES: ${{ inputs.desktop_messages || '20' }}
          PERF_IDLE_SEC: ${{ inputs.desktop_idle || '60' }}
        run: bun scripts/perf-desktop.ts desktop/release-eb/build/dev-macos-*/*.app --no-gate --json "$RUNNER_TEMP/perf-desktop.json"
      - name: the Bun app's size
        if: ${{ inputs.desktop_jsc != '' }}
        run: du -sk desktop/release-eb/build/dev-macos-*/*.app | cut -f1 | tee "$RUNNER_TEMP/size-bun.txt"
      - if: ${{ inputs.desktop_jsc != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kiwi-init/electrobun-livewire
          ref: ${{ inputs.desktop_jsc }}
          path: livewire
      - name: Livewire's JavaScriptCore host, with glue for the app's own bun:ffi libraries (read from the Bun app's bundles) and its launcher (2026.11.4's would start Bun), built beside the pinned devkit against its SDK
        if: ${{ inputs.desktop_jsc != '' }}
        run: |
          core=$(find "$HOME/.hutch/releases/electrobun" -path "*/macos-$(uname -m | sed 's/x86_64/x64/')/libElectrobunCore.dylib" | head -n 1)
          [ -n "$core" ] || { echo "no libElectrobunCore.dylib under ~/.hutch/releases/electrobun"; exit 1; }
          app=$(ls -d desktop/release-eb/build/dev-macos-*/*.app)
          bun livewire/package/src/jsc-host/ffi/extract-app.ts --libs "$app/Contents/MacOS" --sdk desktop/.hutch/devkit/api/sdks/main "$app"/Contents/Resources/app/bun/*.js "$app/Contents/Resources/kiwi.js" | tee "$RUNNER_TEMP/app-ffi.json"
          sh livewire/package/src/jsc-host/overlay-devkit.sh desktop/.hutch/devkit "$RUNNER_TEMP/jsc-devkit" --launcher --check-lib "$core" --check-lib "$(dirname "$core")/libNativeWrapper.dylib" --extra "$RUNNER_TEMP/app-ffi.json"
      - name: test build with the main process on the JavaScriptCore host
        if: ${{ inputs.desktop_jsc != '' }}
        working-directory: desktop
        run: bun scripts/eb.ts build --env=dev
        env:
          CHANNELS_EB_TEST: "1"
          DASH_RELEASE_OFFLINE: "1"
          CHANNELS_JSC: "1"
          CHANNELS_JSC_HOST: ${{ runner.temp }}/jsc-devkit/api/jsc-host
      - name: the JavaScriptCore app's size, and its kiwi CLI on the host
        if: ${{ inputs.desktop_jsc != '' }}
        run: |
          app=$(ls -d desktop/release-eb/build/dev-macos-*/*.app)
          test ! -e "$app/Contents/MacOS/bun"
          du -sk "$app" | cut -f1 | tee "$RUNNER_TEMP/size-jsc.txt"
          "$app/Contents/MacOS/main" --no-env-file --no-install "$app/Contents/Resources/kiwi.js" --version
      - name: the same cold start and idle memory on the JavaScriptCore app
        if: ${{ inputs.desktop_jsc != '' }}
        env:
          PERF_RUNS: "9"
          PERF_MESSAGES: ${{ inputs.desktop_messages || '20' }}
          PERF_IDLE_SEC: ${{ inputs.desktop_idle || '60' }}
        run: bun scripts/perf-desktop.ts desktop/release-eb/build/dev-macos-*/*.app --no-gate --json "$RUNNER_TEMP/perf-desktop-jsc.json"
      - name: when the JavaScriptCore app didn't come up, what it says when it starts, through its launcher
        if: ${{ failure() && inputs.desktop_jsc != '' }}
        timeout-minutes: 3
        run: |
          app=$(ls -d desktop/release-eb/build/dev-macos-*/*.app | head -n 1)
          home=$(mktemp -d)
          export HOME="$home" CFFIXED_USER_HOME="$home" KIWI_HOME="$home/.kiwi" KIWI_EB_DRIVER="$home/driver.sock"
          echo "== Contents/MacOS/kiwi-launcher, as the test driver starts it"
          perl -e 'alarm shift; exec @ARGV' 30 "$app/Contents/MacOS/kiwi-launcher" 2>&1 | tail -n 80 || true
          find "$home" -type f -size -2M \( -name '*.log' -o -name '*.txt' \) -exec sh -c 'echo "== $1"; tail -n 80 "$1"' _ {} \;
      - name: the report
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          [ -f "$RUNNER_TEMP/perf-desktop.json" ] || { echo "no report was written"; exit 1; }
          { echo '```json'; jq '{runs, calibrationMs, measured, scaled, memory, startup}' "$RUNNER_TEMP/perf-desktop.json"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ inputs.desktop_jsc }}" ]; then
            echo "### On Livewire's JavaScriptCore host (${{ inputs.desktop_jsc }})" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "app size: Bun $(cat "$RUNNER_TEMP/size-bun.txt" 2>/dev/null) KB, JavaScriptCore $(cat "$RUNNER_TEMP/size-jsc.txt" 2>/dev/null) KB" | tee -a "$GITHUB_STEP_SUMMARY"
            [ -f "$RUNNER_TEMP/perf-desktop-jsc.json" ] || { echo "no JavaScriptCore report was written"; exit 1; }
            { echo '```json'; jq '{runs, calibrationMs, measured, scaled, memory, startup}' "$RUNNER_TEMP/perf-desktop-jsc.json"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-desktop
          path: |
            ${{ runner.temp }}/perf-desktop.json
            ${{ runner.temp }}/perf-desktop-jsc.json
          if-no-files-found: ignore
          overwrite: true

  desktop-linux:
    name: perf / desktop cold start and idle memory, Linux
    if: ${{ inputs.jobs == 'desktop-linux' || inputs.jobs == 'all' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: WebKitGTK, Xvfb, and what Livewire's JavaScriptCore host builds against
        timeout-minutes: 15
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libpipewire-0.3-dev bison xvfb xauth dbus libgcrypt20-dev libsqlite3-dev libsoup-3.0-dev xxd pkg-config
      - run: bun run ui:build
      - id: electrobun
        run: echo "version=$(bun -e 'console.log(require("./desktop/electrobun-pins.json").electrobun)')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.hutch
          key: hutch-${{ runner.os }}-${{ runner.arch }}-electrobun-${{ steps.electrobun.outputs.version }}
      - name: electrobun toolchain
        working-directory: desktop
        timeout-minutes: 5
        run: for i in 1 2 3; do bun run prepare:eb && exit 0; echo "electrobun prepare failed ($i of 3)"; [ "$i" -lt 3 ] && sleep 20; done; exit 1
      - name: the kiwi CLI the app bundles
        run: mkdir -p dist && bun scripts/build-cli.ts --js dist/kiwi.js
      - name: test build (the test driver in, its own bundle id)
        working-directory: desktop
        run: bun scripts/eb.ts build --env=dev
        env:
          CHANNELS_EB_TEST: "1"
          DASH_RELEASE_OFFLINE: "1"
      - name: cold start, nine launches, and memory after an idle minute under Xvfb; numbers only, no gate
        env:
          PERF_RUNS: "9"
          PERF_MESSAGES: ${{ inputs.desktop_messages || '20' }}
          PERF_IDLE_SEC: ${{ inputs.desktop_idle || '60' }}
        run: |
          app=$(ls -d "$PWD"/desktop/release-eb/build/dev-linux-*/* | head -n 1)
          du -sk "$app" | cut -f1 > "$RUNNER_TEMP/size-bun.txt"
          xvfb-run -a -s "-screen 0 1280x800x24" bun scripts/perf-desktop.ts "$app" --no-gate --json "$RUNNER_TEMP/perf-desktop.json"
      - if: ${{ inputs.desktop_jsc != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kiwi-init/electrobun-livewire
          ref: ${{ inputs.desktop_jsc }}
          path: livewire
      - name: Livewire's JavaScriptCore host, with glue for the app's own bun:ffi libraries (read from the Bun app's bundles) and its launcher (2026.11.4's would start Bun), built beside the pinned devkit against its SDK
        if: ${{ inputs.desktop_jsc != '' }}
        run: |
          core=$(find "$HOME/.hutch/releases/electrobun" -path "*/linux-x64/libElectrobunCore.so" | head -n 1)
          [ -n "$core" ] || { echo "no libElectrobunCore.so under ~/.hutch/releases/electrobun"; exit 1; }
          app=$(ls -d "$PWD"/desktop/release-eb/build/dev-linux-*/* | head -n 1)
          bun livewire/package/src/jsc-host/ffi/extract-app.ts --libs "$app/bin" --sdk desktop/.hutch/devkit/api/sdks/main "$app"/Resources/app/bun/*.js "$app/Resources/kiwi.js" | tee "$RUNNER_TEMP/app-ffi.json"
          sh livewire/package/src/jsc-host/overlay-devkit.sh desktop/.hutch/devkit "$RUNNER_TEMP/jsc-devkit" --launcher --check-lib "$core" --check-lib "$(dirname "$core")/libNativeWrapper.so" --extra "$RUNNER_TEMP/app-ffi.json"
      - name: test build with the main process on the JavaScriptCore host
        if: ${{ inputs.desktop_jsc != '' }}
        working-directory: desktop
        run: bun scripts/eb.ts build --env=dev
        env:
          CHANNELS_EB_TEST: "1"
          DASH_RELEASE_OFFLINE: "1"
          CHANNELS_JSC: "1"
          CHANNELS_JSC_HOST: ${{ runner.temp }}/jsc-devkit/api/jsc-host
      - name: the same on the JavaScriptCore app, after its size and its kiwi CLI on the host
        if: ${{ inputs.desktop_jsc != '' }}
        env:
          PERF_RUNS: "9"
          PERF_MESSAGES: ${{ inputs.desktop_messages || '20' }}
          PERF_IDLE_SEC: ${{ inputs.desktop_idle || '60' }}
        run: |
          app=$(ls -d "$PWD"/desktop/release-eb/build/dev-linux-*/* | head -n 1)
          test ! -e "$app/bin/bun"
          du -sk "$app" | cut -f1 > "$RUNNER_TEMP/size-jsc.txt"
          "$app/bin/main" --no-env-file --no-install "$app/Resources/kiwi.js" --version
          xvfb-run -a -s "-screen 0 1280x800x24" bun scripts/perf-desktop.ts "$app" --no-gate --json "$RUNNER_TEMP/perf-desktop-jsc.json"
      - name: when the JavaScriptCore app didn't come up, what it says when it starts, through its launcher
        if: ${{ failure() && inputs.desktop_jsc != '' }}
        timeout-minutes: 3
        run: |
          app=$(ls -d "$PWD"/desktop/release-eb/build/dev-linux-*/* | head -n 1)
          home=$(mktemp -d)
          export HOME="$home" CFFIXED_USER_HOME="$home" XDG_CONFIG_HOME="$home/.config" XDG_DATA_HOME="$home/.local/share" XDG_CACHE_HOME="$home/.cache" XDG_STATE_HOME="$home/.local/state" KIWI_HOME="$home/.kiwi" KIWI_EB_DRIVER="$home/driver.sock"
          echo "== bin/electrobun-launcher, as the test driver starts it"
          timeout 30 xvfb-run -a "$app/bin/electrobun-launcher" 2>&1 | tail -n 80 || true
          find "$home" -type f -size -2M \( -name '*.log' -o -name '*.txt' \) -exec sh -c 'echo "== $1"; tail -n 80 "$1"' _ {} \;
      - name: the report
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          [ -f "$RUNNER_TEMP/perf-desktop.json" ] || { echo "no report was written"; exit 1; }
          echo "### Linux, Bun app: $(cat "$RUNNER_TEMP/size-bun.txt" 2>/dev/null) KB" | tee -a "$GITHUB_STEP_SUMMARY"
          { echo '```json'; jq '{runs, calibrationMs, measured, scaled, memory, startup}' "$RUNNER_TEMP/perf-desktop.json"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ inputs.desktop_jsc }}" ]; then
            echo "### Linux, on Livewire's JavaScriptCore host (${{ inputs.desktop_jsc }}): $(cat "$RUNNER_TEMP/size-jsc.txt" 2>/dev/null) KB" | tee -a "$GITHUB_STEP_SUMMARY"
            [ -f "$RUNNER_TEMP/perf-desktop-jsc.json" ] || { echo "no JavaScriptCore report was written"; exit 1; }
            { echo '```json'; jq '{runs, calibrationMs, measured, scaled, memory, startup}' "$RUNNER_TEMP/perf-desktop-jsc.json"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-desktop-linux
          path: |
            ${{ runner.temp }}/perf-desktop.json
            ${{ runner.temp }}/perf-desktop-jsc.json
          if-no-files-found: ignore
          overwrite: true
