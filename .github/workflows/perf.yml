name: perf

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perf:
    name: perf / scale and soak
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/browser
      - run: bun run web:build
      - name: perf-scale, four runs and one with the 20-minute soak
        run: |
          for i in 1 2 3 4; do PERF_SOAK_MIN=0 bun scripts/perf-scale.ts --json "$RUNNER_TEMP/perf-$i.json"; done
          PERF_SOAK_MIN=20 bun scripts/perf-scale.ts --json "$RUNNER_TEMP/perf-5.json"
      - name: medians against the gates
        shell: bash
        run: bun scripts/perf-check.ts --nightly "$RUNNER_TEMP"/perf-*.json | tee -a "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf
          path: ${{ runner.temp }}/perf-*.json
          if-no-files-found: ignore
          overwrite: true
