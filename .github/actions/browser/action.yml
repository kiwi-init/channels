name: browser
description: Chromium's headless shell, with webkit also Playwright's WebKit, and the system packages they need, their .deb files cached so a slow apt mirror costs nothing.
inputs:
  webkit:
    description: Also install Playwright's WebKit, the engine of the Mac's and Linux's system web view, and its packages.
    default: "false"
runs:
  using: composite
  steps:
    - id: image
      shell: bash
      run: |
        echo "key=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
        echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
        echo "engines=chromium-headless-shell${{ inputs.webkit == 'true' && ' webkit' || '' }}" >> "$GITHUB_OUTPUT"
        echo "suffix=${{ inputs.webkit == 'true' && '-webkit' || '' }}" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/browser-debs
        key: browser-debs-${{ runner.arch }}-${{ steps.image.outputs.key }}-${{ hashFiles('bun.lock') }}${{ steps.image.outputs.suffix }}
        restore-keys: browser-debs-${{ runner.arch }}-${{ steps.image.outputs.key }}-
    - shell: bash
      run: |
        debs="$RUNNER_TEMP/browser-debs"
        conf=/etc/apt/apt.conf.d/90browser-debs
        mkdir -p "$debs/partial"
        echo "Dir::Cache::Archives \"$debs/\";" | sudo tee "$conf" > /dev/null
        bunx playwright-core install-deps ${{ steps.image.outputs.engines }}
        sudo apt-get autoclean -qq
        sudo rm -rf "$conf" "$debs/partial" "$debs/lock"
        sudo chown -R "$(id -u):$(id -g)" "$debs"
    - id: shell
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.os }}-${{ hashFiles('bun.lock') }}${{ steps.image.outputs.suffix }}
    - if: steps.shell.outputs.cache-hit != 'true'
      shell: bash
      run: bunx playwright-core install --only-shell chromium
    - if: steps.shell.outputs.cache-hit != 'true' && inputs.webkit == 'true'
      shell: bash
      run: bunx playwright-core install webkit
