name: browser
description: Chromium's headless shell and the system packages it needs, their .deb files cached so a slow apt mirror costs nothing.
runs:
  using: composite
  steps:
    - id: image
      shell: bash
      run: echo "key=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/browser-debs
        key: browser-debs-${{ runner.arch }}-${{ steps.image.outputs.key }}-${{ hashFiles('bun.lock') }}
        restore-keys: browser-debs-${{ runner.arch }}-
    - shell: bash
      run: |
        debs="$RUNNER_TEMP/browser-debs"
        conf=/etc/apt/apt.conf.d/90browser-debs
        mkdir -p "$debs/partial"
        echo "Dir::Cache::Archives \"$debs/\";" | sudo tee "$conf" > /dev/null
        bunx playwright-core install-deps chromium-headless-shell
        sudo apt-get autoclean -qq
        sudo rm -rf "$conf" "$debs/partial" "$debs/lock"
        sudo chown -R "$(id -u):$(id -g)" "$debs"
    - id: shell
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
    - if: steps.shell.outputs.cache-hit != 'true'
      shell: bash
      run: bunx playwright-core install --only-shell chromium
