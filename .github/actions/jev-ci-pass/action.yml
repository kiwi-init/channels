name: jev-ci pass
description: >-
  Remembers that this job passed on these exact inputs (an empty Actions cache entry named
  after the job and its input hash), so jev-ci can skip it when the same inputs come back.
inputs:
  job:
    required: true
  hash:
    description: The job's input hash from the plan. Empty when planning failed; then nothing is saved.
    required: true
  shard:
    description: >-
      For a job split across runners, this runner's part as `1of3`. Each part saves its own entry,
      and jev-ci counts the job passed only once every part has one.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - if: inputs.hash != ''
      shell: bash
      run: mkdir -p "$RUNNER_TEMP/jev-ci-pass" && echo "${{ inputs.hash }}" > "$RUNNER_TEMP/jev-ci-pass/${{ inputs.job }}"
    - if: inputs.hash != ''
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/jev-ci-pass/${{ inputs.job }}
        key: jev-ci-pass-${{ inputs.job }}-${{ inputs.hash }}${{ inputs.shard != '' && format('-shard{0}', inputs.shard) || '' }}
