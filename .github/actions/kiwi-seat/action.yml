name: kiwi seat
description: >-
  Gives the merge bus a seat in the team's Kiwi channel, so its bus.* events reach the agents:
  unpacks the seat (a base64 tar.gz of a KIWI_HOME that joined the channel) and installs the
  kiwi CLI from this repository's latest release, checked against its SHA256SUMS. Without a
  seat it does nothing, and events only go to the job summary.
inputs:
  seat:
    description: The KIWI_BUS_SEAT secret. Empty skips the step.
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SEAT: ${{ inputs.seat }}
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ -z "$SEAT" ]; then echo "no KIWI_BUS_SEAT: bus events go to the job summary only"; exit 0; fi
        dir="$RUNNER_TEMP/kiwi"
        mkdir -p "$dir/home" "$dir/bin"
        printf '%s' "$SEAT" | base64 -d | tar -xz -C "$dir/home"
        gh release download --repo "$GITHUB_REPOSITORY" --pattern kiwi-linux-x64 --pattern SHA256SUMS --dir "$dir/bin"
        (cd "$dir/bin" && grep ' kiwi-linux-x64$' SHA256SUMS | sha256sum -c -)
        gh attestation verify "$dir/bin/kiwi-linux-x64" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
        chmod +x "$dir/bin/kiwi-linux-x64"
        echo "KIWI_HOME=$dir/home" >> "$GITHUB_ENV"
        echo "KIWI_BIN=$dir/bin/kiwi-linux-x64" >> "$GITHUB_ENV"
