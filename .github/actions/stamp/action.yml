name: stamp
description: The release's version and changelog (scripts/stamp.ts, made once by release-build.yml's version job) applied to this checkout.
inputs:
  path:
    description: The checkout to stamp.
    default: "."
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: stamp
        path: ${{ runner.temp }}/stamp
    - shell: bash
      working-directory: ${{ inputs.path }}
      run: |
        if [ -s "$RUNNER_TEMP/stamp/stamp.patch" ]; then git apply "$RUNNER_TEMP/stamp/stamp.patch"; fi
        git diff --stat
