    day: { top: [96, 112, 134], mid: [146, 158, 172], hor: [212, 206, 196], r0: [74, 80, 88], r1: [30, 34, 40], far: [150, 160, 172], near: [86, 96, 110], cloud: [184, 190, 198], glow: [250, 240, 222], tree: [38, 62, 46], haze: [0.14, 0.15, 0.165], fac: 0.66 }

#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 vUv;
uniform sampler2D uSoft;
uniform sampler2D uSharp;
uniform sampler2D uGlyph;
uniform vec2 uRes;
uniform float uT;
uniform float uDay;
uniform float uLamp;
uniform vec3 uHaze;
uniform vec4 uCar[6];
uniform vec2 uSig;
uniform vec3 uSigCol;
uniform vec3 uBea;
uniform vec4 uRun;
uniform vec2 uRunA;

float h21(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
vec3 h31(float p){vec3 q=fract(vec3(p)*vec3(.1031,.103,.0973));q+=dot(q,q.yzx+33.33);return fract((q.xxy+q.yzz)*q.zyx);}
float vn(vec2 p){vec2 i=floor(p);vec2 f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1.,0.)),f.x),mix(h21(i+vec2(0.,1.)),h21(i+vec2(1.,1.)),f.x),f.y);}
float rainAt(float t){return .56+.2*sin(t*.00041+1.3)+.08*sin(t*.0013+.4);}
vec2 unit(vec2 v){return v/max(1.,length(v));}

vec3 runners(vec2 p,float cols,float vb,float rb,float seed,float px,inout float trail){
  float W=1./cols;
  float cx=p.x*cols;
  float col=floor(cx);
  float lx=(fract(cx)-.5)*W;
  vec3 cn=h31(col*13.17+seed*71.3);
  float v=vb*(.6+.8*cn.x);
  float P=mix(16.,36.,cn.y);
  float ph=cn.z*50.;
  float s=.62-p.y;
  float K=(uT-s/v)/P+ph;
  float k0=floor(K);
  vec2 off=vec2(0.);
  float mask=0.;
  for(int j=-1;j<=1;j++){
    float k=k0+float(j);
    vec3 n=h31(k*1.618+col*57.3+seed*13.1);
    vec3 m=h31(k*3.71+col*11.9+seed*5.3+.5);
    float jit=(n.x-.5)*.3;
    float tk=(k-ph+jit)*P;
    float ex=step(m.x,rainAt(tk));
    float tau=uT-tk;
    float w=mix(.6,1.5,n.y);
    float sh=v*(tau+.85*sin(w*tau+n.z*6.283)/w);
    float r=rb*W*(.75+.5*m.y);
    float amp=W*.07;
    float x0=(n.z-.5)*W*.28;
    float fa=n.y*6.283;
    float fb=m.z*6.283;
    float hx=x0+amp*sin(sh*9.+fa)+amp*.5*sin(sh*23.+fb);
    vec2 d=vec2(lx-hx,sh-s);
    vec2 e=vec2(d.x*(1.+.35*smoothstep(0.,r*1.5,d.y)),d.y*(d.y>0.?.6:1.05));
    float ed=max(r*.22,1.5*px);
    float hm=(1.-smoothstep(r-ed,r,length(e)))*ex;
    off+=unit(e/r)*hm;
    mask=max(mask,hm);
    float age=(K-k-jit)*P;
    float life=ex*smoothstep(0.,r*1.5,sh-s)*(1.-smoothstep(.2*P,1.6*P,age));
    float tx=x0+amp*sin(s*9.+fa)+amp*.5*sin(s*23.+fb);
    float tw=r*.45;
    trail=max(trail,(1.-smoothstep(tw*.4,tw,abs(lx-tx)))*life);
    float sp=r*2.6;
    float si=floor(s/sp);
    float sc=(si+.5)*sp;
    vec3 nb=h31(si*7.31+k*19.1+col*3.7+seed);
    float ab=age+(s-sc)/v;
    float lb=ex*step(nb.x,.6)*smoothstep(r*1.6,r*2.6,sh-sc)*(1.-smoothstep(.15*P,1.5*P,ab));
    float rr=r*(.2+.28*nb.y)*sqrt(lb);
    float bx=x0+amp*sin(sc*9.+fa)+amp*.5*sin(sc*23.+fb)+(nb.z-.5)*r*.5;
    vec2 bd=vec2(lx-bx,sc-s);
    float be=max(rr*.3,1.5*px);
    float bm=(1.-smoothstep(rr-be,rr,length(bd)))*step(.0004,rr);
    off+=unit(bd/max(rr,1e-4))*bm;
    mask=max(mask,bm);
  }
  return vec3(off,mask);
}

vec3 beads(vec2 p,float sc,float rate,float dens,float px){
  vec2 g=p*sc;
  vec2 id=floor(g);
  vec2 f=fract(g)-.5;
  float ph=h21(id+11.7);
  float cyc=uT*rate*(.6+.8*ph)+ph*7.;
  float k=floor(cyc);
  float lf=cyc-k;
  vec3 n=h31(id.x*127.1+id.y*311.7+k*74.7);
  float gr=smoothstep(0.,.3,lf)*(1.-smoothstep(.75,1.,lf));
  float r=(.1+.22*n.x*n.x)*gr;
  vec2 c=(vec2(n.y,fract(n.x*13.7))-.5)*.36;
  vec2 d=(f-c)*vec2(1.,1.08);
  float ed=max(r*.3,1.5*px*sc);
  float m=(1.-smoothstep(r-ed,r,length(d)))*step(1.-dens,n.z)*step(.02,r);
  return vec3(unit(d/max(r,1e-3))*m,m);
}

float spot(vec2 q,vec2 c,float rs,float rp,float fo){
  float d=length(q-c);
  float r=d/rs;
  float b=(1.-smoothstep(.84,1.,r))*(.74+.2*smoothstep(.45,.95,r)+.05*sin(r*26.))*.3;
  float k=d*d/(rp*rp);
  float pt=exp(-k)*1.2+exp(-k*.06)*.1;
  return mix(b,pt,fo);
}

float streak(vec2 q,vec2 c,float rs,float fo){
  vec2 d=q-c;
  float wx=mix(rs*.5,rs*.2,fo);
  return exp(-d.x*d.x/(wx*wx))*(1.-smoothstep(-.02,0.,d.y))*exp(d.y*8.)*.14;
}

vec3 lights(vec2 uv,float fo,float asp){
  vec2 q=vec2(uv.x*asp,uv.y);
  vec3 acc=vec3(0.);
  for(int i=0;i<6;i++){
    vec4 c=uCar[i];
    if(c.w>0.){
      float rs=c.y>.24?.027:.034;
      vec2 cf=vec2(c.x+.024*c.z,c.y);
      vec2 cb=vec2(c.x-.024*c.z,c.y);
      acc+=c.w*(vec3(1.,.9,.72)*(spot(q,cf,rs,.009,fo)+streak(q,cf,rs,fo))+vec3(1.,.16,.1)*(spot(q,cb,rs*.9,.008,fo)*.85+streak(q,cb,rs,fo)*.8));
    }
  }
  vec2 sc=vec2(uSig.x*asp,uSig.y);
  acc+=uSigCol*(spot(q,sc,.022,.007,fo)+streak(q,vec2(sc.x,.345),.022,fo)*.6);
  if(uBea.z>0.){acc+=vec3(1.,.14,.1)*spot(q,vec2(uBea.x*asp,uBea.y),.014,.006,fo)*uBea.z;}
  return acc;
}

void main(){
  vec2 uv=vUv;
  float asp=uRes.x/uRes.y;
  float px=1./uRes.y;
  vec2 p=vec2((uv.x-.5)*asp,uv.y-.5);
  float trail=0.;
  vec3 A=runners(p,6.,.05,.24,1.,px,trail);
  vec3 B=runners(p+vec2(.031,0.),10.,.042,.2,2.,px,trail);
  vec3 C=beads(p,15.,.012,.24,px);
  vec3 D=beads(p+vec2(3.1,1.7),30.,.018,.06,px);
  float wipe=1.-trail;
  vec2 off=A.xy+B.xy+(C.xy+D.xy)*wipe;
  float drop=clamp(A.z+B.z+(C.z+D.z)*wipe,0.,1.);
  vec2 uvR=uv-off*vec2(1./asp,1.)*.2;
  float mist=vn(vec2(uv.x*asp*1.4+uT*.007,uv.y*2.6))*.65+vn(vec2(uv.x*asp*3.1-uT*.005,uv.y*5.2+4.))*.35;
  vec2 gq=(uv-uRun.xy)/uRun.zw;
  float gin=step(0.,gq.x)*step(gq.x,1.)*step(0.,gq.y)*step(gq.y,1.)*step(.001,uRunA.x);
  vec2 gc=clamp(gq,0.,1.);
  vec3 gt=texture2D(uGlyph,gc).rgb*gin;
  float gdx=texture2D(uGlyph,gc+vec2(.003,0.)).g*gin-gt.g;
  float gdy=texture2D(uGlyph,gc+vec2(0.,.024)).g*gin-gt.g;
  float er=vn(p*60.)*.55+vn(p*19.+7.)*.45;
  float gform=smoothstep(uRunA.y-.08,uRunA.y+.08,er)*uRunA.x;
  float gs=mix(gt.r,gt.g,.4)*gform;
  float gh=gt.g*gform;
  vec2 guv=uv+vec2(gdx,gdy)*vec2(1./asp,1.)*.05*gform;
  vec3 soft=texture2D(uSoft,guv).rgb;
  vec3 fog=soft*.88+uHaze*(.32+.3*mist);
  vec3 glow=texture2D(uSoft,vec2(uv.x,.46+(uv.y-.5)*.3)).rgb*.9+soft*.5+uHaze*.8+vec3(.012,.011,.01);
  fog=mix(fog,fog*.82,clamp(gh-gs,0.,1.)*.4)+glow/(1.+3.*glow)*gs*mix(1.35,.6,uDay);
  vec3 crisp=texture2D(uSharp,uv).rgb;
  vec2 lw=vec2(uv.x-off.x*.1/asp,.46+(uv.y-.5)*.3-off.y*.1);
  vec3 lens=mix(texture2D(uSharp,uvR).rgb,texture2D(uSoft,lw).rgb*mix(1.2,.98,uDay)+uHaze*mix(.2,.05,uDay),.94);
  vec3 col=mix(fog,crisp*.96+uHaze*.12,trail*.55*(1.-drop));
  col=mix(col,lens*1.12,drop);
  col+=lights(mix(uv,uvR,drop),drop,asp);
  float ol=clamp(length(off),0.,1.);
  col*=1.-.42*smoothstep(.5,1.,ol)*drop;
  float spec=(1.-smoothstep(0.,.32,length(off-vec2(-.32,.42))))*drop;
  col+=spec*(soft*.6+uHaze*.5+mix(vec3(.02,.022,.03),vec3(.05,.055,.06),uDay));
  vec2 lq=vec2(uv.x*asp,uv.y)-vec2(asp*.84,.17);
  float halo=exp(-dot(lq,lq)*9.);
  vec2 lc=lq*vec2(1.,.72);
  float core=exp(-dot(lc,lc)*240.)*.5+(1.-smoothstep(.035,.075,length(lc)))*.12;
  vec3 warm=vec3(1.,.6,.27);
  col+=warm*(halo*.15+core)*uLamp;
  col+=warm*(drop*.4+spec*1.6)*halo*uLamp;
  vec2 vv=(uv-.5)*vec2(1.6,2.);
  col*=1.-.25*smoothstep(.4,1.6,dot(vv,vv));
  gl_FragColor=vec4(col,1.);
}
`;

  var HEAD = "#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\n#else\nprecision mediump float;\n#endif\nvarying vec2 vUv;\n";

  var FS_BLUR = HEAD + `
uniform sampler2D uTex;
uniform vec2 uStep;
uniform float uSig;
void main(){
  vec3 a=vec3(0.);
  float ws=0.;
  for(int i=-8;i<=8;i++){
    float x=float(i);
    float w=exp(-x*x/(2.*uSig*uSig));
    a+=texture2D(uTex,vUv+uStep*x).rgb*w;
    ws+=w;
  }
  gl_FragColor=vec4(a/ws,1.);
}
`;

  var FS_DOWN = HEAD + `
uniform sampler2D uTex;
uniform vec2 uStep;
void main(){
  vec3 a=texture2D(uTex,vUv+uStep*vec2(-1.,-1.)).rgb+texture2D(uTex,vUv+uStep*vec2(1.,-1.)).rgb+texture2D(uTex,vUv+uStep*vec2(-1.,1.)).rgb+texture2D(uTex,vUv+uStep*vec2(1.,1.)).rgb;
  gl_FragColor=vec4(a*.25,1.);
}
`;

  var FS_COMP = HEAD + `
uniform sampler2D uMain;
uniform sampler2D uBloom;
uniform vec2 uMainRes;
uniform vec2 uBloomRes;
uniform float uDay;
float h21(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
vec4 cubic(float v){vec4 n=vec4(1.,2.,3.,4.)-v;vec4 s=n*n*n;float x=s.x;float y=s.y-4.*s.x;float z=s.z-4.*s.y+6.*s.x;return vec4(x,y,z,6.-x-y-z)*(1./6.);}
vec3 bic(sampler2D t,vec2 uv,vec2 res){
  uv=uv*res-.5;
  vec2 f=fract(uv);
  uv-=f;
  vec4 xc=cubic(f.x);
  vec4 yc=cubic(f.y);
  vec4 c=uv.xxyy+vec2(-.5,1.5).xyxy;
  vec4 s=vec4(xc.xz+xc.yw,yc.xz+yc.yw);
  vec4 o=(c+vec4(xc.yw,yc.yw)/s)/res.xxyy;
  float sx=s.x/(s.x+s.y);
  float sy=s.z/(s.z+s.w);
  return mix(mix(texture2D(t,o.yw).rgb,texture2D(t,o.xw).rgb,sx),mix(texture2D(t,o.yz).rgb,texture2D(t,o.xz).rgb,sx),sy);
}
void main(){
  vec3 m=bic(uMain,vUv,uMainRes);
  vec3 b=bic(uBloom,vUv,uBloomRes);
  vec3 col=mix(m,b,.12)+max(b-vec3(mix(.1,.55,uDay)),0.)*mix(.9,.5,uDay);
  vec3 k=vec3(.82);
  col=mix(col,k+(1.-k)*(1.-exp(-(col-k)/(1.-k))),step(k,col));
  col+=(h21(gl_FragCoord.xy)+h21(gl_FragCoord.yx+17.)-1.)/255.;
  gl_FragColor=vec4(col,1.);
}
`;

  function rng(a) {
    return function () {
      a = (a + 0x6d2b79f5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hj(x) {
    var s = Math.sin(x * 91.3458 + 7.13) * 47453.5453;
    return s - Math.floor(s);
  }

  function smooth(a, b, x) {
    var t = Math.min(1, Math.max(0, (x - a) / (b - a)));
    return t * t * (3 - 2 * t);
  }

  function mix3(a, b, t) {
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  }

    return "rgb(" + Math.round(c[0]) + "," + Math.round(c[1]) + "," + Math.round(c[2]) + ")";

    return "rgba(" + Math.round(c[0]) + "," + Math.round(c[1]) + "," + Math.round(c[2]) + "," + Math.min(1, Math.max(0, a)).toFixed(4) + ")";
  }

    var rows = Math.max(1, Math.floor((h - sy * 0.6) / sy));

    for (var r = 0; r < rows; r++) {

          t: R() * 0.6 + fb * 0.4,
          c: Math.floor(R() * WIN.length),
          a: 0.55 + R() * 0.45,
          big: R() < 0.07

    }
    return b;
  }

    for (var q = 0; q < 6; q++) {
      c.near.push({ x: -2.2 + R() * 4.4, y: 0.42 + R() * 0.42, r: 0.055 + R() * 0.04, col: R() < 0.75 ? WIN[Math.floor(R() * 3)] : WIN[3], a: 0.05 + R() * 0.06, t: R(), ph: R() * 6 });
    }
    for (var j = 0; j < 22; j++) {
      c.clouds.push({ x: -2.3 + R() * 4.6, y: 0.04 + R() * 0.34, rx: 0.2 + R() * 0.4, ry: 0.05 + R() * 0.08, a: 0.2 + R() * 0.3, dark: R() < 0.4 });
    }
    x = -2.3;
    while (x < 2.3) {
      c.trees.push({ x: x, r: 0.05 + R() * 0.045, h: 0.05 + R() * 0.05 });
      x += 0.16 + R() * 0.34;
    }
    for (var b = 0; b < 16; b++) {
      c.brollies.push({ x: -2.2 + R() * 4.4, y: Y0 + 0.012 + R() * 0.05, w: 0.022 + R() * 0.016, col: [[196, 56, 52], [226, 180, 64], [40, 58, 104], [36, 120, 118], [30, 32, 36], [150, 70, 120]][Math.floor(R() * 6)] });
    }
    return c;
  }

  function makeCars() {
    var R = rng(4242);
    var out = [];
    for (var i = 0; i < 6; i++) {
      var lane = i < 3 ? 0 : 1;
      out.push({ sp: 1 / (42 + R() * 38), ph: R() * 10, y: lane ? 0.262 : 0.214, dir: lane ? -1 : 1 });
    }
    return out;
  }

  function lookAt(ms) {
    var d = new Date(isFinite(ms) ? ms : Date.now());
    var h = d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600;
    var day = smooth(5.9, 7.9, h) * (1 - smooth(17.6, 19.4, h));
    var dusk = smooth(4.8, 6.1, h) * (1 - smooth(6.4, 7.8, h)) + smooth(17.4, 18.9, h) * (1 - smooth(19.9, 21.2, h));
    var late = smooth(0.5, 2.5, h) * (1 - smooth(4.5, 6, h));
    var lit = (0.46 - 0.24 * late) * (1 - day) + 0.1 * day;
    return { day: day, dusk: dusk, lit: lit };
  }

  function tone(P, k) {
    var a = PAL.night[k];
    var b = PAL.day[k];
    var d = PAL.dusk[k];
    if (typeof a === "number") {
      var s = a + (b - a) * P.day;
      return s + (d - s) * P.dusk * 0.9;
    }
    var o = [];
    for (var i = 0; i < a.length; i++) {
      var v = a[i] + (b[i] - a[i]) * P.day;
      o.push(v + (d[i] - v) * P.dusk * 0.9);
    }
    return o;
  }

  function glowE(c, x, y, rx, ry, col, a) {
    if (a <= 0.002 || rx <= 0 || ry <= 0) return;
    c.save();
    c.translate(x, y);
    c.scale(rx / ry, 1);
    var g = c.createRadialGradient(0, 0, 0, 0, 0, ry);
    g.addColorStop(0, rgba(col, a));
    g.addColorStop(1, rgba(col, 0));
    c.fillStyle = g;
    c.fillRect(-ry, -ry, ry * 2, ry * 2);
    c.restore();
  }

  function point(c, x, y, rp, col, a) {
    if (a <= 0.003) return;
    var R = rp * 6;
    var g = c.createRadialGradient(x, y, 0, x, y, R);
    g.addColorStop(0, rgba(mix3(col, [255, 255, 255], 0.5), a * 1.5));
    g.addColorStop(0.12, rgba(col, a));
    g.addColorStop(0.4, rgba(col, a * 0.15));
    g.addColorStop(1, rgba(col, 0));
    c.fillStyle = g;
    c.fillRect(x - R, y - R, R * 2, R * 2);
  }

  function drawRow(c, list, X, w, h, col, P, wa, fw, fh, facMix) {
    var i, j, b, x0, x1;
    for (i = 0; i < list.length; i++) {
      b = list[i];
      x0 = X(b.x);
      x1 = X(b.x + b.w);
      if (x1 < -2 || x0 > w + 2) continue;
      var fc = mix3(col, b.fac, facMix);
      c.fillStyle = css([fc[0] * b.shade, fc[1] * b.shade, fc[2] * b.shade]);
      c.fillRect(x0, (Y0 - b.h) * h, x1 - x0, (b.h + 0.004) * h);
    }
    for (i = 0; i < list.length; i++) {
      b = list[i];
      x0 = X(b.x);
      x1 = X(b.x + b.w);
      if (x1 < -2 || x0 > w + 2) continue;
      var ww = b.sx * fw * h;
      var wh = b.sy * fh * h;
      var lim = P.lit * b.boost;
      for (j = 0; j < b.win.length; j++) {
        var wn = b.win[j];
        if (wn.t >= lim) {
          if (P.day > 0.05) {
            c.fillStyle = rgba([24, 30, 40], 0.26 * P.day * wn.a);
            c.fillRect(X(wn.x) - ww / 2, wn.y * h - wh / 2, ww, wh);
          }
          continue;
        }
        c.fillStyle = rgba(WIN[wn.c], wn.a * wa);
        c.fillRect(X(wn.x) - ww / 2, wn.y * h - wh / 2, ww, wh);
      }
    }
  }

  function paintBase(c, w, h, P) {
    var a = w / h;
    var n = 1 - P.day;
    var X = function (x) { return (x + a / 2) * h; };
    var g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, css(tone(P, "top")));
    g.addColorStop(0.34, css(tone(P, "mid")));
    g.addColorStop(Y0 - 0.003, css(tone(P, "hor")));
    g.addColorStop(Y0 + 0.003, css(tone(P, "r0")));
    g.addColorStop(1, css(tone(P, "r1")));
    c.globalCompositeOperation = "source-over";
    c.fillStyle = g;
    c.fillRect(0, 0, w, h);
    glowE(c, w * 0.66, h * 0.12, w * 0.55, h * 0.34, [255, 244, 222], 0.34 * P.day);
    glowE(c, w * 0.66, h * 0.1, w * 0.18, h * 0.12, [255, 250, 236], 0.3 * P.day);
    glowE(c, w * 0.35, Y0 * h, w * 0.9, h * 0.3, [255, 150, 104], 0.42 * P.dusk);
    glowE(c, w / 2, Y0 * h, w * 0.85, h * 0.36, tone(P, "glow"), (0.06 + 0.2 * n) * (1 - P.dusk * 0.5));
    var cl = tone(P, "cloud");
    var cd = mix3(tone(P, "top"), [40, 44, 56], 0.4);
    for (var i = 0; i < city.clouds.length; i++) {
      var k = city.clouds[i];
      glowE(c, X(k.x), k.y * h, k.rx * h, k.ry * h, k.dark ? cd : cl, k.a * (k.dark ? 0.6 * P.day + 0.2 : 1));
    }
    glowE(c, w / 2, (Y0 + 0.06) * h, w * 0.8, h * 0.08, tone(P, "glow"), 0.1 * n + 0.12 * P.day);
    var fm = tone(P, "fac");
    drawRow(c, city.far, X, w, h, tone(P, "far"), P, 0.15 + 0.4 * n, 0.5, 0.42, fm * 0.35);
    drawRow(c, city.mid, X, w, h, tone(P, "near"), P, 0.3 + 0.7 * n, 0.62, 0.52, fm);
    var tc = tone(P, "tree");
    for (var t = 0; t < city.trees.length; t++) {
      var tr = city.trees[t];
      glowE(c, X(tr.x), (Y0 - tr.h * 0.6) * h, tr.r * h * 1.2, tr.h * h, tc, 0.85);
    }
    for (var j = 0; j < city.shops.length; j++) {
      var s = city.shops[j];
      c.fillStyle = rgba(s.col, s.a * (0.7 + 0.2 * n));
      c.fillRect(X(s.x), (Y0 - 0.03) * h, s.w * h, 0.028 * h);
      if (s.awOn) {
        c.fillStyle = rgba(s.aw, 0.25 + 0.6 * P.day);
        c.fillRect(X(s.x) - 0.004 * h, (Y0 - 0.042) * h, (s.w + 0.008) * h, 0.013 * h);
      }
    }
    for (var u = 0; u < city.brollies.length; u++) {
      var br = city.brollies[u];
      glowE(c, X(br.x), br.y * h, br.w * h * 1.4, br.w * h * 0.55, br.col, 0.25 + 0.6 * P.day);
    }
    c.save();
    c.globalAlpha = 0.22 + 0.16 * P.day;
    c.translate(0, 2 * Y0 * h);
    c.scale(1, -1);
    c.drawImage(c.canvas, 0, (Y0 - 0.34) * h, w, 0.34 * h, 0, (Y0 - 0.34) * h, w, 0.34 * h);
    c.restore();
  }

  function cityLights(P, a) {
    var n = 1 - P.day;
    var vis = 0.18 + 0.82 * n;
    var lampOn = 1 - smooth(0.3, 0.8, P.day);
    var haze = tone(P, "mid");
    var out = [];
    var i, j, b;
    function add(x, y, r, col, al, soft, rim, ring, ph, hot, rp, refl) {
      if (al < 0.004 || Math.abs(x) > a / 2 + r * 1.5) return;
      out.push({ x: x, y: y, r: r, col: col, a: al, soft: soft, rim: rim, ring: ring, ph: ph, hot: hot, rp: rp, refl: refl });
    }
    for (i = 0; i < city.glow.length; i++) {
      var G = city.glow[i];
      if (G.t >= P.lit * 1.8) continue;
      var dpt = G.depth;
      var gcol = mix3(G.col, haze, 0.38 * (1 - dpt));
      add(G.x, G.y, 0.011 + dpt * dpt * 0.042, gcol, G.a * vis * (0.5 + 0.55 * dpt), 0.05 + dpt * 0.24, G.rim * 0.28, 0.012 + dpt * 0.026, G.ph, G.a > 0.3 ? 0.25 : 0, 0.0035, G.y > Y0 - 0.14 ? 0.3 : 0);
    }
    for (i = 0; i < city.mid.length; i++) {
      b = city.mid[i];
      var lim = P.lit * b.boost;
      for (j = 0; j < b.win.length; j++) {
        var wn = b.win[j];
        if (!wn.big || wn.t >= lim) continue;
        add(wn.x, wn.y, 0.022, WIN[wn.c], 0.2 * wn.a * vis, 0.12, 0.1, 0.03, wn.t * 20, 0, 0.004, 0);
      }
    }
    for (i = 0; i < city.far.length; i++) {
      b = city.far[i];
      if (b.h < 0.17) continue;
      add(b.x + b.w / 2, Y0 - b.h - 0.006, 0.009, [255, 60, 48], 0.5 * n, 0.06, 0, 0, 0, 0, 0.003, 0);
    }
    for (i = 0; i < city.lamps.length; i++) {
      var L = city.lamps[i];
      add(L.x, L.y, L.r, L.col, L.a * lampOn * (L.col[2] > 200 ? 0.3 : 0.42), 0.1, 0.26, 0.03, L.ph, 0.3, 0.005, 1);
    }
    for (i = 0; i < city.neon.length; i++) {
      var N = city.neon[i];
      add(N.x, N.y, N.r * 0.8, N.col, N.a * (0.35 + 0.65 * n) * 0.3, 0.14, 0.2, 0.025, N.ph, 0.1, 0.0045, 0.8);
    }
    for (i = 0; i < city.near.length; i++) {
      var Q = city.near[i];
      if (Q.t >= P.lit * 1.6) continue;
      add(Q.x, Q.y, Q.r, Q.col, Q.a * vis, 0.32, 0.18, 0.04, Q.ph, 0, 0, 0);
    }
    return out;
  }

  function bokeh(W, H, L, X) {
    var cx = X(L.x);
    var cy = L.y * H;
    var R = L.r * H;
    var e = Math.max(1.1, L.soft * R);
    var ca = 0.014;
    var vx = (W / 2 - cx) / (H * 0.5);
    var vy = (H / 2 - cy) / (H * 0.5);
    var vd = Math.sqrt(vx * vx + vy * vy);
    var cut = Math.max(0, vd - 0.55) * 0.55;
    var c2x = cx + (vd > 0 ? vx / vd : 0) * cut * R;
    var c2y = cy + (vd > 0 ? vy / vd : 0) * cut * R;
    var halo = L.hot > 0 ? 2.4 : 1.02;
    var ext = R * halo + 2;
    var x0 = Math.max(0, Math.floor(cx - ext));
    var x1 = Math.min(W - 1, Math.ceil(cx + ext));
    var y0 = Math.max(0, Math.floor(cy - ext));
    var y1 = Math.min(H - 1, Math.ceil(cy + ext));
    if (x1 < x0 || y1 < y0) return;
    var cr = LIN[Math.round(L.col[0])] * L.a * 1.7;
    var cg = LIN[Math.round(L.col[1])] * L.a * 1.7;
    var cb = LIN[Math.round(L.col[2])] * L.a * 1.7;
    var ringF = 24 + (L.ph % 1) * 14;
    for (var y = y0; y <= y1; y++) {
      var dy = y + 0.5 - cy;
      var dy2 = y + 0.5 - c2y;
      var row = (y * W) * 3;
      for (var x = x0; x <= x1; x++) {
        var dx = x + 0.5 - cx;
        var d = Math.sqrt(dx * dx + dy * dy);
        var r = d / R;
        var hv = 0;
        if (L.hot > 0 && r > 0.8) {
          var q = (r - 1) / (halo - 1);
          hv = q < 1 ? L.hot * 0.06 * (1 - q) * (1 - q) : 0;
        }
        if (r > 1.03) {
          if (hv > 0) {
            var o0 = row + x * 3;
            acc[o0] += cr * hv;
            acc[o0 + 1] += cg * hv;
            acc[o0 + 2] += cb * hv;
          }
          continue;
        }
        var dx2 = x + 0.5 - c2x;
        var d2 = Math.sqrt(dx2 * dx2 + dy2 * dy2);
        var m2 = Math.min(1, Math.max(0, (R * 1.08 - d2) / e + 0.5));
        m2 = m2 * m2 * (3 - 2 * m2);
        if (m2 <= 0 && hv <= 0) continue;
        var prof = 0.7 + L.rim * Math.pow(Math.min(1, Math.max(0, (r - 0.5) / 0.47)), 2) + L.ring * Math.sin(r * ringF + L.ph) * (0.35 + 0.65 * r) + L.hot * Math.exp(-r * r * 7);
        var mr = Math.min(1, Math.max(0, (R * (1 + ca) - d) / e + 0.5));
        var mg = Math.min(1, Math.max(0, (R - d) / e + 0.5));
        var mb = Math.min(1, Math.max(0, (R * (1 - ca) - d) / e + 0.5));
        mr = mr * mr * (3 - 2 * mr) * m2;
        mg = mg * mg * (3 - 2 * mg) * m2;
        mb = mb * mb * (3 - 2 * mb) * m2;
        var o = row + x * 3;
        acc[o] += cr * (prof * mr + hv);
        acc[o + 1] += cg * (prof * mg + hv);
        acc[o + 2] += cb * (prof * mb + hv);
      }
    }
  }

  function paintSoft(P, a, lights) {
    var H = 540;
    var W = Math.max(8, Math.round(H * a));
    var bh = 150;
    var bw = Math.max(4, Math.round(bh * a));
    baseCv.width = bw;
    baseCv.height = bh;
    paintBase(baseCtx, bw, bh, P);
    blur(baseCtx, bw, bh, 5);
    softCv.width = W;
    softCv.height = H;
    var c = softCtx;
    c.drawImage(baseCv, 0, 0, W, H);
    var X = function (x) { return (x + a / 2) * H; };
    c.globalCompositeOperation = "lighter";
    for (var i = 0; i < lights.length; i++) {
      var L = lights[i];
      if (L.refl) glowE(c, X(L.x), (Y0 + 0.13) * H, L.r * 0.55 * H, 0.12 * H, L.col, L.a * 0.42 * L.refl);
    }
    c.globalCompositeOperation = "source-over";
    var img = c.getImageData(0, 0, W, H);
    var d = img.data;
    var N = W * H;
    if (!acc || acc.length !== N * 3) acc = new Float32Array(N * 3);
    for (var p = 0, q = 0; p < N; p++, q += 4) {
      acc[p * 3] = LIN[d[q]];
      acc[p * 3 + 1] = LIN[d[q + 1]];
      acc[p * 3 + 2] = LIN[d[q + 2]];
    }
    for (var k = 0; k < lights.length; k++) bokeh(W, H, lights[k], X);
    var K = 0.72;
    for (var s = 0, t = 0; s < N; s++, t += 4) {
      for (var ch = 0; ch < 3; ch++) {
        var v = acc[s * 3 + ch];
        if (v > K) v = K + (1 - K) * (1 - Math.exp(-(v - K) / (1 - K)));
        d[t + ch] = Math.sqrt(v) * 255;
      }
      d[t + 3] = 255;
    }
    c.putImageData(img, 0, 0);
  }

  function paintSharp(P, a, lights, pw) {
    var H = 512;
    var W = Math.max(8, Math.round(H * a));
    var bh = 256;
    var bw = Math.max(4, Math.round(bh * a));
    baseCv.width = bw;
    baseCv.height = bh;
    paintBase(baseCtx, bw, bh, P);
    blur(baseCtx, bw, bh, 1);
    workCv.width = W;
    workCv.height = H;
    var c = workCv.getContext("2d");
    c.drawImage(baseCv, 0, 0, W, H);
    c.globalCompositeOperation = "lighter";
    var X = function (x) { return (x + a / 2) * H; };
    for (var i = 0; i < lights.length; i++) {
      var L = lights[i];
      if (!L.rp) continue;
      point(c, X(L.x), L.y * H, L.rp * H, L.col, Math.min(1, L.a * 1.2));
      if (L.refl) glowE(c, X(L.x), (Y0 + 0.13) * H, 0.008 * H, 0.12 * H, L.col, L.a * 0.45 * L.refl);
    }
    c.globalCompositeOperation = "source-over";
    sharpCv.width = pw;
    sharpCv.height = 512;
    sharpCv.getContext("2d").drawImage(workCv, 0, 0, pw, 512);
  }

  function boxPass(s, o, len, lines, r, step, lineStep) {
    var n = r * 2 + 1;
    for (var L = 0; L < lines; L++) {
      var base = L * lineStep;
      for (var ch = 0; ch < 3; ch++) {
        var b0 = base + ch;
        var sum = 0;
        var k;
        for (k = -r; k <= r; k++) sum += s[b0 + Math.min(Math.max(k, 0), len - 1) * step];
        for (k = 0; k < len; k++) {
          o[b0 + k * step] = sum / n;
          var ad = k + r + 1;
          if (ad > len - 1) ad = len - 1;
          var sb = k - r;
          if (sb < 0) sb = 0;
          sum += s[b0 + ad * step] - s[b0 + sb * step];
        }
      }
      for (var m = 0; m < len; m++) o[base + 3 + m * step] = 255;
    }
  }

  function blur(c, w, h, r) {
    if (r < 1) return;
    var img = c.getImageData(0, 0, w, h);
    var d = img.data;
    var t = new Uint8ClampedArray(d.length);
    for (var it = 0; it < 3; it++) {
      boxPass(d, t, w, h, r, 4, w * 4);
      boxPass(t, d, h, w, r, w * 4, 4);
    }
    c.putImageData(img, 0, 0);
  }

  function placeBeacon(a) {
    var best = null;
    for (var i = 0; i < city.mid.length; i++) {
      var b = city.mid[i];
      if (Math.abs(b.x + b.w / 2) > a / 2 - 0.08) continue;
      if (!best || b.h > best.h) best = b;
    }
    beacon = best ? [(best.x + best.w / 2 + a / 2) / a, 1 - (Y0 - best.h - 0.01), 1] : [0, 0, 0];
  }

  function upload(unit, tex, cv, mip) {
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv);
    if (mip) gl.generateMipmap(gl.TEXTURE_2D);
  }

  function repaint(P) {
    var a = Math.min(4, Math.max(0.25, paintAsp));
    var lights = cityLights(P, a);
    paintSoft(P, a, lights);
    var pw = Math.min(4096, Math.max(128, Math.pow(2, Math.round(Math.log(512 * a) / Math.LN2))));
    paintSharp(P, a, lights, pw);
    placeBeacon(a);
    if (gl && !lost) {
      upload(0, texSoft, softCv, false);
      upload(1, texSharp, sharpCv, true);
    }
  }

  function sceneMs() {
    return st.at === null ? Date.now() : st.at + (performance.now() - st.atPerf);
  }

  function refreshLook() {
    var P = lookAt(sceneMs());
    look = P;
    var key = Math.round(P.day * 50) + "|" + Math.round(P.dusk * 50) + "|" + Math.round(P.lit * 80) + "|" + paintAsp.toFixed(3);
    if (key !== bgKey) {
      bgKey = key;
      repaint(P);
    }
  }

  function isLetter(ch) {
    return /[A-Za-z]/.test(ch);
  }

  function pickGlyph(chars, i) {
    for (var tries = 0; tries < 8; tries++) {
      var ch = B64.charAt(Math.floor(Math.random() * 64));
      chars[i] = ch;
      var ok = true;
      for (var s = Math.max(0, i - 2); s <= i && s + 2 < chars.length + 1; s++) {
        if (s + 2 < chars.length && isLetter(chars[s]) && isLetter(chars[s + 1]) && isLetter(chars[s + 2])) ok = false;
      }
      if (ok) return;
    }
    chars[i] = B64.charAt(52 + Math.floor(Math.random() * 12));
  }

  function startRun(t) {
    var n = 6 + Math.floor(Math.random() * 15);
    var chars = [];
    for (var i = 0; i < n; i++) {
      chars.push("");
      pickGlyph(chars, i);
    }
    var pad = Math.random();
    if (pad < 0.2) chars[n - 1] = "=";
    else if (pad < 0.3) { chars[n - 1] = "="; chars[n - 2] = "="; }
    var swaps = [];
    var wob = [];
    for (var k = 0; k < n; k++) {
      swaps.push(t + 0.1 + Math.random() * 0.3);
      wob.push([(Math.random() - 0.5) * 6, 0.62 + Math.random() * 0.38]);
    }
    var hgt = 0.15 + Math.random() * 0.03;
    var wid = (hgt * 8) / Math.max(0.3, asp);
    var used = (n / 21) * wid;
    run = {
      t0: t, form: 0.8 + Math.random() * 0.4, hold: 1 + Math.random(), fade: 1.3 + Math.random() * 0.6,
      chars: chars, swaps: swaps, wob: wob, h: hgt, w: wid,
      x: 0.1 + Math.random() * Math.max(0.01, 0.8 - used) - (wid - used) / 2,
      y: 0.3 + Math.random() * 0.3,
      amp: 0.75 + Math.random() * 0.25
    };
    drawRun(true);
  }

  function drawRun(fresh) {
    var g = glyphCtx;
    var n = run.chars.length;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalCompositeOperation = "source-over";
    g.shadowColor = "rgba(0,0,0,0)";
    g.shadowBlur = 0;
    g.shadowOffsetX = 0;
    g.fillStyle = fresh ? "#000" : "rgba(0,0,0,0.6)";
    g.fillRect(0, 0, 1024, 128);
    g.font = "800 80px ui-monospace, Menlo, monospace";
    g.textAlign = "center";
    g.textBaseline = "middle";
    var adv = 1024 / 21;
    var x0 = (1024 - adv * n) / 2;
    var i;
    for (i = 0; i < n; i++) {
      g.fillStyle = "rgb(" + Math.round(255 * run.wob[i][1]) + ",0,0)";
      g.fillText(run.chars[i], x0 + (i + 0.5) * adv, 66 + run.wob[i][0]);
    }
    g.globalCompositeOperation = "lighter";
    g.shadowColor = "rgb(0,255,0)";
    g.shadowBlur = 18;
    g.shadowOffsetX = 2048;
    g.fillStyle = "rgb(0,0,255)";
    for (i = 0; i < n; i++) g.fillText(run.chars[i], x0 + (i + 0.5) * adv - 2048, 66 + run.wob[i][0]);
    g.shadowColor = "rgba(0,0,0,0)";
    g.shadowBlur = 0;
    g.shadowOffsetX = 0;
    if (gl && !lost) upload(2, texGlyph, glyphCv, false);
  }

  function glyphStep(t) {
    if (!run) {
      if (t < nextRun - 60) nextRun = t + RUN_GAP;
      if (t >= nextRun) startRun(t);
      else { runUni[4] = 0; return; }
    }
    var e = t - run.t0;
    var total = run.form + run.hold + run.fade;
    if (e < 0 || e > total) {
      run = null;
      nextRun = t + RUN_GAP + Math.random() * RUN_SPAN;
      runUni[4] = 0;
      return;
    }
    if (e < run.form + run.hold && !st.still) {
      var dirty = false;
      for (var i = 0; i < run.chars.length; i++) {
        if (t >= run.swaps[i]) {
          if (run.chars[i] !== "=") pickGlyph(run.chars, i);
          run.swaps[i] = t + 0.09 + Math.random() * 0.24;
          dirty = true;
        }
      }
      if (dirty) drawRun();
    }
    var th;
    if (e < run.form) th = 1.1 - 1.22 * smooth(0, run.form, e);
    else if (e < run.form + run.hold) th = -0.12;
    else th = -0.12 + 1.25 * smooth(0, run.fade, e - run.form - run.hold);
    runUni[0] = run.x;
    runUni[1] = run.y;
    runUni[2] = run.w;
    runUni[3] = run.h;
    runUni[4] = run.amp * (st.still ? 0.45 : 1);
    runUni[5] = th;
  }

  function sigCol(t, n) {
    var cy = t % 64;
    var g = [0.25, 1, 0.55];
    var c = mix3(g, [1, 0.68, 0.18], smooth(28, 29, cy));
    c = mix3(c, [1, 0.18, 0.12], smooth(32, 33, cy));
    c = mix3(c, g, smooth(63, 64, cy));
    var k = 0.55 + 0.45 * n;
    return [c[0] * k, c[1] * k, c[2] * k];
  }

  function fillCars(t, n) {
    var vis = 0.45 + 0.55 * n;
    for (var i = 0; i < 6; i++) {
      var c = cars[i];
      var cy = t * c.sp + c.ph;
      var ci = Math.floor(cy);
      var x = -0.35 + (cy - ci) * (asp + 0.7);
      if (c.dir < 0) x = asp - x;
      carBuf[i * 4] = x;
      carBuf[i * 4 + 1] = c.y;
      carBuf[i * 4 + 2] = c.dir;
      carBuf[i * 4 + 3] = hj(ci * 1.37 + i * 9.1) < 0.6 ? vis : 0;
    }
  }

  function draw2D(L) {
    var w = canvas.width;
    var h = canvas.height;
    var hz = tone(look, "haze");
    ctx2d.globalCompositeOperation = "source-over";
    var tw = Math.max(8, Math.round(w / 9));
    var th = Math.max(8, Math.round(h / 9));
    if (tinyCv.width !== tw) tinyCv.width = tw;
    if (tinyCv.height !== th) tinyCv.height = th;
    var tc = tinyCv.getContext("2d");
    tc.imageSmoothingEnabled = true;
    tc.imageSmoothingQuality = "high";
    tc.drawImage(softCv, 0, 0, tw, th);
    ctx2d.imageSmoothingEnabled = true;
    ctx2d.imageSmoothingQuality = "high";
    ctx2d.drawImage(tinyCv, 0, 0, w, h);
    ctx2d.fillStyle = rgba([hz[0] * 255, hz[1] * 255, hz[2] * 255], 0.35);
    ctx2d.fillRect(0, 0, w, h);
    if (L > 0.01) {
      ctx2d.globalCompositeOperation = "lighter";
      glowE(ctx2d, w * 0.84, h * 0.83, h * 0.42, h * 0.42, [255, 153, 69], 0.18 * L);
      glowE(ctx2d, w * 0.84, h * 0.83, h * 0.05, h * 0.07, [255, 172, 96], 0.5 * L);
      ctx2d.globalCompositeOperation = "source-over";
    }
  }

  function draw(t) {
    var n = 1 - look.day;
    var L = lamp * (0.94 + 0.035 * Math.sin(t * 1.1) + 0.025 * Math.sin(t * 2.3 + 1.7));
    if (!gl) {
      if (ctx2d) draw2D(L);
      return;
    }
    if (lost || gl.isContextLost()) return;
    targets();
    glyphStep(t);
    fillCars(t, n);
    var sc = sigCol(t, n);
    var hz = tone(look, "haze");
    var bb = beacon[2] ? Math.pow(0.5 + 0.5 * Math.sin(t * 1.15), 2.2) * n * 1.3 : 0;
    var S = RT.S;
    gl.bindFramebuffer(gl.FRAMEBUFFER, S.f);
    gl.viewport(0, 0, S.w, S.h);
    gl.useProgram(prog);
    gl.uniform2f(U.uRes, S.w, S.h);
    gl.uniform1f(U.uT, t);
    gl.uniform1f(U.uDay, look.day);
    gl.uniform1f(U.uLamp, L);
    gl.uniform3f(U.uHaze, hz[0], hz[1], hz[2]);
    gl.uniform4fv(U.uCar, carBuf);
    gl.uniform2f(U.uSig, 0.7, 0.4);
    gl.uniform3f(U.uSigCol, sc[0], sc[1], sc[2]);
    gl.uniform3f(U.uBea, beacon[0], beacon[1], bb);
    gl.uniform4f(U.uRun, runUni[0], runUni[1], runUni[2], runUni[3]);
    gl.uniform2f(U.uRunA, runUni[4], runUni[5]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    var sm = S.h * 0.0075;
    var sb = RT.Q.h * 0.034;
    pass(PB, S, RT.T, 1 / S.w, 0, sm);
    pass(PB, RT.T, S, 0, 1 / S.h, sm);
    pass(PD, S, RT.Q, 1 / S.w, 1 / S.h, 0);
    pass(PB, RT.Q, RT.R, 1 / RT.Q.w, 0, sb);
    pass(PB, RT.R, RT.Q, 0, 1 / RT.Q.h, sb);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.useProgram(PC.p);
    gl.activeTexture(gl.TEXTURE3);
    gl.bindTexture(gl.TEXTURE_2D, S.t);
    gl.activeTexture(gl.TEXTURE4);
    gl.bindTexture(gl.TEXTURE_2D, RT.Q.t);
    gl.uniform2f(PC.u.uMainRes, S.w, S.h);
    gl.uniform2f(PC.u.uBloomRes, RT.Q.w, RT.Q.h);
    gl.uniform1f(PC.u.uDay, look.day);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindTexture(gl.TEXTURE_2D, null);
    gl.activeTexture(gl.TEXTURE3);
    gl.bindTexture(gl.TEXTURE_2D, null);
  }

  function pass(P, src, dst, sx, sy, sig) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, dst.f);
    gl.viewport(0, 0, dst.w, dst.h);
    gl.useProgram(P.p);
    gl.activeTexture(gl.TEXTURE3);
    gl.bindTexture(gl.TEXTURE_2D, src.t);
    gl.uniform2f(P.u.uStep, sx, sy);
    if (sig) gl.uniform1f(P.u.uSig, sig);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.bindTexture(gl.TEXTURE_2D, null);
  }

  function target(w, h) {
    var t = gl.createTexture();
    gl.activeTexture(gl.TEXTURE5);
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, texType, null);
    var f = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    var ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.bindTexture(gl.TEXTURE_2D, null);
    return { t: t, f: f, w: w, h: h, ok: ok };
  }

  function dropTargets() {
    ["S", "T", "Q", "R"].forEach(function (k) {
      if (RT[k]) {
        gl.deleteFramebuffer(RT[k].f);
        gl.deleteTexture(RT[k].t);
        RT[k] = null;
      }
    });
    RT.w = 0;
    RT.h = 0;
  }

  function targets() {
    var ch = Math.max(1, window.innerHeight || document.documentElement.clientHeight || 1);
    var hs = Math.round(Math.min(400, Math.max(180, ch / 2)));
    var ws = Math.max(8, Math.round(hs * asp));
    if (RT.S && RT.w === ws && RT.h === hs) return;
    dropTargets();
    var qw = Math.max(2, Math.round(ws / 4));
    var qh = Math.max(2, Math.round(hs / 4));
    RT.S = target(ws, hs);
    RT.T = target(ws, hs);
    RT.Q = target(qw, qh);
    RT.R = target(qw, qh);
    if (!(RT.S.ok && RT.T.ok && RT.Q.ok && RT.R.ok) && texType !== gl.UNSIGNED_BYTE) {
      texType = gl.UNSIGNED_BYTE;
      dropTargets();
      targets();
      return;
    }
    RT.w = ws;
    RT.h = hs;
  }

  function step(dt, t) {
    var pn = performance.now();
    if (!look || pn - bgChecked > 2000) {
      bgChecked = pn;
      refreshLook();
    }
    if (dt < 0) lamp = lampGoal;
    else if (dt > 0) lamp += (lampGoal - lamp) * (1 - Math.exp(-dt / 1.6));
    if (Math.abs(lamp - lampGoal) < 0.002) lamp = lampGoal;
    draw(t);
  }

  function frame(ts) {
    raf = 0;
    if (!running) return;
    raf = requestAnimationFrame(frame);
    if (lastTs >= 0 && ts - lastTs < 30) return;
    var dt = lastTs < 0 ? 0 : Math.min(0.1, (ts - lastTs) / 1000);
    lastTs = ts;
    clock = (clock + dt) % 36000;
    step(dt, clock);
  }

  function update() {
    var live = !!gl && !lost && !st.still && !document.hidden;
    if (live) {
      if (!running) {
        running = true;
        lastTs = -1;
        raf = requestAnimationFrame(frame);
      }
      return;
    }
    if (running) {
      running = false;
      if (raf) cancelAnimationFrame(raf);
      raf = 0;
    }
    if (!document.hidden) {
      bgChecked = -1e9;
      step(-1, clock);
    }
  }

  function resize() {
    var cw = Math.max(1, window.innerWidth || document.documentElement.clientWidth || 1);
    var ch = Math.max(1, window.innerHeight || document.documentElement.clientHeight || 1);
    var dpr = window.devicePixelRatio || 1;
    var k = Math.min(dpr, 1, Math.sqrt(2000000 / (cw * ch)));
    var w = Math.max(1, Math.round(cw * k));
    var h = Math.max(1, Math.round(ch * k));
    if (canvas.width !== w) canvas.width = w;
    if (canvas.height !== h) canvas.height = h;
    asp = cw / ch;
  }

  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : null;
  }

  function makeTex(unit, mip) {
    var t = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, mip ? gl.LINEAR_MIPMAP_LINEAR : gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0, 255]));
    if (mip) gl.generateMipmap(gl.TEXTURE_2D);
    return t;
  }

  function link(src, names) {
    var vs = compile(gl.VERTEX_SHADER, VS);
    var fs = compile(gl.FRAGMENT_SHADER, src);
    if (!vs || !fs) return null;
    var p = gl.createProgram();
    gl.attachShader(p, vs);
    gl.attachShader(p, fs);
    gl.bindAttribLocation(p, 0, "aPos");
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) return null;
    var u = {};
    names.forEach(function (k) {
      u[k] = gl.getUniformLocation(p, k);
    });
    return { p: p, u: u };
  }

  function setupGL() {
    var sc = link(FS, ["uSoft", "uSharp", "uGlyph", "uRes", "uT", "uDay", "uLamp", "uHaze", "uCar", "uSig", "uSigCol", "uBea", "uRun", "uRunA"]);
    PB = link(FS_BLUR, ["uTex", "uStep", "uSig"]);
    PD = link(FS_DOWN, ["uTex", "uStep"]);
    PC = link(FS_COMP, ["uMain", "uBloom", "uMainRes", "uBloomRes", "uDay"]);
    if (!sc || !PB || !PD || !PC) return false;
    prog = sc.p;
    U = sc.u;
    var hf = gl.getExtension("OES_texture_half_float");
    var hfl = gl.getExtension("OES_texture_half_float_linear");
    gl.getExtension("EXT_color_buffer_half_float");
    texType = hf && hfl ? hf.HALF_FLOAT_OES : gl.UNSIGNED_BYTE;
    RT = { w: 0, h: 0, S: null, T: null, Q: null, R: null };
    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.useProgram(PB.p);
    gl.uniform1i(PB.u.uTex, 3);
    gl.useProgram(PD.p);
    gl.uniform1i(PD.u.uTex, 3);
    gl.useProgram(PC.p);
    gl.uniform1i(PC.u.uMain, 3);
    gl.uniform1i(PC.u.uBloom, 4);
    gl.useProgram(prog);
    gl.uniform1i(U.uSoft, 0);
    gl.uniform1i(U.uSharp, 1);
    gl.uniform1i(U.uGlyph, 2);
    texSoft = makeTex(0, false);
    texSharp = makeTex(1, true);
    texGlyph = makeTex(2, false);
    if (run) drawRun(true);
    return true;
  }

  function initGL() {
    var opt = { alpha: false, antialias: false, depth: false, stencil: false, premultipliedAlpha: false, preserveDrawingBuffer: false, powerPreference: "low-power" };
    var g = null;
    try {
      g = canvas.getContext("webgl", opt) || canvas.getContext("experimental-webgl", opt);
    } catch (err) {
      /* no WebGL here: the 2D picture takes over */
      g = null;
    }
    if (!g) return false;
    gl = g;
    if (setupGL()) return true;
    gl = null;
    return false;
  }

  function init2D() {
    var fresh = document.createElement("canvas");
    fresh.id = "scene";
    fresh.setAttribute("aria-hidden", "true");
    canvas.parentNode.replaceChild(fresh, canvas);
    canvas = fresh;
    gl = null;
    ctx2d = canvas.getContext("2d");
    resize();
  }

  function announce() {
    if (sentReady) return;
    sentReady = true;
    try {
      parent.postMessage({ kiwi: "afk", type: "ready" }, "*");
    } catch (err) {
      /* opened outside the app: there is nobody to tell */
      sentReady = true;
    }
  }

  function onMessage(e) {
    var d = e && e.data;
    if (!d || typeof d !== "object" || d.kiwi !== "afk" || d.type !== "state") return;
    if (typeof d.at === "number" && isFinite(d.at)) {
      st.at = d.at;
      st.atPerf = performance.now();
    }
    if (typeof d.needs === "number" && isFinite(d.needs)) st.needs = Math.max(0, d.needs);
    if ("still" in d) {
      var was = st.still;
      st.still = d.still === true;
      if (was !== st.still) resize();
    }
    lampGoal = st.needs > 0 ? 0.7 + 0.3 * Math.min(1, (st.needs - 1) / 4) : 0;
    bgChecked = -1e9;
    update();
  }

  resize();
  paintAsp = asp;
  if (!initGL()) init2D();
  if (gl) {
    canvas.addEventListener("webglcontextlost", function (e) {
      e.preventDefault();
      lost = true;
      update();
    }, false);
    canvas.addEventListener("webglcontextrestored", function () {
      lost = !setupGL();
      bgKey = "";
      bgChecked = -1e9;
      update();
    }, false);
  }
  window.addEventListener("message", onMessage);
  document.addEventListener("visibilitychange", update);
  window.addEventListener("resize", function () {
    resize();
    clearTimeout(aspTimer);
    aspTimer = setTimeout(function () {
      paintAsp = asp;
      bgChecked = -1e9;
      if (!running && !document.hidden) step(-1, clock);
    }, 180);
    if (!document.hidden) step(running ? 0 : -1, clock);
  });

  step(-1, clock);
  requestAnimationFrame(function () { requestAnimationFrame(announce); });
  setTimeout(announce, 600);
  update();
})();
</script>
</body>
</html>
