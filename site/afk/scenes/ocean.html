    var W = world(hourOf(sceneMs()));
    if (gl) drawGL(W); else if (ctx) draw2D(W);
    if (!sentReady) requestAnimationFrame(function () { requestAnimationFrame(announce); });
  }

  function announce() {
    if (sentReady) return;
    sentReady = true;
    try { parent.postMessage({ kiwi: "afk", type: "ready" }, "*"); } catch (err) {
      /* shown outside the app: nobody is listening for ready */
      sentReady = true;
    }
  }

  function frame(ts) {
    raf = 0;
    if (!running) return;
    raf = requestAnimationFrame(frame);
    if (lastTs >= 0 && ts - lastTs < (gl ? 30 : 60)) return;
    var raw = lastTs < 0 ? 0 : (ts - lastTs) / 1000, dt = Math.min(0.1, raw);
    if (raw > 0.052) slow++; else if (raw > 0) { slow = Math.max(0, slow - 1); fast++; }
    if (slow > 40 && lens < 4.5) { lens *= 1.2; slow = 0; fast = 0; }
    lastTs = ts;
    anim += dt;
    var goal = st.needs > 0 ? 1 : 0;
    lamp += (goal - lamp) * (1 - Math.exp(-dt / 1.4));
    beam += dt * (2 * Math.PI / 19) * (0.85 + 0.15 * Math.sin(anim * 0.07));
    stepRun();
    draw();
  }

  function update() {
    var live = (!!gl && !lost || !!ctx) && !st.still && !document.hidden;
    if (live) {
      if (stillTimer) { clearInterval(stillTimer); stillTimer = 0; }
      if (!running) { running = true; lastTs = -1; raf = requestAnimationFrame(frame); }
      return;
    }
    if (running) { running = false; if (raf) cancelAnimationFrame(raf); raf = 0; }
    if (document.hidden) { if (stillTimer) { clearInterval(stillTimer); stillTimer = 0; } return; }
    lamp = st.needs > 0 ? 1 : 0;
    if (st.still) { beam = 1.15; settleRun(); }
    if (!lost) draw();
    if (st.still && !stillTimer) stillTimer = setInterval(function () { if (!document.hidden && st.still && !lost) draw(); }, 120000);
  }

  function onMessage(e) {
    var d = e && e.data;
    if (!d || typeof d !== "object" || d.kiwi !== "afk" || d.type !== "state") return;
    if (typeof d.at === "number" && isFinite(d.at)) { st.at = d.at; st.atPerf = performance.now(); }
    if (typeof d.needs === "number" && isFinite(d.needs)) st.needs = Math.max(0, d.needs);
    if ("still" in d) st.still = d.still === true;
    if (!running) update(); else update();
    if (running && !document.hidden) draw();
  }

  function initGL() {
    var opt = { alpha: false, antialias: false, depth: false, stencil: false, premultipliedAlpha: false, preserveDrawingBuffer: false, powerPreference: "low-power" };
    try { gl = canvas.getContext("webgl", opt) || canvas.getContext("experimental-webgl", opt); } catch (err) {
      /* no WebGL in this frame: the canvas 2D painting takes over */
      gl = null;
    }
    if (!gl) return false;
    if (setupGL()) return true;
    gl = null;
    return false;
  }

  if (!initGL()) {
    var fresh = document.createElement("canvas");
    fresh.id = "sea";
    fresh.setAttribute("aria-hidden", "true");
    canvas.parentNode.replaceChild(fresh, canvas);
    canvas = fresh;
    ctx = canvas.getContext("2d");
  } else {
    canvas.addEventListener("webglcontextlost", function (e) { e.preventDefault(); lost = true; update(); }, false);
    canvas.addEventListener("webglcontextrestored", function () { lost = !setupGL(); update(); }, false);
  }
  window.addEventListener("message", onMessage);
  document.addEventListener("visibilitychange", update);
  window.addEventListener("resize", function () { if (!document.hidden && !running && !lost) draw(); });
  draw();
  setTimeout(announce, 800);
  update();
})();
</script>
</body>
</html>
