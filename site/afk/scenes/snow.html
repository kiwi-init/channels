<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snow Clearing</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1c2540;}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block;}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<script>
(function () {
  "use strict";

  var HEAD = [
    "#ifdef GL_FRAGMENT_PRECISION_HIGH",
    "precision highp float;",
    "#else",
    "precision mediump float;",
    "#endif",
    "varying vec2 vUv;",
    "uniform vec2 uRes;",
    "uniform vec3 uSkyTop;uniform vec3 uSkyHor;uniform vec3 uHaze;uniform vec3 uLight;uniform vec3 uAmb;uniform vec3 uTree;uniform vec3 uSnow;",
    "uniform vec4 uLP;",
    "uniform vec4 uCab;",
    "float h11(float p){p=fract(p*.1031);p*=p+33.33;p*=p+p;return fract(p);}",
    "float h21(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}",
    "float vn(vec2 p){vec2 i=floor(p);vec2 f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1.,0.)),f.x),mix(h21(i+vec2(0.,1.)),h21(i+vec2(1.,1.)),f.x),f.y);}",
    "const mat2 RM=mat2(1.6,1.2,-1.2,1.6);",
    "float fbm(vec2 p){float s=0.;float a=.5;for(int i=0;i<5;i++){s+=a*vn(p);p=RM*p+vec2(3.1,1.7);a*=.5;}return s/.97;}",
    "float fbm3(vec2 p){float s=0.;float a=.5;for(int i=0;i<3;i++){s+=a*vn(p);p=RM*p+vec2(3.1,1.7);a*=.5;}return s/.875;}",
    "float groundLine(float x){return .334+.008*sin(x*2.3+1.)+.010*(vn(vec2(x*3.,7.))-.5);}",
    "float groundNear(float y){return .5+(.34-y)*1.3;}",
    "vec3 hazeAt(vec2 p){vec2 d=p-uLP.xy;float g=exp(-length(d*vec2(.75,1.3))*2.);return uHaze+uLight*g*.32*uLP.w;}",
    "vec2 cabP(vec2 c){return uCab.xy+c*uCab.z;}",
    ""
  ].join("\n");

  var VS = "attribute vec2 aPos;varying vec2 vUv;void main(){vUv=aPos*.5+.5;gl_Position=vec4(aPos,0.,1.);}";

  var BG = HEAD + `
float pine(vec2 q,float sd,float aa,out float sn,out float sh,out float ed,out float vol){
  sn=0.;sh=0.;ed=0.;vol=0.;
  if(q.y<-.06||q.y>1.05||abs(q.x)>.40)return 0.;
  float y=clamp(q.y,0.,1.);
  float ax=abs(q.x);
  float side=step(0.,q.x);
  float soft=clamp(aa*14.,0.,.6);
  float fq=1./(1.+aa*60.);
  float W=.17+.07*h11(sd*1.7);
  float env=W*pow(1.-y,1.04)*(1.+.10*sin(y*7.+sd));
  float yd=y+.20*ax+.05*(vn(vec2(ax*26.*fq,sd))-.5);
  float N=15.+floor(9.*h11(sd+3.1));
  float tc=N*(.5*yd+.5*yd*yd)+h11(sd+5.)+side*(.3+.4*h11(sd+8.));
  float k=floor(tc);
  float s=fract(tc);
  s=clamp(s+.32*(vn(vec2(q.x*34.*fq,k*3.1+sd))-.5),0.,1.);
  float r1=h21(vec2(k+side*31.7,sd));
  float heavy=h21(vec2(k+side*5.3,sd+4.));
  float prof=mix(1.,.68+.22*h21(vec2(k,sd+9.)),pow(s,.55));
  float n=vn(q*vec2(70.,40.)*fq+sd*13.)*.55+vn(q*vec2(170.,110.)*fq+sd*7.)*.45;
  float cln=vn(q*vec2(22.,15.)*fq+sd*2.1);
  float w=env*prof*(.55+.62*r1)*(.62+.42*n+.32*cln);
  w=max(w,.010*(1.-y)*(.6+.8*n));
  w=max(w,(1.-smoothstep(.02,.07,q.y))*.020);
  float brk=vn(q*vec2(150.,110.)*fq+sd*5.)*.6+vn(q*vec2(40.,70.)*fq+sd*2.)*.4;
  float a=smoothstep(w*1.10+aa,w*.86-aa,ax+(brk-.5)*.30*w);
  float bz=.035+.05*vn(vec2(q.x*26.,sd+6.))-.05*smoothstep(.12,.3,ax);
  a*=smoothstep(bz-.03,bz+.01,q.y);
  float inner=(w-ax)/max(env,.004);
  ed=1.-smoothstep(0.,.20,inner);
  vol=smoothstep(0.,.55,inner)*(.75+.5*vn(q*vec2(140.,46.)*fq+sd));
  float cl=vn(q*vec2(26.,52.)*fq+sd*3.)*.6+vn(q*vec2(80.,140.)*fq+sd)*.4;
  float band=smoothstep(.04,.35,s)*(1.-smoothstep(.70,.97,s));
  float rimb=1.-smoothstep(.02,.55,inner);
  float load=h11(sd*3.3+1.);
  float v=cl*.5+band*rimb*(.35+.45*heavy)+band*.10*heavy+.06*(1.-y)+(load-.5)*.24;
  sn=smoothstep(.50-soft*.2,.62+soft*.2,v)*smoothstep(.03,.12,q.y);
  sh=smoothstep(.55,1.,s)*(1.-rimb*.5);
  return a;
}

vec3 treeCol(vec2 q,float cx,float H,float sn,float sh,float ed,float vol,float sd){
  float n=vn(q*vec2(30.,22.)+sd);
  vec3 f=mix(uTree,uAmb,.16)*(.78+.5*n)*(1.-.42*sh)*mix(1.22,.68,clamp(vol,0.,1.));
  f*=.80+.32*clamp(q.y,0.,1.);
  float ls=clamp((uLP.x-cx)*4.,-1.,1.);
  float facing=clamp(.5+.5*ls*sign(q.x),0.,1.);
  vec3 sc=mix(uAmb,uSnow,.42+.48*facing)*(.90+.14*n);
  sc=mix(sc*.86,sc*1.04,smoothstep(.25,.95,sn));
  vec3 c=mix(f,sc,sn);
  c+=uLight*ed*(.2+.8*facing)*.34*uLP.w;
  return c;
}

void row(inout vec3 col,inout float dep,vec2 p,float px,float sd,float base,float amp,float hMin,float hMax,float sp,float dens,float hz,float fogK,float blur,float nr){
  float gy=base+amp*(fbm3(vec2(p.x*1.7+sd*3.7,sd))-.5);
  vec3 hc=hazeAt(p);
  if(p.y<gy+hMax*1.05+.01&&p.y>gy-.06){
    float ci=floor(p.x/sp);
    for(int k=-3;k<=3;k++){
      float c=ci+float(k);
      if(h21(vec2(c,sd))>dens)continue;
      float cx=(c+.5+(h21(vec2(c,sd+1.))-.5)*.9)*sp;
      float H=mix(hMin,hMax,pow(h21(vec2(c,sd+2.)),1.5));
      float by=base+amp*(fbm3(vec2(cx*1.7+sd*3.7,sd))-.5)-.02*H-.004;
      vec2 q=(p-vec2(cx,by))/H;
      if(abs(q.x)>.4||q.y>1.05||q.y<-.06)continue;
      float sn;float sh;float ed;float vol;
      float a=pine(q,c*1.31+sd*17.,(px*1.2+blur)/H,sn,sh,ed,vol);
      if(a<=0.)continue;
      vec3 tc=treeCol(q,cx,H,sn,sh,ed,vol,c);
      float fog=hz+(1.-hz)*fogK*(1.-smoothstep(0.,.8,q.y))+(fbm3(p*vec2(5.,16.)+sd)-.5)*.40*fogK;
      col=mix(col,mix(tc,hc,clamp(fog,0.,1.)),a);
      dep=mix(dep,nr,a);
    }
  }
  float ga=smoothstep(gy+px+blur,gy-px-blur,p.y);
  if(ga>0.){
    float n=fbm3(vec2(p.x*9.,p.y*40.)+sd);
    vec3 gc=mix(uAmb,uSnow,.62+.25*(n-.5));
    float fog=hz+(1.-hz)*fogK*.85;
    col=mix(col,mix(gc,hc,clamp(fog,0.,1.)),ga);
    dep=mix(dep,nr,ga);
  }
}

void tree1(inout vec3 col,inout float dep,vec2 p,float px,float cx,float by,float H,float sd,float hz,float blur,float nr){
  vec2 q=(p-vec2(cx,by))/H;
  if(q.y<-.06||q.y>1.05||abs(q.x)>.42)return;
  float sn;float sh;float ed;float vol;
  float a=pine(q,sd,(px*1.2+blur)/H,sn,sh,ed,vol);
  if(a<=0.)return;
  vec3 tc=treeCol(q,cx,H,sn,sh,ed,vol,sd);
  col=mix(col,mix(tc,hazeAt(p),hz),a);dep=mix(dep,nr,a);
}

vec2 shDir(vec2 b){
  float elev=max((uLP.y-.36)*1.6,.12);
  return vec2(-(uLP.x-b.x)*.55,-.30)/elev;
}
float tshadow(vec2 p,vec2 b,float H,float W){
  vec2 dv=shDir(b)*H*.32;
  float L=length(dv);
  vec2 u=dv/L;
  vec2 d=p-b;
  float t=dot(d,u)/L;
  float pr=abs(d.x*u.y-d.y*u.x);
  float w=W*H*(1.-t*.7)*.55*(1.+t*.6)+.002;
  return smoothstep(-.03,.05,t)*smoothstep(1.,.55,t)*smoothstep(w*(1.5+2.2*t)+.004,w*.15,pr)*(1.-.45*t);
}

float boxA(vec2 c,vec2 lo,vec2 hi,float aa){vec2 a=smoothstep(lo-aa,lo+aa,c)*smoothstep(hi+aa,hi-aa,c);return a.x*a.y;}
float hp(vec2 c,vec2 a,vec2 b,float aa){vec2 d=b-a;vec2 n=normalize(vec2(-d.y,d.x));return smoothstep(-aa,aa,dot(c-a,n));}

vec3 logs(vec2 c,float facing,float sd){
  float ly=c.y/.043;
  float l=fract(ly);
  float rnd=sin(l*3.1416);
  float g=fbm3(vec2(c.x*26.+floor(ly)*7.,ly*3.+sd));
  vec3 wood=vec3(.34,.22,.15)*(.75+.4*g);
  float lit=.30+.55*facing;
  vec3 c0=wood*(.85+.3*h11(floor(ly)*3.7+sd))*(uAmb*1.45+vec3(.06,.04,.025)+uLight*lit*.55*uLP.w)*(.45+.6*rnd);
  c0*=1.-.55*(1.-smoothstep(.0,.12,l))-.35*smoothstep(.9,1.,l);
  return c0;
}

void cabin(inout vec3 col,inout float dep,vec2 p,float px,vec3 groundC){
  vec2 c=(p-uCab.xy)/uCab.z;
  if(c.x<-.75||c.x>.85||c.y<-.06||c.y>.95)return;
  float aa=px/uCab.z*1.1;
  float ls=clamp((uLP.x-uCab.x)*3.,-1.,1.);
  vec3 hz=hazeAt(p);
  float hk=.10;
  vec3 snowLit=mix(uAmb,uSnow,.92)+uLight*.06*uLP.w;
  vec3 snowSh=mix(uAmb,uSnow,.42);
  float fa=boxA(c,vec2(-.50,-.05),vec2(.34,.345),aa);
  if(fa>0.){
    vec3 w=logs(c,.15+.1*ls,1.);
    float le=step(c.x,-.47)*step(.5,fract(c.y/.043*.5));
    w*=1.-.2*(1.-smoothstep(0.,.02,c.x+.50));
    col=mix(col,mix(w,hz,hk),fa);dep=mix(dep,.555,fa);
  }
  float gab=boxA(c,vec2(.34,-.05),vec2(.62,.345),aa)+hp(c,vec2(.34,.34),vec2(.48,.60),aa)*hp(c,vec2(.48,.60),vec2(.62,.34),aa)*boxA(c,vec2(.34,.3),vec2(.62,.62),aa);
  gab=clamp(gab,0.,1.);
  if(gab>0.){
    vec3 w=logs(c+vec2(0.,.012),.55+.4*ls,4.);
    float dr=boxA(c,vec2(.44,-.05),vec2(.535,.235),aa);
    vec3 dc=vec3(.20,.13,.09)*(uAmb*1.1+uLight*.2)*(.8+.3*vn(vec2(c.x*90.,c.y*6.)));
    w=mix(w,dc,dr);
    w*=1.-.35*(1.-smoothstep(0.,.04,c.x-.34));
    col=mix(col,mix(w,hz,hk),gab);dep=mix(dep,.555,gab);
  }
  float le=0.;
  for(int i=0;i<8;i++){
    float yy=(float(i)+.5)*.043;
    float alt=mod(float(i),2.);
    vec2 e1=(c-vec2(-.515-.012*alt,yy))/vec2(.030+.01*alt,.0205);
    vec2 e2=(c-vec2(.345,yy+.006))/vec2(.026,.0205);
    float r1=length(e1);float r2=length(e2);
    float a1=smoothstep(1.+aa*30.,1.-aa*30.,r1)*step(.5,alt+.5);
    float a2=smoothstep(1.+aa*30.,1.-aa*30.,r2)*(1.-alt);
    float a=max(a1,a2);
    if(a>0.){
      float rr=r1<r2?r1:r2;
      vec3 eg=vec3(.46,.33,.22)*(uAmb*1.5+vec3(.06,.04,.025)+uLight*.45*uLP.w)*(.75+.25*sin(rr*18.));
      eg*=.8+.3*smoothstep(.2,-.6,(r1<r2?e1.y:e2.y));
      col=mix(col,mix(eg,hz,hk),a);dep=mix(dep,.555,a);
    }
  }
  col+=uLight*uLP.w*.10*smoothstep(.02,.0,abs(c.x+.50))*boxA(c,vec2(-.6,0.),vec2(-.4,.34),aa)*clamp(-ls,0.,1.);
  vec2 wc=c-vec2(-.09,.175);
  float wf=boxA(wc,vec2(-.088,-.078),vec2(.088,.078),aa);
  if(wf>0.){
    vec3 fr=vec3(.42,.32,.24)*(uAmb*1.2+uLight*.3*uLP.w);
    vec2 g=wc/vec2(.075,.066);
    float pane=boxA(g,vec2(-1.),vec2(1.),aa/.07)*(1.-boxA(g,vec2(-.09,-1.2),vec2(.09,1.2),aa/.07))*(1.-boxA(g,vec2(-1.2,-.08),vec2(1.2,.08),aa/.07));
    vec3 gl=mix(uSkyTop,uSkyHor,.55+.4*g.y)*.38+uLight*.05*uLP.w;
    gl*=.85+.25*vn(g*vec2(3.,9.));
    vec3 wcol=mix(fr,gl,pane);
    float sill=boxA(wc,vec2(-.10,-.095),vec2(.10,-.066+.008*vn(vec2(wc.x*60.,1.))),aa);
    wcol=mix(wcol,snowLit,sill);
    col=mix(col,mix(wcol,hz,hk),wf);
  }
  float ch=boxA(c,vec2(-.31,.40),vec2(-.21,.74),aa);
  if(ch>0.){
    vec2 st=vec2(c.x*30.,c.y*24.);
    float sr=floor(st.y);
    vec2 cell=fract(vec2(st.x+h11(sr)*.7,st.y));
    float mort=smoothstep(.0,.14,cell.x)*smoothstep(1.,.86,cell.x)*smoothstep(0.,.16,cell.y)*smoothstep(1.,.84,cell.y);
    vec3 stn=vec3(.33,.31,.30)*(.7+.5*h21(floor(vec2(st.x+h11(sr)*.7,st.y))))*(uAmb*1.1+uLight*.35*uLP.w);
    stn*=.55+.45*mort;
    stn*=1.-.3*smoothstep(-.23,-.21,c.x);
    col=mix(col,mix(stn,hz,hk),ch);dep=mix(dep,.555,ch);
  }
  float roof=hp(c,vec2(-.60,.300),vec2(.36,.300),aa)*hp(c,vec2(.36,.30),vec2(.48,.625),aa)*hp(c,vec2(.48,.625),vec2(-.48,.625),aa)*hp(c,vec2(-.48,.625),vec2(-.60,.30),aa*2.);
  float top=.625+.018*(vn(vec2(c.x*9.,3.))-.5);
  roof*=smoothstep(top+aa,top-aa,c.y);
  float lipY=.300-.03-.022*vn(vec2(c.x*14.,5.))-.01*vn(vec2(c.x*40.,2.));
  float lip=boxA(c,vec2(-.61,lipY),vec2(.37,.31),aa)*smoothstep(-.63,-.58,c.x);
  float fas=boxA(c,vec2(-.58,.28),vec2(.36,.345),aa);
  if(fas>0.){vec3 fc=vec3(.16,.11,.08)*(uAmb*1.2);col=mix(col,mix(fc,hz,hk),fas*(1.-roof));dep=mix(dep,.555,fas);}
  float rk=hp(c,vec2(.48,.625),vec2(.66,.30),aa*1.5)*(1.-hp(c,vec2(.48,.668),vec2(.68,.31),aa*1.5))*boxA(c,vec2(.36,.29),vec2(.665,.7),aa);
  float sm=clamp(max(max(roof,lip),rk),0.,1.);
  if(sm>0.){
    float sl=clamp((c.y-.30)/.33,0.,1.);
    float n=fbm3(vec2(c.x*10.,c.y*14.));
    vec3 sc=mix(snowSh,snowLit,.55+.4*sl+.15*(n-.5));
    sc=mix(sc,snowSh*.9,smoothstep(.31,.26,c.y)*(1.-roof)*.7);
    sc+=uLight*.18*uLP.w*smoothstep(.02,0.,abs(c.y-top+.008))*roof;
    col=mix(col,mix(sc,hz,hk),sm*(1.-ch));
    dep=mix(dep,.555,sm);
  }
  float cap=boxA(c,vec2(-.322,.735),vec2(-.198,.765+.012*vn(vec2(c.x*30.,1.))),aa*1.2);
  if(cap>0.){col=mix(col,mix(snowLit,hz,hk),cap);dep=mix(dep,.555,cap);}
  float bank=.035+.03*fbm3(vec2(c.x*7.,2.))+.02*smoothstep(.2,-.6,c.x);
  float ba=smoothstep(bank+aa*2.,bank-aa*2.,c.y)*boxA(c,vec2(-.62,-1.),vec2(.64,1.),.03);
  col=mix(col,groundC*mix(.97,1.03,smoothstep(0.,bank,c.y)),ba);
  dep=mix(dep,groundNear(p.y),ba);
}

vec3 sky(vec2 p){
  float t=clamp((p.y-.36)/.64,0.,1.);
  vec3 c=mix(uSkyHor,uSkyTop,smoothstep(0.,1.,pow(t,.7)));
  vec2 d=p-uLP.xy;
  float r=length(d*vec2(.8,1.15));
  vec2 q=vec2(p.x*1.1,p.y*2.8);
  float n=fbm(q+vec2(4.2,1.3));
  float n2=fbm(q*2.1+vec2(n*1.8,0.)+9.);
  float cl=smoothstep(.40,.85,n*.62+n2*.48);
  float glow=exp(-r*3.)*.8+exp(-r*12.)*.55;
  vec3 cc=mix(mix(uSkyTop,uSkyHor,.45)*.9,uLight*.95,clamp(glow*.9,0.,1.));
  c=mix(c,cc,cl*.5);
  c+=uLight*glow*uLP.w*(1.-cl*.35)*.75;
  if(uLP.z>.01){
    float md=length(d);
    float disc=smoothstep(.030,.026,md);
    float mar=fbm(d*55.+3.);
    vec3 mc=uLight*(1.12-.16*smoothstep(.45,.7,mar));
    c=mix(c,mc,disc*uLP.z*(1.-cl*.6));
    c+=uLight*uLP.z*exp(-md*22.)*.25;
  }
  return c;
}

void main(){
  float asp=uRes.x/uRes.y;
  vec2 p=vec2((vUv.x-.5)*asp,vUv.y);
  float px=1./uRes.y;
  vec3 col=sky(p);
  float dep=0.;
  float rg=.43+.10*fbm(vec2(p.x*.7+2.,1.))-.02*sin(p.x*1.3);
  float ma=smoothstep(rg+px*2.,rg-px*2.,p.y);
  if(ma>0.){
    float rock=fbm(vec2(p.x*12.,p.y*26.));
    vec3 mc=mix(mix(uAmb,uSnow,.8),uTree*1.4,smoothstep(.55,.72,rock)*.5*smoothstep(rg-.08,rg,p.y));
    mc=mix(mc,hazeAt(p),.84);
    col=mix(col,mc,ma);dep=mix(dep,.1,ma);
  }
  row(col,dep,p,px,1.3,.400,.03,.025,.065,.008,.95,.76,.58,.0030,.18);
  row(col,dep,p,px,2.7,.388,.03,.04,.10,.013,.92,.64,.58,.0024,.24);
  row(col,dep,p,px,4.1,.374,.03,.06,.15,.020,.86,.52,.58,.0019,.30);
  row(col,dep,p,px,5.9,.358,.025,.10,.23,.032,.80,.40,.58,.0015,.38);
  row(col,dep,p,px,7.3,.342,.02,.16,.36,.050,.74,.28,.56,.0012,.46);
  float gl0=groundLine(p.x);
  float ca=smoothstep(gl0+px,gl0-px,p.y);
  vec3 groundC=col;
  float S=uCab.z;
  vec2 tA=vec2(uCab.x+1.55*S,uCab.y+.020);
  vec2 tB=vec2(uCab.x+.92*S,uCab.y+.010);
  vec2 tC=vec2(uCab.x-.95*S,uCab.y-.012);
  if(ca>0.){
    float Z=1./max(.41-p.y,.02);
    vec2 G=vec2(p.x*Z,Z);
    float e=.02;
    e=.04;
    float h0=fbm3(G*vec2(.30,.42))+.35*fbm3(G*vec2(1.0,.9)+5.);
    float hx=fbm3((G+vec2(e,0.))*vec2(.30,.42))+.35*fbm3((G+vec2(e,0.))*vec2(1.0,.9)+5.);
    float hy=fbm3((G+vec2(0.,e))*vec2(.30,.42))+.35*fbm3((G+vec2(0.,e))*vec2(1.0,.9)+5.);
    vec3 nrm=normalize(vec3(-(hx-h0)/e*1.1,1.,-(hy-h0)/e*1.1));
    float elev=(uLP.y-.36)*1.6;
    vec3 L=normalize(vec3(uLP.x*.8,max(elev,.05),1.));
    float dif=clamp(dot(nrm,L),0.,1.);
    float direct=smoothstep(-.05,.25,elev);
    float dz=clamp((gl0-p.y)/.33,0.,1.);
    float fine=vn(G*vec2(6.,3.))*.5+vn(G*vec2(17.,9.))*.5;
    float rip=sin(G.y*5.+G.x*.7+fbm3(G*.6)*7.)*.5+.5;
    fine=mix(fine,rip,.35*smoothstep(.30,.12,p.y));
    float sk=dot(nrm,normalize(vec3(0.,.55,1.)));
    vec3 gc=mix(uAmb,uSnow,.44+.46*dif*direct+(1.-direct)*(.10+.6*(sk-.5))+.06*(fine-.5));
    gc+=uLight*pow(dif,10.)*.10*direct*uLP.w;
    gc+=uLight*.10*uLP.w*exp(-abs(p.x-uLP.x)*1.5)*(1.-dz);
    float shd=0.;
    shd=max(shd,tshadow(p,tA,.22,.2));
    shd=max(shd,tshadow(p,tB,.33,.2));
    shd=max(shd,tshadow(p,tC,.27,.2));
    float sci=floor(p.x/.17);
    for(int k=-2;k<=2;k++){
      float c=sci+float(k);
      float hh=h21(vec2(c,55.));

  var COMMON = ["uRes", "uSkyTop", "uSkyHor", "uHaze", "uLight", "uAmb", "uTree", "uSnow", "uLP", "uCab"];
  var pScene = null, pBlur = null, pFin = null;
  var RT = {};
  var LW = 2, LH = 2, QW = 2, QH = 2;
  var SIG = 0.0072;

  function setupGL() {
    var b = program(BG, COMMON);
    var sc = program(SCENE, COMMON.concat(["uBg", "uT", "uLamp", "uDay"]));
    var bl = program(BLUR, ["uTex", "uDir", "uSig", "uThr"]);
    var f = program(FIN, COMMON.concat(["uScene", "uBloom", "uT", "uLamp", "uOff", "uDay", "uGly", "uRunA", "uRunB", "uRunC", "uLow"]));
    if (!b || !sc || !bl || !f) return false;
    pBg = b; pScene = sc; pBlur = bl; pFin = f;
    quad = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    RT = {};
    makeTargets();
    glyTex = gl.createTexture();
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, glyTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, atlas());
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.activeTexture(gl.TEXTURE0);
    return true;
  }

  function target(name, w, h) {
    var o = RT[name];
    if (o) { gl.deleteTexture(o.tex); gl.deleteFramebuffer(o.fbo); }
    var t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    var fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
    RT[name] = { tex: t, fbo: fb, w: w, h: h };
  }

  function makeTargets() {
    LW = Math.max(2, Math.round(W / 4)); LH = Math.max(2, Math.round(H / 4));
    QW = Math.max(2, Math.round(LW / 4)); QH = Math.max(2, Math.round(LH / 4));
    target("bg0", LW, LH); target("bg1", LW, LH);
    target("scene", LW, LH); target("ba", LW, LH); target("bb", LW, LH);
    target("qa", QW, QH); target("qb", QW, QH);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    bgHour = -99;
    strip = -1;
  }

  function setCommon(u, pal, w, h) {
    var cab = cabParams();
    gl.uniform2f(u.uRes, w, h);
    gl.uniform3fv(u.uSkyTop, pal.top);
    gl.uniform3fv(u.uSkyHor, pal.hor);
    gl.uniform3fv(u.uHaze, pal.haze);
    gl.uniform3fv(u.uLight, pal.light);
    gl.uniform3fv(u.uAmb, pal.amb);
    gl.uniform3fv(u.uTree, pal.tree);
    gl.uniform3fv(u.uSnow, pal.snow);
    gl.uniform4f(u.uLP, (pal.lp[0] - 0.5) * asp, pal.lp[1], pal.lp[2], pal.lp[3]);
    gl.uniform4f(u.uCab, cab[0], cab[1], cab[2], pal.day);
  }

  function into(name) {
    var t = RT[name];
    gl.bindFramebuffer(gl.FRAMEBUFFER, t.fbo);
    gl.viewport(0, 0, t.w, t.h);
  }

  function bindTex(unit, name) {
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, RT[name].tex);
  }

  function drawBg(target, y0, y1) {
    into("bg" + target);
    gl.useProgram(pBg.p);
    setCommon(pBg.u, bgPal, LW, LH);
    if (y0 > 0 || y1 < LH) {
      gl.enable(gl.SCISSOR_TEST);
      gl.scissor(0, y0, LW, y1 - y0);
    }
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.disable(gl.SCISSOR_TEST);
  }

  function blur(src, dst, dx, dy, sig, thr) {
    into(dst);
    gl.useProgram(pBlur.p);
    bindTex(0, src);
    gl.uniform1i(pBlur.u.uTex, 0);
    gl.uniform2f(pBlur.u.uDir, dx, dy);
    gl.uniform1f(pBlur.u.uSig, sig);
    gl.uniform1f(pBlur.u.uThr, thr);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  function hourGap(a, b) {
    var d = Math.abs(a - b) % 24;
    return Math.min(d, 24 - d);
  }

  function renderGL(dt, force) {
    var hr = hourNow();
    var pal = palette(hr);
    bgAge += dt;
    if (force || hourGap(hr, bgHour) > 0.04) {
      bgPal = pal;
      bgHour = hr;
      bgAge = 0;
      strip = -1;
      drawBg(cur, 0, LH);
    } else if (strip < 0 && bgAge > 9) {
      bgPal = pal;
      bgHour = hr;
      bgAge = 0;
      strip = 0;
    }
    if (strip >= 0) {
      var nxt = 1 - cur;
      var a = Math.floor(strip * LH / STRIPS), b = Math.floor((strip + 1) * LH / STRIPS);
      drawBg(nxt, a, b);
      strip++;
      if (strip >= STRIPS) { cur = nxt; strip = -1; }
    }
    into("scene");
    gl.useProgram(pScene.p);
    setCommon(pScene.u, pal, LW, LH);
    bindTex(0, "bg" + cur);
    gl.uniform1i(pScene.u.uBg, 0);
    gl.uniform1f(pScene.u.uT, anim % 6000);
    gl.uniform1f(pScene.u.uLamp, lamp);
    gl.uniform1f(pScene.u.uDay, pal.day);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    var sg = SIG * LH;
    blur("scene", "ba", 1 / LW, 0, sg, 0);
    blur("ba", "bb", 0, 1 / LH, sg, 0);
    blur("bb", "qa", 2 / LW, 0, 3.2, 0.58 + 0.3 * pal.day);
    blur("qa", "qb", 0, 1 / QH, 3.2, 0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, W, H);
    gl.useProgram(pFin.p);
    setCommon(pFin.u, pal, W, H);
    bindTex(0, "bb");
    gl.uniform1i(pFin.u.uScene, 0);
    bindTex(2, "qb");
    gl.uniform1i(pFin.u.uBloom, 2);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, glyTex);
    gl.uniform1i(pFin.u.uGly, 1);
    gl.activeTexture(gl.TEXTURE0);
    gl.uniform2f(pFin.u.uLow, 1 / LW, 1 / LH);
    gl.uniform1f(pFin.u.uT, anim % 6000);
    gl.uniform1f(pFin.u.uLamp, lamp);
    gl.uniform1f(pFin.u.uDay, pal.day);
    gl.uniform2fv(pFin.u.uOff, off);
    var rs = runState();
    if (rs) {
      gl.uniform4f(pFin.u.uRunA, run.x, run.y, run.gh, rs.e);
      gl.uniform4f(pFin.u.uRunB, run.n, run.seed, rs.step, rs.settle);
      gl.uniform4f(pFin.u.uRunC, run.mode, rs.dis, run.ang, st.still ? 0.55 : 1);
    } else {
      gl.uniform4f(pFin.u.uRunA, 0, 0, 0.02, 0);
    }
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  function resize() {
    var cw = Math.max(1, window.innerWidth || document.documentElement.clientWidth || 1);
    var ch = Math.max(1, window.innerHeight || document.documentElement.clientHeight || 1);
    var dpr = Math.min(2, window.devicePixelRatio || 1);
    var k = Math.min(dpr, Math.sqrt(3600000 / (cw * ch)));
    var w = Math.max(1, Math.round(cw * k)), h = Math.max(1, Math.round(ch * k));
    var changed = w !== W || h !== H;
    W = w; H = h; asp = cw / ch;
    if (canvas.width !== w) canvas.width = w;
    if (canvas.height !== h) canvas.height = h;
    if (gl && changed && pBg) makeTargets();
    if (ctx) bg2d = null;
  }

  var bg2d = null, bg2dHour = -99, flakes2d = null;

  function css(c, k) {
    k = k == null ? 1 : k;
    return "rgb(" + Math.round(Math.min(1, c[0] * k) * 255) + "," + Math.round(Math.min(1, c[1] * k) * 255) + "," + Math.round(Math.min(1, c[2] * k) * 255) + ")";
  }
  function mixc(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }

  function paint2d(pal) {
    var c = document.createElement("canvas");
    c.width = W; c.height = H;
    var g = c.getContext("2d");
    var sk = g.createLinearGradient(0, 0, 0, H * 0.6);
    sk.addColorStop(0, css(pal.top));
    sk.addColorStop(1, css(pal.hor));
    g.fillStyle = sk;
    g.fillRect(0, 0, W, H);
    var lx = pal.lp[0] * W, ly = (1 - pal.lp[1]) * H;
    var gr = g.createRadialGradient(lx, ly, 0, lx, ly, H * 0.6);
    gr.addColorStop(0, "rgba(" + pal.light.map(function (v) { return Math.round(v * 255); }).join(",") + "," + (0.5 * pal.lp[3]) + ")");
    gr.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = gr;
    g.fillRect(0, 0, W, H);
    var rnd = 7;
    function r() { rnd = (rnd * 16807) % 2147483647; return rnd / 2147483647; }
    var rows = [[0.462, 0.06, 0.012, 0.8], [0.45, 0.1, 0.02, 0.62], [0.432, 0.15, 0.03, 0.45], [0.415, 0.22, 0.045, 0.3], [0.398, 0.31, 0.065, 0.15]];
    rows.forEach(function (rw) {
      var col = mixc(pal.tree, pal.haze, rw[3]);
      g.fillStyle = css(col);
      for (var x = -0.05; x < 1.05; x += rw[2] * H / W * (0.7 + r() * 0.6)) {
        var hh = rw[1] * H * (0.45 + 0.55 * r()), bx = x * W, by = (1 - rw[0]) * H, tw = hh * 0.26;
        g.beginPath();
        g.moveTo(bx, by - hh);
        for (var t = 1; t <= 8; t++) {
          var yy = by - hh + hh * t / 8, ww = tw * t / 8 * (0.8 + 0.4 * r());
          g.lineTo(bx + ww, yy + hh * 0.02);
          g.lineTo(bx + ww * 0.45, yy);
        }
        for (var u = 8; u >= 1; u--) {
          var y2 = by - hh + hh * u / 8, w2 = tw * u / 8 * (0.8 + 0.4 * r());
          g.lineTo(bx - w2 * 0.45, y2);
          g.lineTo(bx - w2, y2 + hh * 0.02);
        }
        g.closePath();
        g.fill();
      }
      g.fillStyle = css(mixc(mixc(pal.amb, pal.snow, 0.6), pal.haze, rw[3] + 0.2));
      g.fillRect(0, (1 - rw[0]) * H - 1, W, H);
    });
    var gg = g.createLinearGradient(0, (1 - 0.39) * H, 0, H);
    gg.addColorStop(0, css(mixc(mixc(pal.amb, pal.snow, 0.7), pal.haze, 0.3)));
    gg.addColorStop(1, css(mixc(pal.amb, pal.snow, 0.55)));
    g.fillStyle = gg;
    g.fillRect(0, (1 - 0.392) * H, W, H);
    var cab = cabParams(), s = cab[2] * H, cx = (cab[0] / asp + 0.5) * W, cy = (1 - cab[1]) * H;
    g.fillStyle = css(mixc([0.3, 0.2, 0.14], pal.amb, 0.4), 0.8);
    g.fillRect(cx - 0.5 * s, cy - 0.34 * s, 1.12 * s, 0.34 * s);
    g.fillStyle = css(mixc(pal.amb, pal.snow, 0.85));
    g.beginPath();
    g.moveTo(cx - 0.6 * s, cy - 0.29 * s);
    g.lineTo(cx + 0.36 * s, cy - 0.29 * s);
    g.lineTo(cx + 0.66 * s, cy - 0.3 * s);
    g.lineTo(cx + 0.48 * s, cy - 0.64 * s);
    g.lineTo(cx - 0.48 * s, cy - 0.64 * s);
    g.closePath();
    g.fill();
    return c;
  }

  function render2d(dt, force) {
    var hr = hourNow(), pal = palette(hr);
    if (!bg2d || force || hourGap(hr, bg2dHour) > 0.05) { bg2d = paint2d(pal); bg2dHour = hr; }
    ctx.drawImage(bg2d, 0, 0);
    var cab = cabParams(), s = cab[2] * H, wx = (cab[0] / asp + 0.5) * W + (-0.09) * s, wy = (1 - cab[1]) * H - 0.175 * s;
    if (lamp > 0.01) {
      var gw = ctx.createRadialGradient(wx, wy, 0, wx, wy, s * 0.6);
      gw.addColorStop(0, "rgba(255,170,90," + 0.55 * lamp + ")");
      gw.addColorStop(1, "rgba(255,170,90,0)");
      ctx.fillStyle = gw;
      ctx.fillRect(wx - s, wy - s, 2 * s, 2 * s);
      ctx.fillStyle = "rgba(255,190,110," + lamp + ")";
      ctx.fillRect(wx - 0.075 * s, wy - 0.066 * s, 0.15 * s, 0.132 * s);
    }
    if (!flakes2d) {
      flakes2d = [];
      for (var i = 0; i < 260; i++) flakes2d.push([Math.random(), Math.random(), 0.2 + Math.random() * 0.8, Math.random() * 6.28]);
    }
    var fc = mixc(pal.amb, pal.snow, 0.75);
    flakes2d.forEach(function (f) {
      f[1] += dt * 0.03 * (0.4 + f[2]);
      if (f[1] > 1.05) { f[1] = -0.05; f[0] = Math.random(); }
      var x = (f[0] + 0.01 * Math.sin(anim * 0.4 + f[3])) * W, y = f[1] * H, rr = (0.6 + f[2] * f[2] * 5) * H / 1000;
      ctx.globalAlpha = 0.25 + 0.5 * (1 - f[2] * 0.6);
      ctx.fillStyle = css(fc);
      ctx.beginPath();
      ctx.ellipse(x, y, rr, rr * 0.9, f[3], 0, 6.283);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  function step(dt, force) {
    if (gl && !lost) renderGL(dt, force);
    else if (ctx) render2d(dt, force);
  }

  function frame(ts) {
    raf = 0;
    if (!running) return;
    raf = requestAnimationFrame(frame);
    if (lastTs >= 0 && ts - lastTs < 30) return;
    var dt = lastTs < 0 ? 0 : Math.min(0.1, (ts - lastTs) / 1000);
    lastTs = ts;
    advance(dt);
    step(dt, false);
  }

  function update() {
    var live = !st.still && !document.hidden && !(gl && lost);
    if (live) {
      if (!running) {
        running = true;
        lastTs = -1;
        raf = requestAnimationFrame(frame);
      }
      return;
    }
    if (running) {
      running = false;
      if (raf) cancelAnimationFrame(raf);
      raf = 0;
    }
    if (!document.hidden) {
      lamp = st.needs > 0 ? 1 : 0;
      step(0, true);
    }
  }

  function announce() {
    if (sentReady) return;
    sentReady = true;
    try {
      parent.postMessage({ kiwi: "afk", type: "ready" }, "*");
    } catch (err) {
      /* opened on its own: there is no app to tell */
      sentReady = true;
    }
  }

  function onMessage(e) {
    var d = e && e.data;
    if (!d || typeof d !== "object" || d.kiwi !== "afk" || d.type !== "state") return;
    if (typeof d.at === "number" && isFinite(d.at)) {
      st.at = d.at;
      st.atPerf = performance.now();
    }
    if (typeof d.needs === "number" && isFinite(d.needs)) st.needs = Math.max(0, d.needs);
    if ("still" in d) st.still = d.still === true;
    if (!document.hidden) step(0, false);
    update();
  }

  function initGL() {
    var opt = { alpha: false, antialias: false, depth: false, stencil: false, premultipliedAlpha: false, preserveDrawingBuffer: false, powerPreference: "low-power" };
    var g = null;
    try {
      g = canvas.getContext("webgl", opt) || canvas.getContext("experimental-webgl", opt);
    } catch (err) {
      /* no WebGL here: the 2D painting takes over */
      g = null;
    }
    if (!g) return false;
    gl = g;
    if (setupGL()) return true;
    gl = null;
    return false;
  }

  function init2D() {
    var fresh = document.createElement("canvas");
    fresh.id = "c";
    fresh.setAttribute("aria-hidden", "true");
    canvas.parentNode.replaceChild(fresh, canvas);
    canvas = fresh;
    ctx = canvas.getContext("2d");
    W = 0; H = 0;
    resize();
  }

  resize();
  if (!initGL()) init2D();
  if (gl) {
    canvas.addEventListener("webglcontextlost", function (e) {
      e.preventDefault();
      lost = true;
      update();
    }, false);
    canvas.addEventListener("webglcontextrestored", function () {
      lost = !setupGL();
      update();
    }, false);
  }
  window.addEventListener("message", onMessage);
  document.addEventListener("visibilitychange", update);
  window.addEventListener("resize", function () {
    resize();
    if (!document.hidden) step(0, true);
  });

  step(0, true);
  requestAnimationFrame(function () { requestAnimationFrame(announce); });
  setTimeout(announce, 800);
  update();
})();
</script>
</body>
